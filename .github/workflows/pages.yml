name: Validate & deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuilds leaderboards.json from new scores about once an hour
  # (docs/scores.md). GitHub pauses schedules after 60 days with no commits.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

# Third-party actions are pinned to a commit (tag in the comment): a moved
# or compromised tag can't change what runs with the Pages token.

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR runs can be dropped; a deploy from main must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate games and manifest
        run: node scripts/validate.mjs
      - name: Test the Apps Script backend
        run: node scripts/test-apps-script.mjs
      - name: Test typed leaderboard names
        run: node scripts/test-names.mjs
      - name: Test the Daily Challenge pick and boards
        run: node scripts/test-daily.mjs
      - name: Assemble site
        # Only the public files are published; docs, scripts and the Apps
        # Script source stay in the repo.
        run: |
          mkdir -p _site
          cp -r index.html assets games _site/
          touch _site/.nojekyll
      - name: Build leaderboards
        # Starts from the live file and reads only newer telemetry rows. With
        # no FEEDBACK_READ_KEY secret (or an outage) it keeps the live file.
        env:
          FEEDBACK_READ_KEY: ${{ secrets.FEEDBACK_READ_KEY }}
        run: |
          site=$(sed -nE 's/.*siteUrl: *"([^"]*)".*/\1/p' assets/config.js)
          node scripts/build-leaderboards.mjs --prev "${site}leaderboards.json" --out _site/leaderboards.json
      - name: Build share pages
        # play/<id>/ pages carry each game's link-preview card (Facebook
        # ignores everything after "#") and forward to #/play/<id>.
        run: node scripts/build-share-pages.mjs _site
      - name: Version asset URLs
        # Pages lets browsers cache files for 10 minutes. Tagging each
        # assets/ link with the commit makes a fresh index.html load its
        # matching scripts and styles, never stale cached ones. (Games are
        # already versioned by gallery.js with ?v=<manifest version>.)
        run: |
          sed -i -E "s#(\"assets/[a-z0-9-]+\.(js|css))\"#\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -o 'assets/[a-z0-9-]*\.[a-z]*?v=[0-9a-f]*' _site/index.html
          if grep -qE '"assets/[a-z0-9-]+\.(js|css)"' _site/index.html; then
            echo "::error::index.html still has an unversioned assets/ link"; exit 1
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  browser:
    # Every game under random input, and the gallery smoke test, in Chromium.
    # Not on the hourly schedule (nothing changed) and not a deploy gate, so
    # a flaky browser run never holds back the leaderboards.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Monkey test every game
        run: node scripts/monkey-games.mjs
      - name: Gallery smoke test
        run: node scripts/smoke-gallery.mjs --out smoke-shots
      - name: Keep screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-screenshots
          path: smoke-shots
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
