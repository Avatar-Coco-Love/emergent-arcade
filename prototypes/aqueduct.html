<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aqueduct prototype</title>
<style>
html,body{margin:0;height:100%;background:#0b1320;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#hud{position:fixed;left:8px;top:6px;right:130px;font:12px/1.4 system-ui,sans-serif;color:#8fa8c8;pointer-events:none;white-space:pre-wrap}
#msg{position:fixed;left:0;right:0;bottom:104px;padding:0 16px;text-align:center;font:600 15px system-ui,sans-serif;color:#ffd86b;pointer-events:none}
#valves{position:fixed;left:0;right:0;bottom:44px;display:flex;justify-content:center;gap:12px;pointer-events:none}
#valves button{pointer-events:auto;min-width:120px;height:48px;font:600 15px system-ui,sans-serif;border-radius:10px;border:2px solid var(--c);background:#161b24;color:#f2e6cf;touch-action:manipulation}
#valves button.shut{background:var(--c);color:#14100a}
#valves button span{display:block}
#valves .g{display:block;position:relative;height:6px;margin:3px 2px 0;border-radius:3px;background:#0b1320;overflow:hidden}
#valves .g b{position:absolute;top:0;bottom:0;left:0;width:0}
#valves .g .for{background:repeating-linear-gradient(135deg,var(--f) 0 2px,transparent 2px 4px)}
#valves .g u{position:absolute;top:0;bottom:0;border:1px solid #78e6a0;border-width:0 1px;background:rgba(120,230,160,.25)}
#valves button.mixed .g{outline:2px solid #ff5050}
#rs{position:fixed;right:84px;top:8px;font:600 13px system-ui,sans-serif;padding:7px 12px;border-radius:8px;border:1px solid #38577f;background:#142238;color:#cfe0f5}
#rs.pulse{animation:pulse 1s ease-in-out infinite alternate;border-color:#ffd86b;color:#ffd86b}
@keyframes pulse{to{background:#5a4510}}
#tilt{position:fixed;left:8px;bottom:104px;font:12px system-ui,sans-serif;padding:6px 10px;border-radius:6px;border:1px solid #38577f;background:#142238;color:#cfe0f5;display:none}
#lv{position:fixed;right:8px;top:8px;font:600 13px system-ui,sans-serif;padding:7px 12px;border-radius:8px;border:1px solid #38577f;background:#142238;color:#cfe0f5}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,10,18,.82);font:15px system-ui,sans-serif;color:#cfe0f5}
#menu.on{display:flex}
#menu.won{background:rgba(6,10,18,.5)}
#menu .box{width:min(340px,calc(100vw - 32px));padding:18px;border-radius:14px;background:#111c2e;border:1px solid #2b4466}
#menu h2{margin:0 0 6px;font-size:18px;color:#ffd86b}
#menu p{margin:0 0 12px;color:#9fb6d3;font-size:14px}
#menu .row{display:flex;gap:8px;flex-wrap:wrap}
#menu button{flex:1 1 auto;min-height:44px;font:600 14px system-ui,sans-serif;border-radius:9px;border:1px solid #38577f;background:#1a2a42;color:#e3eefc;text-align:left;padding:8px 12px}
#menu button.main{background:#d9a441;border-color:#d9a441;color:#14100a;text-align:center}
#menu button:disabled{opacity:.4}
#menu .levels{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#menu small{display:block;font-weight:400;color:#9fb6d3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"></div>

<button id="lv">Levels</button>
<button id="rs" title="Restart (R)">↻</button>
<div id="valves"></div>
<div id="menu"><div class="box"></div></div>
<script>

    goal: 'The orange cup hangs over the bridge. Turn the vessel over the way that brings orange to it first, not blue.' },
  { id: 'sorting', name: 'Sorting', shapes: [...CHAMBERS, TOP_SHAPE, SIDE_SHAPE], water: [{ shape: 0, n: 450 }, { shape: 1, n: 250, dye: 1 }],
    bead: { x: -100, y: 40 }, exit: { x: 70, y: 95, r: 18 }, cen: { x: 20, y: 35 }, low: LOW_B, home: HOMES,
    cups: [dyeCup(TOP_CUP, 0, 'turn the vessel over the way that brings blue to it'), dyeCup(SIDE_CUP, 1, 'tip the right chamber over it')], pearls: [{ x: -145, y: 125 }, { x: 150, y: 125 }, { x: 150, y: -65 }],

  if (v.from === 'right') return { cx: v.x1 - w * c / 2, cy: (v.y0 + v.y1) / 2, hw: w * c / 2, hh: h / 2 };

let seedState = 1;

let elapsed = 0, exitT = 0, state = 'playing', keyDir = 0, keyHold = 0, rho0 = 1;
let bandT = 0, doorOpen = false, got = [];   // seconds all cups in band, lock state; pearls collected (per pearl, 0/1)
const trail = [], path = [];   // bead positions, flat x, y: live trail (last TRAIL_N frames), whole run (drawn at the win)
let pathEvery = PATH_EVERY, pathTick = 0;

  h += `<div class="levels">` + LEVELS.map((l, i) => l.free ? `<button data-l="${i}">${l.name}<small>no goal, no score: just water</small></button>` : `<button data-l="${i}" ${unlocked(i) ? '' : 'disabled'}>${i}. ${l.name}<small>${best[l.id] !== undefined ? 'best ' + best[l.id] + pearlDots(bestPearls[l.id] || 0, (l.pearls || []).length) : cleared[l.id] ? 'cleared' : unlocked(i) ? 'not cleared' : 'clear the level before'}</small></button>`).join('') + `</div>`;

}
function hideMenu() { menuOn = false; menu.classList.remove('on'); }
function start(i) { load(i); settling = true; reset(1); settling = false; hideMenu(); }
box.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.l !== undefined) start(+b.dataset.l);
  else if (b.dataset.a === 'retry') start(level);
  else if (b.dataset.a === 'next') start(level + 1);
  else if (b.dataset.a === 'close') { if (state === 'won') showMenu('won', score(), best[L.id]); else hideMenu(); }
});
document.getElementById('lv').addEventListener('click', () => showMenu('levels'));
const restartBtn = document.getElementById('rs');
restartBtn.addEventListener('click', () => { if (!menuOn) start(level); });

// § input
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { keyDir = -1; mode = 'free'; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { keyDir = 1; mode = 'free'; e.preventDefault(); }
  else if (e.key === ' ') { toggleValve(0); e.preventDefault(); }
  else if (e.key >= '1' && e.key <= '9') toggleValve(+e.key - 1);
  else if (e.key === 'r' || e.key === 'R') start(level);
  else if (e.key === 'Escape' || e.key === 'l' || e.key === 'L') { if (menuOn) hideMenu(); else showMenu('levels'); }
});
addEventListener('keyup', e => { if ((e.key === 'ArrowLeft' && keyDir < 0) || (e.key === 'ArrowRight' && keyDir > 0)) keyDir = 0; });
let drag = null;   // grab-and-turn dial (mouse / touch fallback)
cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect();
  drag = { a0: Math.atan2(e.clientY - r.top - Hh / 2, e.clientX - r.left - W / 2), t0: angle, id: e.pointerId }; mode = 'free'; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId || state !== 'playing') return; const r = cv.getBoundingClientRect();
  let d = Math.atan2(e.clientY - r.top - Hh / 2, e.clientX - r.left - W / 2) - drag.a0; d = Math.atan2(Math.sin(d), Math.cos(d));
  const prev = drag.last === undefined ? 0 : drag.last; let dd = d - prev; dd = Math.atan2(Math.sin(dd), Math.cos(dd)); drag.last = d;
  drag.t0 += dd * R2D; angle = drag.t0; });
cv.addEventListener('pointerup', () => { drag = null; });
// Phone tilt: gravity vector in screen space (not Euler angles). Android sign convention; iOS is the opposite.
const tiltBtn = document.getElementById('tilt');
let tiltOn = false, tiltZero = null;
function onMotion(e) {

  const ios = /iP(hone|ad|od)/.test(navigator.userAgent), s = ios ? -1 : 1;
  const gx = -g.x * s, gy = g.y * s;
  if (Math.hypot(gx, gy) < 3) return;                       // phone flat: no screen-space gravity

  a -= tiltZero; while (a - angle > 180) a -= 360; while (a - angle < -180) a += 360;

}
if (typeof DeviceMotionEvent !== 'undefined' && 'ontouchstart' in window) {
  tiltBtn.style.display = 'block';
  tiltBtn.onclick = async () => {
    try { if (DeviceMotionEvent.requestPermission && await DeviceMotionEvent.requestPermission() !== 'granted') return; } catch (_) { return; }
    tiltOn = true; tiltBtn.style.display = 'none'; addEventListener('devicemotion', onMotion);
  };
}
addEventListener('message', e => { if (e.data && e.data.type === 'arcade:pause') paused = true; if (e.data && e.data.type === 'arcade:resume') paused = false; });

// § loop
function lowSide() {   // too little water on the ring side: the bead cannot float down to the ring
  if (!L.low) return false;
  let b = 0; for (let i = 0; i < N; i++) if (PX[i] > L.low.x) b++;
  return b < L.low.n;
}
function hint() {
  if (state === 'won') return `Through the exit! Score ${score()}.`;
  if (doorOpen && CUPS.length && CUPS.some((c, k) => bull(k) < 0.999)) return 'Door open. Carry the bead into the gold ring (a level right on the dotted centre line scores a bullseye).';
  if (!CUPS.length) return L.goal;
  if (hopeT >= HOPE_T) { const c = CUPS[hopeK], o = DYE_NAME[1 - c.dye]; return `The ${DYE_NAME[c.dye]} water is too mixed with ${o} to fill the ${c.name} now. Colours never separate: tap ↻ to start again.`; }
  const mixed = CUPS.findIndex((c, k) => !pure(k) && fill[k] + foreign[k] > 0.1);
  if (mixed >= 0) { const c = CUPS[mixed]; return `The ${c.name} holds too much ${DYE_NAME[1 - c.dye]} (${Math.round(100 * mix[mixed])}%, at most ${100 * PURITY}%). Open its valve and pour it out${hopeT > 0 ? ', or tap ↻ to start again' : ''}.`; }
  const shutInBand = CUPS.length && CUPS.every((c, k) => valveWant[k] && inBand(k) && pure(k));

  if (open >= 0) return `The ${CUPS[open].name} is in its green band! Shut its valve to keep it.`;
  const over = CUPS.findIndex((c, k) => fill[k] > c.band[1]);

let paused = false, last = 0, acc = 0, fpsEMA = 60, simEMA = 0, shownHint = '';

    `${(((angle % 360) + 360) % 360).toFixed(0)}°${cups ? ' · ' + cups : ''}${doorOpen ? ' · DOOR OPEN' : ''} · ${fpsEMA.toFixed(0)} fps · sim ${simEMA.toFixed(1)} ms`;

window.__dbg = { get N() { return N; }, get cups() { return CUPS; }, get fill() { return fill; }, get doorOpen() { return doorOpen; }, step, snap, restore, reset, sdf, get SHAPES() { return SHAPES; }, get EXIT() { return EXIT; }, BEAD_R, PR, TARGET_RATE, H,
