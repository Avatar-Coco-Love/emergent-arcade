<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Glass</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1b2233;
    --line: #34405a;
    --text: #eef1f7;
    --muted: #97a1b8;
    --accent: #f0c46a;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the board scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  #field { flex: 1; min-height: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  #board { display: block; width: 100%; height: 100%; touch-action: none; }
  #msg {
    position: absolute;
    top: 2%;
    left: 2%;
    right: 2%;
    margin: 0;
    text-align: center;
    font-size: 0.85rem;
    line-height: 1.3;
    color: #f4f6fb;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
    pointer-events: none;
  }
  #msg.warn { color: #ffb0a0; }
  #endCard {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(80%, 290px);
    padding: 18px 16px;
    border-radius: 12px;
    background: rgba(27, 34, 51, 0.95);
    border: 1px solid var(--line);
    text-align: center;
  }
  #endCard[hidden] { display: none; }
  #endCard h2 { margin: 0 0 6px; font-size: 1.25rem; color: var(--accent); }
  #endCard p { margin: 0 0 4px; color: #cfd6e4; font-size: 0.9rem; }
  #nextBtn { margin-top: 12px; width: 100%; font-weight: 600; }
  #nextBtn:disabled { opacity: 0.4; }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .bar b { color: var(--text); }
  .pick { display: flex; align-items: center; gap: 4px; }
  .pick button { padding: 6px 9px; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  button:active:not(:disabled) { transform: scale(0.97); }
  button[hidden], #heatWrap[hidden], #clockWrap[hidden] { display: none; }
  #hudBest { font-size: 0.75rem; }
  .gauge {
    display: inline-block;
    width: 64px;
    height: 10px;
    border-radius: 5px;
    background: var(--panel);
    border: 1px solid var(--line);
    vertical-align: middle;
    overflow: hidden;
  }
  .gauge i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #e2583e, #f0a24a); }
  /* The stuck hint pulses the control it points at. */
  .nudge { animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240, 196, 106, 0); border-color: var(--line); }
    50% { box-shadow: 0 0 0 5px rgba(240, 196, 106, 0.45); border-color: var(--accent); }
  }
</style>
</head>
<body>
  <div id="field">
    <div id="stage">
      <canvas id="board" aria-label="Bubble Glass. Turn the box to move the sand and the bubble, hold on sand to melt it into glass, tap glass to shatter it."></canvas>
      <p id="msg" role="status"></p>
      <div id="endCard" hidden>
        <h2 id="endTitle"></h2>
        <p id="endDetail"></p>
        <p id="endAch"></p>
        <button id="nextBtn">Next level</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <span class="pick"><button id="prevLv" aria-label="Previous level">◀</button><span>Level <b id="hudLevel"></b></span><button id="nextLv" aria-label="Next level">▶</button></span>
    <span id="clockWrap" hidden title="Chapter clock">⏱ <b id="hudClock"></b> <span id="hudBest"></span></span>
    <span id="heatWrap">Heat <span class="gauge"><i id="heatFill"></i></span> <b id="hudHeat"></b></span>
    <button id="tiltBtn" hidden>Tilt: off</button>
    <button id="resetBtn">Restart</button>
  </div>

    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';

  // ---------- the world (pure simulation: no input, no drawing) ----------
  // A world holds the grid and everything that moves in it. Cells: t (the
  // material), sid (the shard a glass cell belongs to), tone (a grain's
  // shade, which moves with it), was (what a glass cell melted from, so a
  // shatter gives it back), bub (the bubble covers it). The bubble is a
  // disc at (bx, by) in cell units. ang is the box's angle (rad, clockwise
  // on screen) and angT where it's turning to.
  const DX = [0, 1, 1, 1, 0, -1, -1, -1], DY = [1, 1, 0, -1, -1, -1, 0, 1];
  // Cells in order of height against each of the 8 gravity directions,
  // lowest first (two tie orders, alternated so piles don't lean).
  const ORDER = [];
  for (let k = 0; k < 8; k++) {
    const px = -DY[k], py = DX[k];
    const make = s => {
      const idx = Array.from({ length: N * N }, (_, i) => i);
      const key = i => { const x = i % N, y = (i / N) | 0; return -(x * DX[k] + y * DY[k]) * 1000 + s * (x * px + y * py); };
      idx.sort((a, b) => key(a) - key(b));
      return Int32Array.from(idx);
    };
    ORDER.push([make(1), make(-1)]);
  }

  function parseLevel(L) {
    const w = { t: new Uint8Array(N * N), sid: new Int16Array(N * N), tone: new Uint8Array(N * N),
      was: new Uint8Array(N * N), bub: new Uint8Array(N * N), mark: new Uint32Array(N * N), stamp: 0, pass: 0,
      shards: [], nextId: 1, bubs: [], ang: 0, angT: 0, deg: 0, heat: L.heat, melt: null,
      sandAcc: 0, shardAcc: 0, won: false, flow: 1, moves: 0, moved: 0, bmoved: 0, out: 0, merged: 0,
      melted: 0, glass: 0, shattered: 0, shelter: 0, landed: 0, fast: false };
    const starts = [];
    for (let my = 0; my < MAP; my++) for (let mx = 0; mx < MAP; mx++) {
      const ch = L.map[my][mx];
      const m = BY_CH[ch];
      if (m === undefined) throw new Error(`level ${L.id}: unknown map character ${ch}`);
      if (ch === 'o') starts.push([mx * CH + CH / 2, my * CH + CH / 2]);
      if (EVERY[m] === 1) w.fast = true;
      for (let dy = 0; dy < CH; dy++) for (let dx = 0; dx < CH; dx++) {
        const i = (my * CH + dy) * N + mx * CH + dx;
        w.t[i] = m;
        w.tone[i] = (Math.random() * 256) | 0;
        if (m === GLASS) w.was[i] = MAT.sand;
      }
    }
    // Pre-placed glass: each connected patch is one shard.
    for (let i = 0; i < N * N; i++) {
      if (w.t[i] !== GLASS || w.sid[i]) continue;
      const s = { id: w.nextId++, cells: [], held: false };
      const todo = [i];
      w.sid[i] = s.id;
      while (todo.length) {
        const c = todo.pop();
        s.cells.push(c);
        const x = c % N, y = (c / N) | 0;
        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
          if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const j = ny * N + nx;
          if (w.t[j] === GLASS && !w.sid[j]) { w.sid[j] = s.id; todo.push(j); }
        }
      }
      w.shards.push(s);
    }
    // Centre each bubble where it fits, nearest its o.
    for (const [x0, y0] of starts) {
      const b = { x: x0, y: y0, r: BR, flow: 1 };
      const fits = (x, y) => footprint(x, y, b.r).every(j => j >= 0 && !STOPS[w.t[j]] && !w.bub[j]);
      search: for (let r = 0; r <= 3; r += 0.5) for (let dy = -r; dy <= r; dy += 0.5) for (let dx = -r; dx <= r; dx += 0.5) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) === r && fits(x0 + dx, y0 + dy)) { b.x += dx; b.y += dy; break search; }
      }
      for (const j of footprint(b.x, b.y, b.r)) if (j >= 0) { w.bub[j] = 1; if (FALLS[w.t[j]]) w.t[j] = AIR; }
      w.bubs.push(b);
    }
    w.ang = w.angT = (L.ang || 0) * RAD;
    return w;
  }

  function cloneWorld(w) {
    return { ...w, t: w.t.slice(), sid: w.sid.slice(), tone: w.tone.slice(), was: w.was.slice(), bub: w.bub.slice(),
      mark: new Uint32Array(N * N), stamp: 0, shards: w.shards.map(s => ({ ...s, cells: s.cells.slice() })),
      bubs: w.bubs.map(b => ({ ...b })), melt: w.melt && { ...w.melt } };
  }

  // Cells a bubble of radius r covers when centred at (bx, by) (-1: outside the box).
  function footprint(bx, by, r) {
    const out = [];
    const x0 = Math.floor(bx - r), x1 = Math.floor(bx + r), y0 = Math.floor(by - r), y1 = Math.floor(by + r);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const cx = x + 0.5 - bx, cy = y + 0.5 - by;
      if (cx * cx + cy * cy > r * r) continue;
      out.push(x < 0 || y < 0 || x >= N || y >= N ? -1 : y * N + x);
    }
    return out;
  }

  // Gravity in the box's frame: (gx, gy) for the bubble, and for grains the
  // two nearest of 8 directions (k0, k1) with the share frac of k1, so a
  // small turn makes a slope creep instead of nothing happening until 22.5°.
  function gravity(w) {
    const gx = Math.sin(w.ang), gy = Math.cos(w.ang);
    let kf = (w.ang / (Math.PI / 4)) % 8;
    if (kf < 0) kf += 8;
    const k0 = Math.floor(kf);
    return { gx, gy, k0: k0 & 7, k1: (k0 + 1) & 7, frac: kf - k0, main: Math.round(kf) & 7 };
  }

  const free = (w, j) => w.t[j] === AIR && !w.bub[j];
  // Where a grain at (x, y) can go in direction k, or -1. A diagonal step
  // needs one of the two cells beside it open, so grains can't squeeze
  // between two corners. A grate (up to 3 cells thick) is skipped: the grain
  // lands just past it, straight through.
  function grainTo(w, x, y, k) {
    let nx = x + DX[k], ny = y + DY[k];
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) return -1;
    let j = ny * N + nx;
    if (SIEVE[w.t[j]]) {
      if (DX[k] && DY[k]) return -1;
      for (let n = 0; SIEVE[w.t[j]]; n++) {
        nx += DX[k]; ny += DY[k];
        if (n > 2 || nx < 0 || ny < 0 || nx >= N || ny >= N) return -1;
        j = ny * N + nx;
      }
      return free(w, j) ? j : -1;
    }
    if (!free(w, j)) return -1;
    if (DX[k] && DY[k] && !free(w, y * N + nx) && !free(w, ny * N + x)) return -1;
    return j;
  }

  function sandPass(w, g) {
    const p = w.pass++;
    const order = ORDER[g.main][(p >> 1) & 1];
    const t = w.t, stamp = ++w.stamp;
    const sh = w.shelter, down = g.main;
    for (let n = 0; n < order.length; n++) {
      const i = order[n];
      const m = t[i];
      if (!FALLS[m] || w.mark[i] === stamp || p % EVERY[m]) continue;
      const x = i % N, y = (i / N) | 0;
      const k = Math.random() < g.frac ? g.k1 : g.k0;
      let j = grainTo(w, x, y, k);
      if (j < 0 && SLIDES[m]) {
        const a = Math.random() < 0.5 ? 1 : 7;
        j = grainTo(w, x, y, (k + a) & 7);
        if (j < 0) j = grainTo(w, x, y, (k + 8 - a) & 7);
      }
      if (j < 0) continue;
      t[j] = m; w.tone[j] = w.tone[i]; t[i] = AIR;
      w.mark[j] = stamp;
      w.moves++;
      // Landed on the shard sheltering the bubble (for Umbrella)?
      if (sh) {
        const bx = (j % N) + DX[down], by = ((j / N) | 0) + DY[down];
        if (bx >= 0 && by >= 0 && bx < N && by < N && w.sid[by * N + bx] === sh) w.landed++;
      }
    }
  }

  function moveShard(w, s, dx, dy) {
    const off = dy * N + dx;
    for (const i of s.cells) {
      const nx = i % N + dx, ny = ((i / N) | 0) + dy;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) return false;
      const j = i + off;
      if (w.sid[j] === s.id) continue;
      if (!free(w, j)) return false;
    }
    const data = s.cells.map(i => [i + off, w.tone[i], w.was[i]]);
    for (const i of s.cells) { w.t[i] = AIR; w.sid[i] = 0; }
    s.cells = data.map(([j, tn, wa]) => { w.t[j] = GLASS; w.sid[j] = s.id; w.tone[j] = tn; w.was[j] = wa; return j; });
    return true;
  }

  // Shards fall as one piece along the nearest of the 8 directions; on a
  // diagonal they slide along a wall.
  function shardPass(w, g) {
    const k = g.main, dx = DX[k], dy = DY[k];
    const h = s => { let v = 0; for (const i of s.cells) v += (i % N) * dx + ((i / N) | 0) * dy; return v / s.cells.length; };
    const list = w.shards.filter(s => !s.held).sort((a, b) => h(b) - h(a));
    for (const s of list) {
      if (moveShard(w, s, dx, dy) || dx && dy && (moveShard(w, s, dx, 0) || moveShard(w, s, 0, dy))) w.moved++;
    }
  }

  // Sand straight ahead of bubble b along (ux, uy), weighted by each
  // material's resist: the deepest of four lanes across its width. A thin
  // layer across its path only slows it, but a long run of sand along one
  // side (a film down a tube it fills) is as much a wall as a deep pile.
  function sandAhead(w, b, ux, uy) {
    const px = -uy, py = ux, o1 = b.r - 0.7;
    let most = 0;
    for (const o of [-o1, -o1 / 3, o1 / 3, o1]) {
      let dep = 0;
      for (let s = b.r + 0.6; dep < DEEP && s < b.r + DEEP + 2; s += 1) {
        const x = Math.floor(b.x + ux * s + px * o), y = Math.floor(b.y + uy * s + py * o);
        if (x < 0 || y < 0 || x >= N || y >= N) break;
        const m = w.t[y * N + x];
        if (!FALLS[m]) break;
        dep += RESIST[m];
      }
      most = Math.max(most, dep);
    }
    return most;
  }
  function liquidAt(w, x, y) {
    x = Math.floor(x); y = Math.floor(y);
    return x >= 0 && y >= 0 && x < N && y < N && w.t[y * N + x] === AIR;
  }
  const flowFor = dep => dep <= 0 ? 1 : dep >= DEEP ? 0 : 1 / (1 + dep / TRICKLE_D);

  // Try moving bubble b by (mx, my), slowed by the sand ahead along the
  // move. Grains in the way swap to the cells it leaves behind (sand is
  // never lost); anything that stops it blocks, and so does another bubble
  // (then w.touch is set, and they may merge).
  function tryBubble(w, b, mx, my, ux, uy) {
    const old = footprint(b.x, b.y, b.r), own = new Set(old);
    let nx = b.x + mx, ny = b.y + my;
    let nf = footprint(nx, ny, b.r), shifted = [];
    const scan = () => {
      shifted = [];
      for (const j of nf) {
        if (j < 0) return false;
        if (w.bub[j]) { if (own.has(j)) continue; w.touch = true; return false; }
        if (w.t[j] === AIR) continue;
        if (FALLS[w.t[j]]) shifted.push(j); else return false;
      }
      return true;
    };

  function clock(t) {
    if (t < 60) return `${t.toFixed(1)} s`;
    const m = Math.floor(t / 60);
    return `${m}:${(t - 60 * m).toFixed(1).padStart(4, '0')}`;
  }

  function hud() {
    document.getElementById('hudLevel').textContent = `${level + 1}/${LEVELS.length}`;
    document.getElementById('clockWrap').hidden = !chRun;
    if (chRun) {
      document.getElementById('hudClock').textContent = clock(chRun.t);
      const best = bestBy[CHAPTERS[chRun.ch].id];
      document.getElementById('hudBest').textContent = typeof best === 'number' ? `best ${clock(best)}` : '';
    }
    document.getElementById('prevLv').disabled = level <= 0;
    document.getElementById('nextLv').disabled = level >= reached;
    const hw = document.getElementById('heatWrap');
    hw.hidden = !can('melt');
    document.getElementById('hudHeat').textContent = Math.floor(world.heat);
    document.getElementById('heatFill').style.width = (lv().heat ? 100 * world.heat / lv().heat : 0) + '%';
  }

  function win() {
    state = 'won';
    endPress();
    const c = lv().ch;
    if (chRun && chRun.next === level) {
      if (level === chLast(c)) { chapterTime = chRun.t; chRun = null; } else chRun.next = level + 1;
    }
    report('won');
    const last = level === LEVELS.length - 1;
    beaten.add(lv().id);
    if (level + 1 > reached && !last) reached = level + 1;
    save();
    if (level >= 2 && world.melted === 0) unlock('cold-hands');
    if (level >= 2 && world.deg < LIGHT_DEG) unlock('light-touch');
    if (lastShatter !== null && elapsed - lastShatter <= BREAKOUT_T) unlock('breakout');
    if (LEVELS.every(L => beaten.has(L.id))) unlock('glassblower');
    if (chapterTime !== null) unlock('clockwork');
    msgEl.textContent = '';
    nudge(null);
    document.getElementById('endTitle').textContent = last ? 'Every bubble is free!'
      : chapterTime !== null ? `Chapter ${c + 1} done!` : world.out > 1 ? 'Bubbles free!' : 'Bubble free!';
    const bits = [`${turns} turn${turns === 1 ? '' : 's'}, ${Math.round(world.deg)}° in all`];
    if (can('melt')) bits.push(`${world.melted} shard${world.melted === 1 ? '' : 's'} melted, ${Math.floor(world.heat)} heat left`);
    let text = bits.join('; ') + '.';
    if (chapterTime !== null) {
      const best = bestBy[CHAPTERS[c].id];
      text = `${CHAPTERS[c].name} in ${clock(chapterTime)}` + (typeof best === 'number'
        ? chapterTime < best ? ` (new best, was ${clock(best)}).` : ` (best ${clock(best)}).` : '.') + ' ' + text;
    }
    document.getElementById('endDetail').textContent = text;
    const n = roundEarned.size;
    document.getElementById('endAch').textContent = n ? `🏆 ${n} achievement${n === 1 ? '' : 's'} earned` : '';
    nextBtn.textContent = last ? 'Play again from level 1' : LEVELS[level + 1].ch !== c ? `Chapter ${c + 2}` : 'Next level';
    nextBtn.disabled = true;
    endCard.hidden = false;
    setTimeout(() => { nextBtn.disabled = false; }, END_INPUT_LOCK_MS);
    hud();
  }

  function next() {
    if (state !== 'won') return;
    startLevel(level === LEVELS.length - 1 ? 0 : level + 1);
  }

  // Leaving a level (Restart, or the level picker) counts as a lost try
  // once the player has done anything.
  function leave(reason, to) {
    if (state === 'playing' && firstInput) report('lost', reason);
    startLevel(to);
  }
  function restart() { if (!paused) leave('restart', level); }

  // Level text says {tap} / {hold}; show the word for this device.
  function words(t) {
    return t.replace(/\{(tap|hold)\}/gi, (m, w) => {
      const v = w.toLowerCase() === 'tap' ? TAP : HOLD;
      return w[0] === w[0].toUpperCase() ? v : v.toLowerCase();
    });
  }
  // ms 0: the message stays until something else replaces it.
  function say(text, ms = 2500, warn) {
    const t = words(text);
    msgEl.textContent = t;
    msgEl.className = warn ? 'warn' : '';
    clearTimeout(msgTimer);
    if (ms) msgTimer = setTimeout(() => { msgEl.textContent = ''; }, Math.max(ms, 1500 + MSG_MS_PER_CHAR * t.length));
  }
  // A warning for something that can't be undone, once per level each.
  function warn(key, text) {
    if (warned.has(key)) return;
    warned.add(key);
    warns++;
    say(text, 4000, true);
  }

  // first_input: 1 turn, 2 melt, 3 shatter, 4 a press that did nothing.
  function touched(kind) { if (!firstInput) firstInput = kind; stall = 0; }

  // ---------- the game's step ----------
  function step(dt) {
    elapsed += dt;
    if (chRun) chRun.t += dt;
    simStep(world, dt);
    if (world.flow <= 0) buriedS += dt;
    if (world.shelter && world.landed >= UMBRELLA_N) unlock('umbrella');
    if (!world.shelter) world.landed = 0;
    if (world.melt) {
      const s = world.shards.find(q => q.id === world.melt.sid);
      if (s && touchesBubble(world, s)) {
        warn('wall', can('shatter') ? `Glass is a wall for the bubble. ${TAP} it to break it.`
          : 'Careful: glass is a wall for the bubble, and it can\'t be broken until level 3.');
      }
    }
    if (world.heat < 1 && lv().heat && world.melted) warn('heat', 'Out of heat: no more glass this level.');
    if (world.out > outSeen) {
      outSeen = world.out;
      const [x, y, r] = world.outAt;
      pops.push({ x, y, r, t: 0 });
      if (r > BR * 1.2) unlock('big-bubble');
      if (!world.won) say(world.bubs.length === 1 ? 'One bubble out. One to go.' : `One out. ${world.bubs.length} to go.`, 2500);
    }
    if (world.won) { win(); return; }
    watchStall(dt);
  }

  // The stuck hint: after STALL_T s with nothing moving and no input, look
  // for the turn that brings the bubble closest to the vent; failing that, a
  // place to melt, a shard to shatter, or Restart.
  function watchStall(dt) {
    // Lid-first levels point at the lids once LID_HINT_T s have passed, whatever is moving.
    const lid = lidHint();
    if (lid) {
      if (!hint || !hint.lid || hint.x !== lid.x || hint.y !== lid.y) { hints++; nudge(lid); }
      if (!msgEl.textContent) say(lv().hint, 0);
      return;
    }
    // A shatter or melt hint that has been done clears at once.
    if (hint && (hint.shatter && !world.shards.some(q => q.id === hint.shatter) ||
      hint.melt && !hint.lid && !MELTS[materialAt(world, hint.x, hint.y)])) nudge(null);
    if (hint && hint.lid) {
      nudge(null);
      if (msgEl.textContent.endsWith(words(lv().hint))) { clearTimeout(msgTimer); msgEl.textContent = ''; }
    }
    // In tilt mode a phone in the hand never holds perfectly still, and
    // settling sand keeps creeping: there, still means the phone within
    // TILT_STILL of where it was and the bubble not moving.
    const turning = motion.on ? Math.abs(angDiff(world.angT, stallAng)) > TILT_STILL * RAD : Math.abs(world.angT - world.ang) >= 0.01;
    const settled = world.bmoved < 0.02 && (motion.on || (world.moves < 3 && world.moved === 0));
    const still = settled && !turning && !world.melt && !press;
    if (!still) {
      stall = 0; hintJob = null; ready = null; stallAng = world.angT;
      if (hint) hintStale = true;
      if (hint && (elapsed - hintAt >= HINT_MIN || (hint.turn && Math.abs(angDiff(world.ang, hint.a)) < 10 * RAD))) nudge(null);
      return;
    }
    // Something moved since the hint showed: once it has been up HINT_MIN, look again.
    if (hint && hintStale && elapsed - hintAt >= HINT_MIN) nudge(null);
    stall += dt;
    const limit = level === 0 ? STALL_T / 2 : STALL_T;
    if (stall >= limit) stuckS += dt;
    if (hint) return;
    // Start looking halfway through the wait, a few steps per frame.
    if (stall >= limit / 2 && !hintJob && !ready) hintJob = findHintG(cloneWorld(world));
    if (hintJob) { lookFrom = performance.now(); const r = hintJob.next(); if (r.done) { ready = r.value; hintJob = null; } }
    if (stall < limit || !ready) return;
    const h = ready;
    ready = null;
    hints++;
    hintAt = elapsed;
    nudge(h);
    if (h.turn) say(`${h.turn > 0 ? 'Turn it clockwise ↻' : 'Turn it counterclockwise ↺'} (${motion.on ? 'tip your phone' : touchScreen ? 'drag around the box' : 'drag around the box, or ← →'}).`, 4000);
    else if (h.melt) say(lv().hint || `${HOLD} on the sand here to melt it into glass.`, 5000);
    else if (h.shatter) say(`${TAP} the glass to shatter it back into sand.`, 4000);
    else say(world.heat < 1 && can('melt') ? 'No heat left, and turning won\'t free it. Restart the level.' : 'Stuck for good. Restart the level.', 5000);
  }
  function* findHintG(w) {
    // A melt level's marked spots come first while they're still sand with
    // no glass beside them (the level was built around melting there).
    if (can('melt') && w.heat >= 8) {
      for (const [mx, my] of lv().melt || []) {
        const x = mx * CH + CH / 2, y = my * CH + CH / 2;
        if (MELTS[materialAt(w, x, y)] && !glassNear(w, x, y, 4)) return { melt: true, x, y };
      }
    }
    const { best, wait } = yield* bestTurnG(w, LOOK_T);
    if (best.k && best.score < wait - 2) return { turn: Math.sign(best.k), a: best.a };
    if (can('shatter')) {
      for (const s of w.shards) {
        const c = cloneWorld(w);
        const x = s.cells[0] % N + 0.5, y = ((s.cells[0] / N) | 0) + 0.5;
        if (!shatterAt(c, x, y)) continue;
        const r = yield* bestTurnG(c, LOOK_T);
        if (Math.min(r.best.score, r.wait) < wait - 2) return { shatter: s.id, x, y };
      }
    }
    if (can('melt') && w.heat >= 8) {
      for (const [mx, my] of lv().melt || []) {
        const x = mx * CH + CH / 2, y = my * CH + CH / 2;
        if (MELTS[materialAt(w, x, y)]) return { melt: true, x, y };
      }
    }
    return { restart: true };
  }
  const findHint = w => finish(findHintG(w));
  const angDiff = (a, b) => { const d = a - b; return d - Math.round(d / (2 * Math.PI)) * 2 * Math.PI; };
  // A lid-first level's melt hint: its next marked spot that's still sand
  // with no glass beside it, while there's heat for a lid.
  function lidHint() {
    const L = lv();
    if (!L.lidFirst || !can('melt') || world.heat < 8 || state !== 'playing' || elapsed < LID_HINT_T) return null;
    for (const [mx, my] of L.melt) {
      const x = mx * CH + CH / 2, y = my * CH + CH / 2;
      if (MELTS[materialAt(world, x, y)] && !glassNear(world, x, y, 4)) return { melt: true, lid: true, x, y };
    }
    return null;
  }
  function glassNear(w, x, y, r) {
    for (let j = Math.floor(y - r); j <= y + r; j++) for (let i = Math.floor(x - r); i <= x + r; i++) {
      if (i >= 0 && j >= 0 && i < N && j < N && w.t[j * N + i] === GLASS) return true;
    }
    return false;
  }
  function nudge(h) {
    hint = h;
    hintStale = false;
    document.getElementById('resetBtn').classList.toggle('nudge', !!(h && h.restart));
  }

  // ---------- drawing ----------
  const off = document.createElement('canvas');
  off.width = off.height = N;
  const offCtx = off.getContext('2d');
  const img = offCtx.createImageData(N, N);
  let pops = [], outSeen = 0, confirmed = new Set();
  function drawAngle() { return motion.on ? 0 : world.ang; }
  // Box cell coordinates -> game units, and back.
  function toScreen(bx, by) {
    const a = drawAngle(), x = (bx / N - 0.5) * BOX, y = (by / N - 0.5) * BOX;
    return [W / 2 + x * Math.cos(a) - y * Math.sin(a), H / 2 + x * Math.sin(a) + y * Math.cos(a)];
  }
  function toBox(gx, gy) {
    const a = -drawAngle(), x = gx - W / 2, y = gy - H / 2;
    return [((x * Math.cos(a) - y * Math.sin(a)) / BOX + 0.5) * N, ((x * Math.sin(a) + y * Math.cos(a)) / BOX + 0.5) * N];
  }

  function paintGrid(now) {
    const d = img.data, w = world;
    const heldId = w.melt ? w.melt.sid : 0;
    const glow = 0.5 + 0.5 * Math.sin(now / 150);
    for (let i = 0; i < N * N; i++) {
      const m = w.t[i], c = MATERIALS[m].colour, o = i * 4;
      let r = c[0], g = c[1], b = c[2];
      if (FALLS[m]) { const v = (w.tone[i] - 128) / 128 * 22; r += v; g += v; b += v * 0.6; }
      else if (m === GLASS) {
        const v = (w.tone[i] - 128) / 128 * 10;
        if (w.sid[i] === heldId) { r = 255; g = 150 + 60 * glow; b = 70; }
        else { r += v; g += v; b += v; }
      } else if (SIEVE[m]) { if ((i + ((i / N) | 0)) & 1) { r *= 0.55; g *= 0.55; b *= 0.55; } }
      else if (m === AIR) { const v = ((i * 2654435761) >>> 28) - 8; b += v * 0.4; }
      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
    }
    offCtx.putImageData(img, 0, 0);
  }

  function draw(now) {
    const s = canvas.width / W;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // The ring you turn the box by.
    ctx.strokeStyle = 'rgba(151, 161, 184, 0.28)';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(W / 2, H / 2, RING, 0, Math.PI * 2); ctx.stroke();
    const a = drawAngle();
    ctx.strokeStyle = 'rgba(151, 161, 184, 0.6)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 12; k++) {
      const q = a + k * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(W / 2 + Math.cos(q) * (RING - 5), H / 2 + Math.sin(q) * (RING - 5));
      ctx.lineTo(W / 2 + Math.cos(q) * (RING + 5), H / 2 + Math.sin(q) * (RING + 5));
      ctx.stroke();
    }
    // The box.
    paintGrid(now);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(a);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, -BOX / 2, -BOX / 2, BOX, BOX);
    ctx.strokeStyle = '#4a5776';
    ctx.lineWidth = 3;
    ctx.strokeRect(-BOX / 2, -BOX / 2, BOX, BOX);
    ctx.restore();
    drawShardEdges();
    drawVent(now);
    drawBubbles(now);
    drawPress(now);
    drawHint(now);
    if (motion.on) drawGravity();
    for (const p of pops) {
      p.t += 1 / 60;
      const [x, y] = toScreen(p.x, p.y);
      ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, 1 - p.t)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, p.r * CELL + 40 * p.t, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Bright outline where glass meets anything else, so shards read as solid.
  function drawShardEdges() {
    const w = world;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(drawAngle());
    ctx.translate(-BOX / 2, -BOX / 2);
    ctx.strokeStyle = 'rgba(235, 252, 255, 0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const s of w.shards) for (const i of s.cells) {
      const x = i % N, y = (i / N) | 0;
      if (y === 0 || w.sid[i - N] !== s.id) { ctx.moveTo(x * CELL, y * CELL); ctx.lineTo((x + 1) * CELL, y * CELL); }
      if (y === N - 1 || w.sid[i + N] !== s.id) { ctx.moveTo(x * CELL, (y + 1) * CELL); ctx.lineTo((x + 1) * CELL, (y + 1) * CELL); }
      if (x === 0 || w.sid[i - 1] !== s.id) { ctx.moveTo(x * CELL, y * CELL); ctx.lineTo(x * CELL, (y + 1) * CELL); }
      if (x === N - 1 || w.sid[i + 1] !== s.id) { ctx.moveTo((x + 1) * CELL, y * CELL); ctx.lineTo((x + 1) * CELL, (y + 1) * CELL); }
    }
    ctx.stroke();
    ctx.restore();
  }

  // The vent: an arrow pointing out of the box.
  let ventAt = null;
  function drawVent(now) {
    if (!ventAt) return;
    const [vx, vy, ox, oy] = ventAt;
    const [x, y] = toScreen(vx, vy), [x2, y2] = toScreen(vx + ox * 4, vy + oy * 4);
    const pulse = 0.6 + 0.4 * Math.sin(now / 300);
    ctx.fillStyle = `rgba(240, 196, 106, ${pulse})`;
    const ang = Math.atan2(y2 - y, x2 - x);
    ctx.save();
    ctx.translate(x2, y2);
    ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-4, -7); ctx.lineTo(-4, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function findVent(w) {
    let sx = 0, sy = 0, n = 0;
    for (let i = 0; i < N * N; i++) if (EXIT[w.t[i]]) { sx += i % N + 0.5; sy += ((i / N) | 0) + 0.5; n++; }
    if (!n) return null;
    const x = sx / n, y = sy / n;
    const ox = x < 2 ? -1 : x > N - 2 ? 1 : 0, oy = y < 2 ? -1 : y > N - 2 ? 1 : 0;
    return [x, y, ox, oy];
  }

  // The bubble: white, amber while sand trickles past it, red and dashed
  // when the sand ahead is deep enough to be a wall.
  function drawBubbles(now) { for (const b of world.bubs) drawBubble(b, now); }
  function drawBubble(b, now) {
    const [x, y] = toScreen(b.x, b.y);
    const r = (b.r + 0.4) * CELL;
    const blocked = b.flow <= 0, slow = b.flow < 1;
    ctx.fillStyle = 'rgba(220, 240, 255, 0.25)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = blocked ? '#ff6b5a' : slow ? `rgba(255, 190, 90, ${0.6 + 0.4 * Math.sin(now / 120)})` : '#f4fbff';
    if (blocked) ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.22, 0, Math.PI * 2); ctx.fill();
  }

  // While melting: a ring at the finger that fills as the shard grows.
  function drawPress(now) {
    if (!press || !world.melt) return;
    const s = world.shards.find(q => q.id === world.melt.sid);
    if (!s) return;
    const p = s.cells.length / SHARD_MAX;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath(); ctx.arc(press.x, press.y, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = p >= 1 || world.heat < 1 ? '#ff6b5a' : '#ffae55';
    ctx.beginPath(); ctx.arc(press.x, press.y, 26, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, p)); ctx.stroke();
    void now;
  }

  function drawHint(now) {
    if (!hint || state !== 'playing') return;
    const pulse = 0.5 + 0.5 * Math.sin(now / 200);
    ctx.strokeStyle = `rgba(240, 196, 106, ${0.5 + 0.5 * pulse})`;
    ctx.fillStyle = `rgba(240, 196, 106, ${0.5 + 0.5 * pulse})`;
    ctx.lineWidth = 3;
    if (hint.turn) {
      // Chevrons running around the ring the way to turn.
      const dir = hint.turn, t = (now / 1000) % 1;
      for (const base of [-Math.PI / 2, Math.PI / 2]) {
        for (let k = 0; k < 3; k++) {
          const q = base + dir * (k * 0.22 + t * 0.22);
          const x = W / 2 + Math.cos(q) * RING, y = H / 2 + Math.sin(q) * RING;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(q + (dir > 0 ? Math.PI / 2 : -Math.PI / 2));
          ctx.beginPath(); ctx.moveTo(-6, -7); ctx.lineTo(4, 0); ctx.lineTo(-6, 7); ctx.stroke();
          ctx.restore();
        }
      }
    } else if (hint.melt || hint.shatter) {
      let x = hint.x, y = hint.y;
      if (hint.shatter) {
        const s = world.shards.find(q => q.id === hint.shatter);
        if (!s) return;
        x = s.cells[0] % N + 0.5; y = ((s.cells[0] / N) | 0) + 0.5;
      }
      const [sx, sy] = toScreen(x, y);
      ctx.beginPath(); ctx.arc(sx, sy, 10 + 8 * pulse, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawGravity() {
    // Tilt mode: the box stays level on screen, so show which way is down.
    const g = gravity(world);
    const x = W / 2, y = H / 2, L = RING + 2;
    const ex = x + g.gx * L, ey = y + g.gy * L;
    ctx.fillStyle = 'rgba(240, 196, 106, 0.8)';
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(Math.atan2(g.gy, g.gx));
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------- input ----------
  // A press outside the box, or one that moves DRAG_PX, turns the box by
  // the pointer's angle around the centre. A still press on sand melts
  // after HOLD_DELAY_MS; a quick tap on glass shatters it.
  let press = null;
  const touchScreen = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const TAP = touchScreen ? 'Tap' : 'Click', HOLD = touchScreen ? 'Hold' : 'Click and hold';
  function toGame(evt) {
    const r = canvas.getBoundingClientRect();
    return [(evt.clientX - r.left) / r.width * W, (evt.clientY - r.top) / r.height * H];
  }
  function inBox(bx, by) { return bx >= 0 && by >= 0 && bx < N && by < N; }
  function startTurn(p) {
    if (motion.on) { motion.on = false; updateTiltBtn(); say('Tilt is off: drag to turn.'); }
    p.mode = 'turn';
    p.last = Math.atan2(p.y - H / 2, p.x - W / 2);
    turns++;
    touched(1);
  }
  canvas.addEventListener('pointerdown', evt => {
    if (paused || state !== 'playing' || press) return;
    const [x, y] = toGame(evt);
    const [bx, by] = toBox(x, y);
    press = { id: evt.pointerId, x, y, x0: evt.clientX, y0: evt.clientY, mode: 'pending', bx, by };
    canvas.setPointerCapture(evt.pointerId);
    if (!inBox(bx, by) || !can('melt') && !can('shatter')) { startTurn(press); return; }
    press.timer = setTimeout(() => {
      if (!press || press.mode !== 'pending') return;
      const [fx, fy] = toBox(press.x, press.y);
      const m = materialAt(world, fx, fy);
      if (MELTS[m] && can('melt')) {
        if (world.heat < 1) { say('No heat left.'); press.mode = 'idle'; touched(4); return; }
        if (meltStart(world, fx, fy)) { press.mode = 'melt'; touched(2); return; }
      }
      if (MELTS[m] && !can('melt')) say('Melting unlocks in level 2. Drag to turn the box.');
      if (m === MAT.wet) say('Wet sand won\'t melt. Only dry sand does.');
      press.mode = 'idle';
      touched(4);
    }, HOLD_DELAY_MS);
  });
  canvas.addEventListener('pointermove', evt => {
    if (!press || evt.pointerId !== press.id) return;
    const [x, y] = toGame(evt);
    press.x = x; press.y = y;
    if (press.mode === 'pending' || press.mode === 'idle') {
      if (Math.hypot(evt.clientX - press.x0, evt.clientY - press.y0) > DRAG_PX) { clearTimeout(press.timer); startTurn(press); }
    }
    if (press.mode === 'turn') {
      const q = Math.atan2(y - H / 2, x - W / 2);
      let d = q - press.last;
      if (d > Math.PI) d -= 2 * Math.PI;
      if (d < -Math.PI) d += 2 * Math.PI;
      press.last = q;
      world.angT += d;
      // The target never runs far ahead of the box, so letting go stops it.
      world.angT = Math.max(world.ang - Math.PI / 2, Math.min(world.ang + Math.PI / 2, world.angT));
    }
  });
  function endPress(evt) {
    if (!press || evt && evt.pointerId !== press.id) return;
    clearTimeout(press.timer);
    if (press.mode === 'pending' && evt && evt.type === 'pointerup') {
      const [fx, fy] = toBox(press.x, press.y);
      tapAt(fx, fy);
    }
    if (press.mode === 'melt') meltStop(world);
    press = null;
  }
  canvas.addEventListener('pointerup', endPress);
  canvas.addEventListener('pointercancel', endPress);

  function tapAt(fx, fy) {
    const near = shardNear(fx, fy);
    if (near && !can('shatter')) { say('Shattering unlocks in level 3.'); touched(4); return; }
    if (near) {
      const hit = world.shards.find(s => s.id === near);
      // Glass holding sand back (a lid, or sand that would bury a bubble):
      // the first tap only warns, the second breaks it.
      if (!confirmed.has(hit.id)) {
        const why = isLid(hit) ? 'That lid holds the sand back.' : buries(fx, fy) ? 'Its sand would bury the bubble.' : '';
        if (why) {
          confirmed.add(hit.id);
          warns++;
          say(`${why} ${TAP} it again to break it.`, 3000, true);
          touched(4);
          return;
        }
      }
      const onBubble = touchesBubble(world, hit);
      shatterAt(world, fx, fy);
      touched(3);
      if (onBubble) lastShatter = elapsed;
      if (world.heat < 1 && can('melt') && lv().heat) warn('remake', 'No heat left: that glass can\'t be remade.');
      return;
    }
    touched(4);
    if (MELTS[materialAt(world, fx, fy)] && can('melt')) say(`${HOLD} on sand to melt it.`);
  }
  // The same moves for the balance bots (cell units, radians).
  // Would shattering the glass at (fx, fy) wall a bubble in within 1.5 s?
  function buries(fx, fy) {
    if (world.flow <= 0) return false;
    const c = cloneWorld(world);
    meltStop(c);
    if (!shatterAt(c, fx, fy)) return false;
    for (let k = 0; k < 90 && !c.won; k++) simStep(c, STEP);
    return !c.won && c.flow <= 0;
  }
  function isLid(s) {
    if (!lv().lidFirst) return false;
    return lv().melt.some(([mx, my]) => s.cells.some(i => Math.abs(i % N + 0.5 - (mx * CH + CH / 2)) <= 4 && Math.abs(((i / N) | 0) + 0.5 - (my * CH + CH / 2)) <= 4));
  }
  function botTurn(a) { turns++; touched(1); world.angT = a; }
  function botMelt(fx, fy) { if (!can('melt') || !meltStart(world, fx, fy)) return false; touched(2); return true; }
  function botRelease() { meltStop(world); }
  function shardNear(fx, fy) {
    for (let r = 0; r <= TAP_R; r++) for (let y = Math.floor(fy - r); y <= fy + r; y++) for (let x = Math.floor(fx - r); x <= fx + r; x++) {
      if (x >= 0 && y >= 0 && x < N && y < N && world.sid[y * N + x]) return world.sid[y * N + x];
    }
    return 0;
  }

  // Keys: ← → (or A D) turn the box while held.
  const keys = new Set();
  window.addEventListener('keydown', evt => {
    const k = evt.key;
    if (!['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'].includes(k)) return;
    evt.preventDefault();
    if (paused || state !== 'playing') return;
    if (!keys.has(k)) {
      keys.add(k);
      if (motion.on) { motion.on = false; updateTiltBtn(); }
      turns++;
      touched(1);
    }
  });
  window.addEventListener('keyup', evt => { keys.delete(evt.key); });
  window.addEventListener('blur', () => keys.clear());
  function keyTurn(dt) {
    let dir = 0;
    for (const k of keys) dir += k === 'ArrowLeft' || k === 'a' || k === 'A' ? -1 : 1;
    if (!dir) return;
    world.angT = world.ang + Math.sign(dir) * KEY_RATE * RAD * Math.max(dt, STEP) * 1.5;
  }

  // Phone tilt (opt in): gravity is the real one, and the box stays level
  // on screen, like the sand toy in your hand. Gravity's direction on the
  // screen comes from deviceorientation beta/gamma and the screen's angle.
  const motion = { on: false, angle: 0, have: false, seen: false, moving: false, still: 0 };
  const tiltBtn = document.getElementById('tiltBtn');
  function onOrient(e) {
    if (e.beta === null || e.gamma === null || e.beta === undefined) return;
    motion.seen = true;
    const b = e.beta * RAD, g = e.gamma * RAD;
    const dx = Math.cos(b) * Math.sin(g), dyUp = -Math.sin(b);
    const a = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * RAD;
    const right = dx * Math.cos(a) - dyUp * Math.sin(a);
    const up = dx * Math.sin(a) + dyUp * Math.cos(a);
    if (Math.hypot(right, up) < 0.2) return;   // lying flat: keep the last direction
    motion.angle = Math.atan2(right, -up);
    motion.have = true;
  }
  function updateTiltBtn() { tiltBtn.textContent = `Tilt: ${motion.on ? 'on' : 'off'}`; }
  const askFirst = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
  let listening = false;
  function listen() {
    if (listening) return;
    listening = true;
    window.addEventListener('deviceorientation', onOrient);
  }
  if (touchScreen && typeof DeviceOrientationEvent !== 'undefined') tiltBtn.hidden = false;
  tiltBtn.addEventListener('click', () => {
    if (motion.on) { motion.on = false; updateTiltBtn(); return; }
    const go = () => {
      listen();
      setTimeout(() => {
        if (!motion.have) { say('No tilt sensor found here. Drag to turn instead.'); return; }
        motion.on = true;
        tiltUsed = true;
        updateTiltBtn();
        say('Tilt on: turn your phone like the toy. Drag to switch back.', 3500);
      }, 300);
    };
    if (askFirst) {
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === 'granted') go(); else say('Tilt is off. Drag to turn instead.');
      }).catch(() => say('Tilt is not available here. Drag to turn instead.'));
    } else go();
  });
  function readMotion() {
    if (!motion.on) return;
    let d = motion.angle - world.ang;
    d -= Math.round(d / (2 * Math.PI)) * 2 * Math.PI;
    // A turn of the phone counts once it's moved 10° after being still.
    if (Math.abs(world.angT - (world.ang + d)) > 0.003) {
      if (!motion.moving && Math.abs(d) > 10 * RAD) { motion.moving = true; turns++; touched(1); }
    }
    if (Math.abs(d) < 2 * RAD) motion.moving = false;
    world.angT = world.ang + d;
  }

  document.getElementById('resetBtn').addEventListener('click', restart);
  nextBtn.addEventListener('click', next);
  document.getElementById('prevLv').addEventListener('click', () => { if (!paused && level > 0) leave('switch', level - 1); });
  document.getElementById('nextLv').addEventListener('click', () => { if (!paused && level < reached) leave('switch', level + 1); });

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    acc += dt;
    last = now;
    if (!paused && state === 'playing') { keyTurn(dt); readMotion(); }
    while (acc >= STEP) {
      if (state === 'playing' && !paused) {
        if (press && press.mode === 'melt') { const [fx, fy] = toBox(press.x, press.y); meltMove(world, fx, fy); }
        step(STEP);
      }
      acc -= STEP;
    }
    hud();
    draw(now);
    requestAnimationFrame(frame);
  }

  runId = Math.random().toString(36).slice(2, 10);
  fitStage();
  updateTiltBtn();
  startLevel(reached);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
