<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pressure Grid</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #16161d;
    --text: #e8e8ee;
    --muted: #9a9aa5;
    --accent: #6fd3ff;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the board scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    gap: 10px;
  }
  #boardWrap {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
  }
  #board {
    display: block;
    touch-action: none;
    border-radius: 8px;
  }
  .controls {
    flex: none;
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a2a34;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .stat {
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div id="boardWrap">
    <canvas id="board" aria-label="Pressure Grid board. Tap a cell to pump, drag to siphon."></canvas>
  </div>
  <div class="controls">
    <button id="resetBtn">Reset</button>
    <span class="stat" id="stat"></span>
  </div>

<script>
(function() {
  const GAME_ID = 'pressure-grid';
  const GRID_SIZE = 10;
  const CELL_PX = 40;
  const CLICK_ADD = 30;
  const BLEED_RATE = 0.15;
  const ERUPT_THRESHOLD = 100;
  const ERUPT_BLAST = 24;   // 4 × 24 < ERUPT_THRESHOLD: every interior eruption loses pressure, so storms burn out
  const TICK_MS = 200;
  const SIPHON_FRACTION = 0.6;   // fraction of source cell's pressure moved
  const SIPHON_EFFICIENCY = 0.85; // fraction of siphoned amount that survives the transfer
  const DRAG_THRESHOLD_PX = 12;   // movement needed before a tap becomes a drag

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const statEl = document.getElementById('stat');
  const size = GRID_SIZE * CELL_PX; // board size in game units; drawing uses these

  // Scale the board to the largest square that fits the space it's given, and
  // give the canvas one pixel per screen pixel so it stays sharp at any size.
  const wrap = document.getElementById('boardWrap');
  function fitBoard() {
    const side = Math.max(120, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight)));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = side + 'px';
    canvas.style.height = side + 'px';
    canvas.width = canvas.height = Math.round(side * dpr);
    ctx.setTransform(canvas.width / size, 0, 0, canvas.height / size, 0, 0);
    draw(); // resizing a canvas clears it
  }

  // The gallery pauses the game while one of its panels covers it.
  let paused = false;
  window.addEventListener('message', evt => {
    if (evt.data && evt.data.type === 'arcade:pause') paused = true;
    if (evt.data && evt.data.type === 'arcade:resume') paused = false;
  });

  let pressure = makeGrid(0);
  let flash = makeGrid(0);
  let ticks = 0;
  let eruptions = 0;
  let siphons = 0;

  // drag tracking
  let pointerDown = false;
  let startCell = null;
  let startPx = null;
  let isDragging = false;
  let dragDir = null; // [dx, dy]

  // Achievements: announced to the Emergent Arcade gallery when embedded
  // (it records them); harmless when the file is opened on its own.
  const unlocked = new Set();
  function unlock(id) {
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
    }
  }

  function makeGrid(fill) {
    return Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(fill));
  }

  function inBounds(x, y) {
    return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE;
  }

  function neighbors(x, y) {
    const result = [];
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (inBounds(nx, ny)) result.push([nx, ny]);
    }
    return result;
  }

  function colorFor(p, f) {
    if (f > 0) return 'rgb(255,255,255)';
    const t = Math.min(p / ERUPT_THRESHOLD, 1);
    const r = Math.round(30 + t * 225);
    const g = Math.round(30 + (1 - Math.abs(t - 0.5) * 2) * 120);
    const b = Math.round(80 * (1 - t));
    return `rgb(${r},${g},${b})`;
  }

  function tick() {
    if (paused) return;
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        if (flash[y][x] > 0) flash[y][x]--;
      }
    }

    const deltas = makeGrid(0);
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const p = pressure[y][x];
        if (p <= 0) continue;
        const ns = neighbors(x, y);
        if (ns.length === 0) continue;
        const amount = p * BLEED_RATE;
        const per = amount / ns.length;
        deltas[y][x] -= amount;
        for (const [nx, ny] of ns) deltas[ny][nx] += per;
      }
    }
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        pressure[y][x] = Math.max(0, pressure[y][x] + deltas[y][x]);
      }
    }

    resolveEruptions();
    if (pressure.every(row => row.every(p => p >= 20))) unlock('full-pressure');
    ticks++;
    draw();
  }

  // Returns how many cells erupted.
  function resolveEruptions() {
    let count = 0;
    let eruptedAny = true;
    let guard = 0;
    while (eruptedAny && guard < 20) {
      eruptedAny = false;
      guard++;
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          if (pressure[y][x] >= ERUPT_THRESHOLD) {
            pressure[y][x] = 0;
            flash[y][x] = 3;
            eruptions++;
            count++;
            for (const [nx, ny] of neighbors(x, y)) pressure[ny][nx] += ERUPT_BLAST;
            eruptedAny = true;
          }
        }
      }
    }
    if (count >= 1) unlock('first-eruption');
    if (count >= 5) unlock('chain-reaction');
    if (eruptions >= 100) unlock('century');
    return count;
  }

  function draw() {
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        ctx.fillStyle = colorFor(pressure[y][x], flash[y][x]);
        ctx.fillRect(x * CELL_PX, y * CELL_PX, CELL_PX, CELL_PX);
        ctx.strokeStyle = '#222228';
        ctx.lineWidth = 1;
        ctx.strokeRect(x * CELL_PX, y * CELL_PX, CELL_PX, CELL_PX);
      }
    }

    if (isDragging && startCell && dragDir) {
      const [sx, sy] = startCell;
      const [dx, dy] = dragDir;
      const tx = sx + dx, ty = sy + dy;
      ctx.strokeStyle = 'rgba(111,211,255,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx * CELL_PX + CELL_PX / 2, sy * CELL_PX + CELL_PX / 2);
      ctx.lineTo(tx * CELL_PX + CELL_PX / 2, ty * CELL_PX + CELL_PX / 2);
      ctx.stroke();
    }

    statEl.textContent = `ticks: ${ticks} · eruptions: ${eruptions} · siphons: ${siphons}`;
  }

  function cellFromClientXY(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = size / rect.width;
    const scaleY = size / rect.height;
    const cx = (clientX - rect.left) * scaleX;
    const cy = (clientY - rect.top) * scaleY;
    return [Math.floor(cx / CELL_PX), Math.floor(cy / CELL_PX)];
  }

  function primaryDirection(dx, dy) {
    if (Math.abs(dx) >= Math.abs(dy)) {
      return [Math.sign(dx), 0];
    } else {
      return [0, Math.sign(dy)];
    }
  }

  function doPump(cell) {
    const [x, y] = cell;
    if (!inBounds(x, y)) return;
    pressure[y][x] += CLICK_ADD;
  }

  function doSiphon(cell, dir) {
    const [x, y] = cell;
    const [dx, dy] = dir;
    const tx = x + dx, ty = y + dy;
    if (!inBounds(x, y) || !inBounds(tx, ty)) return;
    const amount = pressure[y][x] * SIPHON_FRACTION;
    if (amount <= 0.01) return;
    pressure[y][x] -= amount;
    pressure[ty][tx] += amount * SIPHON_EFFICIENCY;
    siphons++;
    if (siphons >= 25) unlock('plumber');
    if (resolveEruptions() > 0) unlock('siphon-strike');
  }

  function onPointerDown(evt) {
    evt.preventDefault();
    canvas.setPointerCapture(evt.pointerId);
    pointerDown = true;
    isDragging = false;
    dragDir = null;
    startCell = cellFromClientXY(evt.clientX, evt.clientY);
    startPx = [evt.clientX, evt.clientY];
  }

  function onPointerMove(evt) {
    if (!pointerDown || !startCell) return;
    const dxPx = evt.clientX - startPx[0];
    const dyPx = evt.clientY - startPx[1];
    const dist = Math.hypot(dxPx, dyPx);
    if (dist > DRAG_THRESHOLD_PX) {
      isDragging = true;
      dragDir = primaryDirection(dxPx, dyPx);
      draw();
    }
  }

  function onPointerUp(evt) {
    if (!pointerDown) return;
    pointerDown = false;
    if (!startCell) return;

    if (isDragging && dragDir) {
      doSiphon(startCell, dragDir);
    } else {
      doPump(startCell);
    }

    startCell = null;
    isDragging = false;
    dragDir = null;
    draw();
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  // A cancelled pointer (e.g. the browser took over the gesture) does nothing.
  canvas.addEventListener('pointercancel', () => {
    pointerDown = false;
    startCell = null;
    isDragging = false;
    dragDir = null;
    draw();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    pressure = makeGrid(0);
    flash = makeGrid(0);
    ticks = 0;
    eruptions = 0;
    siphons = 0;
    draw();
  });

  new ResizeObserver(fitBoard).observe(wrap);
  window.addEventListener('resize', fitBoard); // browser zoom changes devicePixelRatio
  fitBoard();
  setInterval(tick, TICK_MS);
})();
</script>
</body>
</html>
