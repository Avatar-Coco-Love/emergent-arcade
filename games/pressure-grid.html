<!DOCTYPE html>
<html lang="en">
<head>
<script>
// § crash report: uncaught errors go to the arcade's telemetry (docs/telemetry.md, "Errors").
(function () {
  var sent = 0;
  function report(message, line, col) {
    if (window.parent === window || sent++ >= 3) return;
    try {
      window.parent.postMessage({ type: 'arcade:error', game: 'pressure-grid', message: String(message).slice(0, 300), line: line | 0, col: col | 0 }, '*');
    } catch (_) {}
  }
  window.addEventListener('error', function (e) { report(e.message, e.lineno, e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled rejection: ' + (r && r.message ? r.message : r), 0, 0);
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pressure Grid</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #16161d;
    --line: #2a2a34;
    --text: #e8e8ee;
    --muted: #9a9aa5;
    --accent: #ff7a3d;
    --ok: #7be08a;
    --star: #ffd25a;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the board scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  .bar {
    flex: none;
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: default; transform: none; }
  button.lv { padding: 4px 8px; min-width: 52px; line-height: 1.15; font-size: 0.8rem; }
  button.lv .st { display: block; font-size: 0.7rem; color: var(--star); letter-spacing: 1px; min-height: 0.85rem; }
  button.lv.on { border-color: var(--accent); }
  button.primary { border-color: var(--accent); color: #fff; background: #3a1d10; }
  /* Messages get their own strip, never over the board (two lines tall so the board doesn't jump).
     It sits under the board: the cabinet's toasts (achievements, new best) cover the top of the game. */
  #msg {
    flex: none;
    min-height: 2.6em;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 0.92rem;
    line-height: 1.3;
  }
  #msg b { color: var(--accent); }
  #msg .stars { color: var(--star); letter-spacing: 2px; }
  #boardWrap {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
  }
  #board { display: block; touch-action: none; }
  .stat { color: var(--muted); font-size: 0.8rem; text-align: center; }
  /* The live region: read by screen readers, not shown. */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <div class="bar" id="levels"></div>
  <div id="boardWrap">
    <canvas id="board" role="img" aria-label="Pressure Grid board. Tap or click a cell to pump, drag to a neighbour to siphon. Keys: arrows move a cursor, Enter pumps, S then an arrow aims a pour."></canvas>
  </div>
  <div id="msg"></div>
  <div class="stat" id="stat"></div>
  <div class="sr" id="say" role="status" aria-live="polite"></div>
  <div class="bar">
    <button id="undoBtn">Undo</button>
    <button id="restartBtn">Restart</button>
    <button id="nextBtn" class="primary" hidden>Next level</button>
  </div>

<script>
(function() {
  const GAME_ID = 'pressure-grid';
  const CELL = 80;               // board units per cell (drawing)
  const WAVE_MS = 260;           // one eruption wave on screen
  const DRAG_THRESHOLD_PX = 12;  // movement needed before a press becomes a drag

  // § sim: rules and levels. Pure functions, no DOM: scripts/balance-pressure-grid.mjs
  // runs this block as is (between "§ sim" and "§ end sim") to solve every level.
  const THRESHOLD = 10;   // a cell at this much erupts
  const PUMP_ADD = 4;     // pump: +4 (three pumps from empty erupt)
  const BLAST = 2;        // an eruption sends this much to each open neighbour (4 × 2 < 10: every eruption loses pressure)
  const SAFE_MAX = 8;     // above this a cell leaks 1 per move (the bleed)
  const SIPHON_LOSS = 1;  // a siphon pours all of a cell into a neighbour, minus this
  const MAX_WAVES = 60;   // guard; chains always end (every eruption loses pressure)

  // Map letters: . open, o target, # wall, s sealed, S sealed target,
  // ^ > v < valve, * vent, l leaky, L leaky target.
  // Sealed cells can't be pumped and take no blasts: only a siphon fills them.
  // Valves are sealed pipe cells: pours in and out only go the arrow's way.
  // Vents start at 8; at 10 one empties its open neighbours instead of blasting.
  // Leaky cells lose 2 after every move.
  // Ids are permanent (telemetry). par is the solver's minimum (balance script).
  const LEVELS = [
    { id: 'first-pop', name: 'First pop', par: 3,
      hint: '{Tap} the ringed cell to pump it (+4). At 10 it bursts.',
      map: ['.....', '..o..', '.....', '.....', '.....'] },
    { id: 'chain', name: 'Chain', par: 7,
      hint: 'A burst sends +2 to each neighbour. A neighbour at 8 bursts too.',
      map: ['.....', '.....', '.ooo.', '.....', '.....'] },
    { id: 'sealed', name: 'Sealed', par: 5,
      hint: 'Sealed cells can\'t be pumped. Drag from a neighbour onto it to pour everything in (1 is lost).',
      map: ['.....', '.....', '..S..', '.....', '.....'] },
    { id: 'wall', name: 'Wall', par: 10,
      hint: 'Walls stop bursts and pours. A ring at 8 bursts when its neighbour does.',
      map: ['......', '..#...', '.o#oS.', '..#...', '......', '......'] },
    { id: 'pipes', name: 'Pipes', par: 16,
      hint: 'Two seals, three rings. You can pour out of a ring too: the order matters.',
      map: ['#######', '#.oSo.#', '###.###', '##.o.##', '###S###', '###.###', '#######'] },
    { id: 'drip', name: 'Drip', par: 8,
      hint: 'A cell with a drop is leaky: it loses 2 after every move. Prime the others first, then fill it in one go.',
      map: ['.....', '.....', '.oLo.', '.....', '.....'] },
    { id: 'vent', name: 'Vent', par: 4,
      hint: 'Vents (purple) start at 8. One that bursts empties its neighbours. Pour it out first: that pressure is yours.',
      map: ['######', '#.*o.#', '#.o*.#', '######'] },
    { id: 'valves', name: 'Valves', par: 7,
      hint: 'Arrows are valves: pours go through them only the arrow\'s way. A valve can\'t be pumped.',
      map: ['#######', '#*<S<*#', '##.o.##', '#######'] },
    { id: 'relief', name: 'Relief', par: 10,
      hint: 'A burst beside a full vent sets it off, and it empties its neighbours. Use the vent before it goes.',
      map: ['#######', '##.#.##', '#.So*S#', '##....#', '#######'] },
    { id: 'flow', name: 'Flow', par: 10,
      hint: 'Everything at once. A leaky ring needs 10 in a single move: what can pour that much?',
      map: ['#######', '#*>S..#', '##.o*.#', '##l.L.#', '#######'] },
  ];

  const OPEN = 0, SEALED = 1, WALL = 2;
  const DIRS = '^>v<';   // valve arrows: up, right, down, left
  const LEAKY_DRIP = 2;  // a leaky cell loses this after every move (instead of the leak)
  function parseLevel(def) {
    const h = def.map.length, w = def.map[0].length;
    const kind = new Int8Array(w * h), target = new Uint8Array(w * h);
    const valve = new Int8Array(w * h).fill(-1), vent = new Uint8Array(w * h), leaky = new Uint8Array(w * h);
    def.map.forEach((row, y) => [...row].forEach((ch, x) => {
      const i = y * w + x;
      valve[i] = DIRS.indexOf(ch);
      kind[i] = ch === '#' ? WALL : (ch === 's' || ch === 'S' || valve[i] >= 0) ? SEALED : OPEN;
      target[i] = ch === 'o' || ch === 'S' || ch === 'L' ? 1 : 0;
      vent[i] = ch === '*' ? 1 : 0;
      leaky[i] = ch === 'l' || ch === 'L' ? 1 : 0;
    }));
    const nbrs = [];
    for (let i = 0; i < w * h; i++) {
      const x = i % w, y = (i / w) | 0, n = [];
      if (y > 0) n.push(i - w);
      if (x < w - 1) n.push(i + 1);
      if (y < h - 1) n.push(i + w);
      if (x > 0) n.push(i - 1);
      nbrs.push(n.filter(j => kind[j] !== WALL));
    }
    const targets = [];
    for (let i = 0; i < w * h; i++) if (target[i]) targets.push(i);
    return { def, w, h, n: w * h, kind, target, valve, vent, leaky, nbrs, targets };
  }

  // A state: p = pressure per cell, hit = targets that have erupted.
  // Vents start full (SAFE_MAX): one more blast and they vent.
  function startState(L) {
    const p = new Int8Array(L.n);
    for (let i = 0; i < L.n; i++) if (L.vent[i]) p[i] = SAFE_MAX;
    return { p, hit: new Uint8Array(L.n) };
  }
  function solved(L, st) { return L.targets.every(i => st.hit[i]); }

  function canPump(L, st, i) { return L.kind[i] === OPEN; }
  // A pour that touches a valve must go the arrow's way (into it from behind, out of its front).
  function pourDir(L, i, j) { return j === i - L.w ? 0 : j === i + 1 ? 1 : j === i + L.w ? 2 : 3; }
  function pourOk(L, i, j) {
    if (L.kind[i] === WALL || L.kind[j] === WALL || !L.nbrs[i].includes(j)) return false;
    const d = pourDir(L, i, j);
    return (L.valve[i] < 0 || L.valve[i] === d) && (L.valve[j] < 0 || L.valve[j] === d);
  }
  function canSiphon(L, st, i, j) { return st.p[i] > SIPHON_LOSS && pourOk(L, i, j); }

  // Plays one move: { pump: i } or { from: i, to: j }. Returns the new state
  // and what happened, for the animation: frames (pressure after the move,
  // after each wave), waves (cells that erupted together; a vent in a wave
  // empties its open neighbours instead of blasting them), leaks (cells that
  // lost 1) and drips (leaky cells that lost pressure). Returns null for an
  // illegal move. Between moves every cell holds at most SAFE_MAX, so only
  // cells this move touched can erupt or leak; leaky cells drip every move.
  function play(L, st, move) {
    const p = Int8Array.from(st.p), hit = Uint8Array.from(st.hit);
    let cand;
    if (move.pump !== undefined) {
      if (!canPump(L, st, move.pump)) return null;
      p[move.pump] += PUMP_ADD;
      cand = [move.pump];
    } else {
      if (!canSiphon(L, st, move.from, move.to)) return null;
      p[move.to] += p[move.from] - SIPHON_LOSS;
      p[move.from] = 0;
      cand = [move.to];
    }
    const frames = [Int8Array.from(p)], touched = new Set(cand), waves = [];
    for (let guard = 0; guard < MAX_WAVES; guard++) {
      const wave = [...new Set(cand)].filter(i => p[i] >= THRESHOLD).sort((a, b) => a - b);
      if (!wave.length) break;
      for (const i of wave) { p[i] = 0; if (L.target[i]) hit[i] = 1; }
      cand = [];
      for (const i of wave) if (!L.vent[i]) for (const j of L.nbrs[i]) if (L.kind[j] === OPEN) { p[j] += BLAST; cand.push(j); touched.add(j); }
      for (const i of wave) if (L.vent[i]) for (const j of L.nbrs[i]) if (L.kind[j] === OPEN) p[j] = 0;
      waves.push(wave);
      frames.push(Int8Array.from(p));
    }
    const leaks = [], drips = [];
    for (const i of touched) if (!L.leaky[i] && p[i] > SAFE_MAX && p[i] < THRESHOLD) { p[i]--; leaks.push(i); }
    for (let i = 0; i < L.n; i++) if (L.leaky[i] && p[i] > 0) { p[i] = Math.max(0, p[i] - LEAKY_DRIP); drips.push(i); }
    return { st: { p, hit }, frames, waves, leaks, drips };
  }

  // 3 stars at par, 2 within par + 3, 1 for any solve.
  function stars(par, moves) { return moves <= par ? 3 : moves <= par + 3 ? 2 : 1; }
  // § end sim

  // § words: the gallery fills {tap} in the manifest; the game does its own.
  const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const words = s => s.replace(/\{Tap\}/g, COARSE ? 'Tap' : 'Click').replace(/\{tap\}/g, COARSE ? 'tap' : 'click');

  // § messaging: achievements, results, pause, bests from the gallery.
  // Checked when used: a downloaded copy's shim stands in for the parent.
  const embedded = () => window.parent !== window;
  const unlocked = new Set();
  function unlock(id) {
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (embedded()) window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
  }
  let paused = false;
  // Stars per level this visit (0 = not solved here). The gallery only keeps
  // the best total, so levels solved on an earlier visit are inferred from it
  // (solved in order): they unlock the next level and count toward the total.
  const best = LEVELS.map(() => 0);
  let restoredTotal = 0;
  window.addEventListener('message', evt => {
    const d = evt.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'arcade:pause') { paused = true; cancelGesture(); }
    if (d.type === 'arcade:resume') paused = false;
    if (d.type === 'arcade:best' && d.bests && typeof d.bests === 'object') {
      const t = Number(d.bests.main);
      if (t > 0 && t <= LEVELS.length * 3) { restoredTotal = Math.round(t); renderLevels(); }
    }
  });
  // Levels solved on an earlier visit, filled with stars from the first one
  // (3 each, the rest on the last) so the total matches the stored best.
  function inferred() {
    const out = LEVELS.map(() => 0);
    let left = restoredTotal;
    const solvedCount = Math.min(LEVELS.length, Math.ceil(restoredTotal / 3));
    for (let i = 0; i < solvedCount; i++) { out[i] = Math.max(1, Math.min(3, left - (solvedCount - 1 - i))); left -= out[i]; }
    return out;
  }
  const levelStars = i => Math.max(best[i], inferred()[i]);
  const totalStars = () => LEVELS.reduce((a, _, i) => a + levelStars(i), 0);
  const isOpen = i => i === 0 || levelStars(i - 1) > 0;

  const RUN = Math.random().toString(36).slice(2, 10) || 'run';
  const attempts = LEVELS.map(() => 0);
  function postResult() {
    if (!embedded()) return;
    window.parent.postMessage({ type: 'arcade:result', game: GAME_ID, outcome: 'win',
      time: Math.round(playMs / 100) / 10, level: cur + 1, level_id: LEVELS[cur].id,
      run: RUN, attempt: attempts[cur], score: totalStars(),
      stats: { level: cur + 1, actions: moves, par: LEVELS[cur].par, siphons, max_chain: maxChain,
        stars: stars(LEVELS[cur].par, moves), undos, restarts } }, '*');
  }

  // § state
  let cur = 0, L, st, moves, siphons, maxChain, undos, restarts, history, done, playMs;
  let anim = null;            // { frames, waves, leaks, t } while an eruption plays out
  let last = performance.now();
  // Keyboard cursor: on once a key moves it; siphon = aiming a pour (dir: 0-3 as pourDir, -1 none).
  const kb = { on: false, cell: 0, siphon: false, dir: -1 };

  function loadLevel(i) {
    cur = i; L = parseLevel(LEVELS[i]);
    st = startState(L); moves = 0; siphons = 0; maxChain = 0; undos = 0; restarts = 0;
    history = []; done = false; playMs = 0; anim = null;
    kb.cell = L.targets[0] || 0; kb.siphon = false; kb.dir = -1;
    attempts[i]++;
    fitBoard(); renderLevels(); renderUI();
    say(`Level ${i + 1}, ${LEVELS[i].name}. ${words(LEVELS[i].hint).replace(/<[^>]*>/g, '')}`);
  }
  function snapshot() { return { st, moves, siphons, maxChain, done }; }
  function restore(s) { ({ st, moves, siphons, maxChain, done } = s); anim = null; }

  function doMove(move) {
    if (done || paused) return;
    const r = play(L, st, move);
    if (!r) return;
    history.push(snapshot());
    st = r.st; moves++;
    const burst = r.waves.reduce((a, w) => a + w.filter(i => !L.vent[i]).length, 0);
    if (move.from !== undefined) {
      siphons++;
      if (siphons >= 15) unlock('plumber');
      if (burst) unlock('siphon-strike');
    }
    maxChain = Math.max(maxChain, burst);
    if (burst) unlock('first-eruption');
    if (burst >= 3) unlock('chain-reaction');
    if (r.waves.some(w => w.some(i => L.kind[i] === SEALED && L.valve[i] < 0))) unlock('unsealed');
    if (r.waves.length || r.leaks.length || r.drips.length) anim = { frames: r.frames, waves: r.waves, leaks: r.leaks, drips: r.drips, t: 0 };
    const said = moveWords(move, r, history[history.length - 1].st);
    if (solved(L, st)) {
      done = true;
      const s = stars(LEVELS[cur].par, moves);
      best[cur] = Math.max(best[cur], s);
      if (move.from !== undefined && r.waves.flat().filter(i => L.target[i]).length >= 2) unlock('last-drop');
      if (LEVELS.every((_, i) => best[i] === 3)) unlock('all-stars');
      postResult();
      renderLevels();
      kb.siphon = false;
      say(`${said} Solved in ${moves} moves, ${s} star${s > 1 ? 's' : ''}.${cur + 1 < LEVELS.length ? ' N for the next level.' : ''}`);
    } else say(said);
    renderUI();
  }
  function undo() {
    if (!history.length || paused) return;
    restore(history.pop()); undos++; kb.siphon = false; renderUI();
    say(`Undone. Moves ${moves}.`);
  }
  function restart() {
    if (paused || (!moves && !done)) return;
    history.push(snapshot());
    st = startState(L); moves = 0; siphons = 0; maxChain = 0; done = false; anim = null;
    restarts++; kb.siphon = false; renderUI();
    say('Restarted.');
  }

  // § live region: one short line per move, key or level, never per frame.
  const sayEl = document.getElementById('say');
  function say(text) { sayEl.textContent = text; }
  const DIR_WORDS = ['up', 'right', 'down', 'left'];
  const STEP = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const cellName = i => `row ${((i / L.w) | 0) + 1}, column ${i % L.w + 1}`;
  function neighbour(i, d) {
    const x = i % L.w + STEP[d][0], y = ((i / L.w) | 0) + STEP[d][1];
    return x >= 0 && y >= 0 && x < L.w && y < L.h ? y * L.w + x : -1;
  }
  // What a cell is, for the cursor: "Row 2, column 3: 4, ring."
  function cellInfo(i) {
    const name = cellName(i).replace(/^r/, 'R');
    if (L.kind[i] === WALL) return `${name}: wall.`;
    const marks = [];
    if (L.valve[i] >= 0) marks.push(`valve pointing ${DIR_WORDS[L.valve[i]]}`);
    else if (L.kind[i] === SEALED) marks.push('sealed');
    if (L.vent[i]) marks.push('vent');
    if (L.leaky[i]) marks.push('leaky');
    if (L.target[i]) marks.push(st.hit[i] ? 'ring, burst' : 'ring');
    return `${name}: ${st.p[i]}${marks.length ? ', ' + marks.join(', ') : ''}.`;
  }
  // What a move did, from play()'s result and the state before it.
  function moveWords(move, r, before) {
    const out = [];
    if (move.pump !== undefined) out.push(`Pumped to ${r.frames[0][move.pump]}.`);
    else out.push(`Poured ${before.p[move.from] - SIPHON_LOSS} ${DIR_WORDS[pourDir(L, move.from, move.to)]}, now ${r.frames[0][move.to]}.`);
    const n = r.waves.reduce((a, w) => a + w.length, 0);
    if (n) out.push(n === 1 ? '1 cell bursts.' : `${n} cells burst${r.waves.length > 1 ? ` in a chain of ${r.waves.length} waves` : ''}.`);
    if (r.waves.some(w => w.some(i => L.vent[i]))) out.push('A vent empties its neighbours.');
    if (r.leaks.length) out.push(`${r.leaks.length} cell${r.leaks.length > 1 ? 's leak' : ' leaks'} 1.`);
    if (r.drips.length) out.push('Leaky cells drip.');
    const rings = L.targets.filter(t => !r.st.hit[t]).length;
    if (rings && L.targets.some(t => r.st.hit[t] && !before.hit[t])) out.push(`${rings} ring${rings > 1 ? 's' : ''} left.`);
    return out.join(' ');
  }

  // § ui: level buttons, message strip, status line
  const levelsEl = document.getElementById('levels');
  const msgEl = document.getElementById('msg');
  const statEl = document.getElementById('stat');
  const nextBtn = document.getElementById('nextBtn');
  const starText = n => '★'.repeat(n) + '☆'.repeat(3 - n);
  function renderLevels() {
    levelsEl.replaceChildren(...LEVELS.map((def, i) => {
      const b = document.createElement('button');
      b.className = 'lv' + (i === cur ? ' on' : '');
      b.disabled = !isOpen(i);
      const s = levelStars(i);
      b.innerHTML = `${i + 1}<span class="st">${best[i] ? starText(best[i]) : s ? '✓' : ''}</span>`;
      b.title = isOpen(i) ? `Level ${i + 1}: ${def.name}` : 'Solve the level before to open it';
      b.addEventListener('click', () => { if (isOpen(i)) loadLevel(i); });
      return b;
    }));
    const t = document.createElement('span');
    t.className = 'stat';
    t.textContent = `★ ${totalStars()}/${LEVELS.length * 3}`;
    levelsEl.append(t);
  }
  function renderUI() {
    const def = LEVELS[cur];
    if (done) {
      const s = stars(def.par, moves);
      const tip = s === 3 ? (moves < def.par ? 'Under par!' : 'At par.') : `Par is ${def.par}: try again for ${s === 2 ? 'the last star' : 'more stars'}.`;
      msgEl.innerHTML = `<span>Solved in ${moves} moves <span class="stars">${starText(s)}</span><br>${tip}</span>`;
    } else {
      msgEl.innerHTML = `<span><b>${cur + 1}. ${def.name}</b> · ${words(def.hint)}</span>`;
    }
    const left = L.targets.filter(t => !st.hit[t]).length;
    statEl.textContent = `Moves ${moves} · ★★★ ≤${def.par} ★★ ≤${def.par + 3} · ${left ? left + ' left' : 'all burst'} · bursts at ${THRESHOLD}`;
    document.getElementById('undoBtn').disabled = !history.length;
    document.getElementById('restartBtn').disabled = !moves && !done;
    nextBtn.hidden = !done || cur === LEVELS.length - 1;
    draw();
  }

  // § board: layout and drawing
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('boardWrap');
  // Scale the board to the largest size that fits, one canvas pixel per
  // screen pixel. Refit on every level change, not only on resize.
  function fitBoard() {
    if (!L) return;
    const bw = L.w * CELL, bh = L.h * CELL;
    const k = Math.min(wrap.clientWidth / bw, wrap.clientHeight / bh);
    const cw = Math.max(60, Math.floor(bw * k)), ch = Math.max(60, Math.floor(bh * k));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    cssK = cw / bw;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    ctx.setTransform(canvas.width / bw, 0, 0, canvas.height / bh, 0, 0);
    paint();
  }

  // Two lightness bands, so a number reads 4.5:1 or more at every pressure
  // and near-burst cells stand apart without hue: 0-7 dark (slate to
  // brick, white numbers, 8:1+), 8+ bright amber (dark numbers, 10:1+).
  function fillFor(v) {
    if (v >= SAFE_MAX) return v > SAFE_MAX ? '#ffe08a' : '#ffbe5c';
    const t = Math.max(0, v) / (SAFE_MAX - 1);
    const r = Math.round(34 + t * 104), g = Math.round(34 + t * 20), b = Math.round(48 - t * 22);
    return `rgb(${r},${g},${b})`;
  }
  const inkFor = v => v >= SAFE_MAX ? '#2a1500' : v > 0 ? '#ffffff' : '#a3a3b0';
  // Canvas text in board units, never under 12.5 CSS px (cssK: CSS px per unit).
  let cssK = 1;
  const fs = n => Math.max(n, Math.ceil(12.5 / cssK));
  // A label on a dark backing, readable over any cell or a burst flash.
  function tag(text, x, y, align, base, color, size) {
    const f = fs(size);
    ctx.font = `bold ${f}px sans-serif`;
    const w = ctx.measureText(text).width + 8, h = f + 6;
    const left = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
    const top = base === 'bottom' ? y - h : base === 'top' ? y : y - h / 2;
    ctx.fillStyle = 'rgba(16,16,22,0.92)'; ctx.fillRect(left, top, w, h);
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, left + w / 2, top + h / 2 + 1);
  }

  // What to show: the animation frame if one is playing, else the state.
  function shown() {
    if (!anim) return { p: st.p, flash: null };
    const k = Math.min(anim.frames.length - 1, Math.floor(anim.t / WAVE_MS));
    return { p: anim.frames[k], flash: k > 0 ? anim.waves[k - 1] : null, wave: k, waves: anim.waves.length };
  }

  // draw() asks for a paint on the next frame, so a press and its move in
  // one frame paint once. A refit paints at once (resizing clears the canvas).
  let dirty = false;
  function draw() { dirty = true; }
  function paint() {
    dirty = false;
    if (!L) return;
    const { p, flash, wave, waves } = shown();
    const flashSet = new Set(flash || []);
    ctx.clearRect(0, 0, L.w * CELL, L.h * CELL);
    const preview = gesturePreview();
    for (let i = 0; i < L.n; i++) {
      const x = (i % L.w) * CELL, y = ((i / L.w) | 0) * CELL;
      if (L.kind[i] === WALL) {
        ctx.fillStyle = '#121218';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.strokeStyle = '#24242e'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let d = -CELL; d < CELL; d += 20) { ctx.moveTo(x + Math.max(0, d), y + Math.max(0, -d)); ctx.lineTo(x + Math.min(CELL, CELL + d), y + Math.min(CELL, CELL - d)); }
        ctx.stroke();
        continue;
      }
      ctx.fillStyle = flashSet.has(i) ? '#ffffff' : fillFor(p[i]);
      ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
      if (L.valve[i] >= 0) {
        // a valve: pipe walls along the arrow, and the arrow
        const d = L.valve[i], horiz = d === 1 || d === 3;
        ctx.fillStyle = '#8fb3d9';
        if (horiz) { ctx.fillRect(x + 2, y + 10, CELL - 4, 5); ctx.fillRect(x + 2, y + CELL - 15, CELL - 4, 5); }
        else { ctx.fillRect(x + 10, y + 2, 5, CELL - 4); ctx.fillRect(x + CELL - 15, y + 2, 5, CELL - 4); }
        // a bold chevron in the front half, pointing the way pours go
        const ang = [-Math.PI / 2, 0, Math.PI / 2, Math.PI][d], cxv = x + CELL / 2, cyv = y + CELL / 2;
        const ux = Math.cos(ang), uy = Math.sin(ang);
        ctx.strokeStyle = '#8fb3d9'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(cxv + ux * 19 - uy * 15, cyv + uy * 19 + ux * 15);
        ctx.lineTo(cxv + ux * 32, cyv + uy * 32);
        ctx.lineTo(cxv + ux * 19 + uy * 15, cyv + uy * 19 - ux * 15);
        ctx.stroke(); ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
      } else if (L.kind[i] === SEALED) {
        // a steel frame: pours only
        ctx.strokeStyle = '#8fb3d9'; ctx.lineWidth = 6;
        ctx.strokeRect(x + 7, y + 7, CELL - 14, CELL - 14);
        // and a padlock in the corner
        ctx.fillStyle = '#8fb3d9'; ctx.fillRect(x + 11, y + 19, 14, 10);
        ctx.beginPath(); ctx.arc(x + 18, y + 19, 4.5, Math.PI, 0); ctx.lineWidth = 3; ctx.stroke();
      }
      if (L.vent[i]) {
        // a vent: grille bars top and bottom
        ctx.fillStyle = '#c86bff';
        for (let k = 0; k < 3; k++) { ctx.fillRect(x + 16 + k * 18, y + 9, 12, 5); ctx.fillRect(x + 16 + k * 18, y + CELL - 14, 12, 5); }
        ctx.strokeStyle = '#c86bff'; ctx.lineWidth = 3; ctx.strokeRect(x + 5, y + 5, CELL - 10, CELL - 10);
      }
      if (L.leaky[i]) {
        // leaky: a drop in the bottom-left corner
        const dx = x + 12, dy = y + CELL - 16;
        ctx.fillStyle = '#9ad7ff';
        ctx.beginPath(); ctx.moveTo(dx, dy - 9); ctx.quadraticCurveTo(dx + 7, dy, dx + 6, dy + 4);
        ctx.arc(dx, dy + 4, 6, 0, Math.PI); ctx.quadraticCurveTo(dx - 7, dy, dx, dy - 9); ctx.fill();
      }
      if (L.target[i]) {
        // a dark rim under the ring keeps it visible on bright (8+) cells
        ctx.beginPath(); ctx.arc(x + CELL / 2, y + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
        ctx.strokeStyle = '#1b1309'; ctx.lineWidth = 9; ctx.stroke();
        ctx.strokeStyle = st.hit[i] && !anim ? '#7be08a' : '#ff7a3d'; ctx.lineWidth = 5; ctx.stroke();
      }
      if (!flashSet.has(i)) {
        const v = p[i];
        ctx.fillStyle = inkFor(v);
        ctx.font = `bold ${fs(v >= SAFE_MAX ? 36 : 32)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(v), x + CELL / 2, y + CELL / 2 + 2);
      }
    }
    // leaks: after the last wave, a "-1" on each cell that leaked
    if (anim && wave === waves) {
      for (const i of anim.leaks) tag('−1 leak', (i % L.w) * CELL + CELL - 2, ((i / L.w) | 0) * CELL + CELL - 2, 'right', 'bottom', '#9ad7ff', 18);
      for (const i of anim.drips) tag('drip', (i % L.w) * CELL + CELL - 2, ((i / L.w) | 0) * CELL + CELL - 2, 'right', 'bottom', '#9ad7ff', 18);
    }
    // a vent that went off: its name over it while the wave shows
    if (anim && flash) {
      for (const i of flash) if (L.vent[i]) tag('vented!', (i % L.w) * CELL + CELL / 2, ((i / L.w) | 0) * CELL + 4, 'center', 'top', '#d9a3ff', 18);
    }
    if (anim && waves > 1 && wave > 0) tag(`chain wave ${wave}/${waves}`, 4, 4, 'left', 'top', '#ffffff', 20);
    if (preview) drawPreview(preview);
    // the keyboard cursor: black and white, seen on dark and bright cells
    if (kb.on && !done) {
      const x = (kb.cell % L.w) * CELL, y = ((kb.cell / L.w) | 0) * CELL;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 7; ctx.strokeRect(x + 3, y + 3, CELL - 6, CELL - 6);
      ctx.strokeStyle = kb.siphon ? '#6fd3ff' : '#ffffff'; ctx.lineWidth = 3; ctx.strokeRect(x + 3, y + 3, CELL - 6, CELL - 6);
    }
  }

  // A move's preview: arrow for a pour, and on every cell it changes the
  // value it will have (a burst mark where it erupts).
  function drawPreview({ move, r }) {
    const cx = i => (i % L.w) * CELL + CELL / 2, cy = i => ((i / L.w) | 0) * CELL + CELL / 2;
    if (move.from !== undefined) {
      ctx.strokeStyle = r ? 'rgba(111,211,255,0.95)' : 'rgba(255,90,90,0.9)'; ctx.lineWidth = 8;
      const a = move.from, b = move.to;
      ctx.beginPath(); ctx.moveTo(cx(a), cy(a)); ctx.lineTo(cx(b), cy(b)); ctx.stroke();
      const ang = Math.atan2(cy(b) - cy(a), cx(b) - cx(a));
      ctx.beginPath();
      ctx.moveTo(cx(b) + Math.cos(ang) * 6, cy(b) + Math.sin(ang) * 6);
      ctx.lineTo(cx(b) - Math.cos(ang - 0.6) * 22, cy(b) - Math.sin(ang - 0.6) * 22);
      ctx.lineTo(cx(b) - Math.cos(ang + 0.6) * 22, cy(b) - Math.sin(ang + 0.6) * 22);
      ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    } else if (!r) {
      const i = move.pump;
      ctx.strokeStyle = 'rgba(255,90,90,0.9)'; ctx.lineWidth = 6;
      ctx.strokeRect((i % L.w) * CELL + 6, ((i / L.w) | 0) * CELL + 6, CELL - 12, CELL - 12);
    }
    if (!r) return;
    const erupted = new Set(r.waves.flat());
    for (let i = 0; i < L.n; i++) {
      if (L.kind[i] === WALL) continue;
      const x = (i % L.w) * CELL, y = ((i / L.w) | 0) * CELL;
      if (erupted.has(i)) {
        ctx.setLineDash([8, 6]); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
        ctx.strokeRect(x + 5, y + 5, CELL - 10, CELL - 10); ctx.setLineDash([]);
      }
      if (r.st.p[i] !== st.p[i] || erupted.has(i)) {
        tag(erupted.has(i) && !r.st.p[i] ? '💥' : '→' + r.st.p[i], x + CELL - 2, y + CELL - 2, 'right', 'bottom', erupted.has(i) ? '#ffffff' : '#9ad7ff', 18);
      }
    }
  }

  // § input: press = pump preview, drag toward a neighbour = siphon preview,
  // release = play it. Leaving the board cancels. Hover (mouse) previews a pump.
  let gesture = null;   // { cell, x0, y0, dir, drag }
  let hoverCell = -1;
  function cellAt(evt) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((evt.clientX - rect.left) / rect.width * L.w);
    const y = Math.floor((evt.clientY - rect.top) / rect.height * L.h);
    return x >= 0 && y >= 0 && x < L.w && y < L.h ? y * L.w + x : -1;
  }
  function gestureMove() {
    if (gesture) {
      if (!gesture.drag) return { pump: gesture.cell };
      const x = gesture.cell % L.w + gesture.dir[0], y = ((gesture.cell / L.w) | 0) + gesture.dir[1];
      if (x < 0 || y < 0 || x >= L.w || y >= L.h) return { from: gesture.cell, to: -1 };
      return { from: gesture.cell, to: y * L.w + x };
    }
    if (kb.on) {
      if (!kb.siphon) return { pump: kb.cell };
      const to = kb.dir < 0 ? -1 : neighbour(kb.cell, kb.dir);
      return to < 0 ? null : { from: kb.cell, to };
    }
    if (hoverCell >= 0 && !COARSE) return { pump: hoverCell };
    return null;
  }
  function gesturePreview() {
    if (done || anim || paused || !L) return null;
    const move = gestureMove();
    if (!move) return null;
    if (move.pump !== undefined && L.kind[move.pump] === WALL) return null;
    const r = move.to === -1 ? null : play(L, st, move);
    if (move.from !== undefined && move.to === -1) return { move: { from: move.from, to: move.from }, r: null };
    return { move, r };
  }
  function cancelGesture() { gesture = null; draw(); }
  canvas.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    if (paused) return;
    anim = null;   // a press finishes any animation, then acts as usual
    kb.on = false; kb.siphon = false;   // the pointer takes over from the cursor
    const c = cellAt(evt);
    if (c < 0 || done) return;
    canvas.setPointerCapture(evt.pointerId);
    gesture = { cell: c, x0: evt.clientX, y0: evt.clientY, dir: null, drag: false };
    draw();
  });
  canvas.addEventListener('pointermove', evt => {
    if (!gesture) {
      const c = evt.pointerType === 'mouse' ? cellAt(evt) : -1;
      if (c !== hoverCell) { hoverCell = c; if (c >= 0) kb.on = kb.siphon = false; draw(); }
      return;
    }
    const dx = evt.clientX - gesture.x0, dy = evt.clientY - gesture.y0;
    const rect = canvas.getBoundingClientRect();
    const out = evt.clientX < rect.left || evt.clientX > rect.right || evt.clientY < rect.top || evt.clientY > rect.bottom;
    if (out) { gesture.out = true; draw(); return; }
    gesture.out = false;
    if (Math.hypot(dx, dy) > DRAG_THRESHOLD_PX) {
      gesture.drag = true;
      gesture.dir = Math.abs(dx) >= Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    } else gesture.drag = false;
    draw();
  });
  canvas.addEventListener('pointerup', () => {
    if (!gesture) return;
    const g = gesture; gesture = null;
    if (!g.out) {
      const move = g.drag ? null : { pump: g.cell };
      if (g.drag) {
        const x = g.cell % L.w + g.dir[0], y = ((g.cell / L.w) | 0) + g.dir[1];
        if (x >= 0 && y >= 0 && x < L.w && y < L.h) doMove({ from: g.cell, to: y * L.w + x });
      } else doMove(move);
    }
    draw();
  });
  canvas.addEventListener('pointercancel', cancelGesture);
  canvas.addEventListener('pointerleave', () => { if (hoverCell >= 0) { hoverCell = -1; draw(); } });

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('restartBtn').addEventListener('click', restart);
  nextBtn.addEventListener('click', () => { if (cur + 1 < LEVELS.length) loadLevel(cur + 1); });
  // Keys: arrows move a cursor, Enter/Space pump under it, S then an arrow
  // aims a pour (Enter or S pours, Escape cancels). The same doMove as the
  // pointer. Tab is the browser's; Space/Enter on a focused button press it.
  const ARROWS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
  window.addEventListener('keydown', evt => {
    if (evt.ctrlKey || evt.metaKey || evt.altKey || evt.key === 'Tab') return;
    const onButton = evt.target && evt.target.tagName === 'BUTTON';
    if (evt.key in ARROWS) {
      evt.preventDefault();
      if (onButton) evt.target.blur();
      if (!paused && !done) keyArrow(ARROWS[evt.key]);
      return;
    }
    if (paused) return;
    const k = evt.key.toLowerCase();
    if (k === 'z' || k === 'u') undo();
    else if (k === 'r') restart();
    else if (k === 'n' && done && cur + 1 < LEVELS.length) loadLevel(cur + 1);
    else if (onButton) return;
    else if (k === 'enter' || k === ' ') {
      evt.preventDefault();
      if (evt.repeat) return;
      if (!done) keyAct();
      else if (k === 'enter' && cur + 1 < LEVELS.length) loadLevel(cur + 1);
    } else if (k === 's' && !evt.repeat && !done) keySiphon();
    else if (k === 'escape' && kb.siphon) { kb.siphon = false; kb.dir = -1; say('Pour cancelled.'); draw(); }
  });
  function keyArrow(d) {
    anim = null;
    const to = neighbour(kb.cell, d);
    if (kb.siphon) {
      if (to < 0) { say(`No cell ${DIR_WORDS[d]}.`); return; }
      kb.dir = d;
      say(canSiphon(L, st, kb.cell, to) ? `Pour ${DIR_WORDS[d]} into ${cellInfo(to).replace(/^R/, 'r')} Enter pours.` : `Can't pour ${DIR_WORDS[d]}: ${whyNot(kb.cell, to)}`);
    } else if (!kb.on) { kb.on = true; say(cellInfo(kb.cell)); }
    else if (to >= 0) { kb.cell = to; say(cellInfo(to)); }
    draw();
  }
  function whyNot(from, to) {
    if (L.kind[to] === WALL) return 'a wall.';
    if (st.p[from] <= SIPHON_LOSS) return `a pour needs ${SIPHON_LOSS + 1} or more.`;
    return 'a valve only lets pours go its arrow\'s way.';
  }
  function keyAct() {
    anim = null;
    if (!kb.on) { kb.on = true; say(`${cellInfo(kb.cell)} Arrows move, Enter pumps, S pours.`); draw(); return; }
    if (kb.siphon) {
      if (kb.dir < 0) say('Pick a neighbour with an arrow first, or Escape.');
      else pourKey();
      return;
    }
    if (!canPump(L, st, kb.cell)) { say(L.kind[kb.cell] === WALL ? 'A wall: nothing to pump.' : 'Sealed: only a pour fills it.'); return; }
    doMove({ pump: kb.cell });
  }
  function pourKey() {
    const from = kb.cell, to = neighbour(from, kb.dir);
    if (!canSiphon(L, st, from, to)) { say(`Can't pour ${DIR_WORDS[kb.dir]}: ${whyNot(from, to)}`); return; }
    kb.siphon = false; kb.dir = -1;
    doMove({ from, to });
  }
  function keySiphon() {
    anim = null; kb.on = true;
    if (kb.siphon) {
      if (kb.dir >= 0) pourKey();
      else { kb.siphon = false; say('Pour cancelled.'); draw(); }
      return;
    }
    if (L.kind[kb.cell] === WALL) { say('A wall: nothing to pour.'); draw(); return; }
    if (st.p[kb.cell] <= SIPHON_LOSS) { say(`Too little to pour: a pour needs ${SIPHON_LOSS + 1} or more.`); draw(); return; }
    kb.siphon = true; kb.dir = -1;
    say(`Pour from ${cellName(kb.cell)}, ${st.p[kb.cell]}: pick a neighbour with an arrow. Enter pours, Escape cancels.`);
    draw();
  }

  // § clock: animation and unpaused play time (for telemetry)
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (!paused) {
      if (!done) playMs += dt;
      if (anim) {
        anim.t += dt;
        if (anim.t >= anim.frames.length * WAVE_MS + (anim.leaks.length || anim.drips.length ? 300 : 0)) anim = null;
        draw();
      }
    }
    if (dirty) paint();
    requestAnimationFrame(frame);
  }

  new ResizeObserver(fitBoard).observe(wrap);
  window.addEventListener('resize', fitBoard); // browser zoom changes devicePixelRatio
  loadLevel(0);
  requestAnimationFrame(frame);
})();
// § a11y label
// The canvas label names the verbs, with the word for this device.
{
  const fine = window.matchMedia('(pointer: fine)').matches;
  const t = fine ? 'click' : 'tap', T = fine ? 'Click' : 'Tap';
  document.getElementById('board').setAttribute('aria-label', `Pressure Grid board. ${T} a cell to pump pressure into it, drag from a cell to a neighbour to siphon. Keys: arrows move a cursor, Enter or Space pumps, S then an arrow aims a pour and Enter pours, Z undo, R restart, N next level.`);
}
</script>
</body>
</html>
