<!DOCTYPE html>
<html lang="en">
<head>
<script>
// § crash report: uncaught errors go to the arcade's telemetry (docs/telemetry.md, "Errors").
(function () {
  var sent = 0;
  function report(message, line, col) {
    if (window.parent === window || sent++ >= 3) return;
    try {
      window.parent.postMessage({ type: 'arcade:error', game: 'loom', message: String(message).slice(0, 300), line: line | 0, col: col | 0 }, '*');
    } catch (_) {}
  }
  window.addEventListener('error', function (e) { report(e.message, e.lineno, e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled rejection: ' + (r && r.message ? r.message : r), 0, 0);
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loom</title>
<style>
  :root {
    --bg: #150f19;
    --panel: #241a2b;
    --text: #f1e8f0;
    --muted: #a898a8;
    --accent: #e0679a;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the table scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    gap: 8px;
  }
  #field { flex: 1; min-height: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  #table {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    border-radius: 10px;
    background: #1d1523;
  }
  #msg {
    position: absolute;
    top: 3%;
    left: 8px;
    right: 8px;
    margin: 0;
    text-align: center;
    width: fit-content;
    max-width: calc(100% - 16px);
    margin: 0 auto;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(21, 15, 25, 0.88);
    font-size: 0.85rem;
    color: #f5e9f1;
    pointer-events: none;
  }
  #msg:empty { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #endCard {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(86%, 300px);
    padding: 18px 16px;
    border-radius: 12px;
    background: rgba(36, 26, 43, 0.95);
    border: 1px solid #45344f;
    text-align: center;
  }
  #endCard[hidden] { display: none; }
  #endCard h2 { margin: 0 0 6px; font-size: 1.3rem; }
  #endCard h2.won { color: #ffd27a; }
  #endCard h2.lost { color: #ff9a8a; }
  #endCard p { margin: 0 0 4px; color: #d8cad6; font-size: 0.9rem; }
  #playAgain { margin-top: 12px; width: 100%; font-weight: 600; }
  #playAgain:disabled { opacity: 0.4; }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .bar b { color: var(--text); }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #45344f;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div id="field">
    <div id="stage">
      <canvas id="table" role="img" aria-label="Loom. Drag a knot to pull the net, tap or click a knot to pin it. Keys: arrows pick a knot, C the next corner, Enter or P pins it, hold Space and the arrows pull it, S status."></canvas>
      <p id="msg" aria-hidden="true"></p>
      <div class="sr" id="say" role="status" aria-live="polite"></div>
      <div id="endCard" hidden>
        <h2 id="endTitle"></h2>
        <p id="endDetail"></p>
        <p id="endAch"></p>
        <button id="playAgain">Next shape</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <span><b id="hudShape"></b> <span id="hudLevel"></span></span>
    <span>Pins <b id="hudPins"></b></span>
    <span>Slips <b id="hudSlips"></b></span>
    <button id="resetBtn">Restart shape</button>
  </div>
<script>
(function() {
  const GAME_ID = 'loom';
  const W = 400, H = 480;
  const COLS = 6, ROWS = 6;        // knots in the net
  const REST = 32;                 // strand rest length (px)
  const CX = 200, CY = 245;        // centre of the net at rest
  // Strands only pull: force = strain (stretch / rest length) while taut.
  const FRICTION = 0.01;           // a free knot stays put under this net force
  const MOB = 1500;                // px/s of drift per unit of force over friction
  const VMAX = 600;                // fastest a knot drifts (px/s)
  const GRIP_K = 1 / 8;            // pull force per px the finger leads its knot ...
  const GRIP_MAX = 1;              // ... up to this
  const WARN = 0.4;                // strain where a strand turns hot
  const SNAP = 0.6;                // strain past which a strand snaps ...
  const FRAY_WARN = 0.12, FRAY_SNAP = 0.2; // the same for a frayed strand
  const SNAP_DELAY = 0.8;          // ... after this long over it (s)
  const PIN_HOLD = 0.6;            // force a pin holds; past it the pin works loose ...
  const POP_DELAY = 0.6;           // ... and pops after this long (s)
  const RING_RED = 0.8;            // a load ring turns red at this share of PIN_HOLD
  const MAX_PINS = 4;              // pins in the cloth at once
  const MAX_SLIPS = 3;             // snaps + popped pins in one shape: the cloth gets away
  const DOT_R = 12;                // a knot this close covers a dot
  const HOLD_WIN = 1.0;            // every dot covered, hands off, for this long (s)
  const GRACE = 0.6;               // a released knot stays put this long (s)
  const GRAB_R = 26;               // reach of a touch to the nearest knot (px)
  const TAP_SLOP_PX = 10;
  const END_INPUT_LOCK_MS = 1000;  // ignore taps right after a win/loss
  const STEP = 1 / 60, SUB = 4;

  // The run: seven silhouettes in a row. Snapped strands stay snapped. Each
  // dot is [x, y, knot]: the knot the design has in mind (corners to
  // corners, edge knots lined up by a taut edge). Any knot covers a plain
  // dot; only the balance bots read the third number. A dyed dot
  // ([x, y, knot, 'dye']) counts only under its own knot, which is dyed to
  // match. `frayed` lists strands (knot pairs) that snap at FRAY_SNAP.
  // Each shape is mirrored left-right at random (knot numbers too).
  const SHAPES = [
    { name: 'Tablecloth', outline: [[100, 145], [300, 145], [300, 345], [100, 345]],
      dots: [[100, 145, 0], [300, 145, 5], [300, 345, 35], [100, 345, 30]] },
    { name: 'Banner', outline: [[85, 185], [315, 185], [315, 305], [85, 305]],
      dots: [[85, 185, 0], [315, 185, 5], [315, 305, 35], [85, 305, 30], [177, 185, 2], [223, 305, 33]] },
    { name: 'Sail', outline: [[135, 130], [320, 355], [135, 355]],
      dots: [[135, 130, 0], [135, 355, 30], [320, 355, 35], [135, 220, 12], [209, 355, 32]] },
    { name: 'Kite', outline: [[200, 85], [320, 245], [200, 405], [80, 245]],
      dots: [[200, 85, 0], [320, 245, 5], [200, 405, 35], [80, 245, 30]] },
    { name: 'Pennant', note: 'The blue dot only takes the blue knot.',
      outline: [[110, 150], [335, 245], [110, 340]],
      dots: [[110, 150, 0], [110, 340, 30], [335, 245, 17, 'dye']] },
    { name: 'Hammock', note: 'Frayed edges (dashed) tear at a third of the stretch.',
      outline: [[90, 190], [310, 190], [310, 300], [90, 300]],
      dots: [[90, 190, 6], [310, 190, 11], [310, 300, 29], [90, 300, 24]],
      frayed: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5], [30, 31], [31, 32], [32, 33], [33, 34], [34, 35]] },
    { name: 'Arrow', note: 'The blue knot takes the point. Watch the pins.',
      outline: [[200, 110], [310, 330], [200, 280], [90, 330]],
      dots: [[200, 110, 2, 'dye'], [310, 330, 35], [90, 330, 30]] },
  ];
  const DYE = '#5ab4ff';

  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');
  const msgEl = document.getElementById('msg');
  const sayEl = document.getElementById('say');
  // Reduced motion: no shake, flash, blink, lint or flying pins (their
  // Math.random calls stay, so seeded bots reproduce exactly).
  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  const still = () => reduceMQ.matches;

  // Achievements: announced to the Emergent Arcade gallery when embedded
  // (it records them); harmless when the file is opened on its own.
  const unlocked = new Set();
  const roundEarned = new Set();
  function unlock(id) {
    roundEarned.add(id);
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
    }
  }

  // Tell the gallery how a shape ended (anonymous play telemetry, see
  // docs/telemetry.md). time is seconds of unpaused play on this shape; level
  // is the shape, run ties one run's shapes together, attempt counts retries.
  // Stats keys are in docs/games/loom.md.
  function report(result, reason) {
    if (window.parent === window) return;
    const r1 = v => Math.round(v * 10) / 10;
    const msg = { type: 'arcade:result', game: GAME_ID,
      outcome: result === 'won' ? 'win' : 'loss', time: r1(elapsed),
      level: level + 1, run: runId, attempt,
      stats: { snaps, pops, pulls, pins: pinsPlaced, max_pins: maxPins, holes: startHoles.length,
        covered: coveredCount(), first_input: firstInput === null ? -1 : r1(firstInput), keys: keyUses } };
    if (reason) msg.reason = reason;
    window.parent.postMessage(msg, '*');
  }

  // Scale the table to the largest W:H box that fits, one canvas pixel per
  // screen pixel. Drawing always uses W x H game units.
  const field = document.getElementById('field');
  const stage = document.getElementById('stage');
  function fitStage() {
    const scale = Math.min(field.clientWidth / W, field.clientHeight / H);
    const w = Math.max(100, Math.floor(W * scale));
    const h = Math.max(120, Math.floor(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  new ResizeObserver(fitStage).observe(field);
  window.addEventListener('resize', fitStage);
  fitStage();

  // The gallery pauses the game while one of its panels covers it.
  let paused = false;
  window.addEventListener('message', evt => {
    if (evt.data && evt.data.type === 'arcade:pause') paused = true;
    if (evt.data && evt.data.type === 'arcade:resume') paused = false;
  });

  const endCard = document.getElementById('endCard');
  const playAgainBtn = document.getElementById('playAgain');

  // Net: knots in a COLS x ROWS grid, strands between horizontal and
  // vertical neighbours (a knotted net, so it shears freely).
  const strands = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c;
    if (c < COLS - 1) strands.push({ a: i, b: i + 1 });
    if (r < ROWS - 1) strands.push({ a: i, b: i + COLS });
  }
  let knots = [];

  let level, runId, attempt, runSnaps, startHoles, state, msgTimer;
  let elapsed, holdT, snaps, pops, pulls, pinsPlaced, maxPins, firstInput, keyUses;
  let grabbed = null, finger = { x: 0, y: 0 }, slipWatch = null, hinted = false;
  let lint = [], flyingPins = [], flash = 0;

  // The shape being played, mirrored or not.
  let cur = null;
  const mirrorKnot = i => Math.floor(i / COLS) * COLS + (COLS - 1 - i % COLS);
  function layShape(flip) {
    const sh = SHAPES[level], fx = x => flip ? W - x : x, fk = flip ? mirrorKnot : i => i;
    cur = { name: sh.name, note: sh.note, outline: sh.outline.map(([x, y]) => [fx(x), y]),
      dots: sh.dots.map(d => [fx(d[0]), d[1], fk(d[2]), d[3]]),
      frayed: (sh.frayed || []).map(([a, b]) => [fk(a), fk(b)]) };
    cur.dyed = cur.dots.filter(d => d[3] === 'dye').map(d => d[2]);
    // Dot numbers for the live region, in reading order (labels only).
    const order = cur.dots.map((d, j) => j).sort((a, b) => cur.dots[a][1] - cur.dots[b][1] || cur.dots[a][0] - cur.dots[b][0]);
    cur.dotNo = [];
    order.forEach((j, n) => { cur.dotNo[j] = n + 1; });
  }
  function shape() { return cur; }
  function pinsIn() { return knots.filter(k => k.pinned).length; }
  function holes() { return strands.map((s, i) => s.alive ? -1 : i).filter(i => i >= 0); }

  function newRun() {
    level = 0;
    runId = Math.random().toString(36).slice(2, 10);
    runSnaps = 0;
    for (const s of strands) s.alive = true;
    startLevel(1);
  }

  // Lay the net flat (holes from earlier shapes stay) and start a shape.
  function startLevel(att) {
    attempt = att;
    if (att === 1) { startHoles = holes(); layShape(Math.random() < 0.5); }
    for (let i = 0; i < strands.length; i++) {
      const s = strands[i];
      s.alive = !startHoles.includes(i);
      s.strain = -1; s.over = 0;
      s.fray = cur.frayed.some(([a, b]) => (a === s.a && b === s.b) || (a === s.b && b === s.a));
    }
    knots = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      knots.push({ x: CX + (c - (COLS - 1) / 2) * REST, y: CY + (r - (ROWS - 1) / 2) * REST,
        pinned: false, over: 0, load: 0, grace: 0 });
    }
    elapsed = 0; holdT = 0; snaps = 0; pops = 0; pulls = 0; pinsPlaced = 0; maxPins = 0; keyUses = 0;
    firstInput = null; grabbed = null; slipWatch = null;
    lint = []; flyingPins = [];
    roundEarned.clear();
    state = 'playing';
    endCard.hidden = true;
    say(`${shape().name}: ${shape().note || 'cover every dot.'}`, shape().note ? 4000 : 2500,
      `${shape().name}, shape ${level + 1} of ${SHAPES.length}: ${shape().note || 'cover every dot.'} ` +
      `${shape().dots.length} dots. S says where they are from the picked knot.`);
    hud();
  }

  function hud() {
    document.getElementById('hudShape').textContent = shape().name;
    document.getElementById('hudLevel').textContent = `${level + 1}/${SHAPES.length}`;
    document.getElementById('hudPins').textContent = `${pinsIn()}/${MAX_PINS}`;
    document.getElementById('hudSlips').textContent = `${snaps + pops}/${MAX_SLIPS}`;
  }

  function endLevel(result, why) {
    state = result;
    if (grabbed !== null) release();
    report(result, why);
    msgEl.textContent = '';
    const title = document.getElementById('endTitle');
    const last = level === SHAPES.length - 1;
    if (result === 'won') {
      title.textContent = last ? 'Every shape held!' : `${shape().name} held!`;
      const slips = snaps + pops, h = holes().length;
      document.getElementById('endDetail').textContent =
        `${maxPins} pin${maxPins === 1 ? '' : 's'}, ${slips} slip${slips === 1 ? '' : 's'}.` +
        (last ? ` ${runSnaps} snap${runSnaps === 1 ? '' : 's'} in the whole run.`
          : h ? ` ${h} snapped strand${h === 1 ? '' : 's'} carr${h === 1 ? 'ies' : 'y'} over.` : '');
      playAgainBtn.textContent = last ? 'New run' : 'Next shape';
    } else {
      title.textContent = why === 'torn' || why === 'frayed' ? 'Torn!' : 'It got away!';
      document.getElementById('endDetail').textContent = why === 'frayed'
        ? 'A frayed strand gave way: they can’t take much stretch. Keep them slack.'
        : `${snaps} snap${snaps === 1 ? '' : 's'} and ${pops} popped pin${pops === 1 ? '' : 's'}. ` +
          `${coveredCount()} of ${shape().dots.length} dots were covered.`;
      playAgainBtn.textContent = 'Try this shape again';
    }
    title.className = result;
    const n = roundEarned.size;
    document.getElementById('endAch').textContent = n
      ? `🏆 ${n} achievement${n === 1 ? '' : 's'} earned` : '';
    speak(`${title.textContent} ${document.getElementById('endDetail').textContent} ` +
      (n ? `${n} achievement${n === 1 ? '' : 's'} earned. ` : '') + `Enter: ${playAgainBtn.textContent.toLowerCase()}.`);
    playAgainBtn.disabled = true;
    endCard.hidden = false;
    setTimeout(() => { playAgainBtn.disabled = false; }, END_INPUT_LOCK_MS);
    hud();
  }

  function next() {
    if (state === 'won') {
      if (level === SHAPES.length - 1) { newRun(); return; }
      level++;
      startLevel(1);
    } else {
      startLevel(attempt + 1);
    }
  }

  // #msg shows a line for a while; the live region (#say, hidden) gets the
  // same line, or `spoken` when the words for keys differ.
  function say(text, ms, spoken) {
    msgEl.textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msgEl.textContent = ''; }, ms || 2500);
    speak(spoken || text);
  }
  function speak(t) { sayEl.textContent = t; }

  function coveredBy(d) {
    if (d[3] === 'dye') return Math.hypot(knots[d[2]].x - d[0], knots[d[2]].y - d[1]) <= DOT_R;
    for (const k of knots) if (Math.hypot(k.x - d[0], k.y - d[1]) <= DOT_R) return true;
    return false;
  }
  // How close a strand is to snapping: 1 at its snap strain.
  function snapFrac(s) { return s.strain / (s.fray ? FRAY_SNAP : SNAP); }
  function coveredCount() { return shape().dots.filter(coveredBy).length; }

  // ---------- the two verbs ----------
  function touched() { if (firstInput === null) firstInput = elapsed; }

  // Pull: grab a knot. Pulling a pinned knot pulls its pin out.
  function grab(i) {
    if (state !== 'playing') return;
    touched();
    const k = knots[i];
    if (k.pinned) { k.pinned = false; k.over = 0; }
    grabbed = i;
    finger = { x: k.x, y: k.y };
    pulls++;
    hud();
  }
  function setFinger(x, y) { finger = { x, y }; }
  function release() {
    if (grabbed === null) return;
    const k = knots[grabbed];
    k.grace = GRACE;
    slipWatch = { i: grabbed, x: k.x, y: k.y };
    grabbed = null;
  }

  // Pin: tap a free knot to fix it where it is; tap a pin to take it out.
  function tapKnot(i) {
    if (state !== 'playing') return;
    touched();
    const k = knots[i];
    if (k.pinned) { k.pinned = false; k.over = 0; hud(); return; }
    if (pinsIn() >= MAX_PINS) { say(`All ${MAX_PINS} pins are in. Tap a pin to take it out.`, 2500, `All ${MAX_PINS} pins are in. Pick a pin and press Enter to take it out.`); return; }
    k.pinned = true; k.over = 0;
    pinsPlaced++;
    maxPins = Math.max(maxPins, pinsIn());
    if (slipWatch && slipWatch.i === i) slipWatch = null;
    hud();
  }

  // ---------- simulation ----------
  const fx = new Float64Array(COLS * ROWS), fy = new Float64Array(COLS * ROWS);

  function physics(h) {
    fx.fill(0); fy.fill(0);
    for (const s of strands) {
      if (!s.alive) continue;
      const a = knots[s.a], b = knots[s.b];
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1e-6;
      s.strain = len / REST - 1;
      if (s.strain > 0) {
        const f = s.strain / len;
        fx[s.a] += f * dx; fy[s.a] += f * dy;
        fx[s.b] -= f * dx; fy[s.b] -= f * dy;
      }
      if (snapFrac(s) > 1) {
        s.over += h;
        if (s.over >= SNAP_DELAY) snap(s);
      } else s.over = Math.max(0, s.over - 2 * h);
    }
    for (let i = 0; i < knots.length; i++) {
      const k = knots[i];
      let gx = fx[i], gy = fy[i];
      if (k.pinned) {
        k.load = Math.hypot(gx, gy);
        if (k.load > PIN_HOLD) {
          k.over += h;
          if (k.over >= POP_DELAY) pop(k);
        } else k.over = Math.max(0, k.over - 2 * h);
        continue;
      }
      k.load = Math.hypot(gx, gy); // what a pin here would hold
      if (i === grabbed) {
        const dx = finger.x - k.x, dy = finger.y - k.y, d = Math.hypot(dx, dy);
        const g = Math.min(GRIP_MAX, GRIP_K * d);
        if (d > 1e-6) { gx += g * dx / d; gy += g * dy / d; }
      } else if (k.grace > 0) { k.grace -= h; continue; }
      const m = Math.hypot(gx, gy);
      if (m <= FRICTION) continue;
      const v = Math.min(VMAX, MOB * (m - FRICTION));
      k.x += gx / m * v * h;
      k.y += gy / m * v * h;
      k.x = Math.max(4, Math.min(W - 4, k.x));
      k.y = Math.max(4, Math.min(H - 4, k.y));
    }
  }

  function snap(s) {
    if (!s.alive || state !== 'playing') return;
    s.alive = false; s.over = 0;
    snaps++; runSnaps++;
    const a = knots[s.a], b = knots[s.b];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    for (let j = 0; j < 10; j++) {
      const t = Math.random() * Math.PI * 2, v = 30 + Math.random() * 60;
      lint.push({ x: mx, y: my, vx: Math.cos(t) * v, vy: Math.sin(t) * v, life: 0.6 });
    }
    flash = 0.25;
    hud();
    if (s.fray) { endLevel('lost', 'frayed'); return; } // old rope gives way at once
    if (slipped('torn')) return;
    say(`Snap! ${slipsLeft()}`, 2500, `Snap! The strand ${strandName(s)} broke. ${slipsLeft()}`);
  }

  function pop(k) {
    if (state !== 'playing') return;
    k.pinned = false; k.over = 0; k.grace = 0;
    pops++;
    const t = Math.random() * Math.PI * 2;
    flyingPins.push({ x: k.x, y: k.y, vx: Math.cos(t) * 90, vy: -60 - Math.random() * 40, life: 0.7 });
    hud();
    if (slipped('slipped')) return;
    say(`A pin popped loose! ${slipsLeft()}`, 2500, `The pin at ${knotName(knots.indexOf(k))} popped loose! ${slipsLeft()}`);
  }

  // Snaps and pops are slips; MAX_SLIPS of them in one shape lose it.
  function slipped(why) {
    if (snaps + pops < MAX_SLIPS) return false;
    endLevel('lost', why);
    return true;
  }
  function slipsLeft() {
    const n = MAX_SLIPS - snaps - pops;
    return n === 1 ? 'One more slip and it gets away.' : `${n} more slips and it gets away.`;
  }

  function step(dt) {
    elapsed += dt;
    for (let n = 0; n < SUB && state === 'playing'; n++) physics(dt / SUB);
    if (state !== 'playing') return;
    // A knot let go without a pin slides back: show once that pins hold it.
    if (slipWatch) {
      const k = knots[slipWatch.i];
      if (k.pinned || grabbed === slipWatch.i) slipWatch = null;
      else if (Math.hypot(k.x - slipWatch.x, k.y - slipWatch.y) > 14) {
        if (!hinted) { say('It slid back. Tap a knot to pin it.', 2500, 'It slid back. Enter or P pins the picked knot.'); hinted = true; }
        slipWatch = null;
      }
    }
    if (grabbed === null && coveredCount() === shape().dots.length) {
      holdT += dt;
      if (holdT >= HOLD_WIN) win();
    } else holdT = 0;
  }

  function win() {
    unlock('first-shape');
    if (shape().name === 'Kite' && snaps + pops === 0) unlock('kite-flyer');
    if (shape().name === 'Hammock' && attempt === 1) unlock('old-rope');
    if (shape().name === 'Arrow' && snaps + pops === 0) unlock('true-colours');
    if (level === SHAPES.length - 1) {
      unlock('full-run');
      if (runSnaps === 0) unlock('unbroken');
    }
    endLevel('won');
  }

  function effects(dt) {
    for (const p of lint) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
    lint = lint.filter(p => p.life > 0);
    for (const p of flyingPins) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
    flyingPins = flyingPins.filter(p => p.life > 0);
    flash = Math.max(0, flash - dt);
  }

  // ---------- drawing ----------
  function mix(c1, c2, t) {
    t = Math.max(0, Math.min(1, t));
    return `rgb(${c1.map((v, i) => Math.round(v + (c2[i] - v) * t)).join(',')})`;
  }
  // Tension bands by lightness (L*), so they read without hue: slack 35
  // (dim, sagging), taut linen 88 → gold 80, and at WARN a step down to
  // orange-red 60 → red 54, drawn 1 px thicker. Over SNAP: crossbars (and
  // a white blink with motion on). docs/games/loom.md, "Accessibility".
  const LINEN = [232, 220, 200], GOLD = [242, 193, 78], EMBER = [235, 105, 45], RED = [230, 70, 60];
  const SLACK = 'rgba(200,188,172,0.36)';
  function strandColor(s) {
    const warn = s.fray ? FRAY_WARN : WARN, snapAt = s.fray ? FRAY_SNAP : SNAP;
    if (s.strain < warn) return mix(LINEN, GOLD, s.strain / warn);
    return mix(EMBER, RED, (s.strain - warn) / (snapAt - warn));
  }

  // A ring around a pin (or the knot being pulled) filling with its load:
  // grey (L* 54), gold (80) from half of PIN_HOLD, and from RING_RED a
  // darker red (53) drawn thicker on a dark track.
  function loadRing(x, y, f) {
    const high = f > RING_RED;
    if (high) {
      ctx.strokeStyle = 'rgba(10,6,12,0.85)';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = high ? '#e04848' : f > 0.5 ? '#f2c14e' : 'rgba(255,255,255,0.45)';
    ctx.lineWidth = high ? 4 : 2.5;
    ctx.beginPath(); ctx.arc(x, y, 11, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.stroke();
  }
  // A strand over its snap strain: two white crossbars with dark edges.
  function overMark(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len * 5, ny = dx / len * 5;
    for (const [c, w] of [['rgba(10,6,12,0.9)', 4], ['#ffffff', 2]]) {
      ctx.strokeStyle = c; ctx.lineWidth = w;
      ctx.beginPath();
      for (const t of [0.4, 0.6]) {
        const x = a.x + dx * t, y = a.y + dy * t;
        ctx.moveTo(x - nx, y - ny); ctx.lineTo(x + nx, y + ny);
      }
      ctx.stroke();
    }
  }

  function draw(now) {
    const tm = still() ? 0 : now; // decoration's clock: frozen under reduced motion
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.fillStyle = '#1d1523';
    ctx.fillRect(0, 0, W, H);
    // Faint weave on the table.
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 10; x < W; x += 20) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 10; y < H; y += 20) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    if (flash > 0 && !still()) { ctx.fillStyle = `rgba(255,80,80,${flash * 0.4})`; ctx.fillRect(0, 0, W, H); }

    // The silhouette and its dots.
    const sh = shape();
    ctx.beginPath();
    sh.outline.forEach(([x, y], j) => j ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.fillStyle = 'rgba(224,103,154,0.07)';
    ctx.fill();
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(224,103,154,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    const holding = holdT > 0;
    for (const d of sh.dots) {
      const on = coveredBy(d);
      ctx.setLineDash(on ? [] : [3, 3]);
      ctx.strokeStyle = on ? (holding ? '#ffd27a' : '#9be37a') : d[3] === 'dye' ? DYE : 'rgba(240,160,195,0.9)';
      ctx.lineWidth = on ? 2 : 1.5;
      ctx.beginPath(); ctx.arc(d[0], d[1], DOT_R, 0, Math.PI * 2); ctx.stroke();
      if (d[3] === 'dye') {
        ctx.fillStyle = 'rgba(90,180,255,0.3)';
        ctx.beginPath(); ctx.arc(d[0], d[1], DOT_R - 3, 0, Math.PI * 2); ctx.fill();
      }
      if (holding) {
        ctx.setLineDash([]);
        ctx.strokeStyle = '#ffd27a';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(d[0], d[1], DOT_R + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * holdT / HOLD_WIN); ctx.stroke();
      }
    }
    ctx.setLineDash([]);

    // Strands: slack ones sag, taut ones warm up from linen to gold to red.
    for (const s of strands) {
      const a = knots[s.a], b = knots[s.b];
      ctx.setLineDash([]);
      if (!s.alive) {
        // Frayed ends where a strand snapped.
        const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
        ctx.strokeStyle = 'rgba(160,140,130,0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + dx / len * 7, a.y + dy / len * 7 + 2);
        ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - dx / len * 7, b.y - dy / len * 7 + 2);
        ctx.stroke();
        continue;
      }
      // Frayed strands are drawn broken and thin.
      ctx.setLineDash(s.fray ? [4, 3] : []);
      if (s.strain <= 0) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        const sag = Math.sqrt(Math.max(0, REST * REST - len * len)) * 0.35;
        ctx.strokeStyle = SLACK;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my + sag, b.x, b.y); ctx.stroke();
        continue;
      }
      const blink = s.over > 0 && tm > 0 && Math.sin(tm / 40) > 0;
      const warm = s.strain >= (s.fray ? FRAY_WARN : WARN);
      ctx.strokeStyle = blink ? '#ffffff' : strandColor(s);
      ctx.lineWidth = (s.fray ? 1.5 : 2) + (warm ? 1 : 0) + Math.min(1.5, snapFrac(s) * 1.5);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      if (s.over > 0) { ctx.setLineDash([]); overMark(a, b); }
    }
    ctx.setLineDash([]);

    // Knots and pins. A pin's ring fills with the load it holds.
    for (let i = 0; i < knots.length; i++) {
      const k = knots[i];
      const dyed = shape().dyed.includes(i);
      if (k.pinned) {
        const f = Math.min(1, k.load / PIN_HOLD);
        let x = k.x, y = k.y;
        if (k.over > 0) {
          const jx = (Math.random() - 0.5) * 3, jy = (Math.random() - 0.5) * 3;
          if (!still()) { x += jx; y += jy; }
        }
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath(); ctx.arc(x + 1.5, y + 2, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = dyed ? DYE : '#d9a441';
        ctx.beginPath(); ctx.arc(x, y, 7.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = dyed ? '#bfe2ff' : '#f7d88a';
        ctx.beginPath(); ctx.arc(x - 2, y - 2, 2.5, 0, Math.PI * 2); ctx.fill();
        loadRing(x, y, f);
        if (k.over > 0) {
          // Working loose (over PIN_HOLD): an outer white ring.
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        ctx.fillStyle = dyed ? DYE : '#f4ead8';
        ctx.beginPath(); ctx.arc(k.x, k.y, dyed ? 6 : 4.5, 0, Math.PI * 2); ctx.fill();
        if (k.grace > 0) {
          ctx.strokeStyle = `rgba(244,234,216,${k.grace / GRACE * 0.6})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(k.x, k.y, 9, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }

    // The pull: a line from the knot to the finger, thicker the harder it pulls.
    if (grabbed !== null) {
      const k = knots[grabbed];
      const g = Math.min(GRIP_MAX, GRIP_K * Math.hypot(finger.x - k.x, finger.y - k.y)) / GRIP_MAX;
      ctx.strokeStyle = `rgba(224,103,154,${0.4 + 0.5 * g})`;
      ctx.lineWidth = 1 + 3 * g;
      ctx.beginPath(); ctx.moveTo(k.x, k.y); ctx.lineTo(finger.x, finger.y); ctx.stroke();
      // The load a pin would hold if it went in here, on the same ring.
      ctx.strokeStyle = 'rgba(224,103,154,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(k.x, k.y, 11, 0, Math.PI * 2); ctx.stroke();
      loadRing(k.x, k.y, Math.min(1, k.load / PIN_HOLD));
    }

    if (still()) { drawKeys(); return; }
    for (const p of lint) {
      ctx.fillStyle = `rgba(240,225,205,${Math.min(1, p.life * 2)})`;
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    for (const p of flyingPins) {
      ctx.fillStyle = `rgba(217,164,65,${Math.min(1, p.life * 2)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
    }
    drawKeys();
  }

  // ---------- input ----------
  // One pointer at a time. A touch picks the nearest knot in reach. Moving
  // past TAP_SLOP_PX pulls it (the knot follows as hard as the finger leads
  // it); lifting without moving pins or unpins it.
  let pointerId = null, downKnot = null, downPx = null, dragging = false;

  function toGame(evt) {
    const rect = canvas.getBoundingClientRect();
    return { x: (evt.clientX - rect.left) * W / rect.width, y: (evt.clientY - rect.top) * H / rect.height };
  }
  function nearestKnot(p) {
    let best = null, bd = GRAB_R;
    knots.forEach((k, i) => { const d = Math.hypot(k.x - p.x, k.y - p.y); if (d < bd) { bd = d; best = i; } });
    return best;
  }

  canvas.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    if (pointerId !== null || state !== 'playing' || paused) return;
    const p = toGame(evt);
    downKnot = nearestKnot(p);
    if (downKnot === null) return;
    pointerId = evt.pointerId;
    canvas.setPointerCapture(evt.pointerId);
    downPx = [evt.clientX, evt.clientY];
    dragging = false;
  });
  canvas.addEventListener('pointermove', evt => {
    if (evt.pointerId !== pointerId) return;
    const p = toGame(evt);
    if (!dragging && Math.hypot(evt.clientX - downPx[0], evt.clientY - downPx[1]) > TAP_SLOP_PX) {
      if (state !== 'playing' || paused) return;
      dragging = true;
      grab(downKnot);
    }
    if (dragging) setFinger(p.x, p.y);
  });
  function up(evt, cancelled) {
    if (evt.pointerId !== pointerId) return;
    pointerId = null;
    if (dragging) release();
    else if (!cancelled && state === 'playing' && !paused) tapKnot(downKnot);
    dragging = false;
  }
  canvas.addEventListener('pointerup', evt => up(evt, false));
  canvas.addEventListener('pointercancel', evt => up(evt, true));

  document.getElementById('resetBtn').addEventListener('click', () => startLevel(attempt + 1));
  playAgainBtn.addEventListener('click', next);

  // § keys
  // The same two verbs without a pointer. Arrows pick a knot: each of the
  // picked knot's net neighbours gets its own arrow (the least-turn
  // matching over at most 4! orders, from where the knots are now), so
  // every knot is reachable. Enter or P pins or unpins it (tapKnot, as a
  // tap). Hold Space to grab it (grab, as a drag): the arrows then move a
  // lead point that starts on the knot and speeds up while held, and the
  // knot is pulled toward it with the same setFinger a finger uses, so the
  // pull is the one a finger at that lead makes. Space up = finger up.
  // C jumps to the next corner, S says the shape's status. Tab is the
  // browser's; Space/Enter on a focused button press the button.
  const LEAD_SLOW = 40, LEAD_FAST = 160, LEAD_RAMP = 0.8; // px/s, s to full speed
  const LEAD_TAP = 3, LEAD_MAX = 40; // px a fresh press moves; farthest lead
  const DIRS = { ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1], ArrowLeft: [-1, 0] };
  const DIR_WORDS = { ArrowUp: 'up', ArrowRight: 'right', ArrowDown: 'down', ArrowLeft: 'left' };
  const ARROWS = Object.keys(DIRS);
  const OPPOSITE = { ArrowUp: 'ArrowDown', ArrowDown: 'ArrowUp', ArrowLeft: 'ArrowRight', ArrowRight: 'ArrowLeft' };
  const kb = { i: 0, shown: false, pull: false, held: new Set(), heldFor: 0, lx: 0, ly: 0,
    infoAt: -1, covered: -1, coverAt: 0, coverSaid: true, over: new Set(), loose: new Set(), band: 0, trail: [] };
  const CORNERS = { 0: 'top-left', [COLS - 1]: 'top-right', [COLS * (ROWS - 1)]: 'bottom-left', [COLS * ROWS - 1]: 'bottom-right' };
  function knotName(i) {
    const r = Math.floor(i / COLS), c = i % COLS;
    const n = CORNERS[i] ? `the ${CORNERS[i]} corner` : `row ${r + 1}, column ${c + 1}`;
    return cur && cur.dyed.includes(i) ? `${n} (the blue knot)` : n;
  }
  function strandName(s) {
    const r = Math.floor(s.a / COLS), c = s.a % COLS;
    return s.b === s.a + 1 ? `on row ${r + 1} between columns ${c + 1} and ${c + 2}`
      : `on column ${c + 1} between rows ${r + 1} and ${r + 2}`;
  }
  function neighbours(i) {
    const r = Math.floor(i / COLS), c = i % COLS, n = [];
    if (r > 0) n.push(i - COLS);
    if (c < COLS - 1) n.push(i + 1);
    if (r < ROWS - 1) n.push(i + COLS);
    if (c > 0) n.push(i - 1);
    return n;
  }
  // Which neighbour each arrow picks: the assignment with the least total
  // (squared) turn from each neighbour's direction.
  function arrowMap(i) {
    const k = knots[i], nb = neighbours(i);
    const turn = (j, a) => {
      const dx = knots[j].x - k.x, dy = knots[j].y - k.y, m = Math.hypot(dx, dy);
      if (m < 1e-6) return Math.PI / 2;
      return Math.acos(Math.max(-1, Math.min(1, (dx * DIRS[a][0] + dy * DIRS[a][1]) / m)));
    };
    let best = null, bc = Infinity;
    const perm = (n, used, cost, pick) => {
      if (n === nb.length) { if (cost < bc) { bc = cost; best = pick.slice(); } return; }
      for (const a of ARROWS) if (!used.has(a)) {
        used.add(a); pick.push(a);
        perm(n + 1, used, cost + turn(nb[n], a) ** 2, pick);
        used.delete(a); pick.pop();
      }
    };
    perm(0, new Set(), 0, []);
    const map = {};
    nb.forEach((j, n) => { map[best[n]] = j; });
    return map;
  }
  function strandBetween(i, j) { return strands.find(s => (s.a === i && s.b === j) || (s.a === j && s.b === i)); }
  function tensionWord(s) {
    if (!s.alive) return 'snapped';
    const warn = s.fray ? FRAY_WARN : WARN;
    const w = s.strain <= 0 ? 'slack' : s.strain < warn ? 'taut' : snapFrac(s) < 1 ? 'straining' : 'over its limit';
    return s.fray ? `frayed, ${w}` : w;
  }
  function loadWord(k) {
    const f = k.load / PIN_HOLD;
    return f > 1 ? 'too much, working loose' : f > RING_RED ? 'high' : f > 0.5 ? 'half' : 'low';
  }
  const off = (dx, dy) => {
    const p = [];
    if (Math.abs(dx) >= 2) p.push(`${Math.round(Math.abs(dx))} ${dx > 0 ? 'right' : 'left'}`);
    if (Math.abs(dy) >= 2) p.push(`${Math.round(Math.abs(dy))} ${dy > 0 ? 'down' : 'up'}`);
    return p.length ? p.join(', ') : 'right on it';
  };
  const dotName = d => `${d[3] === 'dye' ? 'blue dot' : 'dot'} ${cur.dotNo[cur.dots.indexOf(d)]}`;
  // Where knot i is against the dots: the dot it covers, or the nearest
  // one it can take (saying so if another knot covers it) and then the
  // nearest open one.
  function dotWords(i) {
    const k = knots[i];
    const takes = cur.dots.filter(d => d[3] !== 'dye' || d[2] === i);
    const on = takes.find(d => Math.hypot(k.x - d[0], k.y - d[1]) <= DOT_R);
    if (on) return `On ${dotName(on)}, ${off(k.x - on[0], k.y - on[1])} of its centre.`;
    const near = ds => ds.reduce((p, q) => Math.hypot(p[0] - k.x, p[1] - k.y) <= Math.hypot(q[0] - k.x, q[1] - k.y) ? p : q);
    const d = near(takes), open = takes.filter(e => !coveredBy(e));
    if (!coveredBy(d)) return `Nearest ${dotName(d)}: ${off(d[0] - k.x, d[1] - k.y)}.`;
    const o = open.length ? near(open) : null;
    return `Nearest ${dotName(d)}, covered by another knot: ${off(d[0] - k.x, d[1] - k.y)}.` +
      (o ? ` Nearest open ${dotName(o)}: ${off(o[0] - k.x, o[1] - k.y)}.` : '');
  }
  function strandWords(i, lead = 'Strands: ') {
    const map = arrowMap(i);
    return lead + ARROWS.filter(a => map[a] !== undefined)
      .map(a => `${DIR_WORDS[a]} ${tensionWord(strandBetween(i, map[a]))}`).join(', ') + '.';
  }
  function knotInfo(i) {
    const k = knots[i];
    const pin = k.pinned ? `pinned, load ${loadWord(k)}` : 'free';
    return `${knotName(i)}, ${pin}. ${strandWords(i)} ${dotWords(i)}`;
  }
  function netWords() {
    let hot = 0, over = 0;
    for (const s of strands) if (s.alive && s.strain >= (s.fray ? FRAY_WARN : WARN)) { if (snapFrac(s) >= 1) over++; else hot++; }
    return over ? `${over} strand${over === 1 ? '' : 's'} over the limit, ${hot} straining.`
      : hot ? `${hot} strand${hot === 1 ? '' : 's'} straining.` : 'No strand straining.';
  }
  function pullInfo() {
    const k = knots[grabbed], lead = Math.hypot(kb.lx - k.x, kb.ly - k.y);
    const g = Math.min(GRIP_MAX, GRIP_K * lead) / GRIP_MAX;
    const how = g >= 1 ? 'full pull' : g >= 0.5 ? 'half pull' : g > 0.05 ? 'light pull' : 'no pull';
    return `Lead ${off(kb.lx - k.x, kb.ly - k.y)}: ${how}. ${strandWords(grabbed)} ${netWords()} ` +
      `A pin here would hold a ${loadWord(k).replace('too much, working loose', 'too high')} load. ${dotWords(grabbed)}`;
  }
  function status() {
    const k = knots[kb.i], n = cur.dots.length;
    const dots = cur.dots.slice().sort((a, b) => cur.dotNo[cur.dots.indexOf(a)] - cur.dotNo[cur.dots.indexOf(b)])
      .map(d => `${dotName(d)} ${off(d[0] - k.x, d[1] - k.y)}${coveredBy(d) ? ' (covered)' : ''}`);
    const dye = cur.dyed.length ? ` The blue dot only takes the blue knot, ${knotName(cur.dyed[0]).replace(' (the blue knot)', '')}.` : '';
    return `${cur.name}: ${coveredCount()} of ${n} dots covered, ${pinsIn()} of ${MAX_PINS} pins, ` +
      `${snaps + pops} of ${MAX_SLIPS} slips. ${netWords()} From ${knotName(kb.i)}: ${dots.join('; ')}.${dye}`;
  }

  function keyPick(key) {
    if (!kb.shown) { kb.shown = true; speak(knotInfo(kb.i) + ' Enter pins it, hold Space and the arrows pull it.'); return; }
    // The opposite arrow always walks back the way the picker came (a
    // trail): once the net folds, the matching alone can't promise that
    // (43% of steps on randomly pulled nets).
    const top = kb.trail[kb.trail.length - 1];
    const j = top && top.key === key ? top.to : arrowMap(kb.i)[key];
    if (j === undefined) { speak(`No knot ${DIR_WORDS[key]} of ${knotName(kb.i)}.`); return; }
    if (top && top.key === key) kb.trail.pop();
    else { kb.trail.push({ key: OPPOSITE[key], to: kb.i }); if (kb.trail.length > 12) kb.trail.shift(); }
    kb.i = j;
    speak(knotInfo(j));
  }
  // C jumps to the next corner (clockwise from the top left): the knots
  // most plans start from, and the arrows can't always walk back the way
  // they came once the net folds.
  const CORNER_ORDER = [0, COLS - 1, COLS * ROWS - 1, COLS * (ROWS - 1)];
  function keyCorner(back) {
    kb.shown = true;
    if (kb.pull) return;
    const at = CORNER_ORDER.indexOf(kb.i);
    kb.i = CORNER_ORDER[at < 0 ? 0 : (at + (back ? 3 : 1)) % 4];
    kb.trail = [];
    speak(knotInfo(kb.i));
  }
  function keyPin() {
    kb.shown = true;
    if (kb.pull) { speak('Let go of Space first, then Enter pins the knot.'); return; }
    const k = knots[kb.i], was = k.pinned, n = pinsIn();
    tapKnot(kb.i);
    if (was !== k.pinned) keyUses++;
    if (was && !k.pinned) speak(`Took the pin out of ${knotName(kb.i)}. ${pinsIn()} of ${MAX_PINS} pins.`);
    else if (!was && k.pinned) speak(`Pinned ${knotName(kb.i)}: load ${loadWord(k)}. ${n + 1} of ${MAX_PINS} pins. ${dotWords(kb.i)}`);
  }
  function startPull() {
    kb.shown = true;
    if (kb.pull || pointerId !== null) return;
    grab(kb.i);
    if (grabbed !== kb.i) return;
    kb.pull = true; kb.heldFor = 0; keyUses++;
    kb.lx = knots[kb.i].x; kb.ly = knots[kb.i].y;
    setFinger(kb.lx, kb.ly);
    kb.infoAt = -1;
    speak(`Pulling ${knotName(kb.i)}. The arrows lead it; let go of Space to drop it.`);
  }
  function endPull() {
    if (!kb.pull) return;
    kb.pull = false; kb.held.clear();
    if (grabbed !== kb.i) return;
    release();
    speak(`Let go of ${knotName(kb.i)}. ${dotWords(kb.i)} Enter pins it before it slides.`);
  }
  // The lead point moves while arrows are held (slow at first, for aiming,
  // then fast enough to get ahead of the knot), never more than LEAD_MAX
  // from it. Its pull is described once the arrows are let go.
  function moveLead(dt) {
    if (kb.pull && grabbed !== kb.i) { kb.pull = false; kb.held.clear(); }
    if (!kb.pull) return;
    let dx = 0, dy = 0;
    for (const a of kb.held) { dx += DIRS[a][0]; dy += DIRS[a][1]; }
    if (dx || dy) {
      kb.heldFor += dt;
      const v = (LEAD_SLOW + (LEAD_FAST - LEAD_SLOW) * Math.min(1, kb.heldFor / LEAD_RAMP)) * dt / Math.hypot(dx, dy);
      nudgeLead(dx * v, dy * v);
      kb.infoAt = 0.3;
    } else {
      kb.heldFor = 0;
      if (kb.infoAt > 0 && (kb.infoAt -= dt) <= 0) speak(pullInfo());
    }
  }
  function nudgeLead(dx, dy) {
    const k = knots[grabbed];
    let x = Math.max(0, Math.min(W, kb.lx + dx)), y = Math.max(0, Math.min(H, kb.ly + dy));
    const m = Math.hypot(x - k.x, y - k.y);
    if (m > LEAD_MAX) { x = k.x + (x - k.x) * LEAD_MAX / m; y = k.y + (y - k.y) * LEAD_MAX / m; }
    kb.lx = x; kb.ly = y;
    setFinger(x, y);
  }
  // What the eye sees change, in words, once each: a strand going over its
  // limit, a pin working loose, the count of covered dots (once it has held
  // still for 0.4 s), and the pulled knot's strands turning straining.
  function announce() {
    if (state !== 'playing' || paused) return;
    const now = elapsed;
    for (const s of strands) {
      const on = s.alive && s.over > 0;
      if (on && !kb.over.has(s)) speak(`The strand ${strandName(s)} is over its limit: ease off or it snaps!`);
      if (on) kb.over.add(s); else kb.over.delete(s);
    }
    knots.forEach((k, i) => {
      const on = k.pinned && k.over > 0;
      if (on && !kb.loose.has(i)) speak(`The pin at ${knotName(i)} is working loose!`);
      if (on) kb.loose.add(i); else kb.loose.delete(i);
    });
    const c = coveredCount();
    if (c !== kb.covered) { kb.covered = c; kb.coverAt = now; kb.coverSaid = false; }
    else if (!kb.coverSaid && now - kb.coverAt >= 0.4) {
      kb.coverSaid = true;
      if (now > 0.5) speak(c === cur.dots.length ? (grabbed === null ? 'Every dot covered. Hands off: hold for a second.'
        : 'Every dot covered. Let go and pin to hold it.') : `${c} of ${cur.dots.length} dots covered.`);
    }
    if (kb.pull) {
      let band = 0;
      for (const j of neighbours(grabbed)) {
        const s = strandBetween(grabbed, j);
        if (s.alive && s.strain >= (s.fray ? FRAY_WARN : WARN)) band = 1;
      }
      if (band > kb.band) speak(strandWords(grabbed, 'Now straining. Strands: '));
      kb.band = band;
    } else kb.band = 0;
  }
  function drawKeys() {
    if (!kb.shown || state !== 'playing') return;
    const k = knots[kb.i];
    for (const [c, w] of [['rgba(10,6,12,0.9)', 5], ['#ffffff', 2]]) {
      ctx.strokeStyle = c; ctx.lineWidth = w;
      ctx.beginPath(); ctx.arc(k.x, k.y, 19, 0, Math.PI * 2); ctx.stroke();
    }
    if (kb.pull) {
      for (const [c, w] of [['rgba(10,6,12,0.9)', 4], ['#ffffff', 1.5]]) {
        ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(kb.lx - 6, kb.ly); ctx.lineTo(kb.lx + 6, kb.ly);
        ctx.moveTo(kb.lx, kb.ly - 6); ctx.lineTo(kb.lx, kb.ly + 6);
        ctx.stroke();
      }
    }
  }
  window.addEventListener('keydown', evt => {
    if (evt.ctrlKey || evt.metaKey || evt.altKey || evt.key === 'Tab') return;
    const onButton = evt.target && evt.target.tagName === 'BUTTON';
    const k = evt.key === ' ' ? 'space' : evt.key.toLowerCase();
    if (onButton && (k === 'enter' || k === 'space')) return; // the focused button presses itself
    if (evt.key in DIRS) {
      evt.preventDefault();
      if (onButton) evt.target.blur();
      if (paused || state !== 'playing') return;
      if (kb.pull) {
        if (!evt.repeat) { kb.held.add(evt.key); nudgeLead(DIRS[evt.key][0] * LEAD_TAP, DIRS[evt.key][1] * LEAD_TAP); }
        return;
      }
      keyPick(evt.key);
      return;
    }
    if (paused) return;
    if (state !== 'playing') {
      if (k === 'enter' && !evt.repeat && !playAgainBtn.disabled) { evt.preventDefault(); next(); }
      return;
    }
    if (k === 'space') { evt.preventDefault(); if (!evt.repeat) startPull(); }
    else if (k === 'enter' || k === 'p') { evt.preventDefault(); if (!evt.repeat) keyPin(); }
    else if (k === 's') { evt.preventDefault(); if (!evt.repeat) { kb.shown = true; speak(status()); } }
    else if (k === 'c') { evt.preventDefault(); if (!evt.repeat) keyCorner(evt.shiftKey); }
  });
  window.addEventListener('keyup', evt => {
    if (evt.key in DIRS) kb.held.delete(evt.key);
    if (evt.key === ' ') endPull();
  });
  window.addEventListener('blur', endPull);

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    acc += dt;
    last = now;
    if (state === 'playing' && !paused) moveLead(dt);
    while (acc >= STEP) {
      if (state === 'playing' && !paused) step(STEP);
      acc -= STEP;
    }
    if (!paused) effects(dt);
    announce();
    draw(now);
    requestAnimationFrame(frame);
  }

  newRun();
  requestAnimationFrame(frame);
})();
// § a11y label
// The canvas label names the verbs, with the word for this device.
{
  const fine = window.matchMedia('(pointer: fine)').matches;
  const t = fine ? 'click' : 'tap';
  document.getElementById('table').setAttribute('aria-label', `Loom. Drag a knot to pull the net, ${t} a knot to pin it. ` +
    'Keys: arrows pick a knot, C the next corner, Enter or P pins or unpins it, hold Space and the arrows pull it, S status.');
}
</script>
</body>
</html>
