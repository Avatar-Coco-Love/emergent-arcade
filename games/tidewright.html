<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidewright</title>
<style>
  :root {
    --bg: #10202b;
    --panel: #1b3140;
    --text: #eef4f2;
    --muted: #9fb5bd;
    --accent: #d9b872;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the shore scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  #field { flex: 1; min-height: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  #shore { display: block; width: 100%; height: 100%; touch-action: none; border-radius: 10px; }
  #msg {
    position: absolute; top: 34px; left: 24px; right: 24px; margin: 0;
    text-align: center; font-size: 0.85rem; line-height: 1.3; color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95); pointer-events: none;
  }
  #msg.warn { color: #ffb4a2; font-weight: 600; }
  #endCard {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    width: min(86%, 300px); padding: 18px 16px; border-radius: 12px;
    background: rgba(20, 38, 50, 0.96); border: 1px solid #3f6272; text-align: center;
  }
  #endCard[hidden] { display: none; }
  #endCard h2 { margin: 0 0 6px; font-size: 1.3rem; }
  #endCard h2.won { color: #f2d58a; }
  #endCard h2.lost { color: #ff9a8a; }
  #endCard p { margin: 0 0 4px; color: #d6e3e6; font-size: 0.9rem; }
  #endCard button { margin-top: 10px; width: 100%; font-weight: 600; }
  #endCard button:disabled { opacity: 0.4; }
  #endCard button[hidden] { display: none; }
  .bar {
    flex: none; display: flex; align-items: center; justify-content: center;
    gap: 14px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted);
  }
  .bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .meter {
    display: inline-block; width: 52px; height: 8px; border-radius: 4px;
    background: #2a4352; vertical-align: middle; overflow: hidden;
  }
  .meter span { display: block; height: 100%; }
  #sandFill { background: var(--accent); }
  #floodFill { background: #5fb0e0; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid #3f6272;
    border-radius: 6px; padding: 8px 14px; font-size: 0.9rem; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div id="field">
    <div id="stage">
      <canvas id="shore" aria-label="Tidewright seawall. Flick to throw sand onto the wall, tap a sluice gate handle to open or shut it."></canvas>
      <p id="msg" role="status"></p>
      <div id="endCard" hidden>
        <h2 id="endTitle"></h2>
        <p id="endDetail"></p>
        <p id="endAch"></p>
        <button id="mainBtn"></button>
        <button id="altBtn">New run</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <span>Waves held <b id="hudWaves"></b></span>
    <span>Sand <span class="meter"><span id="sandFill"></span></span></span>
    <span>Flood <span class="meter"><span id="floodFill"></span></span></span>
    <button id="resetBtn">New run</button>
  </div>

<script>
(function() {
  // § constants
  const GAME_ID = 'tidewright';
  const W = 400, H = 600;           // game units (canvas scales to fit)
  const NC = 32, COLW = W / NC;     // sand columns along the wall
  const GY = 440, K = 4.2;          // ground line y, px per height unit
  const HMAX = 95;                  // tallest a column can get

  // Sea and waves (heights: ground behind the wall = 0)
  const CALM_B = -8;                // calm sea level
  const SPRING_B = 26;              // spring tide sea level: above the gate sills
  const EBB = 0.5, EBB_T = 3;       // spring tide ebbs at this share of the calm, over EBB_T s
  const SILL = 0.5;                 // an open gate drains down to this
  const C0 = 24, CG = 1;            // crest of wave 1, gain per wave
  const CALM_T = [12, 16, 22];      // calm before wave 1, wave 2, later waves (s)
  const RISE = 2.5, HOLD = 2, FALL = 2.5, DOUBLE_GAP = 6; // wave shape (s)
  const ROGUE = 10;                 // rogue wave: extra crest on one column
  const STORM_N = 4, STORM_CUT = 6, STORM_SLUMP = 3; // storm: columns cut, slump multiplier

  // Water (the shared state with the wall)
  const OVER = 2;                   // overtopping: OVER * excess^1.5 per s
  const SCOUR = 0.08;               // wall lost per unit of water over it
  const LEAK = 0.035;               // seep through the wall while a wave stands on it: LEAK * (sea - calm sea) per s
  const LEAK_FROM = 3;              // seepage and erosion start at this wave
  const RAIN = 0.09;                // rain: water per s on every column
  const GATE_Q = 2;                 // open gate: flow per s per unit of head
  const JET = 4, JET_SUM = (JET + 1) * (JET + 1); // inflow through a gate spreads over ±JET columns
  const FLOW = 6;                   // water spreading between neighbouring columns
  const ERODE = 0.005;              // wall lost per s per unit of standing water
  const SOFT = 5;                   // loss reason: 1 height softened by water counts as SOFT water of seepage
  const WET_D = 2;                  // water deeper than this is "standing"
  const WASH = 0.3;                 // share of sand that stays in deep water
  const FLOOD_D = 24;               // mean water that floods the village
  const SLUMP = 0.03;               // share of each column lost per wave

  // Sand
  const AMMO_MAX = 40, AMMO0 = 40, AMMO_RATE = 4.5; // sand pile and refill per s
  const S_MIN = 3, S_MAX = 9;       // pellet size (height units spread over 3 columns)
  const GATE_COLS = [4, 12, 19, 27];
  const SEASON = 6, REPAIR = 4;     // waves per season, repair between seasons

  // Input
  const FLICK_PX = 16;              // movement that makes a press a flick (game px)
  const TAP_SLOP = 10, TAP_MS = 450;
  const V_LO = 0.25, V_HI = 1.4;    // swipe speed (px/ms) for the smallest / biggest pellet
  const FLICK_WAIT = 90;            // ms after crossing FLICK_PX to measure speed
  const CHARGE_S = 0.5;             // keyboard: hold Space this long for the biggest pellet
  const HANDLE_Y = 488, HANDLE_R = 21;
  const END_LOCK_MS = 1000;
  const STEP = 1 / 60;
  const EVENTS = ['rogue', 'rain', 'spring', 'double', 'storm'];
  const FIXED = { 4: ['rogue'], 5: ['rain'], 6: ['spring'], 7: ['double'], 8: ['storm'],
    9: ['rogue', 'rain'], 10: ['double', 'storm'], 11: ['spring', 'rogue'], 12: ['rain', 'double'] };

  const canvas = document.getElementById('shore');
  const ctx = canvas.getContext('2d');
  const msgEl = document.getElementById('msg');
  const touchy = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const TAP = touchy ? 'Tap' : 'Click';

  // Achievements: announced to the Emergent Arcade gallery when embedded.
  const unlocked = new Set();
  function unlock(id) {
    runEarned.add(id);
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
    }
  }

  // Round (season) results for play telemetry (docs/telemetry.md); keys in docs/games/tidewright.md.
  function report(won, reason) {
    if (window.parent === window) return;
    const r1 = v => Math.round(v * 10) / 10;
    const msg = { type: 'arcade:result', game: GAME_ID, outcome: won ? 'win' : 'loss',
      time: r1(elapsed), level: season, run: runId, attempt, score: waves,
      stats: { waves, peak_w: r1(peakW), gate_open_s: r1(gateOpenS), flicks, whiffs } };
    if (!won) msg.reason = reason;
    window.parent.postMessage(msg, '*');
  }

  const field = document.getElementById('field');
  const stage = document.getElementById('stage');
  function fitShore() {
    const scale = Math.min(field.clientWidth / W, field.clientHeight / H);
    const w = Math.max(80, Math.floor(W * scale)), h = Math.max(120, Math.floor(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  new ResizeObserver(fitShore).observe(field);
  window.addEventListener('resize', fitShore);
  fitShore();

  let paused = false;
  window.addEventListener('message', evt => {
    if (evt.data && evt.data.type === 'arcade:pause') { paused = true; endGesture(); charging = null; }
    if (evt.data && evt.data.type === 'arcade:resume') paused = false;
  });

  const endCard = document.getElementById('endCard');
  const mainBtn = document.getElementById('mainBtn');
  const altBtn = document.getElementById('altBtn');

  // § state
  const Hh = new Float32Array(NC);  // wall height per column
  const Wd = new Float32Array(NC);  // standing water behind each column
  const wet = new Float32Array(NC); // 0..1, for colour
  const sea = new Float32Array(NC); // sea level in front of each column (this step)
  const cracked = new Uint8Array(NC);
  const gateOpen = GATE_COLS.map(() => false);
  let spec, phase, pt, wave, waves, season, state, elapsed, ammo, runId, attempt, snap;
  let gateIn, prevIn, peakW, gateOpenS, flicks, whiffs, src, drained, overWave, meanW;
  let cleanRogues = 0, lastReason = null, hinted = {}, cursor = NC >> 1, kbUsed = false, tapWhiffs = 0, lockUntil = 0, tnow = 0;
  const runEarned = new Set();
  const fx = [];

  // § waves
  function ri(n) { return Math.floor(Math.random() * n); }
  function specFor(k) {
    const s = { k, crest: C0 + CG * (k - 1), calm: CALM_T[Math.min(k, 3) - 1], rogueCol: -1, storm: [] };
    let ev = FIXED[k] || [];
    if (k > 12) {
      const n = Math.min(3, 1 + Math.floor((k - 7) / 6)), pool = EVENTS.slice();
      ev = [];
      if (spec && spec.spring) pool.splice(pool.indexOf('spring'), 1); // never two spring tides in a row
      while (ev.length < n) ev.push(pool.splice(ri(pool.length), 1)[0]);
    }
    s.ev = ev;
    for (const e of ev) if (e !== 'storm') s[e] = true;
    if (s.rogue) do s.rogueCol = 1 + ri(NC - 2); while (GATE_COLS.includes(s.rogueCol));
    if (ev.includes('storm')) while (s.storm.length < STORM_N) { const c = ri(NC); if (!s.storm.includes(c)) s.storm.push(c); }
    return s;
  }
  function smooth(u) { return u * u * (3 - 2 * u); }
  function pulse(u) {
    if (u < 0) return 0;
    if (u < RISE) return smooth(u / RISE);
    u -= RISE; if (u < HOLD) return 1;
    u -= HOLD; if (u < FALL) return 1 - smooth(u / FALL);
    return 0;
  }
  const PULSE = RISE + HOLD + FALL;
  function waveLen(s) { return s.double ? 2 * PULSE + DOUBLE_GAP : PULSE; }
  // Calm sea level now. A spring tide holds the sea above the sills, then ebbs late in the calm.
  function baseSea() {
    if (!spec.spring || phase !== 'calm') return CALM_B;
    const u = (pt - spec.calm * EBB) / EBB_T;
    return u <= 0 ? SPRING_B : u >= 1 ? CALM_B : SPRING_B + (CALM_B - SPRING_B) * smooth(u);
  }
  function rogueAt(s, i) { const d = Math.abs(i - s.rogueCol); return s.rogueCol < 0 || d > 1 ? 0 : d ? ROGUE / 2 : ROGUE; }
  // Highest sea the next (or current) wave brings to column i: what the marker shows.
  function crestAt(i) { return spec.crest + rogueAt(spec, i); }
  function timeToWave() { return phase === 'calm' ? spec.calm - pt : 0; }

  function startWave(k) {
    wave = k;
    spec = specFor(k);
    phase = 'calm'; pt = 0; drained = 0; overWave = 0; prevIn = gateIn || 0; gateIn = 0;
    cracked.fill(0);
    for (const c of spec.storm) { Hh[c] = Math.max(0, Hh[c] - STORM_CUT); cracked[c] = 1; }
    const tell = { rogue: 'A rogue wave is aimed at the marked spot.',
      rain: 'Rain: water will rise everywhere behind the wall.',
      spring: 'Spring tide: the sea stands above the gate sills until it ebbs. An open gate lets it in.',
      double: 'Two waves back to back: no time to drain between them.',
      storm: 'Storm damage: shore up the cracked columns.' };
    const said = spec.ev.map(e => tell[e]);
    if (k === LEAK_FROM) said.unshift('From now on the sea soaks through the wall (drips), and standing water wears it down.');
    if (said.length) say(said.join(' '), 6);
    if (k === 3 && !hinted.gate) gateHint();
  }

  // § run
  function newRun() {
    season = 1; waves = 0; attempt = 1; cleanRogues = 0;
    runId = Math.random().toString(36).slice(2, 10) || 'run';
    for (let i = 0; i < NC; i++) Hh[i] = 30 + (Math.random() * 6 - 3);
    let n; do n = 2 + ri(NC - 5); while (GATE_COLS.some(g => Math.abs(g - n - 1) < 2));
    for (let i = n; i < n + 3; i++) Hh[i] = 19 + Math.random() * 2;
    Wd.fill(0); wet.fill(0); gateIn = 0;
    ammo = AMMO0;
    gateOpen.fill(false);
    hinted = {}; tapWhiffs = 0;
    runEarned.clear();
    snap = saveSnap();
    beginSeason();
    say('The tide is coming. The white line shows how high the next wave will reach: flick sand onto the wall where it is too low.', 7);
  }
  function saveSnap() { return { H: Float32Array.from(Hh), W: Float32Array.from(Wd), ammo, waves }; }
  function beginSeason() {
    elapsed = 0; peakW = 0; gateOpenS = 0; flicks = 0; whiffs = 0;
    src = { overtop: 0, gate: 0, seep: 0 };
    state = 'playing';
    endCard.hidden = true;
    startWave(waves + 1);
    hud();
  }
  function retrySeason() {
    Hh.set(snap.H); Wd.set(snap.W); ammo = snap.ammo; waves = snap.waves;
    gateOpen.fill(false);
    attempt++;
    beginSeason();
  }
  function nextSeason() {
    season++; attempt = 1;
    for (let i = 0; i < NC; i++) { Hh[i] = Math.min(HMAX, Hh[i] + REPAIR); Wd[i] *= 0.5; }
    ammo = AMMO_MAX;
    gateOpen.fill(false);
    snap = saveSnap();
    beginSeason();
  }

  function endWave() {
    for (let i = 0; i < NC; i++) Hh[i] -= Hh[i] * SLUMP * (cracked[i] ? STORM_SLUMP : 1);
    waves++;
    if (waves >= 5) unlock('breakwater');
    if (waves >= 18) unlock('old-salt');
    if (spec.rogue && overWave < 0.5 && ++cleanRogues >= 3) unlock('stand-firm');
    if (waves % SEASON === 0) {
      if (peakW <= FLOOD_D / 3) unlock('dry-feet');
      state = 'season';
      report(true);
      showCard(true);
    } else startWave(wave + 1);
  }

  function lose() {
    state = 'lost';
    const tot = src.gate + src.overtop + src.seep;
    const reason = src.gate >= tot * 0.25 ? 'gate' : src.overtop >= src.seep ? 'overtop' : 'seep';
    lastReason = reason;
    report(false, reason);
    showCard(false, reason);
  }

  function showCard(won, reason) {
    const why = { overtop: 'Waves poured over the low spots in the wall.',
      gate: 'The sea came in through open gates.',
      seep: 'Seepage and rain built up behind the wall and never drained.' };
    const t = document.getElementById('endTitle');
    t.textContent = won ? `Season ${season} held` : 'The village flooded';
    t.className = won ? 'won' : 'lost';
    document.getElementById('endDetail').textContent = won
      ? `${waves} waves held so far. The wall carries over, a little repaired.`
      : `${why[reason]} Waves held: ${waves}.`;
    const names = { breakwater: 'Breakwater', 'sluice-master': 'Sluice Master', 'dry-feet': 'Dry Feet',
      'stand-firm': 'Stand Firm', 'old-salt': 'Old Salt' };
    const got = [...runEarned].map(id => names[id]);
    document.getElementById('endAch').textContent = got.length ? 'Earned: ' + got.join(', ') : '';
    mainBtn.textContent = won ? 'Next season' : `Retry season ${season}`;
    altBtn.hidden = won;
    endCard.hidden = false;
    lockUntil = performance.now() + END_LOCK_MS;
    mainBtn.disabled = altBtn.disabled = true;
    setTimeout(() => { mainBtn.disabled = altBtn.disabled = false; }, END_LOCK_MS);
  }

  // § simulation
  function step(dt) {
    elapsed += dt; pt += dt;
    if (phase === 'calm' && pt >= spec.calm) { phase = 'wave'; pt = 0; }
    else if (phase === 'wave' && pt >= waveLen(spec)) { endWave(); if (state !== 'playing') return; }
    const base = baseSea(), seepOn = wave >= LEAK_FROM;
    ammo = Math.min(AMMO_MAX, ammo + AMMO_RATE * dt);
    let p1 = 0, p2 = 0;
    if (phase === 'wave') { p1 = pulse(pt); if (spec.double) p2 = pulse(pt - PULSE - DOUBLE_GAP); }
    for (let i = 0; i < NC; i++) {
      const S = base + (spec.crest - base) * (p1 + p2) + rogueAt(spec, i) * p1;
      sea[i] = S;
      if (S > Hh[i]) {
        const q = OVER * Math.pow(S - Hh[i], 1.5) * dt;
        Wd[i] += q; src.overtop += q; overWave += q;
        Hh[i] = Math.max(0, Hh[i] - SCOUR * q);
      }
      if (seepOn && S > base) { const q = LEAK * (S - base) * dt; Wd[i] += q; src.seep += q; }
      if (spec.rain) { Wd[i] += RAIN * dt; src.seep += RAIN * dt; }
    }
    for (let g = 0; g < GATE_COLS.length; g++) {
      if (!gateOpen[g]) continue;
      gateOpenS += dt;
      const c = GATE_COLS[g], S = sea[c];
      const lvl = Math.max(SILL, S);
      if (Wd[c] > lvl) { const q = (Wd[c] - lvl) * Math.min(1, GATE_Q * dt); Wd[c] -= q; drained += q; }
      else if (S > Math.max(SILL, Wd[c])) {
        // The sea bursts through and spreads along the back of the wall.
        const q = GATE_Q * (S - Math.max(SILL, Wd[c])) * dt;
        for (let d = -JET; d <= JET; d++) { const i = c + d; if (i >= 0 && i < NC) Wd[i] += q * (JET + 1 - Math.abs(d)) / JET_SUM; }
        src.gate += q; gateIn += q;
      }
    }
    for (let i = 0; i < NC - 1; i++) { const f = FLOW * (Wd[i] - Wd[i + 1]) * dt; Wd[i] -= f; Wd[i + 1] += f; }
    let sum = 0;
    for (let i = 0; i < NC; i++) {
      if (seepOn && Wd[i] > WET_D) {
        const e = Math.min(Hh[i], ERODE * (Wd[i] - WET_D) * dt);
        Hh[i] -= e; src.seep += e * SOFT;
      }
      wet[i] += ((Wd[i] > WET_D ? 1 : 0) - wet[i]) * Math.min(1, dt * 0.8);
      sum += Wd[i];
    }
    meanW = sum / NC;
    peakW = Math.max(peakW, meanW);
    const fade = Math.exp(-dt / 30);
    src.overtop *= fade; src.gate *= fade; src.seep *= fade;
    if (drained >= FLOOD_D * NC * 0.5 && gateIn + prevIn < 1) unlock('sluice-master'); // none of it let in through a gate
    if (!hinted.gate && meanW > 1.5) gateHint();
    if (phase === 'calm' && spec.calm - pt < 4 && gateOpen.some(o => o) && !hinted['shut' + wave]) {
      hinted['shut' + wave] = true;
      say('Shut the open gates: the wave is coming!', 3, true);
    }
    if (meanW >= FLOOD_D) lose();
  }
  function gateHint() {
    hinted.gate = true;
    say(`Water is pooling behind the wall. ${TAP} a gate handle to open it and drain the water out; shut it before the next wave.`, 7);
  }

  // Throw a pellet of sand onto column col (skew -1..1 spreads it left/right).
  function throwSand(col, size, skew) {
    if (state !== 'playing' || paused) return false;
    col = Math.max(0, Math.min(NC - 1, col));
    if (ammo < S_MIN) {
      whiffs++;
      say('The sand pile is empty: it refills slowly. Gates still work.', 3);
      return false;
    }
    size = Math.min(Math.max(S_MIN, Math.min(S_MAX, size)), ammo);
    ammo -= size; flicks++;
    const k = Math.max(-1, Math.min(1, skew || 0)) * 0.2;
    const parts = [[col - 1, 0.25 - k], [col, 0.5], [col + 1, 0.25 + k]];
    let kept = 0, wetIn = false;
    for (const [c, w] of parts) {
      if (c < 0 || c >= NC) continue;
      const wash = Wd[c] <= WET_D ? 1 : Math.max(WASH, 1 - (1 - WASH) * (Wd[c] - WET_D) / 4);
      if (wash < 1) wetIn = true;
      const g = size * w * wash;
      Hh[c] = Math.min(HMAX, Hh[c] + g); kept += g;
    }
    fx.push({ kind: 'pellet', x: (col + 0.5) * COLW, y: GY - Hh[col] * K, t: 0, wet: wetIn });
    if (kept < size * 0.6) {
      whiffs++;
      if (!hinted.wash) { hinted.wash = true; say('Sand thrown into standing water washes away. Drain it first, then build.', 5); }
    }
    return true;
  }

  function toggleGate(g) {
    if (state !== 'playing' || paused || g < 0 || g >= GATE_COLS.length) return;
    gateOpen[g] = !gateOpen[g];
    fx.push({ kind: 'ring', x: (GATE_COLS[g] + 0.5) * COLW, y: HANDLE_Y, t: 0 });
  }

  // § messages
  let msgUntil = 0, msgMin = 0;
  function say(text, secs, warn) {
    const now = tnow;
    if (now < msgMin && !warn) { queued = [text, secs]; return; }
    msgEl.textContent = text;
    msgEl.className = warn ? 'warn' : '';
    msgMin = now + Math.min(secs, 3);
    msgUntil = now + secs;
  }
  let queued = null;
  function tickMsg() {
    if (queued && tnow >= msgMin) { const q = queued; queued = null; say(q[0], q[1]); }
    else if (msgEl.textContent && tnow >= msgUntil) msgEl.textContent = '';
  }

  function hud() {
    document.getElementById('hudWaves').textContent = waves;
    document.getElementById('sandFill').style.width = (100 * ammo / AMMO_MAX).toFixed(0) + '%';
    document.getElementById('floodFill').style.width = Math.min(100, 100 * (meanW || 0) / FLOOD_D).toFixed(0) + '%';
  }

  // § drawing
  const y = h => GY - h * K;
  function mix(a, b, t) {
    const p = s => [1, 3, 5].map(j => parseInt(s.slice(j, j + 2), 16));
    const A = p(a), B = p(b);
    return `rgb(${A.map((v, j) => Math.round(v + (B[j] - v) * t)).join(',')})`;
  }
  function draw() {
    const s = canvas.width / W;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    const dark = spec.rain || spec.storm.length ? 1 : 0;
    const sky = ctx.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, dark ? '#2a3a48' : '#3d6f93');
    sky.addColorStop(1, dark ? '#50636e' : '#a9cddc');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, GY);
    if (spec.rain) {
      ctx.strokeStyle = 'rgba(200,225,240,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let j = 0; j < 40; j++) { const rx = (j * 97 + tnow * 40) % W, ry = (j * 53 + tnow * 300) % GY; ctx.moveTo(rx, ry); ctx.lineTo(rx - 2, ry + 8); }
      ctx.stroke();
    }
    // Sea behind the wall.
    ctx.beginPath();
    ctx.moveTo(0, GY);
    for (let i = 0; i <= NC; i++) {
      const c = Math.min(i, NC - 1), sw = Math.sin(tnow * 1.7 + i * 0.7) * 0.6;
      ctx.lineTo(i * COLW, y(sea[c] + sw));
    }
    ctx.lineTo(W, GY);
    ctx.closePath();
    ctx.fillStyle = spec.spring ? '#2b6a8a' : '#2f7ca3';
    ctx.fill();
    // Wall.
    for (let i = 0; i < NC; i++) {
      const x = i * COLW, top = y(Hh[i]);
      ctx.fillStyle = mix('#dcbd78', '#8d6d44', wet[i]);
      ctx.fillRect(x, top, COLW + 0.6, GY - top);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(x, top, COLW + 0.6, 2);
      if (cracked[i]) {
        ctx.strokeStyle = '#4a3320'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let j = 0; j < 5; j++) ctx.lineTo(x + (j % 2 ? 3 : COLW - 3), top + 4 + j * 7);
        ctx.stroke();
      }
    }
    // Gates in the wall.
    GATE_COLS.forEach((c, g) => {
      const x = c * COLW, gh = 9 * K;
      ctx.fillStyle = '#5e646c';
      ctx.fillRect(x - 1, GY - gh - 3, COLW + 2, gh + 3);
      ctx.fillStyle = gateOpen[g] ? '#101820' : '#7a5230';
      ctx.fillRect(x + 2, GY - gh, COLW - 4, gh);
      if (gateOpen[g] && Math.abs(Wd[c] - sea[c]) > 0.3 && Math.max(Wd[c], sea[c]) > SILL) {
        ctx.fillStyle = 'rgba(140,200,240,0.8)';
        const fl = Wd[c] > sea[c] ? 'out' : 'in';
        for (let j = 0; j < 3; j++) {
          const yy = GY - 3 - ((tnow * 30 + j * 9) % 24);
          ctx.fillRect(x + 3 + j * 2.5, fl === 'out' ? yy : GY - gh + (GY - 3 - yy), 1.5, 3);
        }
      }
    });
    // Water over the wall, seepage drips.
    for (let i = 0; i < NC; i++) {
      const x = i * COLW;
      if (sea[i] > Hh[i]) {
        ctx.fillStyle = 'rgba(200,235,255,0.75)';
        ctx.fillRect(x + 1, y(Hh[i]) - 2, COLW - 2, y(Math.max(Wd[i], 0)) - y(Hh[i]) + 2);
      }
      if (wave >= LEAK_FROM && sea[i] > baseSea() + 1) {
        const r = (tnow * (1 + (sea[i] - baseSea()) / 20) + i * 0.37) % 1;
        ctx.fillStyle = 'rgba(120,190,235,0.9)';
        ctx.fillRect(x + COLW / 2 - 1, GY - 6 * K + r * 6 * K, 2, 3);
      }
      if (wave >= LEAK_FROM && Wd[i] > WET_D && i % 2 === 0) {
        ctx.fillStyle = 'rgba(80,50,25,0.8)';
        const ty = y(Hh[i]) - 7 + ((tnow * 6) % 3);
        ctx.beginPath(); ctx.moveTo(x + COLW / 2 - 3, ty); ctx.lineTo(x + COLW / 2 + 3, ty); ctx.lineTo(x + COLW / 2, ty + 4); ctx.fill();
      }
    }
    // Standing water at the foot of the wall.
    ctx.beginPath();
    ctx.moveTo(0, GY);
    for (let i = 0; i < NC; i++) { ctx.lineTo(i * COLW, y(Wd[i])); ctx.lineTo((i + 1) * COLW, y(Wd[i])); }
    ctx.lineTo(W, GY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(70,150,210,0.62)';
    ctx.fill();
    // Sea level, seen through the wall.
    if (Math.max(...sea) < HMAX) {
      ctx.strokeStyle = 'rgba(40,120,190,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 4) {
        const i = Math.min(NC - 1, Math.floor(x / COLW));
        ctx.lineTo(x, y(sea[i]) + Math.sin(x / 9 + tnow * 3) * 1.5);
      }
      ctx.stroke();
      if (sea[0] > -2) { ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#1f5f96'; ctx.textAlign = 'left'; ctx.fillText('sea', 3, y(sea[0]) - 4); }
    }
    // Flood level: ticks at both edges.
    ctx.fillStyle = '#ff7b66';
    ctx.fillRect(0, y(FLOOD_D) - 1.5, 14, 3); ctx.fillRect(W - 14, y(FLOOD_D) - 1.5, 14, 3);
    // Next crest marker.
    const warn = phase === 'calm' && spec.calm - pt < 5;
    if (phase === 'calm' || pt < RISE) {
      ctx.strokeStyle = warn || phase === 'wave' ? '#ffb070' : 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < NC; i++) { ctx.lineTo(i * COLW, y(crestAt(i))); ctx.lineTo((i + 1) * COLW, y(crestAt(i))); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd2c8';
    ctx.fillText('flood', W - 3, y(FLOOD_D) - 5);
    if (phase === 'calm' || pt < RISE) {
      ctx.fillStyle = warn || phase === 'wave' ? '#ffb070' : '#fff';
      ctx.textAlign = 'left';
      ctx.fillText('next crest', 3, y(crestAt(0)) - 5);
    }
    // Keyboard cursor.
    if (kbUsed) {
      const cx = (cursor + 0.5) * COLW, cy = y(Hh[cursor]) - 12;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(cx - 5, cy - 6); ctx.lineTo(cx + 5, cy - 6); ctx.lineTo(cx, cy); ctx.fill();
      if (charging) {
        const f = Math.min(1, (tnow - charging) / CHARGE_S);
        ctx.fillStyle = '#dcbd78'; ctx.beginPath(); ctx.arc(cx, cy - 14, 3 + 5 * f, 0, 7); ctx.fill();
      }
    }
    // Ground, gate handles, village.
    ctx.fillStyle = '#6d5a3a';
    ctx.fillRect(0, GY, W, 10);
    ctx.fillStyle = '#2f4a2e';
    ctx.fillRect(0, GY + 10, W, H - GY - 10);
    GATE_COLS.forEach((c, g) => {
      const cx = (c + 0.5) * COLW;
      ctx.strokeStyle = '#8a9096'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, GY + 4); ctx.lineTo(cx, HANDLE_Y - HANDLE_R); ctx.stroke();
      ctx.fillStyle = gateOpen[g] ? '#3fa36f' : '#a8453a';
      ctx.beginPath(); ctx.arc(cx, HANDLE_Y, HANDLE_R, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
      const a = gateOpen[g] ? Math.PI / 4 : 0;
      for (let j = 0; j < 4; j++) {
        const t = a + j * Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(cx, HANDLE_Y); ctx.lineTo(cx + Math.cos(t) * (HANDLE_R - 4), HANDLE_Y + Math.sin(t) * (HANDLE_R - 4)); ctx.stroke();
      }
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText(gateOpen[g] ? 'OPEN' : 'SHUT', cx, HANDLE_Y + HANDLE_R + 12);
      if (kbUsed) ctx.fillText(String(g + 1), cx + HANDLE_R + 6, HANDLE_Y - HANDLE_R + 4);
    });
    const flood = Math.min(1, (meanW || 0) / FLOOD_D);
    for (let j = 0; j < 7; j++) {
      const hx = 12 + j * 56 + (j % 2) * 8, hy = 562, hw = 30, hh = 20;
      ctx.fillStyle = '#c9b89a'; ctx.fillRect(hx, hy, hw, hh);
      ctx.fillStyle = '#8c3b2e';
      ctx.beginPath(); ctx.moveTo(hx - 4, hy); ctx.lineTo(hx + hw / 2, hy - 12); ctx.lineTo(hx + hw + 4, hy); ctx.fill();
      ctx.fillStyle = '#f3d77a'; ctx.fillRect(hx + 6, hy + 6, 6, 6); ctx.fillRect(hx + 18, hy + 6, 6, 6);
    }
    if (flood > 0.02) {
      ctx.fillStyle = 'rgba(70,150,210,0.7)';
      ctx.fillRect(0, 582 - flood * 36, W, flood * 36);
    }
    // Effects.
    for (let j = fx.length - 1; j >= 0; j--) {
      const f = fx[j];
      f.t += 1 / 60;
      if (f.kind === 'pellet') {
        ctx.fillStyle = f.wet ? 'rgba(200,230,255,' + (1 - f.t * 3) + ')' : 'rgba(240,215,150,' + (1 - f.t * 3) + ')';
        for (let q = 0; q < 6; q++) ctx.fillRect(f.x + Math.cos(q) * f.t * 50, f.y - 4 - Math.abs(Math.sin(q * 2)) * f.t * 40, 2.5, 2.5);
        if (f.t > 0.33) fx.splice(j, 1);
      } else if (f.kind === 'ring') {
        ctx.strokeStyle = 'rgba(255,255,255,' + (1 - f.t * 3) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, HANDLE_R + f.t * 40, 0, 7); ctx.stroke();
        if (f.t > 0.33) fx.splice(j, 1);
      }
    }
    // Top line: wave and countdown.
    ctx.fillStyle = 'rgba(10,25,35,0.55)';
    ctx.fillRect(0, 0, W, 26);
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.fillText(`Season ${season} · wave ${wave}`, 8, 18);
    ctx.textAlign = 'right';
    ctx.fillStyle = warn || phase === 'wave' ? '#ffb070' : '#fff';
    ctx.textAlign = 'right';
    ctx.fillText(phase === 'calm' ? `next wave in ${Math.ceil(spec.calm - pt)} s` : 'WAVE!', W - 8, 18);
    const names = { rogue: 'rogue', rain: 'rain', spring: 'spring tide', double: 'double', storm: 'storm' };
    if (spec.ev.length) {
      ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffe2a8';
      ctx.fillText(spec.ev.map(e => names[e]).join(' + '), W / 2 + 10, 18);
    }
  }

  // § input
  // A press that moves FLICK_PX is a flick: sand lands on the column under
  // where the press started; swipe speed sets the pellet size, sideways
  // direction spreads it. A still press on a gate handle toggles the gate.
  let active = null, charging = null;
  function toShore(evt) {
    const r = canvas.getBoundingClientRect();
    return [(evt.clientX - r.left) * W / r.width, (evt.clientY - r.top) * H / r.height];
  }
  function endGesture() { active = null; }
  function fire(a, now) {
    const dx = a.last[0] - a.start[0], dy = a.last[1] - a.start[1], d = Math.hypot(dx, dy);
    const v = d / Math.max(8, a.lastT - a.t0); // px/ms, from the events' own timestamps
    const size = S_MIN + (S_MAX - S_MIN) * Math.max(0, Math.min(1, (v - V_LO) / (V_HI - V_LO)));
    throwSand(Math.floor(a.start[0] / COLW), size, d ? dx / d : 0);
    a.mode = 'done';
  }
  function tapAt(p) {
    let best = -1, bd = 1e9;
    GATE_COLS.forEach((c, g) => { const d = Math.hypot(p[0] - (c + 0.5) * COLW, p[1] - HANDLE_Y); if (d < bd) { bd = d; best = g; } });
    if (bd <= HANDLE_R + 12) { toggleGate(best); return; }
    if (tapWhiffs++ < 2) say(`Flick (a quick swipe) to throw sand onto the wall. ${TAP} a gate handle to open or shut it.`, 4);
  }
  canvas.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    if (state !== 'playing' || paused || active) return;
    canvas.setPointerCapture(evt.pointerId);
    const p = toShore(evt);
    active = { id: evt.pointerId, start: p, last: p, t0: evt.timeStamp, lastT: evt.timeStamp, mode: 'pending' };
  });
  canvas.addEventListener('pointermove', evt => {
    const a = active;
    if (!a || evt.pointerId !== a.id || state !== 'playing' || paused) return;
    a.last = toShore(evt); a.lastT = evt.timeStamp;
    const now = performance.now();
    if (a.mode === 'pending' && Math.hypot(a.last[0] - a.start[0], a.last[1] - a.start[1]) >= FLICK_PX) { a.mode = 'flick'; a.tx = now; }
    if (a.mode === 'flick' && now - a.tx >= FLICK_WAIT) fire(a, now);
  });
  canvas.addEventListener('pointerup', evt => {
    const a = active;
    if (!a || evt.pointerId !== a.id) return;
    const now = performance.now();
    if (state === 'playing' && !paused) {
      if (a.mode === 'flick') fire(a, now);
      else if (a.mode === 'pending' && now - a.t0 < TAP_MS &&
        Math.hypot(a.last[0] - a.start[0], a.last[1] - a.start[1]) < TAP_SLOP) tapAt(a.start);
    }
    endGesture();
  });
  canvas.addEventListener('pointercancel', evt => { if (active && evt.pointerId === active.id) endGesture(); });

  window.addEventListener('keydown', evt => {
    if (state !== 'playing' || paused) return;
    const k = evt.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { kbUsed = true; cursor = Math.max(0, Math.min(NC - 1, cursor + (k === 'ArrowLeft' ? -1 : 1))); evt.preventDefault(); }
    else if (k === ' ') { kbUsed = true; if (!charging) charging = tnow; evt.preventDefault(); }
    else if (k >= '1' && k <= String(GATE_COLS.length)) toggleGate(+k - 1);
  });
  window.addEventListener('keyup', evt => {
    if (evt.key !== ' ' || !charging) return;
    const f = Math.min(1, (tnow - charging) / CHARGE_S);
    charging = null;
    throwSand(cursor, S_MIN + (S_MAX - S_MIN) * f, 0);
  });

  function onMain() {
    if (performance.now() < lockUntil) return;
    if (state === 'season') nextSeason(); else if (state === 'lost') retrySeason();
  }
  mainBtn.addEventListener('click', onMain);
  altBtn.addEventListener('click', () => { if (performance.now() >= lockUntil) newRun(); });
  document.getElementById('resetBtn').addEventListener('click', newRun);

  // § loop
  let last = performance.now(), acc = 0;
  function frame(now) {
    if (active && active.mode === 'flick' && now - active.tx >= FLICK_WAIT && state === 'playing' && !paused) fire(active, now);
    const d = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!paused) { acc += d; tnow += d; }
    while (acc >= STEP) {
      if (state === 'playing' && !paused) step(STEP);
      acc -= STEP;
    }
    tickMsg();
    hud();
    draw();
    requestAnimationFrame(frame);
  }

  newRun();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
