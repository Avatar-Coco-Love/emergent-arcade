<!DOCTYPE html>
<html lang="en">
<head>
<script>
// § crash report: uncaught errors go to the arcade's telemetry (docs/telemetry.md, "Errors").
(function () {
  var sent = 0;
  function report(message, line, col) {
    if (window.parent === window || sent++ >= 3) return;
    try {
      window.parent.postMessage({ type: 'arcade:error', game: 'coat-check', message: String(message).slice(0, 300), line: line | 0, col: col | 0 }, '*');
    } catch (_) {}
  }
  window.addEventListener('error', function (e) { report(e.message, e.lineno, e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled rejection: ' + (r && r.message ? r.message : r), 0, 0);
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coat Check</title>
<style>
  :root {
    --bg: #0f0d0c; --panel: #1b1816; --line: #34302b; --text: #efe9e1; --muted: #9d958c;
    --accent: #e0aa5c; --good: #5fcf80; --bad: #ff6b5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; gap: 3px;
    padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
    user-select: none; -webkit-user-select: none;
  }
  /* The rule and message strip has its own rows, never over the doors; fixed height so nothing jumps. */
  #rule { flex: none; text-align: center; color: var(--accent); font-weight: 600; font-size: 0.8rem; min-height: 1.3em; }
  #msg { flex: none; min-height: 2.6em; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 0.88rem; line-height: 1.25; }
  #msg b { color: var(--accent); }
  #msg .win { color: var(--good); font-weight: 600; }
  #msg .loss { color: var(--bad); font-weight: 600; }
  #hud { flex: none; display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 2px; }
  #hud .x { color: var(--bad); letter-spacing: 2px; }
  #hud .pk { color: var(--accent); letter-spacing: 1px; }
  #wrap { flex: 1; min-height: 0; position: relative; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  @media (max-height: 420px) {
    body { gap: 1px; padding-top: 3px; }
    #rule { font-size: 0.74rem; }
    #msg { min-height: 2.4em; font-size: 0.8rem; }
  }
</style>

<body>
  <div id="rule"></div>
  <div id="msg"></div>
  <div id="hud"><span id="where"></span><span><span class="x" id="cx"></span> <span class="pk" id="pk"></span></span><span id="coats"></span></div>
  <div id="wrap"><canvas id="board" role="img" aria-label="Coat Check: drag each coat onto a hook, tap or click the door that holds a guest's coat, hold a door to peek."></canvas></div>

<script>
(function() {
  const GAME_ID = 'coat-check';
  const TAP_MS = 200, HOLD_MS = 450;   // under 0.2 s opens the door, 0.2-0.45 s nothing, from 0.45 s a peek
  const END_LOCK_MS = 1000;            // input ignored after a shift ends...
  const RECAP_MS = 2000;               // ...and while the recap shows every door open
  const SHOW_MS = 900;                 // a fetched door stays open this long
  const DRAG_PX = 10, SLIDE_PX = 22;   // a press that moves this far is a drag / no longer a tap or hold
  const COMPLAINTS = 3;

  // § sim (pure rules: no DOM, no clock; scripts/balance-coat-check.mjs runs this block)
  const NV = 4;   // values per feature: colour, pattern, pin
  // reshuffle: counter events (a hang or a guest served) between reshuffles; friendP: chance an arrival brings a friend right behind
  const TUNE = { reshuffle: [5, 7], friendP: 0.2 };
  function rng32(seed) {
    let a = seed >>> 0 || 1;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const sp = (name, rows, cols, guests, load, rules) => ({ name, rows, cols, guests, load, rules, slack: 2 });
  const CAMPAIGN = [
    sp('Colour tickets', 2, 3, 4, 3, ['colour']),
    sp('Any feature', 3, 3, 6, 5, []),
    sp('Look-alikes', 3, 4, 8, 7, ['look']),
    sp('Coach party', 3, 4, 10, 8, ['coach']),
    sp('Reshuffle', 3, 4, 10, 8, ['reshuffle']),
    sp('Friends', 3, 4, 10, 8, ['friends']),
    sp('Two-feature', 3, 4, 10, 9, ['pair']),
    sp('Regulars', 3, 4, 10, 9, ['regulars']),
    sp('Look + coach', 3, 4, 10, 9, ['look', 'coach']),
    sp('Reshuffle + friends', 3, 4, 10, 9, ['reshuffle', 'friends']),
    sp('Pairs + regulars', 3, 4, 10, 9, ['pair', 'regulars']),
    sp('All rules', 3, 4, 12, 10, ['look', 'coach', 'reshuffle', 'friends', 'pair', 'regulars']),
  ];
  const MIX = ['look', 'coach', 'reshuffle', 'friends', 'pair', 'regulars'];
  function endlessSpec(e, seed) {
    const r = rng32(seed * 7919 + e * 104729 + 1), pool = MIX.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const load = Math.min(12, 8 + (e >> 1)), big = load >= 10;
    return { name: 'Endless ' + (e + 1), rows: big ? 4 : 3, cols: 4, guests: load + 6, load, rules: pool.slice(0, r() < 0.3 ? 3 : 2), slack: 1, endless: true };
  }
  const has = (st, rule) => st.spec.rules.includes(rule);
  const predOK = (coat, pred) => pred.every(([f, v]) => coat.f[f] === v);
  // carry: [{ f, hook }] regulars left on the hooks by the previous shift; bonus: carried peeks
  function newShift(spec, seed, carry = [], bonus = 0) {
    const r = rng32(seed), n = spec.rows * spec.cols, two = spec.rules.includes('colour');
    const st = { spec, r, rr: rng32(seed ^ 0x5bd1e995), hooks: Array(n).fill(null), feats: two ? 2 : 3, tfeats: two ? [0] : [0, 1, 2],
      arrived: 0, events: 0, served: 0, complaints: 0, budget: spec.slack + bonus, peeks: 0, reshuffles: 0, tickets: 0, fallbacks: 0,
      nextId: 1, pending: null, done: false, lost: false, maxLoad: 0, reshuffled: -1, friendNext: 0, stays: new Set(), ages: [], hung: [] };
    if (spec.rules.includes('regulars')) { const k = 1 + (r() < 0.5); while (st.stays.size < k) st.stays.add(1 + Math.floor(r() * (spec.guests - 2))); }
    st.coach = spec.rules.includes('coach') ? { start: Math.floor(r() * 2), size: spec.cols + 2, colour: Math.floor(r() * NV) } : null;
    st.nextRes = spec.rules.includes('reshuffle') ? TUNE.reshuffle[0] + Math.floor(r() * (TUNE.reshuffle[1] - TUNE.reshuffle[0] + 1)) : Infinity;
    carry.forEach((c, i) => { st.hooks[c.hook] = { id: st.nextId++, f: c.f.slice(), arr: -100 - i, born: -10, stay: false, carried: true }; });
    return st;
  }
  const hungCoats = st => st.hooks.filter(Boolean);
  function uniqueFeats(c, hung, feats) { return feats.filter(f => !hung.some(o => o !== c && o.f[f] === c.f[f])); }
  function uniquePairs(c, hung, feats) {
    const out = [];
    for (let i = 0; i < feats.length; i++) for (let j = i + 1; j < feats.length; j++) {
      const a = feats[i], b = feats[j];
      if (!hung.some(o => o !== c && o.f[a] === c.f[a] && o.f[b] === c.f[b])) out.push([a, b]);
    }
    return out;
  }
  function eligibleCount(hung, feats) { return hung.filter(c => uniqueFeats(c, hung, feats).length).length; }
  function makeCoat(st) {
    const r = st.r, hung = hungCoats(st), nf = st.feats, idx = st.arrived;
    const rand = () => [Math.floor(r() * NV), Math.floor(r() * NV), nf === 3 ? Math.floor(r() * NV) : -1];
    const dup = f => hung.some(c => c.f[0] === f[0] && c.f[1] === f[1] && c.f[2] === f[2]);
    const best = fix => {   // 6 tries, keep the coat that leaves the most guests able to leave
      let pick = null, score = -1;
      for (let t = 0; t < 6; t++) {
        const f = rand(); if (fix) fix(f); if (dup(f)) continue;
        const s = eligibleCount(hung.concat([{ f }]), st.tfeats);
        if (s > score) { score = s; pick = f; }
      }
      return pick || (() => { let f; do { f = rand(); if (fix) fix(f); } while (dup(f) && hung.length < 40); return f; })();
    };
    const ch = st.coach;
    if (ch && idx >= ch.start && idx < ch.start + ch.size) return best(f => { f[0] = ch.colour; });
    if (has(st, 'look') && hung.length && r() < 0.5) {   // a look-alike: shares two features, differs in the third
      const src = hung[Math.floor(r() * hung.length)], vary = r() < 0.7 ? 2 : Math.floor(r() * 2);
      const f = src.f.slice(), opts = [0, 1, 2, 3].filter(v => v !== src.f[vary]);
      const fresh = opts.filter(v => !hung.some(o => o.f[vary] === v));
      f[vary] = (fresh.length ? fresh : opts)[Math.floor(r() * (fresh.length ? fresh : opts).length)];
      if (!dup(f)) return f;
    }
    return best(null);
  }
  // The ticket for each guest who could leave now: [{ coat, w, pick() }]
  function departures(st) {
    const hung = hungCoats(st), out = [];
    for (const c of hung) {
      if (c.stay) continue;
      const singles = uniqueFeats(c, hung, st.tfeats).map(f => [[f, c.f[f]]]);
      const pairs = has(st, 'pair') ? uniquePairs(c, hung, st.tfeats).filter(([a, b]) => !singles.some(s => s[0][0] === a || s[0][0] === b)).map(([a, b]) => [[a, c.f[a]], [b, c.f[b]]]) : [];
      const A = c.friendOf && hung.find(o => o.id === c.friendOf);
      const friend = A ? uniqueFeats(A, hung, st.tfeats).map(f => [[f, A.f[f]]]) : [];
      if (!singles.length && !pairs.length && !friend.length) continue;
      const waitsForB = hung.some(o => o.friendOf === c.id);   // A leaves after its friend B
      out.push({ coat: c, w: waitsForB ? 0.05 : st.events - c.born + 1, pick: () => {
        const r = st.r;
        if (friend.length && r() < 0.7) return { pred: friend[Math.floor(r() * friend.length)], friend: A.id };
        if (pairs.length && (!singles.length || r() < 0.5)) return { pred: pairs[Math.floor(r() * pairs.length)] };
        if (!singles.length) return { pred: friend[0], friend: A.id };
        const twin = hung.find(o => o !== c && [0, 1, 2].filter(f => o.f[f] === c.f[f]).length === 2);
        if (twin) { const d = [0, 1, 2].find(f => twin.f[f] !== c.f[f]), s = singles.find(x => x[0][0] === d); if (s) return { pred: s }; }
        return { pred: singles[Math.floor(r() * singles.length)] };
      } });
    }
    return out;
  }
  // The next prompt at the counter: { type: 'hang', coat } or { type: 'ticket', coat, pred, friend }; null when the shift is over.
  function next(st) {
    if (st.pending || st.done || st.lost) return st.pending;
    const r = st.r, hung = hungCoats(st), load = hung.length, free = st.hooks.length - load;
    const canArrive = st.arrived < st.spec.guests && free > 0;
    const arriveP = load >= st.spec.load ? 0 : st.served === 0 ? 1 : 0.6;
    let ev = null;
    if (canArrive && r() < arriveP) ev = 'arrive';
    else {
      const deps = departures(st);
      if (deps.length) {
        let x = r() * deps.reduce((s, d) => s + d.w, 0), d = deps[0];
        for (const o of deps) { x -= o.w; if (x <= 0) { d = o; break; } }
        const t = d.pick(); st.tickets++;
        st.pending = { type: 'ticket', coat: d.coat, pred: t.pred, friend: t.friend || 0 };
        return st.pending;
      }
      if (canArrive) ev = 'arrive';
      else if (hung.some(c => !c.stay)) {   // nobody can be named by the shift's rules: name a pair (or the whole coat)
        const c = hung.filter(x => !x.stay).sort((a, b) => a.born - b.born)[0];
        const p = uniquePairs(c, hung, [0, 1, 2].slice(0, st.feats))[0];
        st.tickets++; st.fallbacks++;
        st.pending = { type: 'ticket', coat: c, pred: p ? p.map(f => [f, c.f[f]]) : [0, 1, 2].slice(0, st.feats).map(f => [f, c.f[f]]), friend: 0 };
        return st.pending;
      } else { st.done = true; return null; }
    }
    const f = makeCoat(st), coat = { id: st.nextId++, f, arr: st.arrived, born: st.events, stay: st.stays.has(st.arrived), friendOf: 0 };
    if (st.friendNext) { coat.friendOf = st.friendNext; st.friendNext = 0; }
    else if (has(st, 'friends') && st.arrived < st.spec.guests - 1 && !coat.stay && r() < TUNE.friendP) st.friendNext = coat.id;
    st.arrived++;
    st.pending = { type: 'hang', coat };
    return st.pending;
  }
  function afterEvent(st) {
    st.pending = null; st.events++; st.reshuffled = -1;
    st.maxLoad = Math.max(st.maxLoad, hungCoats(st).length);
    if (st.events >= st.nextRes) {
      const R = st.spec.rows, C = st.spec.cols;
      st.nextRes += TUNE.reshuffle[0] + Math.floor(st.r() * (TUNE.reshuffle[1] - TUNE.reshuffle[0] + 1));
      const occ = row => [...Array(C).keys()].map(c => row * C + c).filter(h => st.hooks[h]);
      let rows = [...Array(R).keys()].filter(w => occ(w).length >= 2);
      const most = Math.max(0, ...rows.map(w => occ(w).length));
      rows = rows.filter(w => occ(w).length === most);
      if (rows.length) {
        const row = rows[Math.floor(st.rr() * rows.length)], hs = occ(row), coats = hs.map(h => st.hooks[h]);
        let perm;
        do { perm = coats.slice(); for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(st.rr() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; } }
        while (perm.every((c, i) => c === coats[i]));
        hs.forEach((h, i) => { st.hooks[h] = perm[i]; });
        st.budget += hs.length - 1; st.reshuffles++; st.reshuffled = row;
      }
    }
    if (st.arrived >= st.spec.guests && !hungCoats(st).some(c => !c.stay)) st.done = true;
  }
  function hang(st, h) {
    const p = st.pending;
    if (!p || p.type !== 'hang' || st.hooks[h]) return false;
    st.hooks[h] = p.coat; st.hung.push([Math.floor(h / st.spec.cols), p.coat.f]);
    afterEvent(st);
    return true;
  }
  function retrieve(st, h) {   // Fetch: { ok } or { ok: false, coat } (the door shows what it holds)
    const p = st.pending, c = st.hooks[h];
    if (!p || p.type !== 'ticket' || !c) return null;
    if (c === p.coat) { st.ages.push(st.events - c.born); st.hooks[h] = null; st.served++; afterEvent(st); return { ok: true }; }
    if (++st.complaints >= 3) st.lost = true;
    return { ok: false, coat: c };
  }
  function peek(st, h) { if (st.peeks >= st.budget || !st.hooks[h]) return null; st.peeks++; return st.hooks[h]; }
  // Share of coats hung in a row that match that row's most common value of its best feature (0-100).
  function purity(st) {
    const rows = new Map();
    for (const [w, f] of st.hung) { if (!rows.has(w)) rows.set(w, []); rows.get(w).push(f); }
    let good = 0, all = 0;
    for (const fs of rows.values()) {
      all += fs.length;
      good += Math.max(...[0, 1, 2].map(k => { const n = [0, 0, 0, 0]; fs.forEach(f => { if (f[k] >= 0) n[f[k]]++; }); return Math.max(...n); }));
    }
    return all ? Math.round(100 * good / all) : 100;
  }
  // § end sim


  // § words: the gallery fills {tap} in the manifest; the game does its own.
  const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const words = s => s.replace(/\{Tap\}/g, COARSE ? 'Tap' : 'Click').replace(/\{tap\}/g, COARSE ? 'tap' : 'click')
    .replace(/\{Hold\}/g, COARSE ? 'Hold' : 'Click and hold').replace(/\{hold\}/g, COARSE ? 'hold' : 'click and hold');
  // Colour-blind-safe hues (Okabe-Ito family, spread in lightness); every ticket also says the word.
  const COLOURS = [['red', '#e0603a'], ['blue', '#3f8fe0'], ['yellow', '#ecd34a'], ['pink', '#d27fb4']];
  const PATTERNS = ['plain', 'striped', 'dotted', 'checked'];
  const PINS = [['★', 'star'], ['☾', 'moon'], ['♥', 'heart'], ['■', 'square']];
  const featWord = (f, v, short) => f === 0 ? COLOURS[v][0] : f === 1 ? PATTERNS[v] : (short ? '' : PINS[v][0] + ' ') + PINS[v][1] + ' pin';
  const describe = c => COLOURS[c.f[0]][0] + ' ' + PATTERNS[c.f[1]] + ' coat' + (c.f[2] >= 0 ? ' with a ' + featWord(2, c.f[2]) : '');
  const RULE_TEXT = { colour: 'Colour tickets: guests name the colour', any: 'Any feature: colour, pattern or pin',
    look: 'Look-alikes: the ticket names the difference', coach: 'Coach party: a run of one colour',
    reshuffle: "Manager's reshuffle: a row gets reordered", friends: "Friends: ⇄ tickets name the friend's coat",
    pair: 'Two-feature tickets: both must match', regulars: 'Regulars: some coats stay overnight' };
  const SHORT = { look: 'Look-alikes', coach: 'Coach party', reshuffle: 'Reshuffle', friends: 'Friends', pair: 'Two-feature', regulars: 'Regulars' };
  const RULE_BITS = { colour: 1, look: 2, coach: 4, reshuffle: 8, friends: 16, pair: 32, regulars: 64 };
  const rowName = w => String.fromCharCode(65 + w);

  // § messaging: achievements, results, pause, bests from the gallery.
  const embedded = () => window.parent !== window;
  const unlocked = new Set();
  function unlock(id) {
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (embedded()) window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
  }
  let paused = false, bestShown = 0;
  window.addEventListener('message', evt => {
    const d = evt.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'arcade:pause') { paused = true; endPress(true); }
    if (d.type === 'arcade:resume') paused = false;
    if (d.type === 'arcade:best' && d.bests && typeof d.bests === 'object') {
      const b = Number(d.bests.main); if (b > 0 && b < 1e5) { bestShown = Math.round(b); renderHUD(); }
    }
  });

  // § daily: ?daily=YYYY-MM-DD is the arcade's Daily Challenge (docs/daily.md): one seeded run, the same for everyone that day.
  const DAILY = (/[?&]daily=(\d{4}-\d\d-\d\d)(?:&|$)/.exec(location.search) || [])[1] || '';
  const dailySeed = () => { let h = 0x811c9dc5; for (const ch of GAME_ID + ':' + DAILY) h = Math.imul(h ^ ch.charCodeAt(0), 0x01000193) >>> 0; return h; };
  function postFinal(run, score) {
    if (DAILY && embedded()) window.parent.postMessage({ type: 'arcade:final', game: GAME_ID, daily: DAILY, run: run, score: score }, '*');
  }

  // § state: the run (coats returned, free retries, regulars) and the shift on the hooks.
  let run, st, phase, lastCoat, counts, shiftMs, endT, flash, rattle, sharp, peekView, carryNote;
  function newRun() {
    // A daily run skips the campaign: Endless shifts from the day's seed.
    run = { id: Math.random().toString(36).slice(2, 10) || 'run', seed: DAILY ? dailySeed() % 1e6 : (Math.random() * 1e6) >>> 0, idx: DAILY ? CAMPAIGN.length : 0, attempt: 1,
      coats: 0, free: CAMPAIGN.map(() => true), carry: [], bonus: 0, over: false, lastWon: false };
    startShift();
  }
  const inCampaign = () => run.idx < CAMPAIGN.length;
  function startShift() {
    const spec = inCampaign() ? CAMPAIGN[run.idx] : endlessSpec(run.idx - CAMPAIGN.length, run.seed);
    st = newShift(spec, (run.seed + run.idx * 7919 + run.attempt * 104729) >>> 0, run.carry, run.bonus);
    lastCoat = st.hooks.slice();
    carryNote = run.carry.length > 0;
    phase = 'play'; shiftMs = 0; endT = 0; flash = null; rattle = null; sharp = null; peekView = null;
    counts = { actions: 0, cancels: 0, think: [], lastAt: 0 };
    cursor = 0; press = null;
    layout();
    next(st);
    $('rule').textContent = (inCampaign() ? `Shift ${run.idx + 1}/${CAMPAIGN.length} · ` : DAILY ? 'Daily · ' : '') + ruleLine(spec);
    prompt('');
    renderHUD();
  }
  function ruleLine(spec) {
    if (spec.endless) return spec.name + ': ' + spec.rules.map(r => SHORT[r]).join(' + ');
    if (!spec.rules.length) return RULE_TEXT.any;
    return spec.rules.length === 1 ? RULE_TEXT[spec.rules[0]] : spec.rules.length > 3 ? 'All rules at once' : spec.rules.map(r => SHORT[r]).join(' + ');
  }

  // § actions: hang (drag), Fetch (tap), peek (hold).
  function act() {
    counts.actions++;
    counts.think.push((shiftMs - counts.lastAt) / 1000); counts.lastAt = shiftMs;
  }
  function doHang(h) {
    if (phase !== 'play' || !st.pending || st.pending.type !== 'hang') return;
    if (st.hooks[h]) { say('That hook is taken. Drag the coat onto a free one.'); return; }
    const coat = st.pending.coat;
    if (!hang(st, h)) return;
    act(); lastCoat[h] = coat;
    after('');
  }
  function doFetch(h) {
    if (phase !== 'play' || !st.pending) return;
    if (st.pending.type === 'hang') { say('<b>Hang this coat first:</b> drag it onto a free hook.'); return; }
    const c = st.hooks[h];
    if (!c) return;
    const busy = st.hooks.filter(Boolean).length >= 10;
    const res = retrieve(st, h);
    if (!res) return;
    act();
    flash = { h, coat: c, t: 0, ok: res.ok };
    if (res.ok) {
      run.coats++;
      if (busy) unlock('full-house');
      if (run.coats >= 100) unlock('night-porter');
      if (sharp && sharp.ids.delete(c.id) && !sharp.ids.size) { if (st.peeks - sharp.peeks0 <= 1) unlock('sharp-eye'); sharp = null; }
      after('<span class="win">Thank you!</span> ');
      return;
    }
    if (st.lost) { endShift(false); return; }

    }
    if (g.dead) return;
    if (!g.key && g.t < TAP_MS) { doFetch(g.door); return; }
    counts.cancels++;
    say(g.key ? 'Hold P a little longer to peek.' : words('Too long for a {tap}, too short to peek: {hold} until the ring closes.'));
  }
  canvas.addEventListener('pointerup', () => endPress(false));
  canvas.addEventListener('pointercancel', () => endPress(true));
  window.addEventListener('keydown', e => {
    if (locked() || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (phase === 'over') { if (k === 'Enter' || k === ' ') { advance(); e.preventDefault(); } return; }
    const go = i => { kbd = true; cursor = Math.max(0, Math.min(st.hooks.length - 1, i)); };
    const C = st.spec.cols;
    if (k === 'ArrowLeft') go(cursor % C ? cursor - 1 : cursor); else if (k === 'ArrowRight') go(cursor % C < C - 1 ? cursor + 1 : cursor);
    else if (k === 'ArrowUp') go(cursor - C >= 0 ? cursor - C : cursor); else if (k === 'ArrowDown') go(cursor + C < st.hooks.length ? cursor + C : cursor);
    else if (k === 'Enter' || k === ' ') { kbd = true; if (st.pending && st.pending.type === 'hang') doHang(cursor); else doFetch(cursor); }
    else if (k === 'p' || k === 'P') { kbd = true; if (!e.repeat && !press && st.hooks[cursor]) press = { door: cursor, key: true, t: 0, peeking: false, dead: false }; }
    else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', e => { if ((e.key === 'p' || e.key === 'P') && press && press.key) endPress(false); });

  // § clock: animation and unpaused shift time (telemetry only; no rule reads it)
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (!paused && st) {
      if (phase === 'play') shiftMs += dt;
      if (phase === 'recap' && (endT += dt) >= Math.max(RECAP_MS, END_LOCK_MS)) phase = 'over';
      if (flash && (flash.t += dt) >= SHOW_MS) flash = null;
      if (rattle && (rattle.t += dt) >= 900) rattle = null;
      if (press && press.door >= 0 && !press.dead && !press.peeking && (press.t += dt) >= HOLD_MS) {
        if (phase === 'play' && startPeek(press.door)) press.peeking = true; else press.dead = true;
      }
    }
    draw(now);
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => { layout(); }).observe(wrap);
  window.addEventListener('resize', layout);
  // read-only peek for scripts/ tests (screenshots, playthroughs)
  window.__cc = () => ({ st, run, phase, G, cell, jump: i => { run.idx = i; run.attempt = 1; run.carry = []; run.bonus = 0; startShift(); } });
  newRun();
  requestAnimationFrame(frame);
})();
// § a11y label
// The canvas label names the verbs, with the word for this device.
{
  const fine = window.matchMedia('(pointer: fine)').matches;
  const t = fine ? 'click' : 'tap', h = fine ? 'click and hold' : 'hold';
  document.getElementById('board').setAttribute('aria-label', `Coat Check: drag each coat onto a hook, ${t} the door that holds a guest's coat, ${h} a door to peek. Keys: arrows pick a hook, Enter hangs the coat or opens the door, hold P to peek, Enter for the next shift.`);
}
</script>
