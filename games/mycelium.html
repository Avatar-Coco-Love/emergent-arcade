<!DOCTYPE html>
<html lang="en">
<head>
<script>
// § crash report: uncaught errors go to the arcade's telemetry (docs/telemetry.md, "Errors").
(function () {
  var sent = 0;
  function report(message, line, col) {
    if (window.parent === window || sent++ >= 3) return;
    try {
      window.parent.postMessage({ type: 'arcade:error', game: 'mycelium', message: String(message).slice(0, 300), line: line | 0, col: col | 0 }, '*');
    } catch (_) {}
  }
  window.addEventListener('error', function (e) { report(e.message, e.lineno, e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled rejection: ' + (r && r.message ? r.message : r), 0, 0);
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mycelium</title>
<style>
  :root {
    --bg: #17110c;
    --panel: #2b2018;
    --text: #f3ead2;
    --muted: #b9a993;
    --accent: #e8b04f;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given; the soil scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
    gap: 6px;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Messages get their own strip, never drawn over the soil (findings: Rail Yard). */
  #msg {
    flex: none; margin: 0; min-height: 2.6em; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 0.85rem; line-height: 1.3; color: var(--text);
  }
  #msg.warn { color: #ffb48a; font-weight: 600; }
  #field { flex: 1; min-height: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  #soil { display: block; width: 100%; height: 100%; touch-action: none; border-radius: 10px; }
  #endCard {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    width: min(88%, 310px); padding: 16px; border-radius: 12px;
    background: rgba(36, 26, 18, 0.96); border: 1px solid #6a5238; text-align: center;
  }
  #endCard[hidden] { display: none; }
  #endCard h2 { margin: 0 0 6px; font-size: 1.25rem; }
  #endCard h2.won { color: #f2d58a; }
  #endCard h2.lost { color: #ff9a8a; }
  #endCard p { margin: 0 0 4px; color: #e6dac4; font-size: 0.88rem; }
  #endCard button { margin-top: 10px; width: 100%; font-weight: 600; }
  #endCard button:disabled { opacity: 0.4; }
  #endCard button[hidden] { display: none; }
  .bar {
    flex: none; display: flex; align-items: center; justify-content: center;
    gap: 6px 12px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted);
  }
  .bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .meter {
    display: inline-block; width: 56px; height: 8px; border-radius: 4px;
    background: #3a2c20; vertical-align: middle; overflow: hidden;
  }
  .meter span { display: block; height: 100%; }
  #poolFill { background: var(--accent); }
  #frostFill { background: #9cc8e8; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid #6a5238;
    border-radius: 6px; padding: 7px 12px; font-size: 0.85rem; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <p id="msg" aria-hidden="true"></p>
  <p id="say" class="sr" role="status" aria-live="polite"></p>
  <div id="field">
    <div id="stage">
      <canvas id="soil" role="img" aria-label="Mycelium. Drag from a knot to grow a thread, tap or click a knot to pulse nutrient to it, hold a knot to cut the thread there."></canvas>
      <div id="endCard" hidden>
        <h2 id="endTitle"></h2>
        <p id="endDetail"></p>
        <p id="endAch"></p>
        <button id="mainBtn"></button>
        <button id="altBtn">New run</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <span><b id="hudSeason"></b></span>
    <span>Mushrooms <b id="hudFruit"></b></span>
    <span>Pool <span class="meter"><span id="poolFill"></span></span> <b id="hudPool"></b> <span id="hudUpkeep"></span></span>
    <span>Frost <span class="meter"><span id="frostFill"></span></span></span>
    <span>Score <b id="hudScore"></b><span id="hudBest"></span></span>
    <button id="resetBtn">New run</button>
  </div>

<script>
(function() {
  // § constants
  const GAME_ID = 'mycelium';
  const W = 400, H = 540;            // game units (canvas scales to fit)
  const S = 36, SY = 31, MX = 20, MY = 22, ROWS = 17; // hex lattice of knot sites
  const JIT = 4;                     // site jitter (px)

  // Sap and the pool (the shared state)
  const K = 3;                       // knots within K threads of the spore or a feeding patch are fed
  const DECAY = 1 / 12;              // sap lost per s by an unfed knot (12 s from full to dead)
  const REFILL = 0.6;                // sap gained per s by a fed knot
  const HUNGER_T = 1.5;              // s between tips withering while the pool can't pay upkeep
  const ROT = 0.4;                   // sap lost per s by a rotting knot, fed or not
  const SAPN = 2;                    // nutrient to refill one knot from empty
  const UPKEEP = 0.12;               // nutrient per knot per s
  const DRY_U = 4;                   // upkeep multiplier in dry soil
  const GROW_C = 3, GROW_V = 2.5;    // nutrient per new knot, knots grown per s
  const PULSE = 20;                  // nutrient a pulse carries out of the pool
  const FRUIT = 30;                  // nutrient that grows one mushroom
  const POOL0 = 40, POOL_MAX = 150;
  const FOOD = 1.4;                    // scales every patch's food
  const INCOME = 2;                  // nutrient per s from a connected patch
  const SPORE_INC = 1.0;             // the spore's own trickle into the pool, per s
  const RETRY_GIFT = 15;             // extra nutrient for each retry of a season
  const SPRING = 25;                 // nutrient added to the pool at the start of each season after the first
  const RIVAL_T = 1.4, RIVAL_EAT = 4, RIVAL_WAIT = 5; // rival mould: s per knot, food eaten per s on a patch, s it rests after a cut
  const FROST_LEFT = 8;              // s left once every patch is used up
  const UP_END = 1.7;                // upkeep multiplier the endless seasons start from (the campaign ramps up to it)
  const ENDLESS_UP = 0.08, ENDLESS_FOOD = 0.93; // per endless season: upkeep up, food down

  // Input
  const HOLD_MS = 450, DRAG_PX = 12, HIT_R = 22, TAP_MS = 450;
  const END_LOCK_MS = 1000;
  const STEP = 1 / 60;
  const FADE = 0.35;                 // sap below this: the knot is fading (drawn ringed, spoken)

  // § seasons
  // patches: [count, food, nearest, farthest] (threads from the spore, through open soil).
  // log: one big patch [food, income, near, far]. late: patches that appear mid-season [at s, food].
  // rivalWait: s before the first rival knot grows (default 4). up: upkeep multiplier (default 1).
  const SEASONS = [
    { name: 'First spores', T: 60, goal: 2, patches: [[2, 50, 3, 4]] },
    { name: 'Leaf litter', T: 70, goal: 3, patches: [[4, 45, 3, 6]] },
    { name: 'Old log', T: 75, goal: 3, patches: [[1, 60, 3, 4]], log: [170, 3, 6, 8] },
    { name: 'Dry spell', T: 75, goal: 3, patches: [[5, 60, 3, 6]], dry: 1 },
    { name: 'Rival mould', T: 80, goal: 4, patches: [[5, 60, 3, 6]], rivals: 1, rivalWait: 10, up: 1.3 },
    { name: 'Stony ground', T: 80, goal: 5, patches: [[4, 55, 3, 8]], rocks: 25, late: [[25, 50], [45, 50]], up: 1.7 },
    { name: 'Two moulds', T: 80, goal: 5, patches: [[6, 55, 4, 8]], rivals: 2, up: 1.7 },
    { name: 'First frost', T: 80, goal: 6, patches: [[6, 75, 5, 9]], dry: 1, rivals: 1, rocks: 15, up: 1.7 },
  ];
  function seasonSpec(n) {
    if (n <= SEASONS.length) return Object.assign({ up: 1, food: 1 }, SEASONS[n - 1]);
    const e = n - SEASONS.length;
    const twists = ['dry', 'rivals', 'rocks', 'late'].sort(() => Math.random() - 0.5).slice(0, 2);
    const sp = { name: 'Endless ' + e, T: 80, goal: 6 + e, patches: [[6, 55, 4, 9]],
      up: UP_END * Math.pow(1 + ENDLESS_UP, e), food: Math.pow(ENDLESS_FOOD, e) };
    for (const tw of twists) {
      if (tw === 'dry') sp.dry = 2;
      if (tw === 'rivals') sp.rivals = e >= 4 ? 2 : 1;
      if (tw === 'rocks') sp.rocks = 25;
      if (tw === 'late') sp.late = [[25, 50], [45, 50]];
    }
    return sp;
  }

  const canvas = document.getElementById('soil');
  const ctx = canvas.getContext('2d');
  const msgEl = document.getElementById('msg');
  const touchy = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const TAP = touchy ? 'Tap' : 'Click', HOLD = touchy ? 'Hold' : 'Click and hold';
  // Reduced motion: decoration (the spore's glow, blinking, effect rings, a pulse's run) keeps still
  // on its own clock; the simulation and its Math.random calls don't change.
  const rmq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  const still = () => !!(rmq && rmq.matches);

  // Achievements: announced to the Emergent Arcade gallery when embedded.
  const unlocked = new Set();
  function unlock(id) {
    runEarned.add(id); roundEarned.add(id);
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
    }
  }

  // Season results for play telemetry (docs/telemetry.md); keys in docs/games/mycelium.md.
  function report(won) {
    if (window.parent === window) return;
    const r1 = v => Math.round(v * 10) / 10;
    const msg = { type: 'arcade:result', game: GAME_ID, outcome: won ? 'win' : 'loss',
      time: r1(t), level: season, run: runId, attempt, score: total,
      stats: { fruit: mushrooms, goal: spec.goal, pulses: st.pulses, spilled: r1(st.spilled), grown: st.grown,
        pruned: st.pruned, starved: st.starved, withered: st.withered, rotted: st.rotted, hungry_s: r1(st.hungryS), pool: r1(pool), knots: countMine(),
        rival_cut: st.rivalCut, first_input: r1(st.firstInput) } };
    if (!won) msg.reason = st.hungryS > 10 ? 'hunger' : 'frost';
    window.parent.postMessage(msg, '*');
  }

  const field = document.getElementById('field');
  const stage = document.getElementById('stage');
  let cssW = W;                       // the soil's CSS width: canvas text is sized from it (fs)
  const fs = n => n * Math.max(1, W / cssW);
  function fitSoil() {
    const scale = Math.min(field.clientWidth / W, field.clientHeight / H);
    const w = Math.max(80, Math.floor(W * scale)), h = Math.max(110, Math.floor(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cssW = w;
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  new ResizeObserver(fitSoil).observe(field);
  window.addEventListener('resize', fitSoil);
  fitSoil();

  let paused = false, best = 0;
  window.addEventListener('message', evt => {
    const d = evt.data;
    if (!d) return;
    if (d.type === 'arcade:pause') { paused = true; press = null; }
    if (d.type === 'arcade:resume') paused = false;
    if (d.type === 'arcade:best' && d.bests && typeof d.bests === 'object') {
      const b = Number(d.bests.main); if (b > 0 && b < 1e5) best = Math.round(b);
    }
  });

  const endCard = document.getElementById('endCard');
  const mainBtn = document.getElementById('mainBtn');
  const altBtn = document.getElementById('altBtn');

  // § state
  const P = [];                      // knot sites {x, y, nb: [indices]}
  let N = 0, core = 0;
  let own, par, sap, rot, conn, dc, dh, dry, patchAt, rpar, rown, head, nxt, queue, dcore;
  let patches = [], rivals = [], jobs = [], fx = [], decor = [];
  let frostEarly = false, endT = 0, hungerAcc = 0;
  let season, spec, t, pool, mushrooms, total, state, runId, attempt, snap, st, lockUntil = 0, tnow = 0, deco = 0;
  let hinted = {}, cursor = 0, kbFrom = -1;
  const runEarned = new Set(), roundEarned = new Set();

  function ri(n) { return Math.floor(Math.random() * n); }
  function buildLattice() {
    P.length = 0;
    for (let r = 0; r < ROWS; r++) {
      const odd = r % 2, cols = odd ? 10 : 11;
      for (let c = 0; c < cols; c++) {
        P.push({ x: MX + c * S + (odd ? S / 2 : 0) + (Math.random() * 2 - 1) * JIT,
          y: MY + r * SY + (Math.random() * 2 - 1) * JIT, nb: [] });
      }
    }
    N = P.length;
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      if (Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y) < S * 1.3) { P[i].nb.push(j); P[j].nb.push(i); }
    }
    own = new Int8Array(N);          // 0 open soil, 1 mine, 2 rival, 3 stone
    par = new Int16Array(N).fill(-1); sap = new Float32Array(N); rot = new Uint8Array(N);
    conn = new Uint8Array(N); dc = new Int16Array(N); dh = new Int16Array(N);
    dry = new Uint8Array(N); patchAt = new Int16Array(N).fill(-1);
    rpar = new Int16Array(N).fill(-1); rown = new Int8Array(N).fill(-1);
    head = new Int16Array(N); nxt = new Int16Array(N); queue = new Int16Array(N); dcore = new Int16Array(N);
    let bd = 1e9;
    P.forEach((p, i) => { const d = Math.hypot(p.x - W / 2, p.y - H / 2); if (d < bd) { bd = d; core = i; } });
    decor = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * H, 0.6 + Math.random() * 1.8]);
  }

  // § network
  // The network is a tree rooted at the spore: par[i] is the knot a thread
  // came from. Knots whose chain to the spore is cut are stranded.
  function topo() {
    head.fill(-1); conn.fill(0); dc.fill(-1); dh.fill(99);
    for (let i = 0; i < N; i++) if (own[i] === 1 && par[i] >= 0) { nxt[i] = head[par[i]]; head[par[i]] = i; }
    let qh = 0, qt = 0;
    conn[core] = 1; dc[core] = 0; queue[qt++] = core;
    while (qh < qt) {
      const u = queue[qh++];
      for (let c = head[u]; c >= 0; c = nxt[c]) { conn[c] = 1; dc[c] = dc[u] + 1; queue[qt++] = c; }
    }
    // Feed distance: threads to the spore or the nearest connected patch with food.
    qh = qt = 0;
    dh[core] = 0; queue[qt++] = core;
    for (const p of patches) if (p.on && p.food > 0 && own[p.i] === 1 && conn[p.i]) { dh[p.i] = 0; queue[qt++] = p.i; }
    while (qh < qt) {
      const u = queue[qh++];
      const visit = v => { if (v >= 0 && own[v] === 1 && conn[v] && dh[v] > dh[u] + 1) { dh[v] = dh[u] + 1; queue[qt++] = v; } };
      visit(par[u]);
      for (let c = head[u]; c >= 0; c = nxt[c]) visit(c);
    }
  }
  function countMine() { let n = 0; for (let i = 0; i < N; i++) if (own[i] === 1) n++; return n; }
  function subtree(i) { const out = [i]; for (let k = 0; k < out.length; k++) for (let c = head[out[k]]; c >= 0; c = nxt[c]) out.push(c); return out; }
  function pathToCore(i) { const out = []; for (let a = i; a >= 0; a = par[a]) out.push(a); return out.reverse(); }
  function upkeepOf(i) { return UPKEEP * spec.up * (dry[i] ? DRY_U : 1); }
  function upkeepRate() { let u = 0; for (let i = 0; i < N; i++) if (own[i] === 1 && conn[i] && i !== core) u += upkeepOf(i); return u; }

  // Shortest route through open soil from a knot of mine to a site (which may
  // be a stranded knot of mine: growing into it reconnects its branch).
  function route(from, to) {
    if (from === to || own[to] === 3 || own[to] === 2) return null;
    if (own[to] === 1 && conn[to]) return null;
    const prev = new Int16Array(N).fill(-2);
    prev[from] = -1;
    let qh = 0, qt = 0;
    queue[qt++] = from;
    while (qh < qt) {
      const u = queue[qh++];
      if (u === to) break;
      for (const v of P[u].nb) {
        if (prev[v] !== -2) continue;
        if (v !== to && own[v] !== 0) continue;
        prev[v] = u; queue[qt++] = v;
      }
    }
    if (prev[to] === -2) return null;
    const path = [];
    for (let a = to; a !== -1; a = prev[a]) path.push(a);
    return path.reverse();
  }

  // § verbs
  function grow(from, to) {
    if (state !== 'playing' || own[from] !== 1 || !conn[from]) return false;
    const path = route(from, to);
    if (!path) return false;
    touch();
    jobs = jobs.filter(j => j.path[j.path.length - 1] !== to);
    jobs.push({ path, k: 1, acc: 0 });
    if (jobs.length > 3) jobs.shift();
    return true;
  }
  function pulse(i) {
    if (state !== 'playing' || own[i] !== 1) return false;
    if (!conn[i]) { say('That branch is cut off: grow a thread into it to reconnect it.', 3); return false; }
    touch();
    const pk = Math.min(pool, PULSE);
    if (pk < 0.5) { say('The pool is empty: a pulse needs nutrient from it.', 3, true); return false; }
    pool -= pk; st.pulses++;
    let left = pk;
    const path = pathToCore(i);
    for (const a of path) {
      if (a === core || rot[a]) continue; // rot can't be fed: only a cut stops it
      const take = Math.min(left, (1 - sap[a]) * SAPN);
      sap[a] += take / SAPN; left -= take;
    }
    const p = patchAt[i] >= 0 ? patches[patchAt[i]] : null;
    if (p && p.on) {
      p.fruit += left;
      while (p.fruit >= FRUIT) {
        p.fruit -= FRUIT; p.caps++; mushrooms++; total++;
        unlock('first-flush');
        if (dc[i] >= 8) unlock('long-reach');
        if (mushrooms >= 12) unlock('fairy-ring');
        fx.push({ kind: 'pop', x: P[i].x, y: P[i].y, t: 0 });
        if (!hinted.score && mushrooms === 1) { hinted.score = 1; say(`A mushroom! Grow ${spec.goal} before the frost. Pulses that reach a patch feed its next one.`, 5); }
      }
    } else st.spilled += left;
    fx.push({ kind: 'surge', path: path.map(a => [P[a].x, P[a].y]), t: 0, spill: !(p && p.on) && left > 1 });
    return true;
  }
  function prune(i) {
    if (state !== 'playing') return false;
    if (own[i] === 2) { touch(); return cutRival(i); }
    if (i === core) { say('The spore can\'t be cut.', 2); return false; }
    if (own[i] !== 1) return false;
    if (par[i] < 0) { say('That branch is already cut off.', 2); return false; }
    touch();
    par[i] = -1; st.pruned++;
    fx.push({ kind: 'cut', x: P[i].x, y: P[i].y, t: 0 });
    topo();
    return true;
  }
  function cutRival(i) {
    const rv = rivals[rown[i]];
    if (!rv) return false;
    const gone = [i];
    if (i === rv.root) { gone.length = 0; for (let j = 0; j < N; j++) if (rown[j] === rown[i] && rpar[j] === i) gone.push(j); }
    let ateFood = false;
    for (let k = 0; k < gone.length; k++) {
      const a = gone[k];
      for (let j = 0; j < N; j++) if (own[j] === 2 && rpar[j] === a && rown[j] === rown[a]) gone.push(j);
    }
    for (const a of gone) {
      if (patchAt[a] >= 0 && patches[patchAt[a]].food > 0) ateFood = true;
      own[a] = 0; rpar[a] = -1; rown[a] = -1;
    }
    if (gone.length) { rv.acc = -RIVAL_WAIT; st.rivalCut++; fx.push({ kind: 'cut', x: P[i].x, y: P[i].y, t: 0 }); }
    if (ateFood) unlock('clean-cut');
    if (!gone.length) say('That is the mould\'s root: cut one of its threads.', 3);
    return gone.length > 0;
  }
  function touch() { if (st.firstInput < 0) st.firstInput = t; }

  // A knot that dies while attached rots the knot it grew from; a cut-off one withers harmlessly.
  function kill(i) {
    if (conn[i] && par[i] >= 0 && par[i] !== core && own[par[i]] === 1) {
      if (!rot[par[i]]) { rot[par[i]] = 1; st.rotted++; }
      if (!hinted.rot) { hinted.rot = 1; say(`Rot! A thread that starves while attached rots back toward the spore. ${HOLD} a rotting knot to cut it loose.`, 7, true); }
    }
    own[i] = 0; par[i] = -1; sap[i] = 0; rot[i] = 0;
    for (let j = 0; j < N; j++) if (own[j] === 1 && par[j] === i) par[j] = -1;
    fx.push({ kind: 'wither', x: P[i].x, y: P[i].y, t: 0 });
  }

  // § simulation
  function step(dt) {
    t += dt;
    for (const p of patches) if (!p.on && t >= p.at) {
      if (own[p.i] !== 0) relocate(p);
      p.on = true; fx.push({ kind: 'pop', x: P[p.i].x, y: P[p.i].y, t: 0 });
      if (!hinted.late) { hinted.late = 1; say('A fresh patch fell into the soil.', 3); }
    }
    // Growing threads extend one knot at a time, paid from the pool as they go.
    for (const j of jobs) {
      j.acc = Math.min(1.5, j.acc + GROW_V * dt);
      while (j.acc >= 1 && j.k < j.path.length) {
        const prev = j.path[j.k - 1], q = j.path[j.k];
        if (own[prev] !== 1 || !conn[prev]) { j.k = j.path.length; break; }
        if (pool < GROW_C) {
          if (!j.wait && !hinted.wait) { hinted.wait = 1; say('Growth waits for the pool: each new knot costs ' + GROW_C + '.', 4); }
          j.wait = true; break;
        }
        j.wait = false;
        if (own[q] === 0) {
          pool -= GROW_C; own[q] = 1; par[q] = prev; sap[q] = 1; conn[q] = 1; dc[q] = dc[prev] + 1; st.grown++;
        } else if (own[q] === 1 && !conn[q]) {
          pool -= GROW_C;
          let a = q, p = prev;
          while (a >= 0) { const nx = par[a]; par[a] = p; p = a; a = nx; }

    const need = upkeepRate() * dt;

  // A late patch whose site a thread took before it fell lands on the nearest open site instead.
  function relocate(p) {
    const d = bfsDist(i => i === p.i, () => true);
    let b = -1;
    for (let i = 0; i < N; i++) if (own[i] === 0 && patchAt[i] < 0 && P[i].nb.every(v => patchAt[v] < 0 || v === p.i) && (b < 0 || d[i] < d[b])) b = i;
    if (b < 0) return;

  function stepRivals(dt) {
    rivals.forEach((rv, r) => {

      if (rv.acc < RIVAL_T) return;
      rv.acc = 0;

  }

  // § run
  function newRun() {
    buildLattice();

    runEarned.clear();

  }
  function setupSeason() {

      if (own[i] === 1) sap[i] = 1;
      rot[i] = 0;
    }

    for (let pass = 0; pass < 2; pass++) {
      topo();
      for (let i = 0; i < N; i++) if (own[i] === 1 && i !== core && (!conn[i] || dc[i] > K)) { own[i] = 0; par[i] = -1; sap[i] = 0; }
    }
    topo();
    // Threads from the spore through open soil, and from my network.
    const dnet = bfsDist(i => own[i] === 1, () => true);
    const place = (food, lo, hi, inc, at) => {
      dcore.set(bfsDist(i => i === core, i => own[i] !== 3));
      const ok = i => own[i] === 0 && patchAt[i] < 0 && P[i].nb.every(v => patchAt[v] < 0) && dnet[i] >= 2 &&
        P[i].x > 30 && P[i].x < W - 30 && P[i].y > 30 && P[i].y < H - 30;
      for (let widen = 0; widen < 6; widen++) {
        const c = [];
        for (let i = 0; i < N; i++) if (ok(i) && dcore[i] >= lo - widen && dcore[i] <= hi + widen) c.push(i);
        if (c.length) {
          const i = c[ri(c.length)];
          patchAt[i] = patches.length;
          patches.push({ i, food: food * FOOD * spec.food, max: food * FOOD * spec.food, inc, fruit: 0, caps: 0, on: at == null, at: at || 0, big: inc > INCOME });

        if (own[i] === 0 && Math.hypot(P[i].x - P[core].x, P[i].y - P[core].y) > S * 2.2) { own[i] = 3; n++; }
      }
    }
    if (spec.log) place(spec.log[0], spec.log[2], spec.log[3], spec.log[1]);
    for (const [n, food, lo, hi] of spec.patches) for (let k = 0; k < n; k++) place(food, lo, hi, INCOME);
    if (spec.late) for (const [at, food] of spec.late) place(food, 3, 8, INCOME, at);
    if (spec.dry) {
      // Dry soil lands on the network you carried over (or near the spore in a fresh run).
      const mine = []; for (let i = 0; i < N; i++) if (own[i] === 1 && i !== core && dc[i] >= 2) mine.push(i);
      for (let k = 0; k < spec.dry; k++) {
        const c = mine.length && Math.random() < 0.7 ? P[mine[ri(mine.length)]] : { x: 60 + Math.random() * (W - 120), y: 60 + Math.random() * (H - 120) };
        const r = 62;

  function bfsDist(src, pass) {

  }

  }
  function startPlay() {

    st = { pulses: 0, spilled: 0, grown: 0, pruned: 0, starved: 0, withered: 0, rotted: 0, hungryS: 0, rivalCut: 0, firstInput: -1 };
    roundEarned.clear();
    seen = null;
    state = 'playing';
    endCard.hidden = true;
    const tw = [];
    if (spec.dry) tw.push(`dry soil (pale): threads there cost ${DRY_U}× upkeep`);
    if (spec.rivals) tw.push(spec.rivals > 1 ? 'two rival moulds' : 'a rival mould');
    if (spec.rocks) tw.push('stones in the soil');
    if (spec.late) tw.push('fresh patches fall mid-season');
    if (spec.log) tw.push('an old log, far out');
    if (spec.up > 1.05) tw.push(`upkeep ×${spec.up.toFixed(1)}: cut what no longer feeds you`);
    if (season > 1) say(`Season ${season}: ${spec.name}. Grow ${spec.goal} mushrooms${tw.length ? '; ' + tw.join(', ') : ''}.`, 6);

  }
  function retrySeason() {
    own.set(snap.own); rot.set(snap.rot); par.set(snap.par); sap.set(snap.sap); patchAt.set(snap.patchAt); dry.set(snap.dry); rown.set(snap.rown);
    rpar.set(snap.rpar);

  function nextSeason() {

  }
  function endSeason() {

    jobs = [];
    if (won) {
      if (season >= 4 && st.starved === 0) unlock('lean-season');
      if (season >= SEASONS.length) unlock('old-growth');

    report(won);
    showCard(won);

  }

  const NAMES = { 'first-flush': 'First Flush', 'long-reach': 'Long Reach', 'clean-cut': 'Clean Cut',
    'lean-season': 'Lean Season', 'fairy-ring': 'Fairy Ring', 'old-growth': 'Old Growth' };
  function showCard(won) {
    const el = document.getElementById('endTitle');
    el.textContent = won ? `Season ${season} fruited` : 'Frost came too soon';
    el.className = won ? 'won' : 'lost';
    const why = st.hungryS > 10 ? `The pool ran dry for ${Math.round(st.hungryS)} s: the network ate its own tips.` :
      `${mushrooms} of ${spec.goal} mushrooms by the frost.`;
    document.getElementById('endDetail').textContent = won
      ? `${mushrooms} mushrooms (goal ${spec.goal}). Score ${total}. Your network and ${Math.round(pool)} nutrient carry over.`
      : `${why} Score ${total}.`;
    const got = [...roundEarned].map(id => NAMES[id]);
    document.getElementById('endAch').textContent = got.length ? 'Earned: ' + got.join(', ') : '';
    mainBtn.textContent = won ? 'Next season' : `Retry season ${season}`;
    altBtn.hidden = won;
    endCard.hidden = false;
    lockUntil = performance.now() + END_LOCK_MS;
    mainBtn.disabled = altBtn.disabled = true;
    setTimeout(() => { mainBtn.disabled = altBtn.disabled = false; }, END_LOCK_MS);
  }

  // § messages
  let msgUntil = 0, msgMin = 0, queued = null;
  function say(text, secs, warn) {
    if (tnow < msgMin && !warn) { queued = [text, secs]; return; }
    msgEl.textContent = text;
    speak(text);
    msgEl.className = warn ? 'warn' : '';
    msgMin = tnow + Math.min(secs, 3);
    msgUntil = tnow + secs;
  }
  function tickMsg() {
    if (queued && tnow >= msgMin) { const q = queued; queued = null; say(q[0], q[1]); }
    else if (msgEl.textContent && tnow >= msgUntil) msgEl.textContent = '';
  }
  function hud() {
    document.getElementById('hudSeason').textContent = `Season ${season}`;
    document.getElementById('hudFruit').textContent = `${mushrooms}/${spec.goal}`;
    document.getElementById('hudPool').textContent = Math.floor(pool);
    const u = state === 'playing' ? upkeepRate() : 0;
    document.getElementById('hudUpkeep').textContent = u >= 0.05 ? `−${u.toFixed(1)}/s` : '';
    document.getElementById('poolFill').style.width = (100 * pool / POOL_MAX).toFixed(0) + '%';
    document.getElementById('frostFill').style.width = Math.min(100, 100 * t / endT).toFixed(0) + '%';
    document.getElementById('hudScore').textContent = total;
    document.getElementById('hudBest').textContent = best ? ` (best ${best})` : '';
  }

  // § drawing
  function sapColor(s, a) {

  }

        const blink = !still() && Math.sin(deco * 10) > 0;
        ctx.fillStyle = blink ? '#d9774a' : '#2a1608'; ctx.beginPath(); ctx.arc(P[i].x, P[i].y, 5.5, 0, 7); ctx.fill();
        ctx.strokeStyle = '#d9774a'; ctx.lineWidth = 2.2; ctx.stroke();
        continue;
      }
      ctx.fillStyle = conn[i] ? knotColor(s) : sapColor(s, 0.5);
      ctx.beginPath(); ctx.arc(P[i].x, P[i].y, r, 0, 7); ctx.fill();
    }
    // A starving branch would also lose this one: also draw its own par for stranded roots
    for (let i = 0; i < N; i++) if (own[i] === 1 && i !== core && par[i] < 0) {
      ctx.strokeStyle = 'rgba(255,138,92,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(P[i].x, P[i].y, 8, 0, 7); ctx.stroke();
    }
    // The spore
    const c = P[core], gl = 14 + Math.sin(deco * 2.5) * 2;
    const g = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, gl * 1.8);
    g.addColorStop(0, 'rgba(255,240,200,0.9)'); g.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, gl * 1.8, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, 7); ctx.fill();
    // Effects. Reduced motion: a pulse's path lights up whole, rings don't grow or fade.
    const calm = still();
    for (const e of fx) {
      if (e.kind === 'surge') {
        const pts = e.path, n = pts.length - 1, u = Math.min(1, e.t / 0.45) * n, k = Math.min(n - 1, Math.floor(u)), fr = u - k;
        if (n < 1) continue;
        if (calm) {
          ctx.strokeStyle = 'rgba(255,214,120,0.8)'; ctx.lineWidth = 3;
          ctx.beginPath(); pts.forEach(([x, y], m) => m ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
          if (e.spill) { ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pts[n][0], pts[n][1], 12, 0, 7); ctx.stroke(); }
          continue;
        }
        const x = pts[k][0] + (pts[k + 1][0] - pts[k][0]) * fr, y = pts[k][1] + (pts[k + 1][1] - pts[k][1]) * fr;
        ctx.fillStyle = `rgba(255,214,120,${1 - Math.max(0, e.t - 0.45) * 3})`;
        ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();
        if (e.spill && e.t > 0.45) {
          ctx.strokeStyle = `rgba(255,214,120,${1 - (e.t - 0.45) * 3})`; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y, 6 + (e.t - 0.45) * 50, 0, 7); ctx.stroke();
        }
      } else {
        const a = calm ? 0.85 : 1 - e.t / 0.7;
        ctx.strokeStyle = e.kind === 'pop' ? `rgba(242,213,138,${a})` : e.kind === 'cut' ? `rgba(255,255,255,${a})` : `rgba(255,120,90,${a})`;
        ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, calm ? 12 : 6 + e.t * 30, 0, 7); ctx.stroke();
      }
    }
    // Input feedback: the grow preview (drag, or a knot marked with Enter), the hold ring, the keyboard cursor.
    if (press && press.mode === 'drag' && press.route) drawPreview(press.route);
    else if (kbUsed && kbFrom >= 0 && state === 'playing') { const r = route(kbFrom, cursor); if (r) drawPreview(r); }
    if (press && press.mode === 'pending' && press.node >= 0) {
      const u = Math.min(1, (performance.now() - press.t0) / HOLD_MS);
      if (u > 0.2) {
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(P[press.node].x, P[press.node].y, 15, -Math.PI / 2, -Math.PI / 2 + u * 2 * Math.PI); ctx.stroke();
      }
    }
    if (kbUsed) {
      ctx.strokeStyle = '#9cc8e8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P[cursor].x, P[cursor].y, 13, 0, 7); ctx.stroke();
      if (kbFrom >= 0) { ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(P[kbFrom].x, P[kbFrom].y, 16, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    }
  }
  function drawPreview(r) {
    const cost = (r.length - 1) * GROW_C, ok = cost <= pool;
    ctx.strokeStyle = ok ? 'rgba(243,234,210,0.8)' : 'rgba(255,140,110,0.85)';
    ctx.setLineDash(ok ? [5, 4] : [2, 4]); ctx.lineWidth = 2.5;
    ctx.beginPath(); r.forEach((a, k) => k ? ctx.lineTo(P[a].x, P[a].y) : ctx.moveTo(P[a].x, P[a].y)); ctx.stroke();
    ctx.setLineDash([]);
    const e = P[r[r.length - 1]];
    label(ok ? String(cost) : `${cost} > pool ${Math.floor(pool)}`, e.x, e.y - 16, ok ? '#f3ead2' : '#ff9a7a');
  }
  // Canvas text: 12 CSS px or more at any width, on a dark backing (it sits over soil and threads).
  function label(text, x, y, color) {
    const f = fs(12);
    ctx.font = `bold ${f}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width + f * 0.7, h = f * 1.45;
    x = Math.max(w / 2, Math.min(W - w / 2, x)); y = Math.max(h / 2, y);
    ctx.fillStyle = 'rgba(16,11,7,0.9)'; ctx.fillRect(x - w / 2, y - h / 2, w, h);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
    ctx.textBaseline = 'alphabetic';
  }

  // § input
  // Press on a knot of mine: move away to grow (drag), let go quickly to
  // pulse (tap), keep still for HOLD_MS to cut the thread into it (hold).
  // Rival knots can only be cut. Keys call the same verbs (doGrow, doPulse, prune via checkHold).
  let press = null, kbUsed = false;
  function toSoil(evt) {
    const r = canvas.getBoundingClientRect();
    return [(evt.clientX - r.left) * W / r.width, (evt.clientY - r.top) * H / r.height];
  }
  function nearest(x, y, test, maxD) {
    let b = -1, bd = maxD;
    for (let i = 0; i < N; i++) if (test(i)) { const d = Math.hypot(P[i].x - x, P[i].y - y); if (d < bd) { bd = d; b = i; } }
    return b;
  }
  canvas.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    if (state !== 'playing' || paused || press) return;
    canvas.setPointerCapture(evt.pointerId);
    const p = toSoil(evt);
    const node = nearest(p[0], p[1], i => own[i] === 1 || own[i] === 2, HIT_R);
    press = { id: evt.pointerId, start: p, last: p, t0: performance.now(), node, mode: 'pending', route: null };
  });
  canvas.addEventListener('pointermove', evt => {
    const a = press;
    if (!a || evt.pointerId !== a.id || state !== 'playing' || paused) return;
    a.last = toSoil(evt);
    if (a.mode === 'pending' && Math.hypot(a.last[0] - a.start[0], a.last[1] - a.start[1]) >= DRAG_PX) {
      a.mode = a.node >= 0 && own[a.node] === 1 && conn[a.node] ? 'drag' : 'none';
      if (a.mode === 'none' && !hinted.dragHelp) { hinted.dragHelp = 1; say('Start a drag on a knot of your network (the spore at first) to grow from it.', 4); }
    }
    if (a.mode === 'drag') {
      const to = nearest(a.last[0], a.last[1], i => own[i] === 0 || (own[i] === 1 && !conn[i]), S);
      a.route = to >= 0 ? route(a.node, to) : null;
    }
  });
  canvas.addEventListener('pointerup', evt => {
    const a = press;
    if (!a || evt.pointerId !== a.id) return;
    press = null;
    if (state !== 'playing' || paused) return;
    if (a.mode === 'drag') {
      if (a.route) doGrow(a.node, a.route[a.route.length - 1]);
    } else if (a.mode === 'pending' && a.node >= 0 && performance.now() - a.t0 < TAP_MS) {
      if (own[a.node] === 1) doPulse(a.node);
      else if (!hinted.rivalTap) { hinted.rivalTap = 1; say(`${HOLD} a rival knot to cut it.`, 3); }
    }
  });
  canvas.addEventListener('pointercancel', evt => { if (press && evt.pointerId === press.id) press = null; });
  function checkHold() {
    const a = press;
    if (a && a.mode === 'pending' && a.node >= 0 && performance.now() - a.t0 >= HOLD_MS) {
      a.mode = 'done';
      doPrune(a.node);
    }
  }

  // Keyboard: arrows move a cursor between sites; Enter marks a knot to grow
  // from, then Enter again grows to the cursor; Space pulses; hold X cuts (the
  // pointer's own hold, same HOLD_MS); N next patch, H the spore, I status.
  function moveCursor(dx, dy) {
    let b = -1, bs = 1e9;
    for (const v of P[cursor].nb) {
      const ux = P[v].x - P[cursor].x, uy = P[v].y - P[cursor].y, d = Math.hypot(ux, uy);
      const along = (ux * dx + uy * dy) / d;
      if (along < 0.45) continue;
      const s = d * (2 - along);
      if (s < bs) { bs = s; b = v; }
    }
    if (b >= 0) cursor = b;
    return b >= 0;
  }
  let patchIdx = -1;
  window.addEventListener('keydown', evt => {
    const k = evt.key;
    // Tab stays the browser's; Space and Enter on a focused button press the button.
    if (evt.target && evt.target.closest && evt.target.closest('button')) return;
    if (k === 'i' || k === 'I') { kbUsed = true; speak(status()); evt.preventDefault(); return; }
    if (state !== 'playing' && !endCard.hidden && k === 'Enter') { onMain(); evt.preventDefault(); return; }
    if (state !== 'playing' || paused) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[k]) {
      kbUsed = true; evt.preventDefault();
      if (press && press.id === 'key') return; // a cut being held stays on its knot
      if (moveCursor(...dirs[k])) speak(describe(cursor)); else speak('Edge of the soil.');
      return;
    }
    if (k === 'Enter') {
      kbUsed = true;
      if (kbFrom === cursor) { kbFrom = -1; speak('Unmarked.'); }
      else if (kbFrom >= 0) { if (!doGrow(kbFrom, cursor)) say('No open route there.', 2); kbFrom = -1; }
      else if (own[cursor] === 1 && conn[cursor]) { kbFrom = cursor; speak('Marked: move the cursor and press Enter to grow there.'); }
      else if (nearestFrom(cursor) >= 0) doGrow(nearestFrom(cursor), cursor); // nothing marked: grow from the nearest knot
      else say('Enter on a knot of your network marks it; Enter again on open soil grows there.', 3);
      evt.preventDefault();
    } else if (k === ' ') { kbUsed = true; if (own[cursor] !== 1) say('Space pulses the knot under the cursor.', 2); else doPulse(cursor); evt.preventDefault(); }
    else if (k === 'x' || k === 'X' || k === 'Delete' || k === 'Backspace') {
      kbUsed = true; evt.preventDefault();
      if (evt.repeat || press) return;
      if (own[cursor] !== 1 && own[cursor] !== 2) { speak('Nothing to cut here.'); return; }
      press = { id: 'key', key: k.toLowerCase(), t0: performance.now(), node: cursor, mode: 'pending' };
    } else if (k === 'n' || k === 'N' || k === 'h' || k === 'H') {
      kbUsed = true; evt.preventDefault();
      if (press && press.id === 'key') return;
      if (k === 'h' || k === 'H') { cursor = core; speak(describe(cursor)); return; }
      const ps = patches.filter(p => p.on && p.food > 0);
      if (!ps.length) { speak('No patch has food left.'); return; }
      ps.sort((a, b) => dcore[a.i] - dcore[b.i] || a.i - b.i);
      patchIdx = (patchIdx + 1) % ps.length;
      cursor = ps[patchIdx].i;
      speak(`Patch ${patchIdx + 1} of ${ps.length}. ` + describe(cursor));
    }
    else if (k === 'Escape') { if (kbFrom >= 0) speak('Unmarked.'); kbFrom = -1; }
  });
  window.addEventListener('keyup', evt => {
    const a = press;
    if (!a || a.id !== 'key' || evt.key.toLowerCase() !== a.key) return;
    press = null;
    if (a.mode === 'pending' && state === 'playing') speak('Hold X to cut.');
  });

  // The verbs as a player calls them: the same functions the bots call, plus a line for the live region.
  function doGrow(from, to) {
    const r = route(from, to);
    if (!grow(from, to)) return false;
    const cost = (r.length - 1) * GROW_C;
    track.set(jobs[jobs.length - 1], { to, wait: false });
    speak(`Growing ${r.length - 1} knot${r.length > 2 ? 's' : ''} toward ${what(to)}, cost ${cost}, pool ${Math.floor(pool)}${cost > pool ? ': it waits for the pool as it goes' : ''}.`);
    return true;
  }
  function doPulse(i) {
    const path = pathToCore(i), before = path.map(a => sap[a]), m0 = mushrooms, sp0 = st.spilled, pool0 = pool;
    const p = patchAt[i] >= 0 && patches[patchAt[i]].on ? patches[patchAt[i]] : null;
    if (!pulse(i)) return false;
    const fed = path.filter((a, k) => sap[a] - before[k] > 0.05).length, sent = Math.round(pool0 - pool);
    let s = `Pulse of ${sent} through ${path.length - 1} thread${path.length === 2 ? '' : 's'}, refilled ${fed} knot${fed === 1 ? '' : 's'}`;
    if (p) {
      const got = mushrooms - m0;
      s += got ? `: ${got > 1 ? got + ' mushrooms' : 'a mushroom'}! ${mushrooms} of ${spec.goal}.` : `, the patch's next mushroom is ${Math.floor(100 * p.fruit / FRUIT)}% grown.`;
    } else s += st.spilled - sp0 >= 1 ? `, ${Math.round(st.spilled - sp0)} spilled (no patch there).` : '.';
    speak(s + ` Pool ${Math.floor(pool)}.`);
    return true;
  }
  function doPrune(i) {
    const rival = own[i] === 2, n0 = rival ? rivalCount() : 0;
    if (!prune(i)) return false;
    if (rival) speak(`Cut the mould: ${n0 - rivalCount()} of its knots gone. It rests ${RIVAL_WAIT} s.`);
    else {
      const n = subtree(i).length;
      speak(`Cut: ${n} knot${n > 1 ? 's' : ''} cut off. They wither in about ${Math.ceil(1 / DECAY)} s and cost no upkeep. Upkeep now ${upkeepRate().toFixed(1)} per s.`);
    }
    return true;
  }
  // The knot of the network with the shortest open route to a site (-1: none), for Enter with nothing marked.
  function nearestFrom(to) {
    if (own[to] === 2 || own[to] === 3 || (own[to] === 1 && conn[to])) return -1;
    const d = bfsDist(j => j === to, v => own[v] === 0);
    let b = -1, bd = 99;
    for (let j = 0; j < N; j++) if (own[j] === 1 && conn[j]) for (const v of P[j].nb) {
      const dv = v === to ? 0 : d[v];
      if (dv < bd || (dv === bd && b >= 0 && dc[j] < dc[b])) { bd = dv; b = j; }
    }
    return b >= 0 && route(b, to) ? b : -1;
  }
  function rivalCount() { let n = 0; for (let i = 0; i < N; i++) if (own[i] === 2) n++; return n; }

  // § live region
  // #say speaks what matters, short and settled (findings: a real-time live region speaks settled
  // changes): the site under the cursor, each verb's result, fading, rot, losses, the mould near the
  // network, the pool at steps of 25, the frost, the result. #msg (the hint strip) is aria-hidden; say() mirrors it here.
  const sayEl = document.getElementById('say');
  let spoken = [];
  function speak(s) { if (spoken.length < 6) spoken.push(s); }
  function flushSpeech() {
    if (!spoken.length) return;
    let s = spoken.join(' ');
    spoken = [];
    if (s === sayEl.textContent) s += ' '; // the same words again still count as a change
    sayEl.textContent = s;
  }
  // Where a site is, from the cursor: rows up/down, columns left/right.
  function from(i) {
    const dy = Math.round((P[i].y - P[cursor].y) / SY), dx = Math.round((P[i].x - P[cursor].x) / S);
    const parts = [];
    if (dy) parts.push(`${Math.abs(dy)} ${dy < 0 ? 'up' : 'down'}`);
    if (dx) parts.push(`${Math.abs(dx)} ${dx < 0 ? 'left' : 'right'}`);
    return parts.length ? parts.join(', ') + ' from the cursor' : 'at the cursor';
  }
  function what(i) {
    const p = patchAt[i] >= 0 && patches[patchAt[i]].on ? patches[patchAt[i]] : null;
    if (p) return p.big ? 'the old log' : 'a patch';
    if (own[i] === 1) return 'your cut-off branch';
    return 'open soil';
  }
  function patchWords(p) {
    if (p.food <= 0) return `${p.big ? 'the old log' : 'a patch'}, used up` + (p.caps ? `, ${p.caps} mushroom${p.caps > 1 ? 's' : ''}` : '');
    return `${p.big ? 'the old log' : 'a patch'} with food ${Math.ceil(p.food)} of ${Math.round(p.max)}` +
      (p.caps ? `, ${p.caps} mushroom${p.caps > 1 ? 's' : ''}` : '') + (p.fruit >= 1 ? `, next mushroom ${Math.floor(100 * p.fruit / FRUIT)}%` : '');
  }
  function describe(i) {
    const p = patchAt[i] >= 0 && patches[patchAt[i]].on ? patches[patchAt[i]] : null;
    const bits = [];
    if (i === core) bits.push(`The spore, your network's heart. Pool ${Math.floor(pool)}`);
    else if (own[i] === 1 && conn[i]) {
      const s = Math.max(0, sap[i]);
      bits.push(`Your knot, ${dc[i]} thread${dc[i] > 1 ? 's' : ''} out, sap ${Math.round(100 * s)}%` +
        (rot[i] ? ', rotting: cut it' : s < FADE ? ', fading: pulse it' : dh[i] <= K ? ', fed' : ', unfed: it fades'));
      if (p) bits.push('on ' + patchWords(p));
    } else if (own[i] === 1) bits.push(`Your cut-off knot, sap ${Math.round(100 * Math.max(0, sap[i]))}%: it withers, or grow into it to reconnect it`);
    else if (own[i] === 2) bits.push(rivals.some(r => r.root === i) ? 'The rival mould\'s root: cut one of its threads' : 'Rival mould' + (p ? ', eating ' + patchWords(p) : '') + `. ${kbUsed ? 'Hold X' : HOLD} to cut it`);
    else if (own[i] === 3) bits.push('A stone');
    else {
      bits.push(p ? 'Open soil: ' + patchWords(p) : 'Open soil');
      if (kbFrom >= 0) {
        const r = route(kbFrom, i);
        bits.push(r ? `grow here: ${r.length - 1} knots, cost ${(r.length - 1) * GROW_C}, pool ${Math.floor(pool)}` : 'no open route from the marked knot (stones or mould in the way)');
      } else {
        const j = nearestFrom(i), r = j >= 0 ? route(j, i) : null;
        bits.push(r ? `${r.length - 1} thread${r.length > 2 ? 's' : ''} from your network: Enter grows there, cost ${(r.length - 1) * GROW_C}, pool ${Math.floor(pool)}` :
          'no open route from your network (stones or mould in the way)');
      }
    }
    if (dry[i] && i !== core) bits.push(`dry soil, ${DRY_U}× upkeep`);
    return bits.join(', ') + '.';
  }
  function status() {
    if (state !== 'playing') return sayEnd();
    const mine = [], fading = [], rotting = []; let cut = 0, rv = 0;
    for (let i = 0; i < N; i++) {
      if (own[i] === 2) rv++;
      if (own[i] !== 1 || i === core) continue;
      if (!conn[i]) { cut++; continue; }
      mine.push(i);
      if (rot[i]) rotting.push(i); else if (sap[i] < FADE) fading.push(i);
    }
    const near = arr => arr.slice().sort((a, b) => Math.hypot(P[a].x - P[cursor].x, P[a].y - P[cursor].y) - Math.hypot(P[b].x - P[cursor].x, P[b].y - P[cursor].y))[0];
    const food = patches.filter(p => p.on && p.food > 0);
    let s = `Season ${season}, ${spec.name}: ${mushrooms} of ${spec.goal} mushrooms, frost in ${Math.max(0, Math.ceil(endT - t))} s. ` +
      `Pool ${Math.floor(pool)}, upkeep ${upkeepRate().toFixed(1)} per s. Network ${mine.length} knots`;
    if (fading.length) s += `, ${fading.length} fading (nearest ${from(near(fading))})`;
    if (rotting.length) s += `, ${rotting.length} rotting (nearest ${from(near(rotting))})`;
    if (cut) s += `, ${cut} cut off`;
    s += `. Patches with food: ${food.length}` + (food.length ? `, nearest ${from(near(food.map(p => p.i)))}` : '') + '.';
    if (rv) s += ` Rival mould: ${rv} knots.`;
    return s;
  }
  function sayEnd() {
    if (endCard.hidden) return '';
    const txt = ['endTitle', 'endDetail', 'endAch'].map(id => document.getElementById(id).textContent).filter(Boolean).map(x => /[.!]$/.test(x) ? x : x + '.').join(' ');
    return `${txt} Enter: ${mainBtn.textContent}.`;
  }

  // Settled changes, read from the state once a frame (outside the simulation, so bots never run it).
  const track = new Map();           // growing threads started by the player -> { to, wait }
  let seen = null;
  function resetWatch() {
    seen = { own: Int8Array.from(own), rot: Uint8Array.from(rot), fade: new Uint8Array(N), linked: patches.map(p => own[p.i] === 1 && conn[p.i]),
      food: patches.map(p => p.on && p.food > 0), on: patches.map(p => p.on), starved: st.starved, withered: st.withered,
      band: Math.floor(pool / 25), bandAt: tnow, poolSaid: Math.floor(pool / 25), dry: pool < 0.5, frost: false };
    track.clear(); news = {}; lastSaid = {};
  }
  let news = {}, lastSaid = {};
  function note(key, item) { const b = news[key] || (news[key] = { first: tnow, items: [] }); b.last = tnow; b.items.push(item); }
  function watch() {
    if (!seen || seen.own.length !== N || seen.linked.length !== patches.length) resetWatch();
    let lost = 0;
    for (let i = 0; i < N; i++) {
      if (seen.own[i] === 1 && own[i] !== 1) lost++;
      if (own[i] === 1 && rot[i] && !seen.rot[i]) note('rot', i);
      const fading = own[i] === 1 && conn[i] && !rot[i] && i !== core && sap[i] < (seen.fade[i] ? FADE + 0.1 : FADE);
      if (fading && !seen.fade[i]) note('fade', i);
      seen.fade[i] = fading ? 1 : 0;
      if (own[i] === 2 && seen.own[i] !== 2) {
        if (patchAt[i] >= 0 && patches[patchAt[i]].on && patches[patchAt[i]].food > 0) note('mouldPatch', i);
        else if (P[i].nb.some(v => own[v] === 1 || P[v].nb.some(w => own[w] === 1 && conn[w]))) note('mould', i);
      }
      seen.own[i] = own[i]; seen.rot[i] = rot[i];
    }
    const starved = st.starved - seen.starved, withered = st.withered - seen.withered;
    if (starved > 0) note('starved', starved);
    if (withered > 0) note('hunger', withered);
    if (lost - starved - withered > 0) note('withered', lost - starved - withered);
    seen.starved = st.starved; seen.withered = st.withered;
    patches.forEach((p, k) => {
      const linked = own[p.i] === 1 && conn[p.i], food = p.on && p.food > 0;
      if (p.on && !seen.on[k]) note('fell', p.i);
      if (linked && !seen.linked[k] && food) note('joined', p.i);
      if (seen.food[k] && !food && p.on) note('spent', p.i);
      seen.linked[k] = linked; seen.food[k] = food; seen.on[k] = p.on;
    });
    // Threads the player started: done, stopped, or waiting for the pool.
    for (const [j, info] of track) {
      if (!jobs.includes(j)) {
        track.delete(j);
        if (own[info.to] === 1 && conn[info.to]) note('grown', info.to); else note('stopped', info.to);
      } else if (j.wait && !info.wait) { info.wait = true; note('wait', info.to); }
    }
    // The pool at steps of 25 (held 1 s), and empty.
    const band = pool < 0.5 ? -1 : Math.floor(pool / 25);
    if (band !== seen.band) { seen.band = band; seen.bandAt = tnow; }
    if (band !== seen.poolSaid && tnow - seen.bandAt >= 1) { seen.poolSaid = band; note('pool', band); }
    const left = endT - t;
    if (!seen.frost && left <= 10 && left > 0) { seen.frost = true; note('frost', Math.ceil(left)); }
    // Speak each kind once it has settled (0.7 s quiet, or 2.5 s old), at most once per 2 s per kind.
    for (const key in news) {
      const b = news[key];
      if (tnow - b.last < 0.7 && tnow - b.first < 2.5) continue;
      if (tnow - (lastSaid[key] || -9) < 2) continue;
      delete news[key]; lastSaid[key] = tnow;
      const s = newsLine(key, b.items);
      if (s) speak(s);
    }
  }
  function newsLine(key, items) {
    const n = items.length, last = items[n - 1];
    const many = (one, more) => n > 1 ? more : one;
    const far = arr => arr.slice().sort((a, b) => dc[b] - dc[a])[0];
    switch (key) {
      case 'fade': { const live = items.filter(i => own[i] === 1 && conn[i] && sap[i] < FADE + 0.1); if (!live.length) return '';
        return `${live.length > 1 ? live.length + ' knots' : 'A knot'} fading, ${from(far(live))}: pulse ${live.length > 1 ? 'them' : 'it'}.`; }
      case 'rot': return `Rot ${from(last)}: it eats back toward the spore. Cut it to stop it.`;
      case 'starved': { const k = items.reduce((a, b) => a + b, 0); return `${k > 1 ? k + ' knots' : 'A knot'} starved while attached.`; }
      case 'hunger': return 'Pool empty: a tip withered to pay the upkeep.';
      case 'withered': { const k = items.reduce((a, b) => a + b, 0); return `${k > 1 ? k + ' cut-off knots' : 'A cut-off knot'} withered.`; }
      case 'mouldPatch': return `Rival mould reached a patch, ${from(last)}: it eats the food.`;
      case 'mould': return `Rival mould spreading next to your network, ${from(last)}.`;
      case 'fell': return `${many('A fresh patch', n + ' fresh patches')} fell, ${from(last)}.`;
      case 'joined': return `Your thread reached ${many(what(last), n + ' patches')}: ${many('it feeds', 'they feed')} the pool.`;
      case 'spent': return `${many('A patch is', n + ' patches are')} used up, ${from(last)}.`;
      case 'grown': return `Thread grown to ${what(last) === 'open soil' ? 'its end' : what(last)}, ${from(last)}.`;
      case 'stopped': return 'A growing thread stopped: the knot it grew from is gone.';
      case 'wait': return `Growth waits for the pool: each knot costs ${GROW_C}, pool ${Math.floor(pool)}.`;
      case 'pool': return last < 0 ? 'Pool empty.' : `Pool ${Math.floor(pool)}, upkeep ${upkeepRate().toFixed(1)} per s.`;
      case 'frost': return `Frost in ${last} s: ${mushrooms} of ${spec.goal} mushrooms.`;
    }
    return '';
  }

  function onMain() {
    if (performance.now() < lockUntil) return;
    if (state === 'season') nextSeason(); else if (state === 'lost') retrySeason();
  }
  mainBtn.addEventListener('click', onMain);
  altBtn.addEventListener('click', () => { if (performance.now() >= lockUntil) newRun(); });
  document.getElementById('resetBtn').addEventListener('click', newRun);

  // § loop
  let last = performance.now(), acc = 0;
  function frame(now) {
    const d = Math.max(0, Math.min((now - last) / 1000, 0.1)); // a first frame can be stamped before last
    last = now;
    if (!paused) {
      acc += d; tnow += d;
      if (!still()) deco += d;
      if (state === 'playing') checkHold();
      for (const e of fx) e.t += d;
      fx = fx.filter(e => e.t < 0.8);
    }
    while (acc >= STEP) {
      if (state === 'playing' && !paused) step(STEP);
      acc -= STEP;
    }
    if (state === 'playing' && !paused) watch();
    tickMsg();
    flushSpeech();
    hud();
    draw();
    requestAnimationFrame(frame);
  }

  newRun();
  requestAnimationFrame(frame);
})();
// § a11y label
// The canvas label names the verbs, with the word for this device.
{
  const fine = window.matchMedia('(pointer: fine)').matches;
  const t = fine ? 'click' : 'tap', h = fine ? 'click and hold' : 'hold';
  document.getElementById('soil').setAttribute('aria-label', `Mycelium. Drag from a knot to grow a thread, ${t} a knot to pulse nutrient to it, ${h} a knot to cut the thread there. Keys: arrows move the cursor, Enter marks a knot and Enter again grows to the cursor, Space pulses, hold X cuts, N next patch, H the spore, I status.`);
}
</script>
</body>
