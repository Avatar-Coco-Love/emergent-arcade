<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Garden</title>
<style>
  :root {
    --bg: #07070d;
    --panel: #15151f;
    --text: #e8e8ee;
    --muted: #9a9aa5;
    --accent: #8be07a;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the sky scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    gap: 8px;
  }
  #field { flex: 1; min-height: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  #sky {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    border-radius: 10px;
    background: #05050a;
  }
  #msg {
    position: absolute;
    top: 10px;
    left: 8px;
    right: 8px;
    margin: 0;
    text-align: center;
    font-size: 0.85rem;
    color: #d8d8e0;
    text-shadow: 0 1px 3px #000;
    pointer-events: none;
  }
  #endCard {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(86%, 300px);
    padding: 18px 16px;
    border-radius: 12px;
    background: rgba(21, 21, 31, 0.94);
    border: 1px solid #2a2a38;
    text-align: center;
  }
  #endCard[hidden] { display: none; }
  #endCard h2 { margin: 0 0 6px; font-size: 1.3rem; }
  #endCard h2.won { color: #8be07a; }
  #endCard h2.lost { color: #ff9a8a; }
  #endCard p { margin: 0 0 4px; color: #c8c8d2; font-size: 0.9rem; }
  #playAgain { margin-top: 12px; width: 100%; font-weight: 600; }
  #playAgain:disabled { opacity: 0.4; }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a2a38;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div id="field">
    <div id="stage">
      <canvas id="sky" aria-label="Orbit Garden sky. Tap to place a planet, drag upward to fling a seed."></canvas>
      <p id="msg" role="status"></p>
      <div id="endCard" hidden>
        <h2 id="endTitle"></h2>
        <p id="endDetail"></p>
        <p id="endAch"></p>
        <button id="playAgain">Play again</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <span>Seeds <b id="hudSeeds"></b></span>
    <span>Blooming <b id="hudBlooms"></b></span>
    <span>Planets <b id="hudPlanets"></b></span>
    <button id="resetBtn">New garden</button>
  </div>

<script>
(function() {
  const GAME_ID = 'orbit-garden';
  const W = 400, H = 600;
  const LAUNCH = { x: W / 2, y: H - 34 };
  const NO_PLANET_BELOW = H - 100;  // keep the launcher area clear
  const START_SEEDS = 40;
  const MAX_PLANETS = 5;
  const GOAL_BLOOMS = 3;
  const PLANET_START_MASS = 1.5;
  const SEED_MASS = 1;             // mass a landed seed adds to its planet
  const BLOOM_MASS = 5;            // a planet at or above this is blooming
  const WITHER_PER_FLING = 0.11;   // every fling costs every planet this much mass
  const DEAD_MASS = 0.3;           // planets below this crumble away
  const G = 900000;                // gravity strength
  const SOFTEN = 15;               // keeps gravity finite near a planet's center
  const FLING_POWER = 1.8;         // seed speed per px of drag (slow, so gravity bends every shot)
  const MAX_DRAG = 140;            // longer drags don't fling any harder
  const MAX_AIM_ANGLE = 75 * Math.PI / 180; // flings go upward, at most this far from straight up
  const DRAG_THRESHOLD_PX = 16;
  const END_INPUT_LOCK_MS = 1000;  // ignore taps right after a win/loss so it can't be skipped
  const SEED_LIFETIME = 10;        // seconds before a drifting seed is lost
  const STEP = 1 / 120;
  const TRAIL_EVERY = 2;           // record a trail point every N steps
  const TRAIL_POINTS = 14;
  const PREVIEW_STEPS = 40;        // aim preview length, in double steps (~0.67 s)

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const msgEl = document.getElementById('msg');

  // Achievements: announced to the Emergent Arcade gallery when embedded
  // (it records them); harmless when the file is opened on its own.
  const unlocked = new Set();
  function unlock(id) {
    roundEarned.add(id);
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
    }
  }

  // Tell the gallery how a round ended (anonymous play telemetry, see
  // docs/telemetry.md). time is seconds of unpaused play this round.
  function report(result) {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:result', game: GAME_ID,
        outcome: result === 'won' ? 'win' : 'loss', time: Math.round(elapsed * 10) / 10 }, '*');
    }
  }

  // Fixed backdrop stars (drawn from a tiny seeded PRNG so it never changes).
  const stars = [];
  let rs = 7;
  function rand() { rs = (rs * 16807) % 2147483647; return rs / 2147483647; }
  for (let i = 0; i < 90; i++) stars.push([rand() * W, rand() * H, rand() * 1.2 + 0.3]);

  // Scale the sky to the largest 2:3 box that fits the space it's given, and
  // give the canvas one pixel per screen pixel so it stays sharp at any size.
  // Drawing always uses W x H game units (draw() sets the transform).
  const field = document.getElementById('field');
  const stage = document.getElementById('stage');
  function fitSky() {
    const scale = Math.min(field.clientWidth / W, field.clientHeight / H);
    const w = Math.max(80, Math.floor(W * scale));
    const h = Math.max(120, Math.floor(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  new ResizeObserver(fitSky).observe(field);
  window.addEventListener('resize', fitSky); // browser zoom changes devicePixelRatio
  fitSky();

  // The gallery pauses the game while one of its panels covers it.
  let paused = false;
  window.addEventListener('message', evt => {
    if (evt.data && evt.data.type === 'arcade:pause') paused = true;
    if (evt.data && evt.data.type === 'arcade:resume') paused = false;
  });

  const endCard = document.getElementById('endCard');
  const playAgainBtn = document.getElementById('playAgain');

  let planets, seeds, seedsLeft, streak, elapsed, state, msgTimer;
  const roundEarned = new Set();

  function newGarden() {
    planets = [];
    seeds = [];
    seedsLeft = START_SEEDS;
    streak = 0;
    elapsed = 0;
    roundEarned.clear();
    state = 'playing';
    endCard.hidden = true;
    say('Tap the sky to place your first planet.');
  }

  function endGame(result) {
    state = result;
    report(result);
    msgEl.textContent = '';
    const title = document.getElementById('endTitle');
    title.textContent = result === 'won' ? 'Garden complete!' : 'Out of seeds';
    title.className = result;
    document.getElementById('endDetail').textContent = result === 'won'
      ? `Won with ${seedsLeft} seed${seedsLeft === 1 ? '' : 's'} to spare.`
      : `${planets.filter(blooming).length} of ${GOAL_BLOOMS} planets were blooming.`;
    const n = roundEarned.size;
    document.getElementById('endAch').textContent = n
      ? `🏆 ${n} achievement${n === 1 ? '' : 's'} earned this round`
      : '';
    // Taps that were already on their way (fast flinging) must not skip this.
    playAgainBtn.disabled = true;
    endCard.hidden = false;
    setTimeout(() => { playAgainBtn.disabled = false; }, END_INPUT_LOCK_MS);
  }

  function say(text) {
    msgEl.textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { if (state === 'playing') msgEl.textContent = ''; }, 3000);
  }

  function radius(p) { return 6 + 5 * Math.sqrt(p.mass); }
  function blooming(p) { return p.mass >= BLOOM_MASS; }

  // Gravity from every planet: reads the mass that both player verbs write.
  function accel(x, y) {
    let ax = 0, ay = 0;
    for (const p of planets) {
      const dx = p.x - x, dy = p.y - y;
      const d2 = dx * dx + dy * dy + SOFTEN * SOFTEN;
      const f = G * p.mass / (d2 * Math.sqrt(d2));
      ax += f * dx;
      ay += f * dy;
    }
    return [ax, ay];
  }

  // ---------- mechanic 1: place ----------
  function placePlanet(x, y) {
    if (state !== 'playing') return;
    if (y > NO_PLANET_BELOW) return say('Too close to the launcher.');
    if (planets.length >= MAX_PLANETS) return say(`The sky holds at most ${MAX_PLANETS} planets.`);
    const probe = { mass: PLANET_START_MASS };
    for (const p of planets) {
      if (Math.hypot(p.x - x, p.y - y) < radius(p) + radius(probe) + 8) return say('Too close to another planet.');
    }
    planets.push({ x, y, mass: PLANET_START_MASS, flash: 0, bloomedOnce: false });
    msgEl.textContent = ''; // drop any hint or warning once a planet lands
    if (planets.length >= MAX_PLANETS) unlock('full-sky');
  }

  // ---------- mechanic 2: fling ----------
  // Drag vector -> launch velocity, or null for a drag that doesn't point upward.
  // Sideways drags are clamped to MAX_AIM_ANGLE from straight up.
  function flingVelocity(dx, dy) {
    if (dy >= 0) return null;
    let angle = Math.atan2(dx, -dy); // 0 = straight up, positive = right
    angle = Math.max(-MAX_AIM_ANGLE, Math.min(MAX_AIM_ANGLE, angle));
    const speed = Math.min(Math.hypot(dx, dy), MAX_DRAG) * FLING_POWER;
    return [Math.sin(angle) * speed, -Math.cos(angle) * speed];
  }

  function fling(dx, dy) {
    if (state !== 'playing') return;
    if (seedsLeft <= 0) return;
    if (!planets.length) return say('Place a planet first: tap the sky.');
    const v = flingVelocity(dx, dy);
    if (!v) return say('Drag upward to fling a seed.');
    const [vx, vy] = v;
    seeds.push({ x: LAUNCH.x, y: LAUNCH.y, vx, vy, vx0: vx, vy0: vy, t: 0, steps: 0, trail: [] });
    seedsLeft--;
    // Passive system: the garden withers per seed flung, not per second, so
    // flinging faster never outruns it (docs/findings.md).
    for (const p of planets) p.mass -= WITHER_PER_FLING;
  }

  // ---------- simulation ----------
  function step(dt) {
    elapsed += dt;
    for (let i = seeds.length - 1; i >= 0; i--) {
      const s = seeds[i];
      const [ax, ay] = accel(s.x, s.y);
      s.vx += ax * dt;
      s.vy += ay * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.t += dt;
      if (++s.steps % TRAIL_EVERY === 0) {
        s.trail.push([s.x, s.y]);
        if (s.trail.length > TRAIL_POINTS) s.trail.shift();
      }

      const hit = planets.find(p => Math.hypot(p.x - s.x, p.y - s.y) < radius(p));
      if (hit) {
        hit.mass += SEED_MASS;
        hit.flash = 0.25;
        seeds.splice(i, 1);
        streak++;
        if (streak >= 5) unlock('green-thumb');
        // Landed while heading more than 90 degrees away from where it was flung.
        if (s.vx * s.vx0 + s.vy * s.vy0 < 0) unlock('gravity-assist');
        continue;
      }
      const out = s.x < -60 || s.x > W + 60 || s.y < -60 || s.y > H + 60;
      if (out || s.t > SEED_LIFETIME) {
        seeds.splice(i, 1);
        streak = 0;
      }
    }

    // Blooming and crumbling are read from mass.
    for (let i = planets.length - 1; i >= 0; i--) {
      const p = planets[i];
      if (p.flash > 0) p.flash -= dt;
      if (blooming(p) && !p.bloomedOnce) {
        p.bloomedOnce = true;
        unlock('first-bloom');
      }
      if (p.mass < DEAD_MASS) {
        planets.splice(i, 1);
        say('A planet withered away.');
      }
    }

    const blooms = planets.filter(blooming).length;
    if (blooms >= GOAL_BLOOMS) {
      unlock('garden-complete');
      if (seedsLeft >= 15) unlock('frugal');
      endGame('won');
    } else if (seedsLeft === 0 && seeds.length === 0) {
      endGame('lost');
    }
  }

  // ---------- drawing ----------
  function draw() {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const [x, y, r] of stars) ctx.fillRect(x, y, r, r);

    // launcher
    ctx.fillStyle = '#2b2b3d';
    ctx.beginPath();
    ctx.arc(LAUNCH.x, H, 40, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = seedsLeft > 0 && state === 'playing' ? '#ffd166' : '#555';
    ctx.beginPath();
    ctx.arc(LAUNCH.x, LAUNCH.y, 5, 0, Math.PI * 2);
    ctx.fill();

    for (const p of planets) drawPlanet(p);

    for (const s of seeds) {
      ctx.strokeStyle = 'rgba(255,209,102,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      s.trail.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (aim) drawAim();

    document.getElementById('hudSeeds').textContent = seedsLeft;
    document.getElementById('hudBlooms').textContent = `${planets.filter(blooming).length}/${GOAL_BLOOMS}`;
    document.getElementById('hudPlanets').textContent = `${planets.length}/${MAX_PLANETS}`;
  }

  function drawPlanet(p) {
    const r = radius(p);
    const t = Math.min(p.mass / BLOOM_MASS, 1);
    if (blooming(p)) {
      // petals
      ctx.fillStyle = '#ff8fb8';
      for (let k = 0; k < 6; k++) {
        const a = k * Math.PI / 3 + performance.now() / 4000;
        ctx.beginPath();
        ctx.arc(p.x + Math.cos(a) * (r + 4), p.y + Math.sin(a) * (r + 4), r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // body: dusty brown -> living green as mass grows
    const cr = Math.round(120 - 60 * t), cg = Math.round(90 + 120 * t), cb = Math.round(70 - 10 * t);
    ctx.fillStyle = p.flash > 0 ? '#ffffff' : `rgb(${cr},${cg},${cb})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
    // progress ring toward bloom
    if (!blooming(p)) {
      ctx.strokeStyle = 'rgba(139,224,122,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 5, -Math.PI / 2, -Math.PI / 2 + t * Math.PI * 2);
      ctx.stroke();
    }
  }

  // Short dotted preview: shows the first moment of the path, not the whole shot.
  function drawAim() {
    const v = flingVelocity(aim.dx, aim.dy);
    if (!v) return;
    let [vx, vy] = v;
    let x = LAUNCH.x, y = LAUNCH.y;
    ctx.fillStyle = 'rgba(255,209,102,0.7)';
    for (let i = 0; i < PREVIEW_STEPS; i++) {
      const [ax, ay] = accel(x, y);
      vx += ax * STEP * 2; vy += ay * STEP * 2;
      x += vx * STEP * 2; y += vy * STEP * 2;
      if (i % 4 === 3) {
        ctx.beginPath();
        ctx.arc(x, y, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- input ----------
  let pointerDown = false, startPx = null, startPt = null, aim = null;

  function toCanvas(evt) {
    const rect = canvas.getBoundingClientRect();
    return [(evt.clientX - rect.left) * W / rect.width, (evt.clientY - rect.top) * H / rect.height];
  }

  canvas.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    canvas.setPointerCapture(evt.pointerId);
    pointerDown = true;
    startPx = [evt.clientX, evt.clientY];
    startPt = toCanvas(evt);
    aim = null;
  });

  canvas.addEventListener('pointermove', evt => {
    if (!pointerDown) return;
    if (Math.hypot(evt.clientX - startPx[0], evt.clientY - startPx[1]) > DRAG_THRESHOLD_PX) {
      const [x, y] = toCanvas(evt);
      aim = { dx: x - startPt[0], dy: y - startPt[1] };
    }
  });

  function onUp() {
    if (!pointerDown) return;
    pointerDown = false;
    if (state !== 'playing' || paused) {
      // the end card's Play again button starts the next round
    } else if (aim) {
      fling(aim.dx, aim.dy);
    } else {
      placePlanet(startPt[0], startPt[1]);
    }
    aim = null;
  }
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', () => { pointerDown = false; aim = null; });

  document.getElementById('resetBtn').addEventListener('click', newGarden);
  playAgainBtn.addEventListener('click', newGarden);

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min((now - last) / 1000, 0.1);
    last = now;
    while (acc >= STEP) {
      if (state === 'playing' && !paused) step(STEP);
      acc -= STEP;
    }
    draw();
    requestAnimationFrame(frame);
  }

  newGarden();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
