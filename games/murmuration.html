<!DOCTYPE html>
<html lang="en">
<head>
<script>
// § crash report: uncaught errors go to the arcade's telemetry (docs/telemetry.md, "Errors").
(function () {
  var sent = 0;
  function report(message, line, col) {
    if (window.parent === window || sent++ >= 3) return;
    try {
      window.parent.postMessage({ type: 'arcade:error', game: 'murmuration', message: String(message).slice(0, 300), line: line | 0, col: col | 0 }, '*');
    } catch (_) {}
  }
  window.addEventListener('error', function (e) { report(e.message, e.lineno, e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled rejection: ' + (r && r.message ? r.message : r), 0, 0);
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmuration</title>
<style>
  :root {
    --bg: #0d0b16;
    --panel: #1a1726;
    --text: #ece8f4;
    --muted: #a39db3;
    --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the sky scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    gap: 8px;
  }
  #field { flex: 1; min-height: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  #sky {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    border-radius: 10px;
  }
  #msg {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 16px);
    margin: 0;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(13, 11, 22, 0.82); /* white text over a sunset sky was under 4.5:1 */
    text-align: center;
    font-size: 0.85rem;
    color: #fff;
    pointer-events: none;
  }
  #msg:empty { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Cards: dawn, tally, run over, chapter, classic result. Still (no
     animation), on a dark backing; text 12.5 CSS px and up. */
  #card {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(88%, 310px);
    max-height: calc(100% - 16px);
    overflow: auto;
    padding: 16px 16px 14px;
    border-radius: 12px;
    background: rgba(26, 23, 38, 0.95);
    border: 1px solid #36304a;
    text-align: center;
  }
  #card[hidden] { display: none; }
  #card .sub { margin: 0 0 2px; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; }
  #card h2 { margin: 0 0 8px; font-size: 1.3rem; }
  #card h2.won { color: #c4b5fd; }
  #card h2.lost { color: #ff9a8a; }
  #card p { margin: 0 0 6px; color: #d6d0e2; font-size: 0.9rem; line-height: 1.35; }
  #card p.story { font-style: italic; color: #c9c2d8; }
  #card p.keys { color: var(--muted); font-size: 0.8rem; }
  #card .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  #card button { width: 100%; }
  #card .alts { display: flex; gap: 8px; }
  #card .alts button { flex: 1; padding: 8px 6px; }
  #card button.main { font-weight: 600; background: #4c3d7a; border-color: #7a66b8; }
  #card button:disabled { opacity: 0.4; }
  #card button[hidden] { display: none; }
  #card button:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 2px; }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .bar b.late { color: #ffb86b; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #36304a;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
</style>

<body>
  <div id="field">
    <div id="stage">
      <canvas id="sky" role="img" aria-label="Murmuration sky. Hold to lure the flock, tap or click to startle it. Keys: arrows move a cursor, hold Space to lure, Enter or X startles."></canvas>
      <p id="msg" aria-hidden="true"></p>
      <p id="say" class="sr" role="status"></p>

  <div class="bar">
    <span id="hudNightBox">Night <b id="hudNight"></b></span>

    <span id="hudStartleBox">Startles <b id="hudStartles"></b></span>
    <button id="resetBtn">New flock</button>
  </div>

<script>
(function() {
  const GAME_ID = 'murmuration';
  const W = 400, H = 600;
  const START_BIRDS = 40;
  // § nights: one row per night (docs/games/murmuration.md). Row 0 is the
  // classic night (v7's numbers). need: birds that must fly through each
  // gate, within `window` seconds of each other; half: half the gap between
  // a gate's posts; dusk: seconds of daylight; spook: LURE_SPOOK, fear per
  // second inside the lure's spook ring; startle: taps allowed. Gates: center
  // and the angle of the line between the posts (degrees). nv: the night's
  // revision (telemetry), so retuning one night doesn't mix its numbers.
  const NIGHTS = [
    { id: 'classic', name: 'Classic night', nv: 1, startle: true, need: 15, half: 55, window: 4, dusk: 60, spook: 0.9,
      gates: [{ x: 95, y: 400, a: 60 }, { x: 300, y: 280, a: 60 }, { x: 120, y: 170, a: 0 },
        { x: 230, y: 440, a: 0 },    // open sky on both sides, so a startle can carry the flock through
        { x: 290, y: 110, a: 30 }] },
    // Chapter 1, "The Gathering" (docs/games/murmuration-chapter1.md). story and
    // rule are the dawn card's lines ({tap}: tap or click, for this device).
    { id: 'dusk', name: 'Dusk', nv: 1, startle: false, need: 12, half: 70, window: 5, dusk: 45, spook: 0.45,
      gates: [{ x: 120, y: 430, a: 105 }, { x: 300, y: 320, a: 59 }, { x: 110, y: 210, a: 120 }, { x: 280, y: 90, a: 55 }],
      story: 'The flock gathers at the marsh.',
      rule: 'Lure only tonight: hold ahead of the flock and draw it through each gate.' },
    { id: 'second-flight', name: 'Second flight', nv: 1, startle: false, need: 13, half: 65, window: 4.5, dusk: 50, spook: 0.65,
      gates: [{ x: 300, y: 330, a: 10 }, { x: 120, y: 260, a: 110 }, { x: 260, y: 150, a: 52 }, { x: 100, y: 440, a: 29 }],
      story: 'Another dusk, another route.',
      rule: 'The sky is less forgiving: birds spook if you press too close.' },
    { id: 'first-tap', name: 'First tap', nv: 1, startle: true, need: 13, half: 60, window: 4.5, dusk: 60, spook: 0.9,
      gates: [{ x: 130, y: 440, a: 106 }, { x: 310, y: 160, a: 33 }, { x: 90, y: 250, a: 68 }, { x: 300, y: 480, a: 138 }],
      story: 'Open sky. The old birds know a trick.',
      rule: '{Tap} behind the flock to throw it forward. Taps scare the birds they touch.' },
    { id: 'open-sky', name: 'Open sky', nv: 1, startle: true, need: 13, half: 55, window: 4, dusk: 60, spook: 0.9,
      gates: [{ x: 90, y: 380, a: 119 }, { x: 290, y: 200, a: 48 }, { x: 270, y: 470, a: 4 }, { x: 100, y: 150, a: 152 }],
      story: 'Long crossings between the gates.',
      rule: '{Tap}ping behind the flock saves seconds on the long runs.' },
    { id: 'breather', name: 'Breather', nv: 1, startle: true, need: 12, half: 65, window: 5, dusk: 40, spook: 0.9,
      gates: [{ x: 200, y: 400, a: 135 }, { x: 310, y: 230, a: 33 }, { x: 150, y: 90, a: 131 }],
      recruits: [{ x: 165, y: 320, n: 4 }],
      story: 'A short night. Stragglers wait in the reeds.',
      rule: 'A small group rests off the route; fly near it and it will join.' },
    { id: 'the-edge', name: 'The edge', nv: 1, startle: true, need: 13, half: 50, window: 4, dusk: 60, spook: 0.9,
      gates: [{ x: 70, y: 420, a: 90 }, { x: 330, y: 300, a: 90 }, { x: 70, y: 170, a: 90 }, { x: 250, y: 70, a: 0 }],
      story: 'The cliffs. The gates hang close to the border.',
      rule: 'Near the border a spooked bird can be lost: keep the lure off the flock, {tap} from inside it.' },
    // Chapter 2, "The High Pass": one new thing per night. crags: rocks in the
    // sky ({x, y, r}); calm birds swerve around them, scared ones less, panicked
    // ones not at all, and a bird that hits one is lost. wind: bands of sky
    // ({y0, y1, v}) that carry every bird sideways at v units per second
    // (+ = right). A gate with calm: true counts only calm birds (fear < SCARED).
    { id: 'crags', name: 'Crags', nv: 1, startle: true, need: 13, half: 60, window: 4.5, dusk: 55, spook: 0.9,
      gates: [{ x: 115, y: 390, a: 70 }, { x: 295, y: 250, a: 110 }, { x: 125, y: 135, a: 70 }, { x: 290, y: 450, a: 20 }],
      crags: [{ x: 190, y: 420, r: 26 }, { x: 200, y: 300, r: 30 }, { x: 215, y: 175, r: 24 }, { x: 185, y: 520, r: 22 }],
      story: 'The mountains begin. Rocks stand in the way.',
      rule: 'Calm birds swerve around a crag; scared ones fly straight into it and are lost. Never startle beside the rocks.' },
    { id: 'crosswind', name: 'Crosswind', nv: 1, startle: true, need: 13, half: 55, window: 4.5, dusk: 45, spook: 0.9,
      gates: [{ x: 110, y: 420, a: 100 }, { x: 290, y: 170, a: 60 }, { x: 90, y: 120, a: 100 }, { x: 300, y: 430, a: 140 }],
      wind: [{ y0: 220, y1: 360, v: 45 }],
      story: 'A wind pours down the valley.',
      rule: 'Inside the wind band every bird drifts with it. Lead the flock upwind of the gate.' },
    { id: 'still-air', name: 'Still air', nv: 1, startle: true, need: 12, half: 65, window: 5, dusk: 55, spook: 0.9,
      gates: [{ x: 150, y: 380, a: 120, calm: true }, { x: 300, y: 200, a: 40, calm: true }, { x: 110, y: 110, a: 120, calm: true }],
      recruits: [{ x: 90, y: 250, n: 5 }],
      story: 'A quiet tarn under the peaks. Stragglers rest by the water.',
      rule: 'Ringed gates count only calm birds: no startles near them, and keep the lure ring white.' },
    { id: 'the-gorge', name: 'The gorge', nv: 1, startle: true, need: 13, half: 60, window: 4.5, dusk: 60, spook: 0.9,
      gates: [{ x: 120, y: 410, a: 90 }, { x: 290, y: 280, a: 90 }, { x: 110, y: 160, a: 90 }, { x: 290, y: 80, a: 20 }],
      crags: [{ x: 205, y: 350, r: 28 }, { x: 200, y: 215, r: 28 }, { x: 330, y: 380, r: 22 }, { x: 60, y: 300, r: 22 }],
      wind: [{ y0: 120, y1: 250, v: -40 }],
      story: 'The walls close in, and the wind finds the gap.',
      rule: 'Rocks and wind together: swing wide of the crags on the downwind side.' },
    { id: 'the-high-pass', name: 'The high pass', nv: 1, startle: true, need: 13, half: 55, window: 4, dusk: 60, spook: 0.9,
      gates: [{ x: 300, y: 330, a: 100 }, { x: 100, y: 330, a: 80 }, { x: 260, y: 160, a: 120 }, { x: 140, y: 95, a: 60, calm: true }],
      crags: [{ x: 200, y: 400, r: 26 }, { x: 200, y: 280, r: 30 }, { x: 195, y: 215, r: 24 }, { x: 320, y: 230, r: 20 }],
      wind: [{ y0: 180, y1: 300, v: 40 }],
      story: 'The last climb before the far side.',
      rule: 'Everything at once, and the last gate wants calm birds.' },
  ];
  // Chapters: a run of nights with its own scene and leaderboard (board).
  // Each chapter can be flown on its own, starting from START_BIRDS.
  const CHAPTERS = [
    { n: 1, name: 'The Gathering', first: 1, last: 6, board: 'ch1', scene: 'marsh',
      roost: 'the flock reaches the roost', next: 'Chapter 2 waits beyond the mountains.' },
    { n: 2, name: 'The High Pass', first: 7, last: 11, board: 'ch2', scene: 'pass',
      roost: 'the flock crosses the mountains', next: 'Chapter 3 is on its way.' },
  ];
  const chapterOf = n => CHAPTERS.find(c => n >= c.first && n <= c.last);
  const LAST_NIGHT = NIGHTS.length - 1;
  const FLOCK_CAP = 55;                       // the flock never grows past this
  const MISS_COST = 3, CLEAR_BONUS = 4;       // tally: birds per gate missed, birds for clearing every gate
  // Night 1's half spook could later be tested against full spook, split by
  // the run id's parity (docs/games/murmuration-chapter1.md). Off: too few players.
  const AB_SPOOK = false;
  // The night being flown (set by newFlock from its NIGHTS row).
  let NIGHT, GATE_NEED, GATE_WINDOW, GATE_HALF, DUSK, LURE_SPOOK, GATES, CRAGS, WIND;
  const CRAG_M = 36;               // calm birds start to swerve this far from a crag's rock...
  const CRAG_TURN = 30;            // ...this hard (like EDGE_TURN), less as fear nears panic, not at all in panic
  const VIEW = 40;                 // how far a bird sees its neighbors
  const SEP = 14;                  // personal space
  const CROWD_R = 12, CROWD_N = 5; // more than CROWD_N birds this close is stressful
  const CROWD_FEAR = 0.1;          // fear per second per extra crowding bird
  const FEAR_DECAY = 0.12;         // fear lost per second
  const CONTAGION = 4.0;           // how fast a bird catches its neighbors' fear
  const CONTAGION_KEEP = 0.85;     // panic weakens by this factor per bird it passes through
  const PANIC = 0.75;              // birds this scared ignore the edges of the sky
  const SCARED = 0.25;             // visibly scared (for the Chain Panic achievement)
  const LURE_ACCEL = 160;
  const LURE_R = 150;              // the lure only reaches birds this close...
  const LURE_FULL = 90;            // ...and pulls at full strength only within this distance
  const LURE_SPOOK_R = 30;         // but it spooks birds that come closer than this (LURE_SPOOK: per night)
  const SWIRL = 70;                // calm birds keep turning, so a flock left alone circles in place
  const NEIGHBORS = 7;             // birds match heading with their few nearest neighbors, like real starlings
  const WANDER = 25;               // each calm bird drifts left and right on its own...
  const WANDER_TIME = 1.5;         // ...changing its mind over about this many seconds
  const STARTLE_R = 70, STARTLE_FEAR = 0.6, STARTLE_PUSH = 330;
  const MIN_SPEED = 45, CALM_MAX = 100, PANIC_EXTRA = 140;
  const EDGE = 60;                 // calm birds turn back within this margin
  const EDGE_TURN = 16;            // how hard they turn back
  const HOLD_MS = 200;             // a press shorter than this (without moving) is a startle
  const MOVE_PX = 12;
  const END_INPUT_LOCK_MS = 1000;  // ignore taps right after a win/loss so it can't be skipped
  const STEP = 1 / 60;

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const msgEl = document.getElementById('msg');

  // Achievements: announced to the Emergent Arcade gallery when embedded
  // (it records them); harmless when the file is opened on its own.
  const unlocked = new Set();
  function unlock(id) {
    roundEarned.add(id);
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
    }
  }

  // § telemetry: one arcade:result per night (anonymous play telemetry,
  // docs/telemetry.md). time is seconds of unpaused play this night; stats and
  // the extra fields say how the flock was steered (keys in
  // docs/games/murmuration.md). Kept in lastResult for the balance harness.
  let lastResult = null;
  function report(result, t) {
    const r1 = v => Math.round(v * 10) / 10;
    const n = NIGHTS.indexOf(NIGHT), won = result === 'won';
    const msg = { type: 'arcade:result', game: GAME_ID,
      outcome: won ? 'win' : 'loss', time: r1(elapsed),
      ...(won ? {} : { reason: elapsed >= DUSK ? 'night' : 'scattered' }),
      ...(n ? { level: n } : {}), run: play.run, attempt: play.attempt,
      stats: { gates: gate, birds: birds.length, flock0: play.flock0, startles,
        lure_s: r1(play.lure), spook_s: r1(play.spook), lost: play.lost, lost_pan: play.lostPan, lost_rock: play.lostRock,
        light_left: won ? r1(DUSK - elapsed) : 0, scared_pk: Math.round(play.scaredPk * 100),
        cohesion: r1(play.cohN ? play.coh / play.cohN : 0),
        tap_back: play.taps[0], tap_side: play.taps[1], tap_front: play.taps[2] },
      nv: NIGHT.nv, night_id: NIGHT.id, gate_t: play.gateT.map(r1), idle_s: r1(play.idle),
      ...(play.firstIn >= 0 ? { first_in_s: r1(play.firstIn), input: play.input } : {}),
      spook: LURE_SPOOK, ...(GATES.some(g => g.calm) ? { calm_rej: play.calmRej } : {}) };
    // Migration nights: the score is the gates cleared so far in this chapter.
    if (t) Object.assign(msg, { score: t.gates, board: chapterOf(n).board, ch: chapterOf(n).n, flock_end: t.after, run_over: t.over ? 1 : 0,
      ...(t.done ? { chapter_done: won ? 1 : 0 } : {}) });
    lastResult = msg;
    if (window.parent !== window) window.parent.postMessage(msg, '*');
  }

  // Scale the sky to the largest 2:3 box that fits the space it's given, and
  // give the canvas one pixel per screen pixel so it stays sharp at any size.
  // Drawing always uses W x H game units (draw() sets the transform).
  const field = document.getElementById('field');
  const stage = document.getElementById('stage');
  // Canvas text in sky units, never under 12.5 CSS px (cssK: CSS px per unit).
  let cssK = 1;
  const fs = n => Math.max(n, Math.ceil(12.5 / cssK));
  function fitSky() {
    const scale = Math.min(field.clientWidth / W, field.clientHeight / H);
    const w = Math.max(80, Math.floor(W * scale));
    const h = Math.max(120, Math.floor(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    cssK = w / W;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  new ResizeObserver(fitSky).observe(field);
  window.addEventListener('resize', fitSky); // browser zoom changes devicePixelRatio
  fitSky();

  // The gallery pauses the game while one of its panels covers it.
  let paused = false;
  window.addEventListener('message', evt => {
    if (evt.data && evt.data.type === 'arcade:pause') { paused = true; releaseLure(); keysUp(); }
    if (evt.data && evt.data.type === 'arcade:resume') paused = false;
  });

  const hudDusk = document.getElementById('hudDusk');
  const resetBtn = document.getElementById('resetBtn');
  const $ = id => document.getElementById(id);

  let birds, gate, passed, startles, elapsed, state, msgTimer, lure, rings, puffs, shock, lastClear = 0;
  let play;                        // this night's numbers for telemetry (report())
  const roundEarned = new Set();
  const attempts = [];             // nights started in this page session, by night
  let classicId = '';              // a classic night's run id

  function newFlock(night = 0) {
    NIGHT = NIGHTS[night];
    ({ need: GATE_NEED, window: GATE_WINDOW, half: GATE_HALF, dusk: DUSK, spook: LURE_SPOOK, gates: GATES } = NIGHT);
    CRAGS = NIGHT.crags || [];
    SCENE = SCENES[night ? chapterOf(night).scene : 'classic'];
    WIND = NIGHT.wind || [];
    if (AB_SPOOK && night === 1 && run && parseInt(run.id.slice(-1), 36) % 2) LURE_SPOOK = NIGHTS[2].spook;
    // A migration night starts with the flock the last one left (survivors keep
    // their quirks); the classic night always starts with START_BIRDS.
    const q = night && run ? run.q : null;
    const count = night && run ? run.flock : START_BIRDS;
    const k = Math.sqrt(Math.max(1, count / START_BIRDS)); // a bigger flock starts in a bigger patch
    birds = [];
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const old = q && q[i];
      birds.push({
        x: 270 + (Math.random() - 0.5) * 100 * k,
        y: 480 + (Math.random() - 0.5) * 60 * k,
        vx: Math.cos(a) * 60, vy: Math.sin(a) * 60,
        fear: 0, hit: false,
        // Individual quirks keep the flock from settling into a neat lattice.
        sep: SEP * (old ? old[0] : 0.8 + Math.random() * 0.45),
        turn: old ? old[1] : 0.6 + Math.random() * 0.8,
        wander: 0,
      });
    }
    // Recruits: calm stragglers resting off the route. Nothing special about
    // them: they join by ordinary flocking once the flock flies within VIEW.
    // (Only nights with recruits draw these random numbers.)
    for (const r of NIGHT.recruits || []) {
      for (let i = 0; i < r.n; i++) {
        const a = Math.random() * Math.PI * 2;
        birds.push({
          x: r.x + (Math.random() - 0.5) * 30, y: r.y + (Math.random() - 0.5) * 30,
          vx: Math.cos(a) * MIN_SPEED, vy: Math.sin(a) * MIN_SPEED,
          fear: 0, hit: false, sep: SEP * (0.8 + Math.random() * 0.45), turn: 0.6 + Math.random() * 0.8,
          wander: 0, recruit: true,
        });
      }
    }
    gate = 0;
    passed = new Map(); // bird -> time it crossed the active gate
    startles = 0;
    play = { lure: 0, spook: 0, idle: 0, lost: 0, lostPan: 0, lostRock: 0, calmRej: 0, scaredPk: 0, coh: 0, cohN: 0, ticks: 0,
      taps: [0, 0, 0], gateT: [], firstIn: -1, input: '', flock0: birds.length,
      run: night && run ? run.id : classicId, attempt: attempts[night] || 1 };
    elapsed = 0;
    lure = null;
    rings = [];
    puffs = [];
    shock = null;
    roundEarned.clear();
    state = 'playing';
    hideCard();
    heard = { gate: 0, birds: birds.length, lostAt: 0, light: LIGHT_MARKS.filter(m => m >= DUSK).length };
    [kb.x, kb.y] = CUR_START;
    if (!night) say('Guide the flock through the glowing gate before night falls.');
  }

  function endGame(result) {
    state = result;
    releaseLure();
    msgEl.textContent = '';
    tally = NIGHT === NIGHTS[0] ? null : tallyNight(result);
    report(result, tally);
    if (tally) showTally(); else showClassicEnd(result);
  }

  // § run: one chapter of the migration in a plain, JSON-safe object (under
  // 1 KB), ready for the gallery's save/load channel (it will store
  // serializeRun() and call restoreRun() for "Continue"). night: the next
  // night to fly; flock: birds at its dawn; gates: cleared so far in this
  // chapter (the score); q: each bird's quirks [separation factor, turn],
  // survivors first. id: one per migration, kept from chapter to chapter.
  const chapterGates = c => NIGHTS.slice(c.first, c.last + 1).reduce((s, N) => s + N.gates.length, 0);
  const MAX_GATES = Math.max(...CHAPTERS.map(chapterGates));
  let run = null, tally = null;
  const r2 = v => Math.round(v * 100) / 100;
  function newId() {
    const a = new Uint32Array(2);
    crypto.getRandomValues(a); // not Math.random: the flock's random sequence stays the balance bots'
    return (a[0].toString(36) + a[1].toString(36)).slice(0, 12);
  }
  function freshRun(c = CHAPTERS[0]) { return { v: 1, id: newId(), night: c.first, flock: START_BIRDS, gates: 0, q: [] }; }
  function serializeRun() { return run && JSON.parse(JSON.stringify(run)); }
  // Starts the run's next night at its dawn card. Rejects anything malformed.
  function restoreRun(o) {
    const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
    if (!o || o.v !== 1 || !/^[a-z0-9]{1,16}$/.test(String(o.id)) || !int(o.night, 1, LAST_NIGHT)
      || !int(o.flock, 0, FLOCK_CAP) || !int(o.gates, 0, chapterGates(chapterOf(o.night))) || !Array.isArray(o.q)) return false;
    const q = o.q.filter(p => Array.isArray(p) && p[0] >= 0.8 && p[0] <= 1.25 && p[1] >= 0.6 && p[1] <= 1.4)
      .slice(0, FLOCK_CAP).map(p => [+p[0], +p[1]]);
    run = { v: 1, id: o.id, night: o.night, flock: o.flock, gates: o.gates, q };
    tally = null;
    showDawn();
    return true;
  }
  // The flock tally after a migration night: birds lost stay lost, each gate
  // missed costs MISS_COST more, clearing every gate brings CLEAR_BONUS.
  function tallyNight(result) {
    const n = NIGHTS.indexOf(NIGHT), won = result === 'won', ch = chapterOf(n);
    const missed = GATES.length - gate, alive = birds.length;
    const after = Math.max(0, Math.min(FLOCK_CAP, alive - MISS_COST * missed + (won ? CLEAR_BONUS : 0)));
    const gates = (run ? run.gates : 0) + gate;
    const done = n === ch.last;
    const over = !done && after < NIGHTS[n + 1].need; // too few birds to pass tomorrow's gates
    const q = birds.slice(0, after).map(b => [r2(b.sep / SEP), r2(b.turn)]);
    const id = run ? run.id : newId();
    run = run && !done && !over ? { v: 1, id, night: n + 1, flock: after, gates, q } : null;
    return { night: n, ch, won, gate, missed, alive, lost: play.flock0 - alive, after, gates, over, done, id, q };
  }
  // The next chapter after a chapter's end: the same migration (run id), and
  // the flock that arrived flies on, rested back up to START_BIRDS if smaller.
  function nextChapter() {
    const t = tally, c = CHAPTERS[t.ch.n];
    restoreRun({ v: 1, id: t.id, night: c.first, flock: Math.max(START_BIRDS, t.after), gates: 0, q: t.q });
  }
  const flyChapter = c => () => restoreRun(freshRun(c));

  // § cards: the dawn of each night, its tally, run over, the chapter's end
  // and the classic night's result. Each is announced through the live region
  // and takes focus; Enter or Space presses its main button.
  const card = $('card'), cardMain = $('cardMain'), cardAlts = [$('cardAlt'), $('cardAlt2')];
  const fine = window.matchMedia('(pointer: fine)').matches;
  const words = text => text.replace(/\{Tap\}/g, fine ? 'Click' : 'Tap').replace(/\{tap\}/g, fine ? 'click' : 'tap');
  let cardActs = null, cardTimer = null, keysUsed = false;
  function showCard({ sub = '', title, cls = '', lines, main, alts = [], lock = false }) {
    $('cardSub').textContent = sub;
    $('cardTitle').textContent = title;
    $('cardTitle').className = cls;
    const body = $('cardBody');
    body.textContent = '';
    for (const [text, c] of lines) {
      if (!text) continue;
      const el = document.createElement('p');
      if (c) el.className = c;
      el.textContent = text;
      body.appendChild(el);
    }
    cardMain.textContent = main[0];
    cardAlts.forEach((b, i) => { b.textContent = alts[i] ? alts[i][0] : ''; b.hidden = !alts[i]; });
    cardActs = { main: main[1], alts: alts.map(a => a[1]) };
    card.hidden = false;
    msgEl.textContent = '';
    const end = t => /[.!?:]$/.test(t) ? t : t + '.';
    speak([sub, title, ...lines.map(l => l[0])].filter(Boolean).map(end).join(' ') + ` Enter: ${main[0]}.`);
    clearTimeout(cardTimer);
    // After a night ends, taps that were already on their way must not skip the card.
    const buttons = [cardMain, ...cardAlts];
    const ready = () => {
      for (const b of buttons) b.disabled = false;
      if (!card.hidden) cardMain.focus({ preventScroll: true });
    };
    if (lock) { for (const b of buttons) b.disabled = true; cardTimer = setTimeout(ready, END_INPUT_LOCK_MS); }

  }
  // Focus leaves the card with it, or Space would press a hidden button instead of luring.
  function hideCard() {
    card.hidden = true;
    if (card.contains(document.activeElement)) document.activeElement.blur();
  }
  cardMain.addEventListener('click', () => cardActs && cardActs.main());
  cardAlts.forEach((b, i) => b.addEventListener('click', () => cardActs && cardActs.alts[i] && cardActs.alts[i]()));
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const earnedLine = when => roundEarned.size ? `🏆 ${plural(roundEarned.size, 'achievement')} earned ${when}` : '';
  const nightOf = n => { const c = chapterOf(n); return `Chapter ${c.n} · Night ${n - c.first + 1} of ${c.last - c.first + 1}`; };
  // The other chapters, as card buttons ("Chapter 2"), and the classic night.
  const otherChapters = c => CHAPTERS.filter(o => o !== c).map(o => [`Chapter ${o.n}`, flyChapter(o)]);

  function showDawn() {
    const n = run.night, N = NIGHTS[n], c = chapterOf(n);
    newFlock(n);
    state = 'dawn';
    const waiting = (N.recruits || []).reduce((s, r) => s + r.n, 0);
    const keys = `Keys: arrows move the cursor, hold Space to lure${N.startle ? ', X startles' : ''}.`;
    // A chapter's first night (fresh flock) also offers the other chapters and the classic night.
    const start = n === c.first && !run.q.length;
    showCard({ sub: nightOf(n), title: N.name,
      lines: [[N.story, 'story'], [words(N.rule)],
        [`${plural(run.flock, 'bird')}${waiting ? ` (+${waiting} waiting)` : ''} · ${N.gates.length} gates × ${N.need} birds · ${N.dusk} s of light.`],
        [fine || keysUsed ? keys : '', 'keys']],
      main: ['Fly', fly], alts: start ? [...otherChapters(c), ['Classic night', startClassic]].slice(0, 2) : [] });
  }
  function fly() {
    if (state !== 'dawn') return;
    const n = run.night;
    play.attempt = attempts[n] = (attempts[n] || 0) + 1;
    hideCard();
    state = 'playing';
    say(`${NIGHT.name}: lead the flock through the glowing gate before night falls.${GATES[0].calm ? ' Calm gate: only calm birds count.' : ''}`);
  }
  function startClassic() {
    run = tally = null;
    classicId = newId();
    attempts[0] = (attempts[0] || 0) + 1;
    newFlock(0);
    play.attempt = attempts[0];
  }
  function newMigration() { restoreRun(freshRun()); }

  function showTally() {
    const t = tally, total = chapterGates(t.ch);
    const title = t.won ? 'Night cleared' : elapsed >= DUSK ? 'Night fell' : 'The flock scattered';
    showCard({ sub: `${nightOf(t.night)} · ${NIGHT.name}`, title, cls: t.won ? 'won' : 'lost', lock: true,
      lines: [[`Gates cleared: ${t.gate} of ${GATES.length}${t.won ? ` with ${clock(DUSK - elapsed)} of light left` : ''}.`],
        [`${plural(t.alive, 'bird')} flew on${t.lost ? `; ${t.lost} lost` : ''}${play.lostRock ? ` (${play.lostRock} on the rocks)` : ''}.`],
        [t.won ? `Every gate cleared: ${CLEAR_BONUS} birds join the flock.` : t.missed ? `${plural(t.missed, 'gate')} missed: ${MISS_COST * t.missed} birds turn back.` : ''],
        [`${t.done ? 'Flock at the end of the chapter' : 'Flock for tomorrow'}: ${plural(t.after, 'bird')}.`],
        [`Chapter ${t.ch.n}: ${t.gates} of ${total} gates.`],
        [earnedLine('tonight')]],
      main: t.done || t.over ? ['Continue', showEnd] : ['Next night', () => restoreRun(serializeRun())] });
  }
  // Run over, or the chapter's end. Score counts either way.
  function showEnd() {
    const t = tally, c = t.ch, total = chapterGates(c), next = CHAPTERS[c.n];
    const again = [`Fly Chapter ${c.n} again`, flyChapter(c)];
    if (t.over) {
      showCard({ sub: nightOf(t.night), title: 'The migration ends', cls: 'lost',
        lines: [[`The flock is down to ${plural(t.after, 'bird')}, and the gates of the next night need ${NIGHTS[t.night + 1].need}.`],
          [`Chapter ${c.n}: ${t.gates} of ${total} gates.`]],
        main: again, alts: [...otherChapters(c), ['Classic night', startClassic]].slice(0, 2) });
    } else {
      const nights = c.last - c.first + 1;
      showCard({ sub: `Chapter ${c.n} · ${c.name}`, title: t.won ? 'Chapter complete' : 'The flock falls short',
        cls: t.won ? 'won' : 'lost',
        lines: [[t.won ? `${nights} nights flown: ${c.roost}.` : `${nights} nights flown, but the last gates were missed.`],
          [`Gates cleared: ${t.gates} of ${total}. Flock: ${plural(t.after, 'bird')}.`],
          [next ? `Chapter ${next.n}, ${next.name}: the flock flies on with ${plural(Math.max(START_BIRDS, t.after), 'bird')}.` : c.next, 'story']],
        main: next ? [`Fly on to Chapter ${next.n}`, nextChapter] : again,
        alts: next ? [again, ['Classic night', startClassic]] : [...otherChapters(c), ['Classic night', startClassic]].slice(0, 2) });
    }
  }
  function showClassicEnd(result) {
    const night = result === 'lost' && elapsed >= DUSK;
    showCard({ sub: 'Classic night', title: result === 'won' ? 'Flock home!' : night ? 'Night fell' : 'The flock scattered',
      cls: result, lock: true,
      lines: [[result === 'won'
        ? `All ${GATES.length} gates with ${plural(birds.length, 'bird')} in ${clock(elapsed)}, ${clock(DUSK - elapsed)} before dark.`
        : night
          ? `The flock was still at gate ${gate + 1} of ${GATES.length} when the light ran out.`
          : `Only ${plural(birds.length, 'bird')} left; a gate needs ${GATE_NEED}.`],
        [earnedLine('this round')]],
      main: ['Fly again', startClassic], alts: CHAPTERS.map(o => [`Chapter ${o.n}`, flyChapter(o)]) });
  }

  function clock(sec) {
    const t = Math.max(0, Math.ceil(sec));
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  }

  function say(text) {
    msgEl.textContent = text;
    speak(text);
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { if (state === 'playing') msgEl.textContent = ''; }, 3000);
  }

  // § live region: screen readers hear what changed, at most once a frame
  // (gates, birds lost, light left, the result), never the frame itself.
  const sayEl = document.getElementById('say');
  let spoken = [], heard;
  function speak(text) { spoken.push(text); }
  function flushSpeech() {
    if (!spoken.length) return;
    sayEl.textContent = spoken.join(' ');
    spoken = [];
  }
  const LIGHT_MARKS = [30, 15, 5];  // seconds of light left worth a line
  function announce() {
    if (state !== 'playing') return flushSpeech();
    if (gate > heard.gate) {
      heard.gate = gate;
      const left = GATES.length - gate;
      speak(`Gate ${gate} cleared with ${lastClear} birds. ${left} gate${left === 1 ? '' : 's'} left.${left && GATES[gate].calm ? ' Next is a calm gate: only calm birds count.' : ''}`);
    }
    // Losses come in bursts: say the new size once it has held for a second.
    if (birds.length < heard.birds) {
      if (!heard.lostAt) heard.lostAt = elapsed;
      if (elapsed - heard.lostAt >= 1) {
        heard.birds = birds.length;
        heard.lostAt = 0;
        speak(`Flock down to ${birds.length} birds${birds.length < GATE_NEED + 5 ? `; a gate needs ${GATE_NEED}` : ''}.`);
      }
    }
    const left = DUSK - elapsed;
    while (heard.light < LIGHT_MARKS.length && left <= LIGHT_MARKS[heard.light]) {
      if (left > LIGHT_MARKS[heard.light] - 1) speak(`${LIGHT_MARKS[heard.light]} seconds of light left.`);
      heard.light++;
    }
    flushSpeech();
  }

  function gateEnds(g) {
    const a = g.a * Math.PI / 180;
    const dx = Math.cos(a) * GATE_HALF, dy = Math.sin(a) * GATE_HALF;
    return [g.x - dx, g.y - dy, g.x + dx, g.y + dy];
  }

  // Does the segment p1->p2 cross the segment q1->q2?
  function crosses(p1x, p1y, p2x, p2y, q1x, q1y, q2x, q2y) {
    const d = (p2x - p1x) * (q2y - q1y) - (p2y - p1y) * (q2x - q1x);
    if (d === 0) return false;
    const t = ((q1x - p1x) * (q2y - q1y) - (q1y - p1y) * (q2x - q1x)) / d;
    const u = ((q1x - p1x) * (p2y - p1y) - (q1y - p1y) * (p2x - p1x)) / d;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1;
  }

  // ---------- mechanic 1: lure (hold) ----------
  // Calm birds are drawn to the lure; fear cancels its pull. Packing the
  // flock tight around it raises fear through crowding (see step()).
  function releaseLure() { lure = null; kb.lure = false; }

  // ---------- mechanic 2: startle (tap) ----------
  // Writes fear directly and shoves nearby birds away from the tap.
  function startle(x, y) {
    if (state !== 'playing' || !NIGHT.startle) return; // nights without startle: taps do nothing
    startles++;
    // Where the tap fell relative to the flock's heading (telemetry): behind,
    // beside or ahead of the main cluster.
    const c = mainCluster(), dx = x - c.x, dy = y - c.y, d = Math.hypot(dx, dy), sp = Math.hypot(c.vx, c.vy);
    const ahead = d > 1 && sp > 1 ? (dx * c.vx + dy * c.vy) / (d * sp) : 0;
    play.taps[ahead < -0.5 ? 0 : ahead > 0.5 ? 2 : 1]++;
    rings.push({ x, y, t: 0 });
    let touched = 0;
    for (const b of birds) {
      b.hit = b.fear > SCARED; // already scared: doesn't count as spread
      const dx = b.x - x, dy = b.y - y;
      const d = Math.hypot(dx, dy);
      if (d >= STARTLE_R) continue;
      const k = 1 - d / STARTLE_R;
      b.fear = Math.min(1, b.fear + STARTLE_FEAR * k);
      b.vx += (dx / (d || 1)) * STARTLE_PUSH * k;
      b.vy += (dy / (d || 1)) * STARTLE_PUSH * k;
      b.hit = true;
      touched++;
    }
    // Watch how far this panic spreads beyond the birds the tap touched.
    shock = touched ? { t: 0 } : null;
  }

  // The main cluster: the mean of the birds within 70 of the centre, refined
  // three times (as the balance bots find it), and its mean velocity.
  function mainCluster() {
    let x = 0, y = 0, vx = 0, vy = 0;
    for (const b of birds) { x += b.x; y += b.y; }
    x /= birds.length || 1; y /= birds.length || 1;
    for (let it = 0; it < 3; it++) {
      let sx = 0, sy = 0, n = 0;
      vx = 0; vy = 0;
      for (const b of birds) if (Math.hypot(b.x - x, b.y - y) < 70) { sx += b.x; sy += b.y; vx += b.vx; vy += b.vy; n++; }
      if (n) { x = sx / n; y = sy / n; vx /= n; vy /= n; }
    }
    return { x, y, vx, vy };
  }

  // ---------- simulation ----------
  // The wind's sideways speed at height y (the bands of the night's wind).
  function windAt(y) {
    for (const w of WIND) {
      const k = Math.min(1, (y - w.y0) / 15, (w.y1 - y) / 15); // eases in over 15 units at each side
      if (k > 0) return w.v * k;
    }
    return 0;
  }
  function step(dt) {
    elapsed += dt;
    let spooking = false;
    const fears = birds.map(b => b.fear); // contagion reads last step's fear
    const near = [];                      // (distance², index) pairs of one bird's neighbors
    for (let i = 0; i < birds.length; i++) {
      const b = birds[i];
      let n = 0, cx = 0, cy = 0, avx = 0, avy = 0, sx = 0, sy = 0, close = 0, maxF = 0, na = 0;
      near.length = 0;
      for (let j = 0; j < birds.length; j++) {
        if (i === j) continue;
        const o = birds[j];
        const dx = o.x - b.x, dy = o.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > VIEW * VIEW) continue;
        near.push(d2, j);
        n++;
        cx += o.x; cy += o.y;
        if (fears[j] > maxF) maxF = fears[j];
        if (d2 < b.sep * b.sep) {
          const d = Math.sqrt(d2) || 0.01;
          const push = (b.sep - d) / b.sep * 400;
          sx -= dx / d * push; sy -= dy / d * push;
        }
        if (d2 < CROWD_R * CROWD_R) close++;
      }
      // Alignment only looks at the nearest few neighbors.
      while (near.length > NEIGHBORS * 2) {
        let far = 0;
        for (let k = 2; k < near.length; k += 2) if (near[k] > near[far]) far = k;
        near[far] = near[near.length - 2]; near[far + 1] = near[near.length - 1];
        near.length -= 2;
      }
      for (let k = 1; k < near.length; k += 2) {
        const o = birds[near[k]];
        na++;
        avx += o.vx; avy += o.vy;
      }

      // Fear: fades on its own, spreads from scared neighbors, grows in a crush.
      let f = b.fear - FEAR_DECAY * dt;
      if (maxF * CONTAGION_KEEP > f) f += (maxF * CONTAGION_KEEP - f) * CONTAGION * dt;
      if (close > CROWD_N) f += (close - CROWD_N) * CROWD_FEAR * dt;
      const lureD = lure && lure.on ? Math.hypot(lure.x - b.x, lure.y - b.y) : Infinity;
      if (lureD < LURE_SPOOK_R) { f += LURE_SPOOK * dt; spooking = true; }
      b.fear = Math.max(0, Math.min(1, f));

      const calm = 1 - b.fear;
      let ax = sx * (1 + b.fear), ay = sy * (1 + b.fear);
      if (n) {
        // Scared birds stop flocking together but still match their neighbors'
        // heading, so a startle sweeps through the flock as one wave.
        ax += (cx / n - b.x) * 1.5 * calm + (avx / na - b.vx) * 1.5;
        ay += (cy / n - b.y) * 1.5 * calm + (avy / na - b.vy) * 1.5;
      }
      if (lureD < LURE_R) {
        const reach = Math.min(1, (LURE_R - lureD) / (LURE_R - LURE_FULL));
        const pull = LURE_ACCEL * calm * calm * reach / (lureD || 1);
        ax += (lure.x - b.x) * pull;
        ay += (lure.y - b.y) * pull;
      }
      // Swirl: steer sideways (clockwise), weaker while following the lure.
      // Each bird turns a little harder or softer than the rest and wanders on
      // its own, so the flock keeps folding and reshaping instead of turning
      // as one rigid block.
      b.wander += -b.wander / WANDER_TIME * dt + (Math.random() - 0.5) * Math.sqrt(24 * dt / WANDER_TIME);
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const swirl = (SWIRL * b.turn * (lure && lure.on ? 0.3 : 1) + WANDER * b.wander) * calm;
      ax += -b.vy / sp * swirl;
      ay += b.vx / sp * swirl;
      ax += (Math.random() - 0.5) * 250 * b.fear;
      ay += (Math.random() - 0.5) * 250 * b.fear;
      // Calm birds turn back from the edges; panicked ones fly right out.
      const edge = Math.max(0, 1 - b.fear / PANIC) * EDGE_TURN;
      if (b.x < EDGE) ax += (EDGE - b.x) * edge;
      if (b.x > W - EDGE) ax -= (b.x - (W - EDGE)) * edge;
      if (b.y < EDGE) ay += (EDGE - b.y) * edge;
      if (b.y > H - EDGE) ay -= (b.y - (H - EDGE)) * edge;
      // Crags: the same rule as the edges. Calm birds swerve, sliding round the
      // side they are already heading for; panicked ones fly straight on.
      if (CRAGS.length && b.fear < PANIC) {
        const turn = (1 - (b.fear / PANIC) ** 3) * CRAG_TURN; // strong until close to panic
        for (const c of CRAGS) {
          const dx = b.x - c.x, dy = b.y - c.y, d = Math.hypot(dx, dy) || 1, m = c.r + CRAG_M - d;
          if (m <= 0) continue;
          const nx = dx / d, ny = dy / d, side = b.vx * -ny + b.vy * nx >= 0 ? 1 : -1;
          ax += (nx - ny * side * 0.6) * m * turn;
          ay += (ny + nx * side * 0.6) * m * turn;
        }
      }

      b.vx += ax * dt;
      b.vy += ay * dt;
      const speed = Math.hypot(b.vx, b.vy) || 1;
      const max = CALM_MAX + PANIC_EXTRA * b.fear;
      const clamped = Math.max(MIN_SPEED, Math.min(max, speed));
      b.vx *= clamped / speed;
      b.vy *= clamped / speed;
    }

    if (lure && lure.on) play.lure += dt;
    if (spooking) play.spook += dt;
    if (!lure && !kb.held.size) play.idle += dt;
    let scared = 0;
    for (const b of birds) if (b.fear >= SCARED) scared++;
    play.scaredPk = Math.max(play.scaredPk, scared / (birds.length || 1));
    // Cohesion: mean distance to the nearest neighbour, every 0.5 s.
    if (play.ticks++ % 30 === 0 && birds.length > 1) {
      let sum = 0;
      for (const b of birds) {
        let m = Infinity;
        for (const o of birds) if (o !== b) m = Math.min(m, (o.x - b.x) ** 2 + (o.y - b.y) ** 2);
        sum += Math.sqrt(m);
      }
      play.coh += sum / birds.length;
      play.cohN++;
    }

    const [g1x, g1y, g2x, g2y] = gateEnds(GATES[gate]), calmGate = GATES[gate].calm;
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      const px = b.x, py = b.y;
      b.x += (b.vx + windAt(b.y)) * dt; // the wind carries every bird, scared or calm
      b.y += b.vy * dt;
      if (crosses(px, py, b.x, b.y, g1x, g1y, g2x, g2y)) {
        if (!calmGate || b.fear < SCARED) passed.set(b, elapsed);
        else play.calmRej++;
      }
      const rock = CRAGS.find(c => Math.hypot(b.x - c.x, b.y - c.y) < c.r);
      if (rock || b.x < -15 || b.x > W + 15 || b.y < -15 || b.y > H + 15) {
        play.lost++;
        if (rock) { play.lostRock++; puffs.push({ x: b.x, y: b.y, t: 0 }); }
        else if (b.fear >= PANIC) play.lostPan++;
        birds.splice(i, 1);
        passed.delete(b);
      }
    }

    // Only birds that crossed recently count: the flock has to go through together.
    for (const [b, t] of passed) if (elapsed - t > GATE_WINDOW) passed.delete(b);

    if (shock) {
      shock.t += dt;
      const spread = birds.filter(b => !b.hit && b.fear > SCARED).length;
      if (spread >= 15) unlock('chain-panic');
      if (shock.t > 2.5) shock = null;
    }
    for (const r of rings) r.t += dt;
    rings = rings.filter(r => r.t < 0.5);
    for (const p of puffs) p.t += dt;
    puffs = puffs.filter(p => p.t < 0.8);

    if (passed.size >= GATE_NEED) {
      lastClear = passed.size;
      gate++;
      play.gateT.push(elapsed);
      passed = new Map();
      if (gate === 1) unlock('first-gate');
      if (gate >= GATES.length) {
        // Per night: every gate cleared (the classic night's 5, or a migration night's).
        unlock('flock-home');
        if (!play.lost) unlock('no-bird-left');
        if (NIGHT.startle && startles <= 3) unlock('soft-touch'); // free on a night with no startle
        if (DUSK - elapsed >= DUSK * 0.25) unlock('swift');
        if (DUSK - elapsed < 5) unlock('last-light');
        if (GATES.length >= 3 && play.spook < 2 && !startles && play.lure >= 10) unlock('gentle-hand');
        if (NIGHT.id === 'the-edge') {
          unlock('gathered');
          if (play.lost <= 2) unlock('edge-dancer');
        }
        if (CRAGS.length && !play.lostRock) unlock('sure-wings');
        if (WIND.length && play.lost <= 2) unlock('into-the-wind');
        if (NIGHT.id === 'the-high-pass') unlock('high-pass');
        endGame('won');
        return;
      }
    }
    if (birds.length < GATE_NEED || elapsed >= DUSK) endGame('lost');
  }

  // ---------- drawing ----------
  // § scenes: each chapter's sky and horizon. Colors are [sunset, night]
  // pairs of [r, g, b]; the land stays in the bottom 120 units, below where
  // calm birds fly (EDGE), and lighter than the birds.
  const SCENES = {
    classic: { top: [[91, 75, 138], [14, 12, 34]], mid: [[192, 112, 138], [34, 27, 66]], low: [[246, 178, 107], [58, 40, 84]] },
    // Chapter 1: the marsh at sunset, a tree line and still water.
    marsh: { top: [[91, 75, 138], [14, 12, 34]], mid: [[192, 112, 138], [34, 27, 66]], low: [[246, 178, 107], [58, 40, 84]],
      land: [
        { fill: [[108, 64, 94], [32, 24, 52]], pts: [0, 562, 30, 552, 55, 558, 90, 545, 120, 556, 160, 548, 200, 557, 240, 543, 275, 554, 320, 547, 360, 558, 400, 550, 400, 600, 0, 600] },
        { fill: [[232, 160, 120], [52, 40, 78]], pts: [0, 574, 400, 574, 400, 600, 0, 600] }],
      reeds: true },
    // Chapter 2: a cold sky over the mountains, snow on the far peaks.
    pass: { top: [[52, 74, 132], [9, 13, 34]], mid: [[128, 144, 196], [24, 32, 68]], low: [[238, 202, 178], [44, 48, 86]],
      land: [
        { fill: [[118, 128, 178], [26, 30, 60]], snow: [[240, 243, 252], [74, 80, 116]],
          pts: [0, 560, 40, 522, 75, 546, 120, 486, 160, 532, 190, 516, 235, 474, 280, 526, 320, 500, 360, 540, 400, 506, 400, 600, 0, 600] },
        { fill: [[78, 84, 124], [16, 18, 40]],
          pts: [0, 582, 50, 556, 100, 576, 150, 548, 210, 580, 260, 562, 310, 586, 360, 552, 400, 572, 400, 600, 0, 600] }] },
  };
  let SCENE = SCENES.classic;
  function mix([a, b], t) {
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  }
  // Reduced motion: the flock is the game and keeps flying; decoration (the
  // lure's pulse, the startle ring's spread) runs on its own clock, frozen.
  const motionQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  const still = () => motionQ.matches;
  const STARS = [];
  for (let i = 0; i < 40; i++) STARS.push([Math.random() * W, Math.random() * H * 0.6, 0.5 + Math.random() * 0.8]);
  function drawLand(dark) {
    for (const l of SCENE.land || []) {
      const p = l.pts;
      ctx.fillStyle = mix(l.fill, dark);
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
      ctx.fill();
      if (l.snow) { // a cap on each peak: the slopes' top quarter
        ctx.fillStyle = mix(l.snow, dark);
        for (let i = 2; i < p.length - 6; i += 2) {
          if (!(p[i + 1] < p[i - 1] && p[i + 1] < p[i + 3]) || p[i + 1] > 530) continue;
          const lx = p[i] + (p[i - 2] - p[i]) * 0.25, ly = p[i + 1] + (p[i - 1] - p[i + 1]) * 0.25;
          const rx = p[i] + (p[i + 2] - p[i]) * 0.25, ry = p[i + 1] + (p[i + 3] - p[i + 1]) * 0.25;
          ctx.beginPath();
          ctx.moveTo(p[i], p[i + 1]); ctx.lineTo(rx, ry); ctx.lineTo((p[i] + rx) / 2, ry - 2);
          ctx.lineTo(p[i], ry + 1); ctx.lineTo((p[i] + lx) / 2, ly - 2); ctx.lineTo(lx, ly);
          ctx.fill();
        }
      }
    }
    if (SCENE.reeds) { // shimmer on the water, then reeds at its edge
      ctx.strokeStyle = `rgba(255,236,214,${0.55 - dark * 0.35})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const [x, y, w] of [[40, 580, 60], [150, 586, 90], [290, 579, 70], [90, 593, 50], [250, 594, 80]]) { ctx.moveTo(x, y); ctx.lineTo(x + w, y); }
      ctx.stroke();
      ctx.strokeStyle = mix([[96, 62, 88], [22, 18, 38]], dark);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let x = 6; x < W; x += 9 + (x * 7) % 11) {
        const h = 14 + (x * 13) % 16, lean = ((x * 5) % 7 - 3) * 0.8;
        ctx.moveTo(x, 600); ctx.quadraticCurveTo(x, 600 - h * 0.6, x + lean, 600 - h);
      }
      ctx.stroke();
    }
  }
  // Wind bands: a faint band with streaks blowing through it (still under
  // reduced motion) and chevrons at both ends pointing downwind.
  function drawWind() {
    const t = still() ? 0 : elapsed;
    for (const w of WIND) {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(0, w.y0, W, w.y1 - w.y0);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      const dir = Math.sign(w.v), len = 22;
      for (let i = 0; i < 16; i++) {
        const y = w.y0 + 10 + ((i * 37) % 97) / 97 * (w.y1 - w.y0 - 20);
        const x = (((i * 71) % 400 + w.v * t * 1.5) % (W + 60) + W + 60) % (W + 60) - 30;
        ctx.moveTo(x, y); ctx.lineTo(x - dir * len, y);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const ym = (w.y0 + w.y1) / 2;
      for (const x0 of [14, W - 30]) for (let k = 0; k < 3; k++) {
        const x = x0 + k * 7 * dir + (dir < 0 ? 14 : 0);
        ctx.moveTo(x, ym - 6); ctx.lineTo(x + 5 * dir, ym); ctx.lineTo(x, ym + 6);
      }
      ctx.stroke();
    }
  }
  // A crag: a jagged rock (its shape fixed by its place in the sky), lit from
  // the sunset side, with a pale rim at night like the birds.
  function drawCrag(c, dark) {
    const pts = [];
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2, k = 0.92 + 0.2 * Math.abs(Math.sin(c.x * 0.37 + c.y * 0.11 + i * 2.3));
      pts.push(c.x + Math.cos(a) * c.r * k, c.y + Math.sin(a) * c.r * k);
    }
    const path = () => { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); };
    path();
    ctx.fillStyle = mix([[86, 76, 92], [30, 28, 44]], dark);
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = mix([[132, 118, 128], [48, 46, 68]], dark); // the lit face
    ctx.beginPath(); ctx.arc(c.x - c.r * 0.35, c.y - c.r * 0.4, c.r * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    path();
    ctx.strokeStyle = `rgba(236,228,255,${0.25 + dark * 0.4})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  function draw() {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    // The sky darkens from sunset to night as the light runs out.
    const dark = Math.min(1, elapsed / DUSK);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, mix(SCENE.top, dark));
    sky.addColorStop(0.55, mix(SCENE.mid, dark));
    sky.addColorStop(1, mix(SCENE.low, Math.pow(dark, 1.5))); // the horizon glow lingers
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    if (dark > 0.5) {
      ctx.fillStyle = `rgba(255,255,255,${(dark - 0.5) * 1.6})`;
      for (const [x, y, r] of STARS) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    }
    drawLand(dark);
    drawWind();
    for (const c of CRAGS) drawCrag(c, dark);

    // Gates: the active one glows and fills gold as birds pass; the next is faint.
    for (let k = GATES.length - 1; k >= gate; k--) {
      const active = k === gate;
      if (!active && k > gate + 1) continue;
      const [x1, y1, x2, y2] = gateEnds(GATES[k]);
      const calm = GATES[k].calm;
      ctx.globalAlpha = active ? 1 : 0.3;
      ctx.lineWidth = 3;
      ctx.setLineDash(calm ? [2, 5] : [6, 6]);
      ctx.strokeStyle = calm ? 'rgba(190,235,255,0.9)' : 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.setLineDash([]);
      if (active && state === 'playing') {
        const t = Math.min(passed.size / GATE_NEED, 1);
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t); ctx.stroke();
        // Count beside the gate line, not on it, on a dark backing: white on
        // the sunset sky was 3.5:1, and birds fly behind it.
        const f = fs(12), label = `${calm ? 'calm ' : ''}${passed.size}/${GATE_NEED}`;
        ctx.font = `600 ${f}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const a = GATES[k].a * Math.PI / 180, off = 10 + f * 0.6;
        const lx = GATES[k].x + Math.sin(a) * off, ly = GATES[k].y - Math.cos(a) * off;
        const bw = ctx.measureText(label).width + f * 0.8, bh = f * 1.5;
        ctx.fillStyle = 'rgba(13,11,22,0.85)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(lx - bw / 2, ly - bh / 2, bw, bh, f * 0.4); else ctx.rect(lx - bw / 2, ly - bh / 2, bw, bh);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText(label, lx, ly + 1);
        ctx.textBaseline = 'alphabetic';
      }
      // Posts: dots, or rings on a calm gate (shape, not only color, says which).
      for (const [px, py] of [[x1, y1], [x2, y2]]) {
        ctx.beginPath(); ctx.arc(px, py, calm ? 6 : 4.5, 0, Math.PI * 2);
        if (!calm) { ctx.fillStyle = '#fff'; ctx.fill(); continue; }
        for (const [c, w] of [['rgba(13,11,22,0.7)', 4.5], ['#e6f7ff', 2]]) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
    }

    // A bird lost on a crag: a burst of feathers.
    for (const p of puffs) {
      const k = p.t / 0.8, r = still() ? 6 : 3 + 9 * k;
      ctx.strokeStyle = `rgba(240,232,255,${0.8 * (1 - k)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + 0.4;
        ctx.moveTo(p.x + Math.cos(a) * r * 0.5, p.y + Math.sin(a) * r * 0.5);
        ctx.lineTo(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r);
      }
      ctx.stroke();
    }

    // Startle shockwaves.
    // (Reduced motion: the ring shows the startle's reach and fades, no spread.)
    for (const r of rings) {
      ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - r.t / 0.5)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, STARTLE_R * (still() ? 1 : 0.3 + 0.7 * r.t / 0.5), 0, Math.PI * 2); ctx.stroke();
    }

    // Lure: a faint dashed circle for its reach, and a ring at the spook
    // radius, wide enough to show around a fingertip (v7: a 10-unit ring hid
    // under the finger on a phone, so the player saw no lure at all). The
    // ring turns red while birds inside it are being spooked: lead further.
    if (lure && lure.on) {
      const spooking = birds.some(b => Math.hypot(lure.x - b.x, lure.y - b.y) < LURE_SPOOK_R);
      const tm = still() ? 0 : performance.now();
      ctx.setLineDash([4, 8]);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(lure.x, lure.y, LURE_R, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      const pulse = LURE_SPOOK_R + 2 * Math.sin(tm / 150);
      if (spooking) {
        ctx.fillStyle = 'rgba(224,68,78,0.18)';
        ctx.beginPath(); ctx.arc(lure.x, lure.y, pulse, 0, Math.PI * 2); ctx.fill();
      }
      for (const [c, w] of [['rgba(13,11,22,0.55)', 4.5], [spooking ? '#ff6b75' : 'rgba(255,255,255,0.85)', 2]]) {
        ctx.strokeStyle = c;
        ctx.lineWidth = w;
        ctx.beginPath(); ctx.arc(lure.x, lure.y, pulse, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(lure.x, lure.y, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    // Birds: dark silhouettes that flush red with fear.
    for (const b of birds) {
      const a = Math.atan2(b.vy, b.vx);
      const r = Math.round(27 + (224 - 27) * b.fear);
      const g = Math.round(22 + (68 - 22) * b.fear);
      const bl = Math.round(38 + (78 - 38) * b.fear);
      ctx.fillStyle = `rgb(${r},${g},${bl})`;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(-4, 3.5);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-4, -3.5);
      ctx.closePath();
      ctx.fill();
      if (dark > 0.3) { // a pale rim keeps dark birds visible against the night
        ctx.strokeStyle = `rgba(236,228,255,${(dark - 0.3) * 0.8})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      ctx.restore();
    }

    if (kb.shown && state === 'playing') drawCursor();

    const n = NIGHTS.indexOf(NIGHT), c = n && chapterOf(n);
    $('hudNight').textContent = c ? `${n - c.first + 1}/${c.last - c.first + 1}` : 'Classic';
    $('hudStartleBox').hidden = !NIGHT.startle;
    resetBtn.textContent = !run && !tally ? 'New flock' : performance.now() - resetArmed < 3000 ? 'Start over?' : 'Start over';
    document.getElementById('hudBirds').textContent = birds.length;
    document.getElementById('hudGate').textContent = `${Math.min(gate + 1, GATES.length)}/${GATES.length}`;
    document.getElementById('hudStartles').textContent = startles;
    hudDusk.textContent = clock(DUSK - elapsed);
    hudDusk.classList.toggle('late', DUSK - elapsed <= 10);
  }

  // ---------- input ----------
  // A short press without moving is a startle; holding (or moving) is a lure.
  let pointerDown = false, downAt = 0, startPx = null, holdTimer = null;

  function toSky(evt) {
    const rect = canvas.getBoundingClientRect();
    return [(evt.clientX - rect.left) * W / rect.width, (evt.clientY - rect.top) * H / rect.height];
  }

  canvas.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    kb.shown = false;
    if (state !== 'playing' || paused) return;
    canvas.setPointerCapture(evt.pointerId);
    pointerDown = true;
    downAt = performance.now();
    startPx = [evt.clientX, evt.clientY];
    noteInput('touch');
    const [x, y] = toSky(evt);
    // With no startle tonight a press lures at once; otherwise a short one startles.
    lure = { x, y, on: !NIGHT.startle };
    clearTimeout(holdTimer);
    if (NIGHT.startle) holdTimer = setTimeout(() => { if (lure) lure.on = true; }, HOLD_MS);
  });

  canvas.addEventListener('pointermove', evt => {
    if (!pointerDown || !lure) return;
    [lure.x, lure.y] = toSky(evt);
    if (Math.hypot(evt.clientX - startPx[0], evt.clientY - startPx[1]) > MOVE_PX) lure.on = true;
  });

  canvas.addEventListener('pointerup', evt => {
    if (!pointerDown) return;
    pointerDown = false;
    clearTimeout(holdTimer);
    const quick = performance.now() - downAt < HOLD_MS;
    const still = Math.hypot(evt.clientX - startPx[0], evt.clientY - startPx[1]) <= MOVE_PX;
    if (quick && still && !paused) startle(...toSky(evt));
    releaseLure();
  });
  // A cancelled pointer (e.g. the browser took over the gesture) does nothing.
  canvas.addEventListener('pointercancel', () => {
    pointerDown = false;
    clearTimeout(holdTimer);
    releaseLure();
  });

  // The bar's button: a new classic flock, or (migration) start the chapter
  // over from its first night, which takes a second press within 3 s so a stray tap can't end a run.
  let resetArmed = -1e9;
  resetBtn.addEventListener('click', () => {
    if (!run && !tally) return startClassic();
    if (performance.now() - resetArmed < 3000) { resetArmed = -1e9; flyChapter(chapterOf(NIGHTS.indexOf(NIGHT)))(); }
    else resetArmed = performance.now();
  });
  // Telemetry: when the first input of a night came, and from what.
  function noteInput(kind) {
    if (kind === 'keys') keysUsed = true;
    if (state === 'playing' && play.firstIn < 0) { play.firstIn = elapsed; play.input = kind; }
  }

  // § keys: the same verbs without a pointer. Arrows move a cursor over the
  // sky while held (slow at first for aiming a startle, then fast enough to
  // lead the flock), Space held lures toward it (letting go stops, like
  // lifting a finger), Enter or X startles at it. Same startle() and lure as
  // the pointer, so the simulation can't tell the difference.
  const CUR_SLOW = 110, CUR_FAST = 260, CUR_RAMP = 0.6; // sky units per second; seconds to full speed
  const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  // The cursor starts between the flock and gate 1, clear of the birds (a
  // lure on top of them spooks them).
  const CUR_START = [170, 430];
  const kb = { x: CUR_START[0], y: CUR_START[1], held: new Set(), heldFor: 0, lure: false, shown: false };
  function keysUp() {
    kb.held.clear();
    if (kb.lure) { kb.lure = false; releaseLure(); }
  }
  function moveCursor(dt) {
    let dx = 0, dy = 0;
    for (const k of kb.held) { dx += DIRS[k][0]; dy += DIRS[k][1]; }
    if (!dx && !dy) { kb.heldFor = 0; }
    else {
      kb.heldFor += dt;
      const v = (CUR_SLOW + (CUR_FAST - CUR_SLOW) * Math.min(1, kb.heldFor / CUR_RAMP)) * dt / Math.hypot(dx, dy);
      kb.x = Math.max(0, Math.min(W, kb.x + dx * v));
      kb.y = Math.max(0, Math.min(H, kb.y + dy * v));
    }
    if (kb.lure && lure) { lure.x = kb.x; lure.y = kb.y; }
  }
  function drawCursor() {
    // A dark ring under a white one reads on the sunset and the night sky;
    // the dashed circle is the startle's reach.
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(kb.x, kb.y, STARTLE_R, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    for (const [c, w] of [['rgba(13,11,22,0.9)', 5], ['#fff', 2]]) {
      ctx.strokeStyle = c;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.arc(kb.x, kb.y, 8, 0, Math.PI * 2);
      ctx.moveTo(kb.x - 14, kb.y); ctx.lineTo(kb.x - 8, kb.y);
      ctx.moveTo(kb.x + 8, kb.y); ctx.lineTo(kb.x + 14, kb.y);
      ctx.moveTo(kb.x, kb.y - 14); ctx.lineTo(kb.x, kb.y - 8);
      ctx.moveTo(kb.x, kb.y + 8); ctx.lineTo(kb.x, kb.y + 14);
      ctx.stroke();
    }
  }
  window.addEventListener('keydown', evt => {
    if (evt.ctrlKey || evt.metaKey || evt.altKey || evt.key === 'Tab') return;
    const onButton = evt.target && evt.target.tagName === 'BUTTON';
    const k = evt.key === ' ' ? 'space' : evt.key.toLowerCase();
    if (onButton && (k === 'enter' || k === 'space')) return; // the focused button presses itself
    if (evt.key in DIRS) {
      evt.preventDefault();
      if (onButton) evt.target.blur();
      if (paused || state !== 'playing') return;
      noteInput('keys');
      kb.held.add(evt.key);
      kb.shown = true;
      return;
    }
    if (paused) return;
    if (state !== 'playing') {
      // A card is up: Enter or Space presses its main button.
      if ((k === 'enter' || k === 'space') && !card.hidden) {
        evt.preventDefault();
        if (!evt.repeat && !cardMain.disabled) cardMain.click();
      }
      return;
    }
    if (k === 'space') {
      evt.preventDefault();
      kb.shown = true;
      if (evt.repeat || kb.lure || pointerDown) return;
      noteInput('keys');
      kb.lure = true;
      lure = { x: kb.x, y: kb.y, on: true };
    } else if ((k === 'enter' || k === 'x') && NIGHT.startle) { // ignored on nights without startle
      evt.preventDefault();
      kb.shown = true;
      noteInput('keys');
      if (!evt.repeat) startle(kb.x, kb.y);
    }
  });
  window.addEventListener('keyup', evt => {
    if (evt.key in DIRS) kb.held.delete(evt.key);
    if (evt.key === ' ' && kb.lure) { kb.lure = false; releaseLure(); }
  });
  window.addEventListener('blur', keysUp);

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    acc += dt;
    last = now;
    if (state === 'playing' && !paused) moveCursor(dt);
    while (acc >= STEP) {
      if (state === 'playing' && !paused) step(STEP);
      acc -= STEP;
    }
    announce();
    draw();
    requestAnimationFrame(frame);
  }

  // The game opens on night 1's dawn card.
  newMigration();
  requestAnimationFrame(frame);
})();
// § a11y label
// The canvas label names the verbs, with the word for this device.
{
  const fine = window.matchMedia('(pointer: fine)').matches;
  const t = fine ? 'click' : 'tap', H = fine ? 'Click and hold' : 'Hold';
  document.getElementById('sky').setAttribute('aria-label', `Murmuration sky. ${H} to lure the flock, ${t} to startle it. Keys: arrows move a cursor, hold Space to lure, Enter or X startles.`);
}
</script>
</body>
</html>
