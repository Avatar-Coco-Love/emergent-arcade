<!DOCTYPE html>
<html lang="en">
<head>
<script>
// § crash report: uncaught errors go to the arcade's telemetry (docs/telemetry.md, "Errors").
(function () {
  var sent = 0;
  function report(message, line, col) {
    if (window.parent === window || sent++ >= 3) return;
    try {
      window.parent.postMessage({ type: 'arcade:error', game: 'ant-trails', message: String(message).slice(0, 300), line: line | 0, col: col | 0 }, '*');
    } catch (_) {}
  }
  window.addEventListener('error', function (e) { report(e.message, e.lineno, e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled rejection: ' + (r && r.message ? r.message : r), 0, 0);
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Trails</title>
<style>
  :root {
    --bg: #17110c;
    --panel: #251b13;
    --text: #f1e9de;
    --muted: #b3a491;
    --accent: #d9a23b;
  }
  * { box-sizing: border-box; }
  /* Fill whatever window the game is given (a browser tab or the gallery
     cabinet); the ground scales to fit both width and height. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    gap: 8px;
  }
  #field { flex: 1; min-height: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  #ground {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    border-radius: 10px;
  }
  /* Text over the ground and the scent glow sits on its own dark backing. */
  #msg {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 16px);
    margin: 0;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(23, 17, 12, 0.85);
    text-align: center;
    font-size: 0.85rem;
    color: #fff;
    pointer-events: none;
  }
  #msg:empty { display: none; }
  #bonus {
    position: absolute;
    left: 6px;
    bottom: 6px;
    max-width: calc(100% - 92px);
    margin: 0;
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(23, 17, 12, 0.85);
    font-size: 0.8rem;
    color: #f3e3c4;
    pointer-events: none;
  }
  #bonus.done { color: #bfe89a; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #ffBtn {
    position: absolute;
    right: 6px;
    bottom: 6px;
    padding: 5px 10px;
    font-size: 0.8rem;
    background: rgba(37, 27, 19, 0.8);
    font-variant-numeric: tabular-nums;
  }
  #ffBtn.on { color: #1d140c; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  #endCard {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(86%, 300px);
    padding: 18px 16px;
    border-radius: 12px;
    background: rgba(37, 27, 19, 0.95);
    border: 1px solid #4a3826;
    text-align: center;
  }
  #endCard[hidden] { display: none; }
  #endCard h2 { margin: 0 0 6px; font-size: 1.3rem; }
  #endCard h2.won { color: #f2c46b; }
  #endCard h2.lost { color: #ff9a8a; }
  #endCard p { margin: 0 0 4px; color: #ddd0bf; font-size: 0.9rem; }
  #endCard p.next { margin-top: 10px; color: #f3e3c4; }
  #endCard p.small { font-size: 0.8rem; color: var(--muted); }
  #endCard p:empty { display: none; }
  #playAgain { margin-top: 12px; width: 100%; font-weight: 600; }
  #playAgain:disabled, #newRunBtn:disabled { opacity: 0.4; }
  #newRunBtn { margin-top: 8px; width: 100%; background: transparent; }
  #newRunBtn[hidden] { display: none; }
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .bar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .bar b.late { color: #ffb86b; }
  #gland {
    display: inline-block;
    width: 48px;
    height: 8px;
    border-radius: 4px;
    background: #3a2c1f;
    vertical-align: middle;
    overflow: hidden;
  }
  #glandFill { display: block; height: 100%; background: var(--accent); }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #4a3826;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div id="field">
    <div id="stage">
      <canvas id="ground" role="img" aria-label="Ant Trails ground. Drag to lay a scent trail, hold to wash scent away."></canvas>
      <p id="msg" aria-hidden="true"></p>
      <p id="say" class="sr" role="status"></p>
      <p id="bonus"></p>
      <button id="ffBtn" aria-label="Game speed">▶▶ 1×</button>
      <div id="endCard" hidden>
        <h2 id="endTitle"></h2>
        <p id="endDetail"></p>
        <p id="endNight"></p>
        <p id="endNext" class="next"></p>
        <p id="endAch" class="small"></p>
        <p id="endBest" class="small"></p>
        <button id="playAgain">Play again</button>
        <button id="newRunBtn" class="alt">New run</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <span>Day <b id="hudDay"></b></span>
    <span>Crumbs <b id="hudCrumbs"></b></span>
    <span>Ants <b id="hudAnts"></b></span>
    <span id="hudRivalWrap" hidden>Rivals <b id="hudRivals"></b></span>
    <span>Sundown <b id="hudSun"></b></span>
    <span>Scent <span id="gland"><span id="glandFill"></span></span></span>
    <button id="resetBtn">New run</button>
  </div>

<script>
(function() {
  const GAME_ID = 'ant-trails';
  const W = 400, H = 600;
  const CELL = 10, GW = W / CELL, GH = H / CELL; // scent grid: 40 x 60 cells

  // The run: six days in a row. Ants alive at sundown carry over to the next day.
  const START_ANTS = 15;           // colony on day 1
  const SPEEDS = [1, 2, 3];        // fast-forward button cycles through these
  const MIN_ANTS = 8;              // fewer ants than this and the colony gives up (the run ends)
  const HATCH_EVERY = 10;          // a new ant hatches for every this many crumbs
  const REST_S = 10;               // overnight, one ant hatches per this many seconds of spare daylight...
  const BONUS_ANTS = 3;            // ...and this many for meeting the day's bonus challenge
  const SPARE = 20;                // Swift (and days 1 and 4's bonus): win with this many seconds left
  const BIG_COLONY = 32;           // Big Colony: this many ants at once
  const SAFE_LOST = 3;             // day 3's bonus: lose at most this many ants
  const NEST = { x: 200, y: 555, r: 16 };
  const JITTER = 12;               // piles and spiders shift up to this far each run
  // Each day has its own food layout ([x, y, crumbs], 'far' marks Long Haul's
  // pile), spider starts, twist and bonus challenge. Layouts are mirrored
  // left-right at random, so a new run looks different too.
  const DAYS = [
    { name: 'First crumbs', goal: 20, sun: 60, bonus: 'swift',
      piles: [[285, 420, 25]], spiders: [],
      note: 'One pile close to home, and no spider yet.' },
    { name: 'First light', goal: 50, sun: 90, bonus: 'far',
      piles: [[315, 420, 15], [85, 270, 25], [300, 85, 40, 'far']], spiders: [[40, 60]],
      note: 'Lead the colony to food.' },
    { name: 'Scattered crumbs', goal: 50, sun: 90, bonus: 'safe',
      piles: [[110, 440, 8], [320, 380, 10], [60, 230, 12], [240, 250, 10], [350, 130, 12], [130, 80, 12]],
      spiders: [[360, 50]], note: 'Food is spread thin today.' },
    { name: 'Storm', goal: 50, sun: 90, bonus: 'swift', storm: true,
      piles: [[330, 300, 32], [70, 150, 38]], spiders: [[200, 40]],
      note: 'Storm clouds wash trails away as they drift by.' },
    { name: 'Two spiders', goal: 55, sun: 90, bonus: 'rainout',
      piles: [[100, 380, 20], [300, 210, 25], [120, 70, 30]], spiders: [[40, 60], [360, 60]],
      note: 'A second spider has moved in.' },
    { name: 'Rival colony', goal: 60, sun: 90, bonus: null, rival: { x: 200, y: 40, n: 22 },
      piles: [[80, 330, 28], [320, 330, 28], [200, 190, 24], [330, 470, 10], [60, 120, 12]], spiders: [[40, 250]],
      note: 'Red ants raid the same food, and follow the same scent.' },
  ];
  const BONUS_TEXT = {
    far: 'clear the far pile', safe: `lose ${SAFE_LOST} ants or fewer`, swift: `win with ${SPARE} s to spare`,
    rainout: 'rain on each spider while it hunts',
  };
  const PILE_R = 10;               // reach this close to pick up a crumb
  const SMELL_R = 22;              // searching ants head straight for food this close

  // Scent (the shared state)
  const EVAP = 0.08;               // scent lost per second (fraction)
  const DIFFUSE = 0.5;             // how fast scent spreads to neighboring cells
  const CARRY_LAY = 0.7;           // scent per second a food-carrying ant adds to its cell
  const DRAW_SCENT = 0.7;          // scent level a drawn trail sets
  const DRAW_W = 9;                // drawn trail half-width
  const GLAND_MAX = 100;           // scent you can draw before the gland is empty...
  const INK_PX = 6;                // ...at one unit per this many pixels of trail
  const GLAND_REGEN = 7;           // units per second
  const RAIN_R0 = 22, RAIN_R1 = 48, RAIN_GROW = 0.8; // rain cloud radius grows while held
  const RAIN_WIPE = 7;             // scent under the rain decays at this rate per second

  // Storm day: clouds drift across the field, washing scent like your rain.
  const STORM_FIRST = 6, STORM_EVERY = 9; // seconds to the first cloud, then between clouds
  const STORM_R = 50, STORM_SPEED = 30, STORM_WIPE = 3;

  // Ants
  const ANT_SPEED = 36;
  const FEEL_D = 11, FEEL_A = 0.55; // feeler distance and angle
  const SCENT_MIN = 0.03;          // ants ignore scent weaker than this
  const OUT_BIAS = 0.6;            // searching ants prefer the feeler pointing away from their nest
  const TURN = 6;                  // how hard ants steer toward scent / home / food
  const WANDER = 5;                // random turning
  const U_TURN = 0.8;              // chance per second a searcher on scent turns outward again
  const RIVAL_GUARD = 45;          // your soldiers turn red ants away this close to the nest

  // Spiders
  const SP_BASE = 20, SP_SCENT = 55; // speed on bare ground, plus this much on full scent
  const SP_FEEL_D = 24, SP_FEEL_A = 0.7;
  const SP_MIN = 0.05;             // spiders notice scent stronger than this
  const SP_TURN = 3.5;
  const SP_CATCH = 8;              // eats any ant this close...
  const EAT_PAUSE = 1.5;           // ...then sits still this long
  const NEST_GUARD = 80;           // soldiers turn spiders away this close to the nest

  // Achievements
  const HIGHWAY_N = 12, HIGHWAY_SCENT = 0.5;
  const DECOY_T = 5, DECOY_R = 80;
  const RAIN_CHASE_T = 1;

  const HOLD_MS = 350;             // a still press this long starts the rain (150 before v8:
                                   // a finger resting before a drag made it rain)
  const MOVE_PX = 10;              // moving further than this first draws a trail
  const RESCUE_MS = 250, RESCUE_PX = 20; // a finger dragging this far this soon after the rain
                                   // began meant a trail: undo the rain and draw it
  const END_INPUT_LOCK_MS = 1000;
  const STEP = 1 / 60;
  const BEST_KEY = 'ant-trails-best';

  const canvas = document.getElementById('ground');
  const ctx = canvas.getContext('2d');
  const msgEl = document.getElementById('msg');
  const bonusEl = document.getElementById('bonus');

  // Achievements: announced to the Emergent Arcade gallery when embedded
  // (it records them); harmless when the file is opened on its own.
  const unlocked = new Set();
  function unlock(id) {
    roundEarned.add(id);
    if (unlocked.has(id)) return;
    unlocked.add(id);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arcade:achievement', game: GAME_ID, id: id }, '*');
    }
  }

  // Tell the gallery how a round (one day) ended (anonymous play telemetry,
  // see docs/telemetry.md). time is seconds of unpaused play that day; level
  // is the day, run ties the days of one run together, attempt counts retries.
  function report(result, why) {
    if (window.parent !== window) {
      const r1 = x => Math.round(x * 10) / 10;
      const stats = {
        dawn: play.dawn, ants: ants.length, lost, hatched, crumbs: delivered, bonus: bonusMet ? 1 : 0,
        trails: play.trails, trail_px: Math.round(play.trailPx), rains: play.rains, rescues: play.rescues, rain_s: r1(play.rainS),
        rain_spider_s: r1(play.rainSpiderS), first_input: play.first < 0 ? -1 : r1(play.first),
        ff_s: r1(play.ffS), keys: play.keys,
      };
      if (rivalNest) stats.rivals = rivalDelivered;
      window.parent.postMessage({ type: 'arcade:result', game: GAME_ID,
        outcome: result === 'lost' ? 'loss' : 'win', time: r1(elapsed),
        level: day + 1, run: runId, attempt, reason: why || '', stats }, '*');
    }
  }

  // Scale the ground to the largest 2:3 box that fits, one canvas pixel per
  // screen pixel. Drawing always uses W x H game units.
  const field = document.getElementById('field');
  const stage = document.getElementById('stage');
  function fitGround() {
    const scale = Math.min(field.clientWidth / W, field.clientHeight / H);
    const w = Math.max(80, Math.floor(W * scale));
    const h = Math.max(120, Math.floor(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  new ResizeObserver(fitGround).observe(field);
  window.addEventListener('resize', fitGround);
  fitGround();

  // The gallery pauses the game while one of its panels covers it.
  let paused = false;
  window.addEventListener('message', evt => {
    if (evt.data && evt.data.type === 'arcade:pause') { paused = true; keysUp(); endGesture(); }
    if (evt.data && evt.data.type === 'arcade:resume') paused = false;
  });

  const endCard = document.getElementById('endCard');
  const playAgainBtn = document.getElementById('playAgain');
  const newRunBtn = document.getElementById('newRunBtn');
  const hudSun = document.getElementById('hudSun');

  let scent = new Float32Array(GW * GH), tmp = new Float32Array(GW * GH);
  const rainLost = new Float32Array(GW * GH); // scent this rain wiped, put back by a rescue
  // The run
  let day, carry, pantry, runLost, bonuses, retries, dawnRun, runId, attempt;
  // What the player did today, for telemetry (see report()).
  let play;
  // One day
  let cfg, goal, sundown, ants, rivals, rivalNest, piles, spiders, storms, stormT;
  let delivered, rivalDelivered, lost, hatched, gland, elapsed, state, rain, msgTimer, bonusMet, overnight;
  const roundEarned = new Set();

  function loadBest() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY)) || null; } catch (e) { return null; }
  }
  function saveBest(b) {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) { /* private window */ }
  }

  function newAnt(home, rival) {
    const out = home === NEST ? -Math.PI / 2 : Math.PI / 2;
    const h = out + (Math.random() - 0.5) * 2.6;
    return {
      x: home.x + Math.cos(h) * 6, y: home.y + Math.sin(h) * 6, h, home, rival,
      carry: false, sp: ANT_SPEED * (0.9 + Math.random() * 0.2), leg: Math.random() * 6,
    };
  }

  function newRun() {
    day = 0;
    carry = START_ANTS;
    pantry = 0;
    runLost = 0;
    bonuses = 0;
    retries = 0;
    runId = Math.random().toString(36).slice(2, 10);
    attempt = 1;
    startDay();
  }

  function startDay() {
    dawnRun = { carry, pantry, runLost, bonuses };
    cfg = DAYS[day];
    goal = cfg.goal;
    sundown = cfg.sun;
    const flip = Math.random() < 0.5;
    const jit = () => (Math.random() - 0.5) * 2 * JITTER;
    const fx = x => flip ? W - x : x;
    scent.fill(0);
    ants = [];
    for (let i = 0; i < carry; i++) ants.push(newAnt(NEST, false));
    rivals = [];
    rivalNest = cfg.rival ? { x: cfg.rival.x, y: cfg.rival.y, r: 14 } : null;
    if (rivalNest) for (let i = 0; i < cfg.rival.n; i++) rivals.push(newAnt(rivalNest, true));
    piles = cfg.piles.map(p => ({ x: fx(p[0]) + jit(), y: p[1] + jit(), n: p[2], far: p[3] === 'far' }));
    spiders = cfg.spiders.map(p => ({
      x: fx(p[0]) + jit(), y: p[1] + jit(), h: Math.random() * Math.PI * 2,
      eat: 0, followT: 0, decoyT: 0, leg: Math.random() * 6, rained: false,
    }));
    storms = [];
    stormT = STORM_FIRST;
    delivered = 0; rivalDelivered = 0; lost = 0; hatched = 0;
    gland = GLAND_MAX;
    elapsed = 0;
    rain = null;
    bonusMet = false;
    roundEarned.clear();
    play = { dawn: ants.length, trails: 0, trailPx: 0, rains: 0, rescues: 0, rainS: 0, rainSpiderS: 0, first: -1, ffS: 0, keys: 0 };
    state = 'playing';
    endCard.hidden = true;
    spoken = [];
    heard = { crumbs: 0, rivals: 0, ants: ants.length, lostAt: 0, light: 0, storms: 0, zone: null };
    showBonus();
    say(`Day ${day + 1}: ${cfg.name}. ${cfg.note} Bring ${goal} crumbs home.`, 4500);
  }

  function showBonus() {
    bonusEl.textContent = cfg.bonus
      ? `${bonusMet ? '✓' : '☆'} Bonus: ${BONUS_TEXT[cfg.bonus]}` : 'Last day';
    bonusEl.classList.toggle('done', bonusMet);
  }
  function meetBonus() {
    if (bonusMet) return;
    bonusMet = true;
    showBonus();
    say(`Bonus done: +${BONUS_ANTS} ants tonight.`);
  }

  function endDay(result, why) {
    const spare = sundown - elapsed;
    if (result === 'won') {
      if (lost === 0 && cfg.spiders.length) unlock('untouchable');
      if (spare >= SPARE) unlock('swift');
      if (cfg.bonus === 'safe' && lost <= SAFE_LOST) meetBonus();
      if (cfg.bonus === 'swift' && spare >= SPARE) meetBonus();
      if (cfg.storm) unlock('weathered');
      if (cfg.spiders.length > 1) unlock('double-trouble');
      if (cfg.rival && rivalDelivered < delivered / 2) unlock('turf-war');
      if (day === DAYS.length - 1 && !retries) unlock('full-season');
    }
    pantry += delivered;
    runLost += lost;
    if (bonusMet) bonuses++;
    if (result === 'won' && day < DAYS.length - 1) {
      state = 'night';
      const rest = Math.floor(Math.max(0, spare) / REST_S);
      overnight = { rest, bonus: bonusMet ? BONUS_ANTS : 0 };
      carry = ants.length + overnight.rest + overnight.bonus;
    } else {
      state = result;
    }
    report(result, why);
    endGesture();
    msgEl.textContent = '';

    // Best run: most days won in a row without a retry.
    const best = loadBest();
    const reached = result === 'lost' ? day : day + 1;
    const isBest = state !== 'night' && !retries && reached > 0 &&
      (!best || reached > best.days || (reached === best.days && pantry > best.crumbs));
    if (isBest) saveBest({ days: reached, crumbs: pantry });

    const title = document.getElementById('endTitle');
    const detail = document.getElementById('endDetail');
    const night = document.getElementById('endNight');
    const next = document.getElementById('endNext');
    title.className = result;
    night.textContent = '';
    next.textContent = '';
    if (state === 'night') {
      title.textContent = `Day ${day + 1} done`;
      detail.textContent = `${delivered} crumbs home in ${clock(elapsed)}. ${lost} ant${lost === 1 ? '' : 's'} lost.`;
      const parts = [];
      if (overnight.rest) parts.push(`+${overnight.rest} rested (spare daylight)`);
      if (overnight.bonus) parts.push(`+${overnight.bonus} bonus`);
      night.textContent = `Overnight: ${parts.length ? parts.join(', ') : 'no new ants'}. ${carry} ants at dawn.`;
      const nd = DAYS[day + 1];
      next.textContent = `Next, day ${day + 2}: ${nd.name}. ${nd.note}`;
      playAgainBtn.textContent = `Start day ${day + 2}`;
    } else if (state === 'won') {
      title.textContent = 'Summer’s end: pantry full!';
      detail.textContent = `All ${DAYS.length} days won${retries ? ` (${retries} retr${retries === 1 ? 'y' : 'ies'})` : ''}. ${pantry} crumbs banked, ${runLost} ant${runLost === 1 ? '' : 's'} lost, ${bonuses} bonus${bonuses === 1 ? '' : 'es'}.`;
      playAgainBtn.textContent = 'New run';
    } else {
      title.textContent = why === 'sun' ? 'The sun went down' :
        why === 'ants' ? 'The colony gave up' : 'Not enough food left';
      detail.textContent = (why === 'sun'
        ? `${delivered} of ${goal} crumbs made it home.`
        : why === 'ants'
          ? `Only ${ants.length} ants left.`
          : cfg.rival ? `Too many crumbs were dropped or raided to reach ${goal}.`
            : `The spider made ants drop too many crumbs to reach ${goal}.`) +
        ` Try day ${day + 1} again with the ants you had at dawn, or start a new run.`;
      playAgainBtn.textContent = `Retry day ${day + 1}`;
    }
    newRunBtn.hidden = state !== 'lost';
    const n = roundEarned.size;
    document.getElementById('endAch').textContent = n
      ? `🏆 ${n} achievement${n === 1 ? '' : 's'} earned today` : '';
    const b = loadBest();
    document.getElementById('endBest').textContent = state === 'night' || !b ? ''
      : isBest ? 'New best run!' : `Best run: ${b.days} day${b.days === 1 ? '' : 's'} won, ${b.crumbs} crumbs.`;
    playAgainBtn.disabled = newRunBtn.disabled = true;
    endCard.hidden = false;
    speak([title, detail, night, next].map(e => e.textContent).filter(Boolean).join(' ') +
      ` Enter: ${playAgainBtn.textContent.toLowerCase()}.`);
    setTimeout(() => { playAgainBtn.disabled = newRunBtn.disabled = false; }, END_INPUT_LOCK_MS);
  }

  function nextDay() {
    day++;
    attempt = 1;
    startDay();
  }

  // Replay a lost day with the colony as it was at dawn.
  function retryDay() {
    ({ carry, pantry, runLost, bonuses } = dawnRun);
    retries++;
    attempt++;
    startDay();
  }

  function clock(sec) {
    const t = Math.max(0, Math.ceil(sec));
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  }

  function say(text, ms) {
    msgEl.textContent = text;
    speak(text);
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { if (state === 'playing') msgEl.textContent = ''; }, ms || 3000);
  }

  // § live region: screen readers hear what changed, at most once a frame
  // (crumbs home, the colony shrinking, raids, storms, light left, the
  // cursor's place, the day's result), never the frame itself. #msg is
  // aria-hidden; its text goes through speak() too.
  const sayEl = document.getElementById('say');
  let spoken = [], heard;
  function speak(text) { spoken.push(text); }
  function flushSpeech() {
    if (!spoken.length) return;
    sayEl.textContent = spoken.join(' ');
    spoken = [];
  }
  const LIGHT_MARKS = [30, 15, 5];  // seconds of daylight left worth a line
  function announce() {
    if (state !== 'playing' || !heard) return flushSpeech();
    const tens = Math.floor(delivered / 10) * 10;
    if (tens > heard.crumbs) {
      heard.crumbs = tens;
      if (delivered < goal) speak(`${delivered} of ${goal} crumbs home.`);
    }
    if (rivalNest && Math.floor(rivalDelivered / 10) * 10 > heard.rivals) {
      heard.rivals = Math.floor(rivalDelivered / 10) * 10;
      speak(`Red ants have raided ${heard.rivals} crumbs.`);
    }
    // Losses come in bursts: say the new size once it has held a second.
    if (ants.length < heard.ants) {
      if (!heard.lostAt) heard.lostAt = elapsed;
      if (elapsed - heard.lostAt >= 1) {
        heard.ants = ants.length;
        heard.lostAt = 0;
        if (ants.length < MIN_ANTS + 5) speak(`Colony down to ${ants.length} ants; below ${MIN_ANTS} it gives up.`);
      }
    } else { heard.ants = ants.length; heard.lostAt = 0; }
    if (storms.length > heard.storms) {
      const c = storms[storms.length - 1];
      speak(`A storm cloud drifts in from the ${c.vx > 0 ? 'left' : 'right'}.`);
    }
    heard.storms = storms.length;
    const left = sundown - elapsed;
    while (heard.light < LIGHT_MARKS.length && left <= LIGHT_MARKS[heard.light]) {
      if (left > LIGHT_MARKS[heard.light] - 1) speak(`${LIGHT_MARKS[heard.light]} seconds to sundown.`);
      heard.light++;
    }
    if (kb.shown) {
      const z = zoneAt(kb.x, kb.y);
      if (z !== heard.zone) {
        heard.zone = z;
        if (z) speak(z);
      }
    }
    flushSpeech();
  }

  // ---------- scent ----------
  function cellOf(x, y) {
    const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
    if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return -1;
    return cy * GW + cx;
  }
  function scentAt(x, y) {
    const i = cellOf(x, y);
    return i < 0 ? 0 : scent[i];
  }

  // Paint a trail segment, paid for from the scent gland. Returns pixels drawn.
  function layTrail(x0, y0, x1, y1) {
    let len = Math.hypot(x1 - x0, y1 - y0);
    if (len < 0.01) return 0;
    const afford = gland * INK_PX;
    if (afford < 1) return 0;
    if (len > afford) {
      const k = afford / len;
      x1 = x0 + (x1 - x0) * k; y1 = y0 + (y1 - y0) * k;
      len = afford;
    }
    gland = Math.max(0, gland - len / INK_PX);
    play.trailPx += len;
    const steps = Math.ceil(len / 3);
    for (let s = 0; s <= steps; s++) {
      const px = x0 + (x1 - x0) * s / steps, py = y0 + (y1 - y0) * s / steps;
      const c0 = Math.floor((px - DRAW_W) / CELL), c1 = Math.floor((px + DRAW_W) / CELL);
      const r0 = Math.floor((py - DRAW_W) / CELL), r1 = Math.floor((py + DRAW_W) / CELL);
      for (let cy = Math.max(0, r0); cy <= Math.min(GH - 1, r1); cy++) {
        for (let cx = Math.max(0, c0); cx <= Math.min(GW - 1, c1); cx++) {
          const d = Math.hypot((cx + 0.5) * CELL - px, (cy + 0.5) * CELL - py);
          if (d > DRAW_W) continue;
          const v = DRAW_SCENT * (1 - 0.4 * d / DRAW_W);
          const i = cy * GW + cx;
          if (scent[i] < v) scent[i] = v;
        }
      }
    }
    return len;
  }

  function rainRadius() { return RAIN_R0 + (RAIN_R1 - RAIN_R0) * Math.min(1, rain.t / RAIN_GROW); }

  function wash(x, y, r, rate, dt, lost) {
    const k = Math.exp(-rate * dt);
    const c0 = Math.max(0, Math.floor((x - r) / CELL)), c1 = Math.min(GW - 1, Math.floor((x + r) / CELL));
    const r0 = Math.max(0, Math.floor((y - r) / CELL)), r1 = Math.min(GH - 1, Math.floor((y + r) / CELL));
    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        if (Math.hypot((cx + 0.5) * CELL - x, (cy + 0.5) * CELL - y) > r) continue;
        const i = cy * GW + cx;
        if (lost) lost[i] += scent[i] * (1 - k);
        scent[i] *= k;
      }
    }
  }

  function stepScent(dt) {
    if (rain) {
      rain.t += dt;
      wash(rain.x, rain.y, rainRadius(), RAIN_WIPE, dt, rainLost);
    }
    for (const c of storms) wash(c.x, c.y, STORM_R, STORM_WIPE, dt);
    const keep = Math.exp(-EVAP * dt), mix = DIFFUSE * dt;
    for (let cy = 0; cy < GH; cy++) {
      for (let cx = 0; cx < GW; cx++) {
        const i = cy * GW + cx, s = scent[i];
        const l = cx > 0 ? scent[i - 1] : s, r = cx < GW - 1 ? scent[i + 1] : s;
        const u = cy > 0 ? scent[i - GW] : s, d = cy < GH - 1 ? scent[i + GW] : s;
        const v = (s + mix * ((l + r + u + d) / 4 - s)) * keep;
        tmp[i] = v < 0.002 ? 0 : v;
      }
    }
    [scent, tmp] = [tmp, scent];
  }

  function stepStorms(dt) {
    if (!cfg.storm) return;
    stormT -= dt;
    if (stormT <= 0) {
      stormT = STORM_EVERY;
      const fromLeft = Math.random() < 0.5;
      storms.push({
        x: fromLeft ? -STORM_R : W + STORM_R, y: 70 + Math.random() * 400,
        vx: (fromLeft ? 1 : -1) * STORM_SPEED, vy: (Math.random() - 0.5) * 12, t: 0,
      });
    }
    for (const c of storms) { c.x += c.vx * dt; c.y += c.vy * dt; c.t += dt; }
    storms = storms.filter(c => c.x > -STORM_R - 1 && c.x < W + STORM_R + 1);
  }

  // ---------- creatures ----------
  function angleDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function steerTo(obj, target, rate, dt) {
    const d = angleDiff(target, obj.h);
    obj.h += Math.max(-rate * dt, Math.min(rate * dt, d));
  }
  function bounce(obj, m) {
    if (obj.x < m) { obj.x = m; obj.h = Math.PI - obj.h; }
    if (obj.x > W - m) { obj.x = W - m; obj.h = Math.PI - obj.h; }
    if (obj.y < m) { obj.y = m; obj.h = -obj.h; }
    if (obj.y > H - m) { obj.y = H - m; obj.h = -obj.h; }
  }

  function stepAnt(a, dt) {
    const home = a.home;
    a.h += (Math.random() - 0.5) * WANDER * dt * 2;
    if (a.carry) {
      // Carriers walk home by dead reckoning, laying scent as they go.
      steerTo(a, Math.atan2(home.y - a.y, home.x - a.x), TURN, dt);
      const i = cellOf(a.x, a.y);
      if (i >= 0) scent[i] = Math.min(1, scent[i] + CARRY_LAY * dt);
      if (Math.hypot(a.x - home.x, a.y - home.y) < home.r) {
        a.carry = false;
        a.h += Math.PI + (Math.random() - 0.5) * 1.5;
        if (a.rival) rivalDelivered++;
        else {
          delivered++;
          if (delivered === 1) unlock('first-crumb');
          if (delivered % HATCH_EVERY === 0) { ants.push(newAnt(NEST, false)); hatched++; }
        }
      }
    } else {
      // Food close by? Go straight for it.
      let food = null, fd = SMELL_R;
      for (const p of piles) {
        if (!p.n) continue;
        const d = Math.hypot(p.x - a.x, p.y - a.y);
        if (d < fd) { fd = d; food = p; }
      }
      if (food) {
        steerTo(a, Math.atan2(food.y - a.y, food.x - a.x), TURN * 2, dt);
        if (fd < PILE_R) {
          food.n--;
          a.carry = true;
          a.h += Math.PI;
          if (food.far && !food.n) {
            unlock('long-haul');
            if (cfg.bonus === 'far') meetBonus();
          }
        }
      } else {
        // Follow scent with three feelers, preferring the way out from the nest.
        let best = null, bestScore = 0, outAhead = 0;
        for (const fa of [-FEEL_A, 0, FEEL_A]) {
          const hh = a.h + fa;
          const px = a.x + Math.cos(hh) * FEEL_D, py = a.y + Math.sin(hh) * FEEL_D;
          const s = scentAt(px, py);
          const nd = Math.hypot(px - home.x, py - home.y) || 1;
          const out = (Math.cos(hh) * (px - home.x) + Math.sin(hh) * (py - home.y)) / nd;
          if (fa === 0) outAhead = out;
          if (s < SCENT_MIN) continue;
          const score = s * (1 + OUT_BIAS * out);
          if (score > bestScore) { bestScore = score; best = fa; }
        }
        if (best !== null) {
          steerTo(a, a.h + best, TURN, dt);
          if (outAhead < -0.5 && Math.random() < U_TURN * dt) a.h += Math.PI;
        }
      }
      // Soldiers see off red ants that come too close to the nest.
      if (a.rival && Math.hypot(a.x - NEST.x, a.y - NEST.y) < RIVAL_GUARD) {
        steerTo(a, Math.atan2(a.y - NEST.y, a.x - NEST.x), TURN * 2, dt);
      }
    }
    a.x += Math.cos(a.h) * a.sp * dt;
    a.y += Math.sin(a.h) * a.sp * dt;
    a.leg += dt * a.sp * 0.5;
    bounce(a, 4);
  }

  function nearAnt(x, y, r) {
    for (const a of ants) if (Math.hypot(a.x - x, a.y - y) < r) return true;
    return false;
  }

  function stepSpider(s, dt) {
    s.leg += dt * 8;
    if (s.eat > 0) { s.eat -= dt; return; }
    let best = null, bestS = SP_MIN;
    for (const fa of [-SP_FEEL_A, 0, SP_FEEL_A]) {
      const v = scentAt(s.x + Math.cos(s.h + fa) * SP_FEEL_D, s.y + Math.sin(s.h + fa) * SP_FEEL_D);
      if (v > bestS) { bestS = v; best = fa; }
    }
    const under = scentAt(s.x, s.y);
    const following = best !== null || under > SP_MIN;
    s.followT = following ? s.followT + dt : 0;
    if (best !== null) steerTo(s, s.h + best, SP_TURN, dt);
    else s.h += (Math.random() - 0.5) * 4 * dt * 2;
    const nd = Math.hypot(s.x - NEST.x, s.y - NEST.y);
    if (nd < NEST_GUARD) steerTo(s, Math.atan2(s.y - NEST.y, s.x - NEST.x), SP_TURN * 2, dt);
    const sp = SP_BASE + SP_SCENT * Math.min(1, under);
    s.x += Math.cos(s.h) * sp * dt;
    s.y += Math.sin(s.h) * sp * dt;
    bounce(s, 8);

    // Decoy: the spider stays on a scent trail with none of your ants near it.
    s.decoyT = following && !nearAnt(s.x, s.y, DECOY_R) ? s.decoyT + dt : 0;
    if (s.decoyT >= DECOY_T) unlock('decoy');

    for (const list of [ants, rivals]) {
      for (let i = list.length - 1; i >= 0; i--) {
        const a = list[i];
        if (Math.hypot(a.x - s.x, a.y - s.y) < SP_CATCH) {
          list.splice(i, 1);
          s.eat = EAT_PAUSE;
          if (!a.rival) {
            lost++;
            say(a.carry ? 'A spider got an ant, and its crumb.' : 'A spider got an ant!');
          }
          return;
        }
      }
    }
  }

  function step(dt) {
    elapsed += dt;
    if (speed > 1) play.ffS += dt;
    gland = Math.min(GLAND_MAX, gland + GLAND_REGEN * dt);
    if (rain) {
      play.rainS += dt;
      if (spiders.some(s => Math.hypot(s.x - rain.x, s.y - rain.y) < rainRadius())) play.rainSpiderS += dt;
      for (const s of spiders) {
        if (s.followT >= RAIN_CHASE_T && Math.hypot(s.x - rain.x, s.y - rain.y) < rainRadius()) {
          unlock('rainmaker');
          s.rained = true;
        }
      }
      if (cfg.bonus === 'rainout' && spiders.every(s => s.rained)) meetBonus();
    }
    stepStorms(dt);
    stepScent(dt);
    for (const a of ants) stepAnt(a, dt);
    for (const a of rivals) stepAnt(a, dt);
    for (const s of spiders) stepSpider(s, dt);

    let onTrail = 0;
    for (const a of ants) {
      if (scentAt(a.x, a.y) >= HIGHWAY_SCENT && Math.hypot(a.x - NEST.x, a.y - NEST.y) > 50) onTrail++;
    }
    if (onTrail >= HIGHWAY_N) unlock('highway');
    if (ants.length >= BIG_COLONY) unlock('big-colony');

    if (delivered >= goal) { endDay('won'); return; }
    const reachable = delivered + ants.filter(a => a.carry).length + piles.reduce((n, p) => n + p.n, 0);
    if (reachable < goal) endDay('lost', 'food');
    else if (ants.length < MIN_ANTS) endDay('lost', 'ants');
    else if (elapsed >= sundown) endDay('lost', 'sun');
  }

  // ---------- drawing ----------
  // Speckled soil, drawn once.
  const soil = document.createElement('canvas');
  soil.width = W; soil.height = H;
  (function() {
    const g = soil.getContext('2d');
    g.fillStyle = '#7a5a3c';
    g.fillRect(0, 0, W, H);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 900; i++) {
      const light = rnd() < 0.5;
      g.fillStyle = light ? 'rgba(170,135,96,0.35)' : 'rgba(58,40,24,0.35)';
      g.beginPath();
      g.arc(rnd() * W, rnd() * H, 0.6 + rnd() * 1.8, 0, Math.PI * 2);
      g.fill();
    }
  })();
  const glow = document.createElement('canvas');
  glow.width = GW; glow.height = GH;
  const glowCtx = glow.getContext('2d');
  const glowImg = glowCtx.createImageData(GW, GH);

  // Reduced motion: the ants, spiders and scent are the game and keep
  // moving; decoration (walking legs, falling raindrops) is drawn still.
  const motionQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  const still = () => motionQ.matches;

  function drawAnt(a) {
    const body = a.rival ? '#8e2412' : '#140d08';
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.h);
    ctx.strokeStyle = body;
    ctx.lineWidth = 0.8;
    const sw = still() ? 0.6 : Math.sin(a.leg) * 1.2;
    ctx.beginPath();
    for (const lx of [-1.5, 0, 1.5]) {
      const k = lx === 0 ? -sw : sw;
      ctx.moveTo(lx, 0); ctx.lineTo(lx + k, -3.6);
      ctx.moveTo(lx, 0); ctx.lineTo(lx - k, 3.6);
    }
    ctx.stroke();
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(-3, 0, 2.6, 1.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(2.4, 0, 1.5, 0, Math.PI * 2); ctx.fill();
    if (a.carry) {
      ctx.fillStyle = '#fbf6ea';
      ctx.fillRect(3.4, -1.3, 2.6, 2.6);
    }
    ctx.restore();
  }

  function drawSpider(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.h);
    ctx.strokeStyle = '#1a0606';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      // Four legs a side, fanning from forward to backward, twitching as it walks.
      const bx = 1 - i * 1.6, fan = (1.5 - i) * 4.5;
      const wig = s.eat > 0 || still() ? 0 : Math.sin(s.leg + i * 1.7) * 1.5;
      for (const side of [-1, 1]) {
        ctx.moveTo(bx, 0);
        ctx.lineTo(bx + fan * 0.6 + wig * side, side * 7);
        ctx.lineTo(bx + fan * 1.3 + wig * side, side * 11.5);
      }
    }
    ctx.stroke();
    ctx.fillStyle = '#2a0b0b';
    ctx.beginPath(); ctx.ellipse(-4, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d1010';
    ctx.beginPath(); ctx.arc(3, 0, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff5d4a';
    ctx.beginPath(); ctx.arc(-4, 0, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawRain(x, y, r, t, fill, drops) {
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(200,225,255,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < drops; i++) {
      const a = i * 2.4, rr = r * Math.sqrt((i + 0.5) / drops);
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      const f = (((still() ? 0 : t * 3) + i * 0.37) % 1) * 8;
      ctx.moveTo(px, py - 4 + f); ctx.lineTo(px - 1, py + f);
    }
    ctx.stroke();
  }

  function drawMound(n, hole, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hole;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 4, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    const k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.drawImage(soil, 0, 0);
    if (!cfg) return;

    // Scent: an amber glow, one pixel per cell, smoothed up to size.
    const d = glowImg.data;
    for (let i = 0; i < scent.length; i++) {
      const s = Math.min(1, scent[i]);
      d[i * 4] = 255; d[i * 4 + 1] = 196 - 60 * s; d[i * 4 + 2] = 70;
      d[i * 4 + 3] = Math.round(Math.min(1, s * 1.3) * 200);
    }
    glowCtx.putImageData(glowImg, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(glow, 0, 0, W, H);

    // Nests: a dark mound with an entrance (the rivals' is red clay).
    drawMound(NEST, '#1c120b', '#5a3f28');
    if (rivalNest) drawMound(rivalNest, '#2a0c06', '#7a3322');

    // Food piles: a heap of crumbs that shrinks as it's carried off.
    for (const p of piles) {
      if (!p.n) continue;
      ctx.fillStyle = '#fbf6ea';
      for (let i = 0; i < p.n; i++) {
        const a = i * 2.4, r = Math.sqrt(i) * 2.6;
        ctx.fillRect(p.x + Math.cos(a) * r - 1.3, p.y + Math.sin(a) * r - 1.3, 2.6, 2.6);
      }
    }

    for (const a of rivals) drawAnt(a);
    for (const a of ants) drawAnt(a);
    for (const s of spiders) drawSpider(s);

    for (const c of storms) drawRain(c.x, c.y, STORM_R, c.t, 'rgba(70,90,130,0.32)', 22);
    if (rain) drawRain(rain.x, rain.y, rainRadius(), rain.t, 'rgba(120,170,230,0.28)', 14);
    if (kb.shown && state === 'playing') drawCursor();

    // Evening light as sundown nears.
    const late = Math.max(0, (elapsed - sundown * 0.6) / (sundown * 0.4));
    if (late > 0) {
      ctx.fillStyle = `rgba(60,20,40,${Math.min(0.45, late * 0.45)})`;
      ctx.fillRect(0, 0, W, H);
    }

    document.getElementById('hudDay').textContent = `${day + 1}/${DAYS.length}`;
    document.getElementById('hudCrumbs').textContent = `${delivered}/${goal}`;
    document.getElementById('hudAnts').textContent = ants.length;
    document.getElementById('hudRivalWrap').hidden = !rivalNest;
    document.getElementById('hudRivals').textContent = rivalDelivered;
    hudSun.textContent = clock(sundown - elapsed);
    hudSun.classList.toggle('late', sundown - elapsed <= 15);
    document.getElementById('glandFill').style.width = `${(gland / GLAND_MAX) * 100}%`;
  }

  // ---------- input ----------
  // Moving before HOLD_MS draws a trail; staying still that long starts the rain.
  let mode = null, startPx = null, lastPt = null, holdTimer = null;

  function toGround(evt) {
    const rect = canvas.getBoundingClientRect();
    return [(evt.clientX - rect.left) * W / rect.width, (evt.clientY - rect.top) * H / rect.height];
  }
  // A gesture (pointer or keys): press, then a trail or a wash, then let go.
  // Both input paths call these, so the simulation can't tell them apart.
  let gest = null;                 // what this gesture did, for the live region
  function endGesture() {
    if (gest && state === 'playing') {
      if (mode === 'trail' && gest.px >= 1) {
        speak(`Trail laid. Scent meter ${Math.round(gland / GLAND_MAX * 100)}%.`);
      } else if (mode === 'wash' && rain) speak(`Rain stopped after ${rain.t.toFixed(1)} s.`);
    }
    gest = null;
    mode = null;
    rain = null;
    kb.trail = kb.wash = false;
    clearTimeout(holdTimer);
  }
  function pressAt(pt) {
    if (play.first < 0) play.first = elapsed;
    mode = 'pending';
    lastPt = pt;
    gest = { px: 0, empty: false };
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      if (mode === 'pending' && state === 'playing') {
        mode = 'wash'; rain = { x: lastPt[0], y: lastPt[1], t: 0, at: lastPt, since: performance.now() }; play.rains++;
        rainLost.fill(0);
        speak('Raining.');
      }
    }, HOLD_MS);
  }
  function beginTrail() {
    mode = 'trail';
    play.trails++;
    clearTimeout(holdTimer);
  }
  function moveTo(pt) {
    if (mode === 'trail') {
      gest.px += layTrail(lastPt[0], lastPt[1], pt[0], pt[1]);
      if (gland < 1 && !gest.empty) { gest.empty = true; speak('Scent meter empty.'); }
    }
    if (mode === 'wash') { rain.x = pt[0]; rain.y = pt[1]; }
    if (mode !== 'pending') lastPt = pt;
  }

  canvas.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    if (state !== 'playing' || paused) return;
    canvas.setPointerCapture(evt.pointerId);
    if (kb.trail || kb.wash) endGesture();
    kb.shown = false;
    startPx = [evt.clientX, evt.clientY];
    pressAt(toGround(evt));
  });

  // A drag that starts just after the rain did was a slow-starting trail:
  // put back what the rain wiped and draw the trail from the press.
  function rescueTrail() {
    for (let i = 0; i < scent.length; i++) if (rainLost[i]) scent[i] = Math.min(1, scent[i] + rainLost[i]);
    lastPt = rain.at;
    play.rains--; play.rescues++; play.rainS = Math.max(0, play.rainS - rain.t);
    rain = null;
    beginTrail();
  }

  canvas.addEventListener('pointermove', evt => {
    if (!mode || kb.trail || kb.wash || state !== 'playing' || paused) return;
    const pt = toGround(evt);
    const moved = Math.hypot(evt.clientX - startPx[0], evt.clientY - startPx[1]);
    if (mode === 'pending' && moved > MOVE_PX) beginTrail();
    else if (mode === 'wash' && performance.now() - rain.since < RESCUE_MS && moved > RESCUE_PX) rescueTrail();
    moveTo(pt);
  });

  const pointerUp = () => { if (!kb.trail && !kb.wash) endGesture(); };
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);

  document.getElementById('resetBtn').addEventListener('click', newRun);
  playAgainBtn.addEventListener('click', () => {
    if (state === 'night') nextDay(); else if (state === 'lost') retryDay(); else newRun();
  });
  newRunBtn.addEventListener('click', newRun);

  // Fast-forward: the same simulation, more steps per frame.
  let speed = 1;
  const ffBtn = document.getElementById('ffBtn');
  function cycleSpeed() {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    ffBtn.textContent = `▶▶ ${speed}×`;
    ffBtn.classList.toggle('on', speed > 1);
  }
  ffBtn.addEventListener('click', cycleSpeed);

  // § keys: the same verbs without a pointer. Arrows move a cursor while held
  // (slow at first for aiming, then faster), hold Space to lay a trail along
  // its path (key up = finger up), hold W to wash under it (let go before
  // HOLD_MS and nothing happens, like lifting a finger). H jumps the cursor
  // to the nest and N to the next food pile; a jump with Space held lays a
  // straight trail, like a fast swipe. Same pressAt / beginTrail / moveTo.
  const CUR_SLOW = 90, CUR_FAST = 240, CUR_RAMP = 0.6; // ground units per second; seconds to full speed
  const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const CUR_START = [200, 480];    // just above the nest
  const kb = { x: CUR_START[0], y: CUR_START[1], held: new Set(), heldFor: 0, trail: false, wash: false, shown: false, pile: -1 };
  function keysUp() {
    kb.held.clear();
    if (kb.trail || kb.wash) endGesture();
  }
  function cursorTo(x, y) {
    kb.x = Math.max(0, Math.min(W, x));
    kb.y = Math.max(0, Math.min(H, y));
    if (kb.trail || kb.wash) moveTo([kb.x, kb.y]);
  }
  function moveCursor(dt) {
    let dx = 0, dy = 0;
    for (const k of kb.held) { dx += DIRS[k][0]; dy += DIRS[k][1]; }
    if (!dx && !dy) { kb.heldFor = 0; return; }
    kb.heldFor += dt;
    const v = (CUR_SLOW + (CUR_FAST - CUR_SLOW) * Math.min(1, kb.heldFor / CUR_RAMP)) * dt / Math.hypot(dx, dy);
    cursorTo(kb.x + dx * v, kb.y + dy * v);
  }
  // What the cursor is over, in words (null: bare ground).
  function zoneAt(x, y) {
    if (Math.hypot(x - NEST.x, y - NEST.y) < NEST.r + 12) return 'Cursor on the nest.';
    if (rivalNest && Math.hypot(x - rivalNest.x, y - rivalNest.y) < rivalNest.r + 12) return 'Cursor on the red ants’ nest.';
    for (const p of piles) {
      if (p.n && Math.hypot(x - p.x, y - p.y) < PILE_R + 14) return `Cursor on ${p.far ? 'the far' : 'a'} pile, ${p.n} crumbs.`;
    }
    for (const s of spiders) if (Math.hypot(x - s.x, y - s.y) < 30) return 'Cursor near a spider.';
    if (scentAt(x, y) > 0.3) return 'Cursor on a trail.';
    return null;
  }
  function nextPile() {
    const order = piles.map((p, i) => i).filter(i => piles[i].n)
      .sort((a, b) => Math.hypot(piles[a].x - NEST.x, piles[a].y - NEST.y) - Math.hypot(piles[b].x - NEST.x, piles[b].y - NEST.y));
    if (!order.length) return speak('No food left on the ground.');
    const at = order.indexOf(kb.pile);
    kb.pile = order[(at + 1) % order.length];
    heard.zone = null;
    cursorTo(piles[kb.pile].x, piles[kb.pile].y);
  }
  function drawCursor() {
    // A dark ring under a white one reads on the soil, the scent and the dusk.
    for (const [c, w] of [['rgba(23,17,12,0.9)', 5], ['#fff', 2]]) {
      ctx.strokeStyle = c;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.arc(kb.x, kb.y, 8, 0, Math.PI * 2);
      ctx.moveTo(kb.x - 14, kb.y); ctx.lineTo(kb.x - 8, kb.y);
      ctx.moveTo(kb.x + 8, kb.y); ctx.lineTo(kb.x + 14, kb.y);
      ctx.moveTo(kb.x, kb.y - 14); ctx.lineTo(kb.x, kb.y - 8);
      ctx.moveTo(kb.x, kb.y + 8); ctx.lineTo(kb.x, kb.y + 14);
      ctx.stroke();
    }
  }
  window.addEventListener('keydown', evt => {
    if (evt.ctrlKey || evt.metaKey || evt.altKey || evt.key === 'Tab') return;
    const onButton = evt.target && evt.target.tagName === 'BUTTON';
    const k = evt.key === ' ' ? 'space' : evt.key.toLowerCase();
    if (onButton && (k === 'enter' || k === 'space')) return; // the focused button presses itself
    if (k === 'f') { if (!evt.repeat) cycleSpeed(); return; }
    if (evt.key in DIRS) {
      evt.preventDefault();
      if (onButton) evt.target.blur();
      if (paused || state !== 'playing') return;
      kb.held.add(evt.key);
      kb.shown = true;
      return;
    }
    if (paused) return;
    if (state !== 'playing') {
      if (k === 'enter' && !evt.repeat && !playAgainBtn.disabled) { evt.preventDefault(); playAgainBtn.click(); }
      return;
    }
    if (!['space', 'w', 'h', 'n'].includes(k)) return;
    evt.preventDefault();
    kb.shown = true;
    if (evt.repeat) return;
    if (k === 'h') { heard.zone = null; cursorTo(NEST.x, NEST.y); }
    else if (k === 'n') nextPile();
    else if (mode) return;           // a gesture is already on
    else if (k === 'space') { pressAt([kb.x, kb.y]); beginTrail(); kb.trail = true; play.keys++; }
    else { pressAt([kb.x, kb.y]); kb.wash = true; play.keys++; }
  });
  window.addEventListener('keyup', evt => {
    if (evt.key in DIRS) kb.held.delete(evt.key);
    if ((evt.key === ' ' && kb.trail) || ((evt.key === 'w' || evt.key === 'W') && kb.wash)) endGesture();
  });
  window.addEventListener('blur', keysUp);

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    acc += dt * speed;
    last = now;
    if (state === 'playing' && !paused) moveCursor(dt);
    while (acc >= STEP) {
      if (state === 'playing' && !paused) step(STEP);
      acc -= STEP;
    }
    announce();
    draw();
    requestAnimationFrame(frame);
  }

  newRun();
  requestAnimationFrame(frame);
})();
// § a11y label
// The canvas label names the verbs, with the word for this device.
{
  const fine = window.matchMedia('(pointer: fine)').matches;
  const h = fine ? 'click and hold' : 'hold';
  document.getElementById('ground').setAttribute('aria-label', `Ant Trails ground. Drag to lay a scent trail, ${h} to wash scent away. Keys: arrows move a cursor, hold Space to lay a trail along its path, hold W to wash under it, H jumps to the nest, N to the next food, F fast-forwards.`);
}
</script>
</body>
</html>
