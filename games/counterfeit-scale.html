<!DOCTYPE html>
<html lang="en">
<head>
<script>
// § crash report: uncaught errors go to the arcade's telemetry (docs/telemetry.md, "Errors").
(function () {
  var sent = 0;
  function report(message, line, col) {
    if (window.parent === window || sent++ >= 3) return;
    try {
      window.parent.postMessage({ type: 'arcade:error', game: 'counterfeit-scale', message: String(message).slice(0, 300), line: line | 0, col: col | 0 }, '*');
    } catch (_) {}
  }
  window.addEventListener('error', function (e) { report(e.message, e.lineno, e.colno); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled rejection: ' + (r && r.message ? r.message : r), 0, 0);
  });
})();
</script>

<style>
  :root {
    --bg: #0d0c10; --panel: #18171d; --line: #2c2a34; --text: #ece9e2; --muted: #9c98a3;

     Under the board: the cabinet's toasts cover the top of the game. */

<body>
  <div id="top"><div><span id="caseName"></span> · <span class="rule" id="rule"></span></div>
    <div class="side"><span class="pips" id="pips"></span> <span id="score"></span></div></div>

  <div class="strip" id="hint"></div>

  <div class="bar">

  </div>

<script>
(function() {
  const GAME_ID = 'counterfeit-scale';
  const TIP_MS = 900;            // the beam swings before the result shows
  const END_LOCK_MS = 1000;      // input ignored after a case ends
  const DRAG_PX = 8;             // movement before a press becomes a drag
  const HOLD_MS = 450;           // hold the beam this long to weigh (a stray tap can't spend a weighing)
  const STRIKES = 3;
  // § sim: cases, weighing and the solver. Pure functions, no DOM: scripts/balance-counterfeit-scale.mjs
  // A case: n coins, rules { fakes: 1|2, dir: 'heavy'|'either', scale: 'balance'|'spring',
  // cap: coins per pan (0 = no limit) }, budget = par + slack. The game tracks the truth as
  // a list of hypotheses ({ f: [fake coins], s: +1 heavy / -1 light }) filtered by each
  // weighing; the solver works on counts, so it is instant.
  const COIN_G = 10;             // a genuine coin's weight (spring scale reading); a fake is ±1 g
  const MAX_K = 8;               // the solver never looks deeper than this

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function allHyps(c) {
    const out = [];
    if (c.fakes === 2) {
      for (let i = 0; i < c.n; i++) for (let j = i + 1; j < c.n; j++) out.push({ f: [i, j], s: 1 });
    } else {
      for (let i = 0; i < c.n; i++) {
        out.push({ f: [i], s: 1 });
        if (c.dir === 'either') out.push({ f: [i], s: -1 });
      }
    }
    return out;
  }

  // Outcome of a weighing if hypothesis h is true. Balance: 1 = left pan heavier, -1 = right
  // heavier, 0 = level. Spring (left pan only): grams above or below the genuine weight.
  function predict(c, h, side) {
    let dl = 0, dr = 0;
    for (const f of h.f) { if (side[f] === 1) dl += h.s; else if (side[f] === 2) dr += h.s; }
    return c.scale === 'spring' ? dl : Math.sign(dl - dr);
  }
  const sideOf = (n, L, R) => { const s = new Uint8Array(n); for (const i of L) s[i] = 1; for (const i of R) s[i] = 2; return s; };

  // spec: { n, fakes, dir, scale, cap, slack, name }. The fake(s) come from the seed.
  function makeCase(spec, seed) {
    const r = rng(seed);
    const c = Object.assign({ fakes: 1, dir: 'heavy', scale: 'balance', cap: 0, slack: 0 }, spec);
    c.seed = seed;
    c.fake = [];
    while (c.fake.length < c.fakes) { const i = Math.floor(r() * c.n); if (!c.fake.includes(i)) c.fake.push(i); }
    c.fake.sort((a, b) => a - b);
    c.sign = c.dir === 'either' ? (r() < 0.5 ? 1 : -1) : 1;
    c.truth = { f: c.fake, s: c.sign };
    c.hyps = allHyps(c);
    c.sig = Array(c.n).fill('');
    c.log = [];
    c.par = parOfSpec(c);
    c.budget = c.par + c.slack;
    return c;
  }

  // '' when the pans can be weighed, else why not.
  function weighError(c, L, R) {
    if (c.log.length >= c.budget) return 'No weighings left: accuse a coin.';
    if (c.scale === 'spring') {
      if (!L.length) return 'Load the pan first.';
      if (c.cap && L.length > c.cap) return 'The pan holds ' + c.cap + ' coins.';
      return '';
    }
    if (!L.length || !R.length) return 'Load both pans first.';
    if (L.length !== R.length) return 'Both pans need the same number of coins (' + L.length + ' vs ' + R.length + ').';
    if (c.cap && L.length > c.cap) return 'Each pan holds ' + c.cap + ' coins.';
    return '';
  }

  // Weigh (assumes weighError is ''): returns the outcome and filters the hypotheses.
  function weigh(c, L, R) {
    const side = sideOf(c.n, L, R);
    const out = predict(c, c.truth, side);
    c.hyps = c.hyps.filter(h => predict(c, h, side) === out);
    for (let i = 0; i < c.n; i++) c.sig[i] += side[i];
    c.log.push({ L: L.slice(), R: R.slice(), out });
    return out;
  }
  // Hypotheses left by only some of the weighings (a player who forgot the rest).
  function hypsFrom(c, logs) {
    let hs = allHyps(c);
    for (const w of logs) { const side = sideOf(c.n, w.L, w.R); hs = hs.filter(h => predict(c, h, side) === w.out); }
    return hs;
  }
  function candidates(hyps, n) { const m = new Uint8Array(n); for (const h of hyps) for (const f of h.f) m[f] = 1; return m; }
  const solvedBy = hyps => hyps.length > 0 && hyps.every(h => h.f.join() === hyps[0].f.join());
  const isRight = (c, picks) => picks.length === c.fakes && picks.slice().sort((a, b) => a - b).join() === c.fake.join();

  // § solver: minimax over count states. One fake: (u unknown, h maybe heavy, l maybe light,
  // g known good). Two fakes: groups of coins that are interchangeable (same pans in every
  // weighing) and the list of ways the 2 fakes can be spread over the groups.
  const memo = new Map();

  function moves1(st, c) {
    const { u, h, l, g } = st, out = [], cap = c.cap || 99, n = u + h + l;
    const spring = c.scale === 'spring';
    for (let u1 = 0; u1 <= u; u1++) for (let h1 = 0; h1 <= h; h1++) for (let l1 = 0; l1 <= l; l1++) {
      const n1 = u1 + h1 + l1;
      if (n1 > cap) continue;
      if (spring) {
        if (!n1) continue;
        out.push({ L: [u1, h1, l1, 0], R: [0, 0, 0, 0], kids: [
          [u - u1, h - h1, l - l1, g + n1], [0, u1 + h1, 0, g + n - u1 - h1], [0, 0, u1 + l1, g + n - u1 - l1]] });
        continue;
      }
      for (let u2 = 0; u2 <= u - u1; u2++) for (let h2 = 0; h2 <= h - h1; h2++) for (let l2 = 0; l2 <= l - l1; l2++) {
        const n2 = u2 + h2 + l2;
        if (n2 > cap || n1 + n2 === 0) continue;
        // mirror symmetry: keep the left pan's (u, h, l) >= the right pan's
        if (u1 < u2 || (u1 === u2 && (h1 < h2 || (h1 === h2 && l1 < l2)))) continue;
        const d = Math.abs(n1 - n2);
        if (d > g) continue;
        const on = n1 + n2;
        out.push({ L: [u1, h1, l1, n1 < n2 ? d : 0], R: [u2, h2, l2, n2 < n1 ? d : 0], kids: [
          [u - u1 - u2, h - h1 - h2, l - l1 - l2, g + on],
          [0, u1 + h1, u2 + l2, g + n - u1 - h1 - u2 - l2],
          [0, u2 + h2, u1 + l1, g + n - u2 - h2 - u1 - l1]] });
      }
    }
    return out;
  }
  function ok1(st, k, c) {
    const n = st.u + st.h + st.l;
    if (n <= 1) return true;
    if (k <= 0 || n > Math.pow(3, k)) return false;
    const g = Math.min(st.g, n);
    const key = '1' + c.scale + c.cap + ':' + st.u + ',' + st.h + ',' + st.l + ',' + g + ':' + k;
    if (memo.has(key)) return memo.get(key);
    const lim = Math.pow(3, k - 1);
    const ms = moves1({ u: st.u, h: st.h, l: st.l, g }, c)
      .filter(m => m.kids.every(q => q[0] + q[1] + q[2] <= lim))
      .sort((a, b) => Math.max(...a.kids.map(q => q[0] + q[1] + q[2])) - Math.max(...b.kids.map(q => q[0] + q[1] + q[2])));
    let res = false;
    for (const m of ms) if (m.kids.every(q => ok1({ u: q[0], h: q[1], l: q[2], g: q[3] }, k - 1, c))) { res = true; break; }
    memo.set(key, res);
    return res;
  }

  // Two fakes: st = { size: [group sizes], D: [[fakes per group], ...], g }.
  const binom = (n, k) => k < 0 || k > n ? 0 : k === 0 || k === n ? 1 : k === 1 ? n : n * (n - 1) / 2;
  const pairsOf = st => st.D.reduce((a, d) => a + d.reduce((p, k, i) => p * binom(st.size[i], k), 1), 0);
  function norm2(size, D, g) {
    // drop groups that are empty or can hold no fake (those coins are known good)
    const keep = [];
    for (let i = 0; i < size.length; i++) {
      if (!size[i]) continue;
      if (D.every(d => d[i] === 0)) { g += size[i]; continue; }
      keep.push(i);
    }
    const s2 = keep.map(i => size[i]);
    const seen = new Set(), D2 = [];
    for (const d of D) { const r = keep.map(i => d[i]); const k = r.join(); if (!seen.has(k)) { seen.add(k); D2.push(r); } }
    return { size: s2, D: D2, g };
  }
  function key2(st, k, c) {
    const cols = st.size.map((s, i) => ({ s, col: st.D.map(d => d[i]).sort().join(''), i }));
    cols.sort((a, b) => a.s - b.s || (a.col < b.col ? -1 : a.col > b.col ? 1 : 0));
    const rows = st.D.map(d => cols.map(x => d[x.i]).join('')).sort();
    const n = st.size.reduce((a, b) => a + b, 0);
    return '2' + c.scale + c.cap + ':' + cols.map(x => x.s).join(',') + '|' + rows.join('.') + '|' + Math.min(st.g, n) + ':' + k;
  }
  // Every way to spread the fakes of distribution d over the pans: [x (left), y (right)] per group.
  function spreads(d, a, b, size) {
    let acc = [[0, 0, []]];
    for (let i = 0; i < d.length; i++) {
      const next = [];
      for (const [sx, sy, parts] of acc)
        for (let x = 0; x <= Math.min(d[i], a[i]); x++) for (let y = 0; y <= Math.min(d[i] - x, b[i]); y++) {
          if (d[i] - x - y > size[i] - a[i] - b[i]) continue;
          next.push([sx + x, sy + y, parts.concat([[x, y, d[i] - x - y]])]);
        }
      acc = next;
    }
    return acc;
  }
  function kids2(st, a, b, c) {
    const spring = c.scale === 'spring', byOut = new Map();
    for (const d of st.D) for (const [sx, sy, parts] of spreads(d, a, b, st.size)) {
      const o = spring ? sx : Math.sign(sx - sy);
      if (!byOut.has(o)) byOut.set(o, []);
      byOut.get(o).push(parts.flat());
    }
    const size = [];
    st.size.forEach((s, i) => size.push(a[i], b[i], s - a[i] - b[i]));
    return [...byOut.values()].map(D => norm2(size, D, st.g));
  }
  function moves2(st, c) {
    const cap = c.cap || 99, spring = c.scale === 'spring', out = [];
    const m = st.size.length, a = Array(m).fill(0), b = Array(m).fill(0);
    const total = st.size.reduce((x, y) => x + y, 0) + st.g;
    const rec = (i, na, nb) => {
      if (na > cap || nb > cap) return;
      if (i === m) {
        if (spring) { if (na) out.push({ a: a.slice(), b: b.slice(), ga: 0, gb: 0 }); return; }
        if (na + nb === 0) return;
        const d = Math.abs(na - nb);
        if (d > st.g || Math.max(na, nb) > cap) return;
        if (a.join() < b.join()) return;       // mirror symmetry
        out.push({ a: a.slice(), b: b.slice(), ga: na < nb ? d : 0, gb: nb < na ? d : 0 });
        return;
      }
      for (let x = 0; x <= st.size[i]; x++) for (let y = 0; y <= (spring ? 0 : st.size[i] - x); y++) {
        a[i] = x; b[i] = y; rec(i + 1, na + x, nb + y);
      }
      a[i] = 0; b[i] = 0;
    };
    rec(0, 0, 0);
    void total;
    return out;
  }
  function ok2(st, k, c) {
    const p = pairsOf(st);
    if (p <= 1) return true;
    if (k <= 0 || p > Math.pow(3, k)) return false;
    const key = key2(st, k, c);
    if (memo.has(key)) return memo.get(key);
    const lim = Math.pow(3, k - 1);
    let res = false;
    const ms = moves2(st, c).map(mv => ({ mv, kids: kids2(st, mv.a, mv.b, c) }))
      .filter(x => x.kids.every(q => pairsOf(q) <= lim))
      .sort((x, y) => Math.max(...x.kids.map(pairsOf)) - Math.max(...y.kids.map(pairsOf)));
    for (const x of ms) if (x.kids.every(q => ok2(q, k - 1, c))) { res = true; break; }
    memo.set(key, res);
    return res;
  }

  // The count state for a list of hypotheses (the truth, or what a player remembers).
  function countState(c, hyps) {
    if (c.fakes === 1) {
      const plus = new Uint8Array(c.n), minus = new Uint8Array(c.n);
      for (const h of hyps) (h.s > 0 ? plus : minus)[h.f[0]] = 1;
      const cls = [];
      let u = 0, h = 0, l = 0;
      for (let i = 0; i < c.n; i++) {
        const k = plus[i] && minus[i] ? 'u' : plus[i] ? 'h' : minus[i] ? 'l' : 'g';
        cls.push(k);
        if (k === 'u') u++; else if (k === 'h') h++; else if (k === 'l') l++;
      }
      return { kind: 1, u, h, l, g: c.n - u - h - l, cls };
    }
    // two fakes: coins with the same pans in every weighing are interchangeable
    const cand = candidates(hyps, c.n), gi = new Map(), members = [], sig = c.sig || [];
    let g = 0;
    for (let i = 0; i < c.n; i++) {
      if (!cand[i]) { g++; continue; }
      const k = sig[i] || '';
      if (!gi.has(k)) { gi.set(k, members.length); members.push([]); }
      members[gi.get(k)].push(i);
    }
    const seen = new Set(), D = [];
    for (const h of hyps) {
      const d = members.map(() => 0);
      for (const f of h.f) d[gi.get(sig[f] || '')]++;
      const k = d.join(); if (!seen.has(k)) { seen.add(k); D.push(d); }
    }
    return { kind: 2, size: members.map(x => x.length), D, g, members };
  }
  const okState = (st, k, c) => st.kind === 1 ? ok1(st, k, c) : ok2(st, k, c);
  function parOf(st, c) { for (let k = 0; k <= MAX_K; k++) if (okState(st, k, c)) return k; return MAX_K + 1; }
  function parOfSpec(c) { return parOf(countState(c, allHyps(c)), c); }

  // A best next weighing within k: counts per class for each pan, or null.
  // One fake: { L: [u, h, l, good], R: [...] }; two fakes: { a: [per group], b: [...], ga, gb }.
  function bestMove(st, k, c) {
    if (st.kind === 1) {
      const ms = moves1(st, c).sort((x, y) => Math.max(...x.kids.map(q => q[0] + q[1] + q[2])) - Math.max(...y.kids.map(q => q[0] + q[1] + q[2])));
      for (const m of ms) if (m.kids.every(q => ok1({ u: q[0], h: q[1], l: q[2], g: q[3] }, k - 1, c))) return m;
      return null;
    }
    const ms = moves2(st, c).map(mv => Object.assign(mv, { kids: kids2(st, mv.a, mv.b, c) }))
      .sort((x, y) => Math.max(...x.kids.map(pairsOf)) - Math.max(...y.kids.map(pairsOf)));
    for (const m of ms) if (m.kids.every(q => ok2(q, k - 1, c))) return m;
    return null;
  }
  // Turn a count move into coins (prefers coins already on that pan, so fewer drags).
  function moveCoins(st, m, c, onPan) {
    const pick = (pool, n, pan, taken) => {
      const free = pool.filter(i => !taken.has(i)).sort((x, y) => (onPan[y] === pan) - (onPan[x] === pan));
      const got = free.slice(0, n); got.forEach(i => taken.add(i)); return got;
    };
    const taken = new Set(), L = [], R = [];
    if (st.kind === 1) {
      const pools = ['u', 'h', 'l', 'g'].map(k => st.cls.map((x, i) => x === k ? i : -1).filter(i => i >= 0));
      for (let j = 0; j < 4; j++) { L.push(...pick(pools[j], m.L[j], 1, taken)); R.push(...pick(pools[j], m.R[j], 2, taken)); }
    } else {
      const goods = []; const inG = new Set(st.members.flat());
      for (let i = 0; i < c.n; i++) if (!inG.has(i)) goods.push(i);
      st.members.forEach((pool, j) => { L.push(...pick(pool, m.a[j], 1, taken)); R.push(...pick(pool, m.b[j], 2, taken)); });
      L.push(...pick(goods, m.ga, 1, taken)); R.push(...pick(goods, m.gb, 2, taken));
    }
    return { L, R };
  }

  // § cases: the campaign (2 per rule) then endless mixes at slack 0.
  const RULE_TEXT = {
    heavy: 'One fake, heavier',
    either: 'One fake, heavier or lighter',
    two: 'Two fakes, both heavier',
  };
  const CAMPAIGN = [
    { name: 'First weighing', n: 3, slack: 1, tip: 'The heavier side tips down. Drag a coin onto each pan, then hold the beam (or press Weigh).' },
    { name: 'Nine coins', n: 9, slack: 1, tip: '{Tap} a coin to mark it: H could be the fake, OK is genuine. Your marks are your memory.' },
    { name: 'Light or heavy', n: 3, dir: 'either', slack: 1, tip: 'The fake may be lighter. A coin you know is genuine (OK) makes a fair counterweight.' },
    { name: 'The twelve', n: 12, dir: 'either', slack: 1, tip: 'Mark H or L on the coins that tipped: a coin that went down can only be heavy.' },
    { name: 'Small pans', n: 9, cap: 4, slack: 0, tip: 'Each pan holds 4 coins, and no spare weighing now. Full pans are not always best.' },
    { name: 'Two per pan', n: 8, dir: 'either', cap: 2, slack: 0, tip: 'Two coins per pan, heavier or lighter. Genuine coins can fill a pan.' },
    { name: 'A pair', n: 4, fakes: 2, slack: 0, tip: 'Two fakes, both heavier. Accuse both: pick two coins.' },
    { name: 'Two of seven', n: 7, fakes: 2, slack: 0, tip: 'A level beam can hide one fake on each side.' },
    { name: 'Spring scale', n: 8, scale: 'spring', slack: 0, tip: 'One pan. Genuine coins weigh 10 g, a fake 11 g: the reading says if the fake is on it.' },
    { name: 'Sixteen grams', n: 16, scale: 'spring', slack: 0, tip: 'Yes or no each time: count how many suspects each answer leaves.' },

    const dyL = tiltShown * G.amp, ends = [[G.cx - G.bl, G.beamY + dyL], [G.cx + G.bl, G.beamY - dyL]];
    ctx.lineWidth = 4; ctx.strokeStyle = '#b8b0c4';
    ctx.beginPath(); ctx.moveTo(ends[0][0], ends[0][1]); ctx.lineTo(ends[1][0], ends[1][1]); ctx.stroke();
    ctx.fillStyle = phase === 'load' && left() ? '#e2b34a' : metal;
    ctx.beginPath(); ctx.moveTo(G.cx, G.beamY - 9); ctx.lineTo(G.cx - 9, G.beamY + 7); ctx.lineTo(G.cx + 9, G.beamY + 7); ctx.fill();
    for (const p of [1, 2]) {
      const pc = panCenter(p), e = ends[p - 1];
      ctx.strokeStyle = '#6b6575'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(e[0], e[1]); ctx.lineTo(pc.x - G.pw / 2 + 4, pc.y); ctx.moveTo(e[0], e[1]); ctx.lineTo(pc.x + G.pw / 2 - 4, pc.y); ctx.stroke();
      drawDish(pc);
    }
  }
  function drawDish(pc) {
    ctx.fillStyle = '#4a4552'; ctx.beginPath();
    ctx.ellipse(pc.x, pc.y + 2, G.pw / 2, 6, 0, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = '#8a8494'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pc.x - G.pw / 2, pc.y + 2); ctx.lineTo(pc.x + G.pw / 2, pc.y + 2); ctx.stroke();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!G) return;
    drawScale();
    // capacity slots, so the limit shows where you load
    if (c.cap) for (const p of (c.scale === 'spring' ? [1] : [1, 2])) {
      const save = panOrder[p].length;
      for (let j = save; j < c.cap; j++) { const q = panSlot(p, j); ctx.beginPath(); ctx.arc(q.x, q.y, G.r, 0, 7); ctx.strokeStyle = 'rgba(226,179,74,.35)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]); }
    }
    // empty home slots
    for (let i = 0; i < c.n; i++) if (where[i]) { const h = G.home[i]; ctx.beginPath(); ctx.arc(h.x, h.y, G.r * 0.9, 0, 7); ctx.strokeStyle = '#2c2a34'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.fillStyle = '#4a4552'; ctx.font = `${Math.round(G.r * 0.7)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(i + 1, h.x, h.y); }
    for (let i = 0; i < c.n; i++) { if (gesture && gesture.moved && gesture.coin === i) continue; const q = coinPos(i); drawCoin(i, q.x, q.y, G.r); }
    if (gesture && gesture.moved) drawCoin(gesture.coin, gesture.x, gesture.y, G.r * 1.15, true);
    if (gesture && gesture.weigh) { ctx.beginPath(); ctx.arc(G.cx, G.beamY, 16, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * gesture.t / HOLD_MS); ctx.strokeStyle = '#e2b34a'; ctx.lineWidth = 4; ctx.stroke(); }
  }

  // § input: drag = load, tap a coin = mark (or pick, while accusing), tap the beam = weigh.
  let gesture = null, kbd = false, cursor = 0;
  function pt(e) { const b = canvas.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  function coinAt(x, y) {
    let best = -1, bd = (G.r * 1.25) ** 2;
    for (let i = 0; i < c.n; i++) { const q = coinPos(i), d = (q.x - x) ** 2 + (q.y - y) ** 2; if (d < bd) { bd = d; best = i; } }
    return best;
  }
  const locked = () => paused || !c || phase === 'tip' || phase === 'wait';
  canvas.addEventListener('pointerdown', e => {
    if (locked()) return;
    kbd = false;
    const p = pt(e);
    if (phase === 'over') { next(); return; }
    const i = coinAt(p.x, p.y);
    if (i >= 0) { gesture = { coin: i, x0: p.x, y0: p.y, x: p.x, y: p.y, moved: false }; canvas.setPointerCapture(e.pointerId); }
    else if (weighHit(p.x, p.y) && phase === 'load') gesture = { weigh: true, t: 0 };
  });
  canvas.addEventListener('pointermove', e => {
    if (!gesture || gesture.weigh) return;
    const p = pt(e);
    gesture.x = p.x; gesture.y = p.y;
    if (!gesture.moved && Math.hypot(p.x - gesture.x0, p.y - gesture.y0) > DRAG_PX && phase === 'load') gesture.moved = true;
  });
  function endGesture(e, cancel) {
    const g = gesture; gesture = null;
    if (!g || cancel || locked()) return;
    if (g.weigh) { say('<b>Hold</b> the beam to weigh.'); return; }
    if (g.moved) { place(g.coin, panHit(g.x, g.y)); return; }
    if (phase === 'accuse') pick(g.coin); else cycleMark(g.coin);
  }
  canvas.addEventListener('pointerup', e => endGesture(e, false));
  canvas.addEventListener('pointercancel', e => endGesture(e, true));
  window.addEventListener('keydown', e => {
    if (locked() || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, cols = G ? G.tf.cols : 1;
    const go = i => { kbd = true; cursor = Math.max(0, Math.min(c.n - 1, i)); };
    if (phase === 'over') { if (k === 'Enter' || k === ' ' || k === 'n' || k === 'N') { next(); e.preventDefault(); } return; }
    if (k === 'ArrowLeft') go(cursor - 1); else if (k === 'ArrowRight') go(cursor + 1);
    else if (k === 'ArrowUp') go(cursor - cols); else if (k === 'ArrowDown') go(cursor + cols);
    else if (/^[0-9]$/.test(k)) go(k === '0' ? 9 : +k - 1);
    else if (k === 'l' || k === 'L') { kbd = true; place(cursor, where[cursor] === 1 ? 0 : 1); }
    else if (k === 'r' || k === 'R') { kbd = true; place(cursor, where[cursor] === 2 ? 0 : 2); }
    else if (k === 't' || k === 'T' || k === 'Backspace') place(cursor, 0);
    else if (k === 'm' || k === 'M') { kbd = true; cycleMark(cursor); }
    else if (k === 'a' || k === 'A') toggleAccuse();
    else if (k === 'Escape') { if (phase === 'accuse') toggleAccuse(); else clearPans(); }
    else if (k === 'h' || k === 'H') showHint();
    else if (k === ' ' || k === 'Enter' || k === 'w' || k === 'W') { if (phase === 'accuse') { kbd = true; pick(cursor); renderUI(); } else doWeigh(); }
    else return;
    e.preventDefault();
  });

  // § clock: animation and unpaused case time (for telemetry)
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (!paused && c) {
      if (phase !== 'over') caseMs += dt;
      if (phase === 'tip') { tipT += dt; if (tipT >= TIP_MS) afterTip(); }
      if (gesture && gesture.weigh && (gesture.t += dt) >= HOLD_MS) { gesture = null; doWeigh(); }
      const target = tiltNow();
      tiltShown += (target - tiltShown) * Math.min(1, dt / 90);
    }
    draw();
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => { layout(); }).observe(wrap);
  window.addEventListener('resize', layout);
  // read-only peek for scripts/ tests (screenshots, playthroughs)
  window.__cs = () => ({ c, where, phase, G, pos: coinPos, run, jump: i => { run.idx = i; startCase(); } });
  newRun();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
